- title: 'CrypTon: A Hybrid Quantum-Classical Framework Integrating BB84 Quantum Key
    Distribution with AES for Secure Communication'
  date: 2026-03
  url: https://doi.org/10.1109/nqcomp68334.2026.11497686
  category: quantum-cryptography
  subcategory: method
  authors:
  - Vishesh Goyal
  - R. S. Krishna
  abstract: 'The emergence of quantum computing poses a significant threat to classical
    cryptographic systems, particularly those relying on mathematical hardness assumptions
    for key exchange. While symmetric algorithms such as the Advanced Encryption Standard
    (AES) remain efficient and widely deployed, their long-term security ultimately
    depends on the secrecy of keys. In this paper, we present a hybrid framework that
    integrates quantum key distribution (QKD) with AES and DES to enhance key security
    without altering cipher internals. Using the BB84 protocol as the quantum key
    generator, we implement a simulation-based system in Qiskit and evaluate it against
    classical pseudo-random key generation.Our methodology covers five phases: establishing
    AES/DES baselines, generating quantum random keys, implementing BB84 with basis
    reconciliation and error detection, integrating quantum keys with AES/DES, and
    benchmarking across varying key sizes and file sizes. Results demonstrate that
    AES encryption throughput remains stable (around 250–370 MB/s) regardless of key
    source, while QKD introduces measurable latency in key generation (around 40–110
    seconds for 128–256 bits). Importantly, adversarial interference is reliably detected,
    with 97.3% accuracy in eavesdropper identification.The findings confirm that while
    classical systems excel in speed and scalability, QKD offers unmatched, physics-backed
    security assurances. Our study highlights the practicality of hybrid quantum-classical
    encryption, providing a foundation for secure communication in the post-quantum
    era.'
