- title: 'Quantum computing in image processing: A review of applications, models,
    and prospects'
  date: 2026-05
  url: https://doi.org/10.1016/j.fraope.2026.100631
  category: survey
  subcategory: theory
  authors:
  - Keerti Kulkarni
  - Priyadarshini K Desai
  abstract: Quantum computing is increasingly being viewed as a promising direction
    for the future of image processing. Conventional approaches to image classification,
    enhancement, compression, and restoration, although highly developed, often struggle
    with scalability, computational complexity, and data security—especially when
    processing high-dimensional or sensitive visual information. This survey explores
    how quantum computing can help address these limitations through quantum image
    representation models such as FRQI and NEQR, variational quantum circuits, and
    hybrid quantum–classical architectures. The primary objective of this review is
    to present a clear and structured overview of the current state of quantum image
    processing (QIP). It discusses foundational representation models, emerging hybrid
    learning techniques, available software frameworks and simulators, benchmarking
    practices, and practical applications in areas such as medical imaging, remote
    sensing, and biometric security. Particular attention is given to solutions that
    are feasible on today’s NISQ-era hardware, including hybrid architectures and
    quantum-secured image processing schemes. The survey concludes by identifying
    existing challenges and outlining realistic future research directions. Overall,
    it emphasizes the practical importance of hybrid models, the need for standardized
    quantum-oriented benchmarks, and the growing potential of quantum-based security
    mechanisms for safeguarding visual data.
  venue: Franklin Open
- title: 'Hybrid Classical-Quantum Systems: The Unsung Heroes of the NISQ Era'
  date: 2026-08
  url: https://doi.org/10.20944/preprints202608.1044.v1
  category: survey
  subcategory: method
  authors:
  - Sayed Mahbub Hasan Amiri
  - Atiar Zahan
  abstract: The Noisy Intermediate-Scale Quantum (NISQ) era, defined by qubit counts
    in the hundreds and gate error rates that preclude long coherence times, imposes
    severe constraints on purely quantum computation. The central problem is that
    achieving practical quantum advantage for real-world tasks must overcome these
    hardware limitations, yet fault-tolerant quantum computers with full error correction
    remain years away. To address this, we present a systematic survey of hybrid classical-quantum
    computing models, in which classical high-performance resources orchestrate the
    workflow, perform iterative optimization, and apply error mitigation to noisy
    quantum processing units. Our review encompasses variational quantum algorithms,
    such as the variational quantum eigensolver and quantum approximate optimization
    algorithm; classical optimizers tailored for noisy quantum landscapes; error mitigation
    techniques including zero-noise extrapolation and probabilistic error cancellation;
    and circuit knitting that partitions large circuits across small QPUs. We find
    that these hybrid architectures have already demonstrated domain-specific utility
    in quantum chemistry for molecular ground-state estimation, in logistics and finance
    for combinatorial optimization, and in machine learning for generative and recommendation
    models. Notably, they often surpass purely classical or purely quantum approaches
    on carefully chosen benchmarks. The evidence indicates that hybrid classical-quantum
    systems are not a temporary stopgap but a durable paradigm. Their role will persist
    into the early fault-tolerant era, where small, logical qubits will similarly
    require classical coordination. Consequently, the field urgently demands the establishment
    of standardized hybrid performance benchmarks, the maturation of robust quantum-classical
    middleware capable of efficient transpiration and execution management, and holistic
    co-design frameworks that seamlessly integrate hardware constraints, software
    stack layers, and application-specific requirements from the outset.
