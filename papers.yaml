- title: AI-Driven Threat Detection and Response Using Quantum Cryptography
  date: 2026-06
  url: https://www.ijert.org/ai-driven-threat-detection-and-response-using-quantum-cryptography
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Prof.  Mohini A.  Thorat
  - Janhvi Chavan
  - Anushka Kumbhar
  abstract: The rapid advancement of quantum computing poses a significant threat
    to conventional cryptographic systems that rely on computational complexity for
    security [3]. Quan-tum Key Distribution (QKD) offers a secure communication mechanism
    based on the principles of quantum mechanics, enabling the detection of unauthorized
    interception attempts [1]. However, practical QKD deployments remain vulnerable
    to channel noise, hardware imperfections, and sophisticated eavesdropping attacks
    [5], [6]. This paper presents an AI-driven threat detection and response framework
    that combines BB84 Quantum Key Distribution, IBM Qiskit simulation, and machine
    learning-based anomaly detection [9]. A high-fidelity quantum simulator is developed
    using IBM Qiskit and AerSimulator to model realistic quantum communication channels
    with depo-larizing noise. A Random Forest classifier trained on 50,000 simulated
    transmission sequences identifies malicious activities by analyzing Quantum Bit
    Error Rate (QBER), noise levels, sifted key lengths, and engineered heuristic
    features [7]. Experimental analysis demonstrates high detection accuracy while
    maintaining real-time operational capabilities. The proposed system further incorporates
    automated mitigation techniques including Privacy Amplification and E91 protocol
    migration to enhance quantum network resilience [2]. The results demonstrate that
    integrating artificial intelligence with quantum cryptography significantly improves
    threat detection, response efficiency, and overall communication security.
