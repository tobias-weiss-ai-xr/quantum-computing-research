- title: 'Engineering Quantum Mechanics for Molecular Systems: From Theory to Drug
    Discovery Applications'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19658974
  category: quantum-hardware
  subcategory: theory
  authors:
  - molecular engineering science
  abstract: 'This comprehensive technical guide explores the transformative integration
    of quantum computing into molecular systems research, highlighting its profound
    implications for drug discovery, materials science, and catalytic engineering.
    Traditional classical computing methods, such as Density Functional Theory (DFT),
    face fundamental limitations when modeling the exponential complexity of electron
    correlations, superposition, and entanglement inherent in molecular systems. Quantum
    computing addresses these bottlenecks by operating on the same physical principles
    as the molecules themselves. The article details several cutting-edge hybrid quantum-classical
    methodologies that partition computational workloads to maximize efficiency on
    Noisy Intermediate-Scale Quantum (NISQ) hardware. Key protocols include the Variational
    Quantum Eigensolver (VQE) for ground-state energy calculations, and the combination
    of Density Matrix Embedding Theory (DMET) with Sample-Based Quantum Diagonalization
    (SQD) for simulating complex molecular fragments. The text also highlights the
    Quantum Echoes algorithm, which utilizes Out-of-Time-Order Correlators (OTOCs)
    alongside Nuclear Magnetic Resonance (NMR) spectroscopy to create a highly accurate
    molecular ruler for determining atomic-scale structures. Furthermore, the guide
    provides an in-depth comparison of leading qubit modalities - superconducting,
    neutral atom, and trapped ion - evaluating their coherence times, gate fidelities,
    and suitability for specific molecular simulations. Because current quantum hardware
    is prone to high error rates, the article emphasizes the necessity of quantum
    error mitigation (QEM) techniques, such as Zero-Noise Extrapolation (ZNE) and
    Physics-Inspired Extrapolation (PIE), to extract chemically accurate results.
    It also explores the convergence of high-performance computing (HPC) and quantum
    processing units (QPUs) in hybrid architectures, utilizing mixed-precision computing
    to optimize workflows. By transitioning from classical approximations to verifiable
    quantum computations, researchers can accurately model previously intractable
    systems, such as metalloenzymes and strongly correlated electron systems, thereby
    accelerating the pipeline for novel therapeutics and sustainable technologies.
    Source: https://www.molengsci.com/posts/engineering-quantum-mechanics-for-molecular-systems-from-theory-to-drug-discovery-applications'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Modular Assembly of High-Performance Logical Blocks from the Lorentzian
    Causal Diamond: Pareto-Optimal Finite-Block Codes, Asymmetric Distance Families,
    and an E₈ Structural Obstruction'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19484042
  category: quantum-hardware
  subcategory: theory
  authors:
  - Yannick Schmitt
  abstract: 'This repository contains the complete research artifact and computational
    verification suite for scaling the discrete Lorentzian causal diamond into high-performance
    Quantum Low-Density Parity-Check (qLDPC) and finite-block codes. By systematically
    exploring algebraic amplification (Hypergraph Product), geometric tessellation
    (toric scaling), and lattice enrichment ($E_8$ Lorentzian substrates), this work
    identifies precise structural obstructions in existing approaches and introduces
    novel, Pareto-optimal CSS codes tailored for near-term hardware in the $N \sim
    100\text{--}200$ physical qubit regime. Scientific Contributions The Augmented-Seed
    Code Family: The central discovery that a specific weight-3 row (one of 64 in
    two $B_4$ symmetry orbits) appended to the primal causal diamond seed raises the
    classical distance from 4 to 6. This breaks the intrinsic distance ceiling of
    the basic geometry, unlocking a family of finite-block codes that significantly
    outperform planar codes (e.g., surface/toric codes) at small block sizes. Methodological
    Warning on Sampling Blindness: Demonstration that Belief Propagation (BP)-style
    random sampling fails catastrophically in high-dimensional kernels. Earlier sampled
    bounds of $d \ge 67$ for the `[[193, 25]]` code are formally retracted; an exact
    Integer Linear Program (ILP) oracle is introduced, definitively proving $d = 4$.
    The $E_8$ Structural Obstruction (Theorem 4.5): Rigorous proof that the 28-qubit
    $E_8$ Lorentzian code cannot be punctured to yield a valid quantum code. Its 7-disconnected-4-cycle
    geometry guarantees $d_Z = 1$ after any single row drop, pointing toward the Euclidean
    $E_8$ root lattice as the necessary next step. Naïve CSS Lift Theorem (Theorem
    5.3): Algebraic proof that setting $H_X = \ker(H_Z)$ definitionally forces $k=0$,
    regardless of chain or torus topology, resolving anomalies in earlier geometric
    scaling attempts. Highlighted Code FamiliesThe augmented geometric construction
    yields a frontier of codes optimized for neutral-atom and trapped-ion architectures,
    including: [[112, 4, (6, 6)]]: Achieves an exceptional figure of merit $kd^2/N
    \approx 1.29$, making it a highly efficient logical block for near-term implementation.
    [[176, 32, (3, 6)]: Features an asymmetric distance profile naturally aligned
    with the $Z$-biased noise characteristic of superconducting hardware. [[208, 16,
    6]]: A self-hypergraph product code with $d=6$ proven algebraically via the Tillich–Zémor
    theorem. Artifact Contents Verification Suite (`verification_modular_assembly.py`):
    A unified, self-contained Python script using `scipy.optimize.milp` that computationally
    verifies every theorem, constructs all augmented seeds, performs exact distance
    certifications via ILP in under 100ms per operator, and reproduces the geometric
    obstructions. Manuscript: Complete LaTeX source files and compiled PDF of the
    paper.'
