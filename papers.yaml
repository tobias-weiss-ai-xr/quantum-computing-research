- title: A Quantum Blind Signature Integrated Hybrid Quantum Key Distribution Framework
    for Secure and Authenticated Quantum Communication
  date: 2026-04
  url: https://doi.org/10.23919/indiacom70271.2026.11526451
  category: quantum-cryptography
  subcategory: method
  authors:
  - Taranjeet Kaur
  - Gaurav Bathla
  abstract: The high pace of quantum computing development presents a serious risk
    to classical cryptographic systems like RSA and ECC in that quantum-resilient
    communication systems must be developed. The present paper will suggest Quantum
    Blind Signature-based Hybrid Quantum Key Distribution (QKD -QBS) to provide secure
    and authenticated quantum communication. The proposed architecture uses both BB84
    and Decoy-State QKD protocols with Quantum Blind Signature (QBS) authentication
    layer in order to support quantum key generation and verification of entities
    in the same session. The framework is simulated and tested with IBM Qiskit Aer
    simulator in realistic channel noise situations. Quantum Bit Error Rate (QBER),
    Secret Key Retention (SKR), Quantum Entropy (H), Authentication Latency and Security
    Index (SI) are used as performance evaluation metrics. The experimental data show
    that the QBER is low (0.34%), SKR is high (92.4%), entropy is nearly ideal ($H=0.99$)
    with the lowest authentication latency (0.17 ms), which proves the fact that the
    integration of QBS does not reduce the efficiency of the key generation but the
    reliability of authentication. The hybrid framework proposed has information-theoretic
    security using the principles of quantum mechanics and strong resistance to impersonation,
    re-play and man in the middle attacks. The findings show that QKDQBS model provides
    a scalable and solid platform of next generation secure communication systems,
    such as IoT,$5 \mathrm{G} / 6 \mathrm{G}$networks, and cloud-based quantum systems.
