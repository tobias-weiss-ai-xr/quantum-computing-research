  - Channa Krishna Raju
  abstract: 'Abstract: Abstract. This study investigates how Quantum Key Distribution
    serves as a novel cryptographic methodology utilizing quantum physics principles
    to counter contemporary cybersecurity challenges. QKD''s intrinsic characteristics
    provide exceptional resistance to conventional intrusion methods while delivering
    encryption strength that cannot be mathematically compromised. Our analysis examines
    QKD protocol behavior under diverse threat conditions within mod ern digital ecosystems.
    We concentrate on implementation-level weaknesses, especially those targeting
    physical elements like photon detection systems, to identify security gaps and
    develop mitigation approaches. Furthermore, we investigate the complexity of integrating
    QKD with legacy communication systems, analyzing vulnerabilities at the intersection
    of quantum and classical technologies while recommending protective mechanisms
    for these transitional zones.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Post-quantum cryptography for healthcare: securing medical data, connected
    devices, and digital health infrastructure'
  date: 2026-07
  url: https://doi.org/10.3389/frhs.2026.1901282
  category: quantum-cryptography
  subcategory: method
  authors:
  - Sheng-Ping Wu
  - Sheng-Ding Wu
  - Kuo-Cheng Lu
  abstract: 'Healthcare systems increasingly depend on interoperable electronic health
    records, picture archiving and communication systems, cloud analytics, remote
    monitoring, and connected medical devices. These workflows create a long-lived
    confidentiality problem: clinical, genomic, pediatric, psychiatric, and family-linked
    data may remain sensitive for decades, whereas the public-key algorithms that
    protect current transport and identity systems are vulnerable to future cryptographically
    relevant quantum computers. Shor''s algorithm threatens RSA, finite-field Diffie-Hellman,
    elliptic-curve Diffie-Hellman, and elliptic-curve signatures, while Grover''s
    algorithm reduces the effective security margin of symmetric primitives. This
    review validates the post-quantum transition pathway for healthcare and distinguishes
    software-deployable post-quantum cryptography from hardware-specialized quantum
    key distribution. We summarize the standardized NIST primitives, correct the status
    of Falcon/FN-DSA as a FIPS 206 algorithm still in development, analyze deployment
    constraints in Internet of Medical Things environments, and map cryptographic
    migration to healthcare governance. A staged, hybrid, crypto-agile migration strategy
    is recommended: prioritize long-confidentiality data, inventory cryptographic
    dependencies, deploy hybrid key establishment at enterprise gateways, reserve
    QKD for selected high-value fixed links, and require vendor update pathways for
    clinical devices.'
  venue: Frontiers in Health Services
- title: Quantum Key Distribution Based Network Integrity Mechanism for Secure Web
    Chatting with Attack Mitigation
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.19307405
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Dileep Kumar Reddy Dr. P
  - Navyasri Suram
  - Srinuvasula Reddy Uppathi
  abstract: 'Quantum Key Distribution (QKD) represents a paradigm shift in cryptographic
    security, offering information-theoretic confidentiality based on fundamental
    principles of quantum mechanics rather than computational hardness assumptions.
    The emergence of advanced quantum processors with ever-increasing qubit counts
    has accelerated the timeline for cryptographically-relevant quantum computers,
    necessitating immediate migration to quantum-safe communication protocols. This
    paper introduces a comprehensive QKD-based network integrity mechanism implemented
    as a Flask-based web chatting application that provides end-to-end security with
    real-time attack detection and automated mitigation. The system integrates a complete
    BB84 protocol simulation with polarized photon transmission modeling, incorporating
    realistic quantum channel parameters including attenuation (0.2 dB/km), dark count
    probability (10⁻⁶), and detector efficiency (30%). The architecture comprises
    four integrated modules: Quantum Key Distribution Engine implementing the full
    BB84 protocol stack with adaptive basis selection and error reconciliation; Secure
    Chat Interface supporting multi-user rooms, private messaging, and file sharing
    with one-time pad encryption using quantum-generated keys refreshed at optimal
    intervals; Network Integrity Monitor employing statistical analysis and machine
    learning techniques to detect eavesdropping attempts through quantum bit error
    rate (QBER) analysis, timing anomalies, and photon statistics; Automated Mitigation
    System that quarantines detected attackers through session termination, IP blacklisting,
    key revocation, and emergency key regeneration. Experimental evaluation demonstrates
    detection rates of 99.7% for intercept-resend attacks at 24.8% QBER, 98.2% for
    photon number splitting attacks at 15.3% QBER, and 99.1% for man-in-the-middle
    attacks at 18.7% QBER. The system achieves key generation rates of 1.82 kbps over
    10 km simulated fiber, with 1.8-second quarantine response time meeting stringent
    incident response requirements. Scalability testing confirms support for 5,000+
    concurrent users with 320 ms response time, making the solution suitable for production
    deployment. This work represents the first production-ready integration of quantum
    key distribution with a complete web chat application featuring automated attack
    detection and mitigation, bridging the gap between theoretical quantum cryptography
    and practical secure communication tools.'
  venue: International Journal of Engineering Research and Science & Technology
- title: 'From key distribution to direct transmission: a comprehensive review of
    quantum image security via QKD and QSDC'
  date: 2026-08
  url: https://doi.org/10.3389/fphy.2026.1878327
  category: quantum-cryptography
  subcategory: theory
  authors:
  - S. Deepika
  - N. Jeyanthi
  abstract: 'In the rapidly evolving landscape of cybersecurity, traditional cryptographic
    systems are increasingly vulnerable to attacks, including brute-force, side-channel,
    man-in-the-middle, replay, and ransomware attacks, highlight the limitations of
    classical encryption techniques. Quantum cryptography leverages the no-cloning
    theorem and the properties of quantum states to establish fundamentally secure
    communication protocols with intrinsic eavesdropping detection capabilities. This
    security framework provides information-theoretic protection beyond the mathematical
    assumptions underlying conventional cryptographic systems. Quantum image security
    has evolved into two major paradigms: Quantum Key Distribution (QKD) and Quantum
    Secure Direct Communication (QSDC). Although recent surveys have reviewed both
    approaches chronologically, they have not systematically analysed their security
    thresholds The objective of this paper proposes a three-axis taxonomy of QSDC
    protocols, classifying them by quantum resource type, physical transmission channel,
    and device trust model. Furthermore, it presents a comparative performance analysis
    of QKD employing a hyperchaotic cipher over QSDC channels across seven quantum
    image representations, including FRQI, NEQR, GQIR, and MCQI. The analysis shows
    that QKD-seeded schemes achieve efficient key distribution, whereas pixel-level
    security remains dependent on cipher complexity. In contrast, QSDC provides end-to-end
    security governed by quantum mechanical principles; hyperentangled carriers achieve
    an eavesdropping detection probability of 0.875 compared with 0.5 for conventional
    two-step protocols, although communication throughput remains a limiting factor.
    Based on these findings, this review outlines future research directions, including
    QSDC-specific quantum repeaters for continental-scale deployment, hyperentangled
    carriers supporting up to 12 bits per photon pair compatible with NEQR’s 8-bit
    encoding, and machine-learning-assisted management of hybrid fiber–free-space
    quantum communication networks.'
  venue: Frontiers in Physics
- title: Quantum Key Distribution (QKD)- Based Cloud Security Model Integrated with
    Quantum Machine Learning(QML) for Threat Detection
  date: 2026-04
  url: https://doi.org/10.1109/iccsp68173.2026.11539237
  category: quantum-cryptography
  subcategory: method
  authors:
  - Tummalacheruvu Rajesh
  - Mukkamala Narasimha Swamy
  - Guru Vimal Kumar Murugan
  abstract: Fears regarding the security of any data are increasing drastically with
    the rapid deployment of cloud-based systems based on artificial intelligence (AI)
    systems, as of now, owing to the existence of quantum computing, which is threatening
    the existing cryptography schemes. To ensure secure communication and smart threat
    detection in cloud networks, this paper proposes a hybrid cloud-based security
    framework, Quantum Shield, which will deploy Quantum Key Distribution (QKD) and
    Quantum Machine Learning (QML). The QKD module relies on the BB84 protocol when
    generating encryption keys, sharing the Quantum Bit Error Rate (QBER) to detect
    eavesdropping and is considered to be safe. At the same time, the QML layer manipulates
    TensorFlow Quantum-executed Variational Quantum Circuits (VQC) to perform the
    processes of classification on encrypted data. QKD and QML modules are also scalably
    deployed on cloud infrastructure and the system is evaluated and measured within
    a simulated environment. The experiments suggest the framework is effective in
    identifying interception attacks and containing QBER below the security threshold
    in case of normal conditions. It also classifies better than its traditional counterparts.
    Further studies will be focused on quantum operation and the validation on a large
    scale. The proposed approach demonstrates a quantum and scalable approach to protecting
    cloud AI systems.
