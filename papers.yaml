- title: 'Layered Post-Quantum Cryptography: A Dual-Encryption Approach to Mitigate
    Quantum Threats'
  date: 2026-06
  url: https://doi.org/10.55041/ijcope.v2i6.338
  category: quantum-cryptography
  subcategory: method
  authors:
  - Vijay Subhas Katta Vijay Subhas Katta
  - Diwakar Shrivastava Diwakar Shrivastava
  - Deepanshi Kushwah Deepanshi Kushwah
  abstract: 'The fast development of cyber communications, multimedia distribution,
    remote working have promoted the demand to transmit sensitive information through
    secure means in both the public and the private networks. The advent of massive
    quantum computers is rendering traditional cryptographic algorithms like RSA and
    Elliptic Curve Cryptography (ECC) insecure because they can crack the classical
    public-key algorithms like the Shor and Grover algorithms. This brings an immediate
    need of hybrid cryptographic systems, which integrate classical, quantum, and
    post-quantum algorithms to provide confidentiality, integrity, authentication,
    and future security beyond the quantum threat horizon.The paper is a proposal
    of a Hybrid Quantum-Post-Quantum Cryptographic Framework of transmitting files
    safely. It starts by aggregating files, which is a process to compress several
    files, images, videos, and multimedia files that users have chosen into one file
    to minimize redundancy and ease encryption. The AES-256 encrypted file is in GCM
    mode and provides confidentiality and integrity of the compressed file.The dual-layer
    mechanism ensures key establishment security. To begin with, Quantum Key Distribution
    (QKD) based on the protocols of BB84/E91 allows the Sender and the Receiver to
    generate a Quantum Secret Key (QSK) by exchanging quantum bits in quantum channel.
    Constant monitoring of the error rate facilitates automatic eavesdropping detection,
    and guarantees the keys generation is made when the conditions are secure, as
    well as the safeguarding of interception and man-in-the-middle attacks.A post-quantum
    layer is provided to ensure long-term security against quantum cryptanalysis,
    which uses Kyber, a NIST-approved lattice-based Key Encapsulation Mechanism (KEM).
    The Receiver creates a key pair of Kyber and disseminates the public key to the
    Sender. By using encapsulation, the Sender gets a PQC ciphertext and a Shared
    Secret (SS), with decapsulation on the Receiver side giving ensure that only participants
    of good faith get the same secret value.The hybridization phase consists of combining
    the QSK of QKD and SS of Kyber with the help of HKDF-SHA256 to obtain a Final
    Wrap Key (FWK). AES-GCM encrypts the key of file encryption by wrapping it with
    FWK which allows a secure and authenticated transfer of the key. The Sender sends
    four messages: encrypted file, Kyber ciphertext, wrapped AES key and the initialisation
    vector. At Receiver end, FWK is calculated once again with the help of QSK and
    SS so that the original data can be decrypted with the help of AES key.The suggested
    framework provides a defense-in-depth solution based on the combination of quantum
    security, post-quantum resilience and authenticated symmetric encryption. It can
    be analyzed that there is a strong resistance to classical and quantum adversaries,
    scalability, and compatibility with the existing communication networks. This
    renders the model to be appropriate to secure government communication, military
    systems, data exchange in healthcare environments, cloud storage and financial
    infrastructures. Keywords— Quantum Key Distribution (QKD), Post-Quantum Cryptography
    (PQC), Kyber,Key Encapsulation Mechanism (KEM), HKDF-SHA256, Quantum Secret Key
    (QSK), GCM Mode.'
