- title: 'Quantum Key Distribution in the Post-Quantum Era: Technologies and Deployment
    Perspectives'
  date: 2026-04
  url: https://doi.org/10.1109/icecco67619.2026.11488792
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Sara Alshehri
  - Amani Ibraheem
  abstract: Quantum computing advances pose a serious threat to conventional public-key
    cryptographic systems such as RSA and elliptic curve cryptography as quantum algorithms
    may undermine the computational assumptions that guaranty their security. This
    challenge has driven the development of quantumsafe security approaches among
    which Quantum Key Distribution (QKD) represents a fundamentally different paradigm
    based on quantum mechanical principles rather than mathematical complexity. This
    paper presents a structured review of recent progress in QKD based on a systematic
    analysis of literature between 2020 and 2025, we examine core protocols including
    discrete-variable, continuous-variable, measurement-deviceindependent, and twin-field
    approaches, while also discussing their relationship with post-quantum cryptography
    as a complementary strategy for future secure communication systems. We provide
    a unified comparison framework to support practical design and policy decisions
    by organizing protocols and implementations along deployment dimensions. The study
    analyze theoretical foundations, implementation technologies across fiber, free-space,
    satellite, and integrated photonic platforms, and key performance trade-offs involving
    scalability, security robustness, and deployment feasibility. Findings indicate
    substantial progress in transitioning QKD from laboratory research toward practical
    implementations, supported by advances in network architectures, integrated hardware
    and hybrid cryptographic designs. The comparative analysis will highlight distinct
    strengths and limitations among protocol families and emphasize the potential
    of combining QKD with post-quantum cryptographic methods to enhance resilience.
    Remaining challenges including scalability constraints, implementation-level vulnerabilities,
    performance limitations over long distances, and integration with existing communication
    infrastructures are critically discussed. Finally, emerging research directions
    such as quantum repeaters, hybrid quantum-classical security models, and exploratory
    directions such as artificial intelligence-assisted optimizations are identified
    as key factors in enabling the evolution of QKD toward largescale quantum-secure
    networking.
