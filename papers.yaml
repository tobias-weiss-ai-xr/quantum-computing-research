  abstract: Quantum key distribution (QKD) is a straightforward cryptographic protocol
    for secure communication using quantum mechanics principles. This book chapter
    provides an introduction to QKD protocols based on theoretical principles, applicability,
    and recent advancements. The chapter provides an overview of the most popular
    BB84 protocol and its extensions, including measurement-device-independent QKD
    (MDI-QKD) and twin-field QKD (TF-QKD). The chapter includes continuous-variable
    QKD (CV-QKD) and its applicability to real networks. Security attacks, including
    side-channel attacks and photon-number splitting (PNS) attacks, are addressed
    with a focus on countermeasures, including decoy-state techniques and device-independent
    protocols. Application of QKD for network security, cloud computing, and critical
    infrastructure is addressed. Integration of QKD with classical cryptography techniques,
    post-quantum cryptography, and innovative quantum network topologies is addressed
    to investigate applicability for large-scale implementation. The chapter discusses
    recent advancements in superconducting nanowire single-photon detectors, quantum
    memory-assisted QKD, and free-space QKD in atmospheric channels. It also discusses
    innovative reconciliation techniques, authentication schemes, future developments,
    and deployment challenges and provides valuable information for researchers and
    practitioners.
