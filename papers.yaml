- title: Quantum-Enhanced Graph Neural Networks for Complex Decision Making in Cognitive
    Autonomous Systems
  date: 2026-03
  url: https://doi.org/10.22541/au.177368940.04003466/v1
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Sai Krishna Thota
  abstract: Graph Neural Networks (GNNs) are now one of the key tools to model relational
    and non-Euclidean data in multiagent systems, infrastructure networks and even
    molecular modeling applications. Nevertheless, in very dense or noisy graph topologies,
    classical message-passing architectures may experience scalability and representational
    degeneration, especially due to over-smoothing and insufficient higher-order dependency
    information. The recent developments in quantum machine learning indicate that
    hybrid quantum-classical models can also provide an alternative feature representation
    by projecting relational data to parameterized quantum circuits. This article
    presents a Quantum-Enhanced Graph Neural Network (QGNN) architecture that extends
    variational quantum circuits with graph learning pipelines, based on classical
    learning. Parameters are represented as parameterized qubits, and relational dependencies
    are represented as structured entanglement mappings. We benchmark the regimes
    where quantum-enhanced relational encoding proves to be more robust and stable
    through the swarm coordination, molecular property prediction, and financial transaction
    network. We also elaborate on the issue of scalability, hardware issues, and practical
    aspects of near-term hybrid implementations and give a critical view of the changing
    role of quantum methods in computational intelligence systems.
