- title: 'Quantum Machine Learning and Quantum Deep Learning: A Review of Algorithms,
    Applications, Challenges and Future Directions'
  date: 2026-06
  url: https://doi.org/10.55248/gengpi.07.0626.15b19
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Sahul Goyal
  abstract: Quantum Machine Learning (QML) and Quantum Deep Learning (QDL) are emerging
    research areas that combine quantum computing with machine learning and deep learning
    techniques.These approaches aim to improve computational speed, feature representation,
    optimisation, and learning performance in complex data-driven problems.This review
    paper presents a structured discussion of recent developments in QML and QDL,
    focusing on major algorithms, application areas, implementation approaches, current
    limitations, and future research directions.The review covers important quantum-based
    learning methods, including quantum support vector machines, quantum k-nearest
    neighbours, quantum principal component analysis, quantum neural networks, variational
    quantum classifiers, quantum convolutional neural networks, quantum reinforcement
    learning, quantum generative models, and hybrid quantum-classical models.The paper
    also discusses how these methods are being explored in healthcare, finance, cybersecurity,
    communication networks, image processing, natural language processing, and optimisation.However,
    the review shows that most QML and QDL models are still in the early stages of
    research.Current challenges include noisy quantum hardware, limited qubit count,
    data encoding issues, circuit design problems, difficulties with model training,
    and a lack of standardised benchmarks.The review concludes that QML and QDL have
    strong future potential, but their practical success depends on improved hardware,
    stronger algorithms, reliable frameworks, and fair comparison with classical models.
  venue: International Journal of Research Publication and Reviews
- title: Quantum physics-informed neural network for scattered wavefields
  date: 2026-06
  url: https://doi.org/10.1142/s0129183126430096
  category: quantum-machine-learning
  subcategory: method
  authors:
  - D. H. G. Duarte
  - P. D. S. de Lima
  - A. B. P. Junior
  abstract: Quantum machine learning (QML) has emerged as a promising paradigm for
    scientific computing, particularly when combined with Physics-Informed Neural
    Networks (PINNs) to solve partial differential equations. In this work, we introduce
    a Quantum Physics-Informed Neural Network (QPINN) framework to solve the Helmholtz
    equation in the context for scattered-wavefield. To overcome the numerical instabilities
    associated with point-source singularities commonly encountered in classical PINNs,
    we adopt the Lippmann–Schwinger integral formulation. The proposed hybrid architecture
    couples a classical neural-network encoder with a variational quantum circuit,
    enabling the learning of expressive, dynamically generated feature embeddings.
    Numerical experiments on a heterogeneous velocity model demonstrate that the proposed
    QPINN achieves high solution accuracy while requiring significantly fewer trainable
    parameters than analogous classical neural network architectures. Our results
    highlight the potential of hybrid quantum-classical approaches as efficient and
    scalable alternatives for wavefield simulation and for solving wave-based inverse
    problems.
  venue: International Journal of Modern Physics C
- title: Quantum Machine Learning for Industrial Artificial Intelligence
  date: 2026-06
  url: https://doi.org/10.4018/979-8-2600-0156-1.ch012
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Muhammad Farhan
  abstract: 'The potential for quantum machine learning is starting to shift from
    theory to well-contained industrial trials. It is most likely to be useful in
    situations where data for industry is not abundant, is hard to tag, high dimensional,
    physically structured, or is associated with challenging optimization problems.
    This chapter reviews some of the major architectures relevant to current industrial
    applications of artificial intelligence that are currently applicable to quantum
    computing: quantum kernels, variational quantum circuits, quantum neural networks,
    quantum convolutional models, quantum reservoir computing, quantum enhanced recurrent
    models, and quantum optimization models. It links these architectures to predictive
    maintenance, anomaly detection, quality inspection, semiconductor manufacturing,
    additive manufacturing, energy systems, scheduling and digital twins.'
  venue: Advances in computational intelligence and robotics book series
- title: Tailor Made Embeddings for Quantum Machine Learning
  date: 2026-06
  url: https://arxiv.org/abs/2606.26312
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Aldo Lamarre
  - Dominik Šafránek
  abstract: Autoencoders transformed classical machine learning by solving the curse
    of dimensionality, enabling principled weight initialization and learning compact,
    structured representations. In this work, we extend this paradigm to quantum machine
    learning by introducing a variational autoencoder framework that learns task-specific
    quantum embeddings of classical data. We demonstrate that high-dimensional datasets,
    including ImageNet, can be compressed into a 13-qubit quantum representation while
    remaining reconstructable through a learned decoder. On MNIST (3 vs 5), our approach
    achieves 98.5% validation accuracy using a circuit-centric quantum classifier,
    within 1.2 percentage points of a classical neural network baseline (99.7%) and
    more than 30 percentage points above a naive amplitude-embedding approach. Unlike
    amplitude embeddings, which require full quantum state tomography for recovery,
    or angle embeddings, which generally rely on circuit inversion under restrictive
    assumptions, the proposed framework reconstructs the original data from only a
    polynomial number of measurements. The framework was further validated on IBM
    quantum hardware, confirming that the learned embeddings remain stable and reconstructable
    under real device noise.
  venue: arXiv (Cornell University)
- title: A Comprehensive Analysis of Accuracy and Robustness in Quantum Neural Networks
  date: 2026-04
  url: https://arxiv.org/abs/2604.26110
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Ban Q. Tran
  - Duong M. Chu
  - Hai T. D. Pham
  abstract: 'Quantum Machine Learning (QML) has recently emerged as a highly promising
    research frontier. Within this domain, Quantum Neural Networks (QNNs),characterized
    by Variational Quantum Circuits (VQCs) at their core and featuring layers of quantum
    gates optimized by classical algorithms, have garnered significant attention.
    However, a rigorous and exhaustive evaluation of their practical performance remains
    largely incomplete. In this study, we conduct a comprehensive comparative analysis
    of three prominent hybrid classical-quantum architectures: Quantum Convolutional
    Neural Networks (QCNN), Quantum Recurrent Neural Networks (QRNN), and Quantum
    Vision Transformers (QViT), focusing on the critical dimensions of generalization,
    accuracy, and robustness. Our findings provide novel insights that address previous
    evaluative gaps. Notably, while these models exhibit exceptional performance on
    low-feature datasets such as MNIST, their learning efficacy degrades significantly
    when transitioned to high-feature datasets. Furthermore, convolutional-based models
    like QCNN appear less effective on high-dimensional data than other machine learning
    architectures. Additionally, while all models are susceptible to adversarial noise,
    traditional architectures, such as recurrent and convolutional networks, demonstrate
    superior resilience. Conversely, in the presence of quantum noise, the transformer-based
    architecture proves its strength by maintaining high robustness against measurement
    noise, channel noise, and finite-shot effects, whereas other architectures suffer
    marked performance declines. These results provide a granular perspective on the
    current state of the field and underscore the critical importance of tailoring
    model selection to the constraints of contemporary Noisy Intermediate-Scale Quantum
    (NISQ) environments.'
  venue: arXiv (Cornell University)
- title: 'Machine Unlearning in the Era of Quantum Machine Learning: An Empirical
    Study'
  date: 2026-08
