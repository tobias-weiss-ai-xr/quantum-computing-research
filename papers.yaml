- title: Quantum Machine Learning for Accelerated Drug Discovery
  date: 2026-04
  url: https://doi.org/10.62643/ijerst.2026.v22.n2.pp200-207
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Mr. B. Srinivasa Rao
  - G. Bhuvaneswari
  - Ch. Sneha
  abstract: Drug discovery is a notoriously protracted and resource-intensive endeavor,
    with the average timeline exceeding a decade and costs surpassing $2 billion per
    approved therapeutic agent. The advent of quantum machine learning (QML) offers
    a transformative opportunity to address the fundamental computational bottlenecks
    of molecular property prediction, chemical space exploration, and de novo drug
    design. This paper presents an integrated QML framework that combines quantum
    neural networks (QNNs) with variational quantum circuits (VQCs) to accelerate
    critical stages of the drug discovery pipeline. Leveraging the principles of quantum
    superposition and entanglement, the proposed system encodes molecular representations
    into high-dimensional quantum states, enabling parallel exploration of chemical
    space that is classically intractable. A hybrid quantum-classical architecture
    is introduced, wherein quantum circuits process encoded molecular fingerprints
    while classical optimizers refine circuit parameters via the parameter shift rule.
    Experimental evaluations on a benchmark dataset of 10,000 molecular structures
    from PubChem demonstrate that the hybrid system achieves R² = 0.87 on solubility
    prediction, AUC = 0.84 on toxicity classification, and RMSE improvement of 8%
    on binding affinity prediction compared to classical deep learning baselines.
    Quantum generative models produce novel molecules with 85% novelty and 94% chemical
    validity, outperforming classical variational autoencoders. The Variational Quantum
    Eigensolver (VQE) achieves chemical accuracy (&lt;1 kcal/mol error) for ground-state
    energy calculations of small molecules. All modules achieved 100% pass rate across
    34 test cases. These results substantiate the potential of QML for pharmaceutical
    applications and provide a reproducible, modular pipeline for future quantum drug
    discovery research.
  venue: International Journal of Engineering Research and Science & Technology
- title: Noise-Aware Adaptive Variational Quantum Neural Network (NAVQNN) For Robust
    NISQ-Era Banknote Authentication
  date: 2026-04
  url: https://doi.org/10.1109/ickecs70176.2026.11527643
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Bommisetti Rakesh
  - G.Murali
  abstract: Noise and limited circuit depth remain major obstacles for deploying quantum
    machine learning models on noisy intermediate-scale quantum (NISQ) devices. Variational
    quantum neural networks (VQNNs) are promising for near-term learning, but their
    performance strongly depends on ansatz design and training stability under realistic
    noise. In this paper, we propose a Noise-Aware Adaptive Variational Quantum Neural
    Network (NAVQNN) for supervised binary classification. NAVQNN combines angle-based
    quantum encoding with a variational classifier whose circuit structure is grown
    adaptively from a candidate block pool using a noise-aware selection criterion
    that evaluates validation loss under a depolarizing noise model and penalizes
    hardware cost (depth and entangling gates). The model is trained in a hybrid quantum–classical
    loop using parameter-shift gradients and the Adam optimizer. Experiments on the
    UCI Banknote Authentication dataset demonstrate strong classification performance,
    achieving 99.13% accuracy and AUC = 0.9998 under NISQ-like noisy simulation, with
    consistently high precision, recall, and F1-score. These results indicate that
    noise-aware adaptive circuit construction can reduce dependence on hand-crafted
    ansätze while maintaining reliable performance in near-term quantum learning settings.
  venue: ''
- title: Hybrid Classical–Quantum-Inspired Neural Network with Simulated Variational
    Circuit for Credit Card Fraud Detection
  date: 2026-07
  url: https://doi.org/10.9734/ajrcos/2026/v19i7877
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - V. R. Srividhya
  - Srividhya Ganesan
  abstract: 'Credit card fraud detection remains a challenging binary classification
    problem because fraudulent transactions are rare, transaction patterns are complex,
    and false negatives may have important operational consequences. This study presents
    a Hybrid Classical–Quantum-Inspired Neural Network (HCQNN) with a simulated variational
    quantum circuit for credit card fraud detection. The proposed framework combines
    classical preprocessing, SMOTE-based class balancing, neural network-based feature
    learning, and quantum-inspired variational feature transformation. The model was
    evaluated using the Credit Card Fraud Detection dataset after applying SMOTE to
    the training data and was compared with three classical baseline classifiers:
    Logistic Regression, Decision Tree, and Linear Support Vector Machine. The experimental
    results show that the proposed HCQNN achieved an AUC of 97.85%, precision of 91.20%,
    recall of 90.10%, and an F1-score of 90.64%. These values indicate improved classification
    balance, particularly in the detection of minority-class fraud cases, compared
    with the selected baseline models. Training and validation behaviour also showed
    stable convergence, with training and validation accuracies exceeding 96% and
    95%, respectively. Since the variational quantum circuit was simulated on classical
    hardware, the findings should be interpreted as evidence of the value of hybrid
    feature learning and quantum-inspired transformations rather than as proof of
    quantum computational advantage. The study provides a basis for further evaluation
    using broader datasets, additional baseline models, and real quantum hardware.'
  venue: Asian Journal of Research in Computer Science
- title: 'Quantum machine learning for complex systems: paradigms, applications, and
    challenges'
  date: 2026-04
  url: https://doi.org/10.20935/acadquant8243
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Vinit Singh
  - Amandeep Singh Bhatia
  - Mandeep Kaur Saggi
  abstract: Quantum machine learning (QML) is rapidly transitioning from theoretical
    promise to practical relevance across data-intensive scientific domains. In this
    review, we provide a structured overview of recent advances that bridge foundational
    quantum learning principles with real-world applications. We survey foundational
    QML paradigms, including variational quantum algorithms, quantum kernel methods,
    and neural-network quantum states, with emphasis on their applicability to complex
    quantum systems. We examine neural-network quantum states as expressive variational
    models for correlated matter, non-equilibrium dynamics, and open quantum systems,
    and discuss fundamental challenges associated with training and sampling. Recent
    advances in quantum-enhanced sampling and diagnostics of learning dynamics, including
    information-theoretic tools, are reviewed as mechanisms for improving scalability
    and trainability. The review further highlights application-driven QML frameworks
    in drug discovery, cancer biology, and agro-climate modeling, where data complexity
    and constraints motivate hybrid quantum–classical approaches. We conclude with
    a discussion of federated quantum machine learning as a route to distributed,
    privacy-preserving quantum learning. Overall, this review presents a unified perspective
    on the opportunities and limitations of QML for complex systems.
  venue: Academia quantum.
- title: 'Hybrid Quantum-Classical Machine Learning Models: A Review'
  date: 2026-05
  url: https://doi.org/10.66631/ijecs.2026.9.10.8
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Miss. Rupeshwari Janardan Rangari
  abstract: Hybrid quantum-classical machine learning (HQML) models represent an emerging
    computational paradigm that combines the strengths of quantum computing and classical
    artificial intelligence to solve complex learning problems more efficiently.Quantum
    computing offers massive parallelism, superposition, and entanglement, enabling
    computational capabilities beyond classical systems for selected tasks.However,
    current quantum hardware remains limited by noise, decoherence, and scalability
    constraints.Hybrid architectures overcome these limitations by integrating quantum
    processors with classical machine learning frameworks, allowing practical implementation
    on Noisy Intermediate-Scale Quantum (NISQ) devices.This review paper presents
    a comprehensive study of hybrid quantum-classical machine learning models, including
    their architecture, working principles, quantum circuits, optimization techniques,
    and applications in healthcare, cybersecurity, finance, robotics, and big data
    analytics.The paper also discusses quantum neural networks, variational quantum
    circuits, quantum support vector machines, and quantum generative models.Furthermore,
    comparative analysis between classical and hybrid quantum systems is presented
    to evaluate performance, scalability, computational efficiency, and implementation
    challenges.Major issues such as quantum noise, hardware limitations, algorithm
    complexity, and high operational cost are examined in detail.Finally, future research
    directions and emerging trends in hybrid quantum-classical computing are discussed.The
    review concludes that HQML models have the potential to revolutionize next-generation
    intelligent computing systems.
  venue: International Journal of Engineering and Creative Science
- title: Hilbert-Space Quantum Neural Representation Learning for NISQ-Era Quantum
    Computing
  date: 2026-08
  url: https://doi.org/10.17635/lancaster/thesis/3358
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Yijie Zhu
  abstract: The convergence of quantum computing and machine learning offers significant
    potential for processing complex data distributions. However, the realization
    of this potential in the Noisy Intermediate-Scale Quantum (NISQ) era is constrained
    by physical hardware limitations, particularly restricted qubit counts and system
    noise. This thesis addresses the challenge of the ”Representation Bottleneck”
    by establishing a framework for resource-efficient quantum representation learning.
    The research demonstrates that effective learning on near-term devices can be
    achieved by optimizing circuit architectures and objective functions to align
    with hardware constraints. First, to address resource limitations in high-dimensional
    visual recognition, we propose the Multi-Gate Quantum Convolutional Neural Network
    (MG-QNN). By employing a Multi-Gate strategy, this architecture optimizes the
    utilization of quan tum resources within the circuit design. Empirical evaluations
    on face recognition benchmarks indicate that this approach maintains competitive
    recognition accuracy while reducing the qubit requirement compared to standard
    quantum convolutional methods. Second, extending the framework to non-Euclidean
    data, we introduce the Single-Qubit Graph Neural Network (sQGNN). Utilizing Discrete-Time
    Quantum Walks, this method encodes graph topologies and relational patterns onto
    a single qubit. This approach circumvents the need for multi-qubit entangling
    gates, thereby reducing the computational overhead and noise sensitivity typically
    associated with processing graph-structured data. Third, in the domain of generative
    modeling, we present the Single-Qubit Quan tum Convolutional Variational Autoencoder
    (QCVAE). Addressing the difficulty of generative tasks on constrained devices,
    this model integrates the Information Bottleneck principle with efficient data
    re-uploading techniques. The study demonstrates that a single qubit possesses
    sufficient expressivity to model and reconstruct image distributions effectively
    when guided by appropriate information theoretic constraints. Finally, to resolve
    the fundamental limitations of classical loss functions in quantum learning, we
    establish the Hilbert-Schmidt Information Bottleneck (HSIB). We identify that
    standard Euclidean metrics often fail to respect the geometric structure of the
    Hilbert space. The HSIB framework employs the Hilbert Schmidt distance as a tractable
    geometric measure, providing a learning objective that maximizes information retention
    while adhering to the intrinsic geometry of quantum states. Collectively, these
    contributions illustrate that practical quantum machine learning advantage in
    the NISQ era does not rely solely on scaling hardware, but on the strategic design
    of resource-efficient architectures and geometrically valid metrics.
  venue: Lancaster EPrints (Lancaster University)
- title: A hardware efficient quantum residual neural network without post-selection
  date: 2026-04
  url: https://arxiv.org/abs/2604.06866
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Amena Khatun
  - Akib Karim
  - Muhammad Usman
  abstract: We propose a hardware efficient quantum residual neural network which
    implements residual connections through a deterministic mixture of the identity
    operation and variational unitaries, enabling fully differentiable training. In
    contrast to the previous implementation of residual connections, our architecture
    avoids post-selection while preserving residual learning. Furthermore, we highlight
    circuit constructions where barren plateaus could be mitigated, which are considered
    as a major limitation of variational quantum learning models. In order to show
    the working of our model, we report its application to image classification tasks
    by training it for MNIST, CIFAR, and SARFish datasets, achieving accuracies of
    99\% and 80\% for binary and multi-class classifications, respectively. These
    accuracies are comparable to previously achieved from the standard variational
    models, however our model requires 10x fewer gates making it better suited for
    resource constraint near-term quantum processors. In addition to high accuracies,
    the proposed architecture also demonstrates adversarial robustness which is another
    desirable parameter for quantum machine learning models. Overall our architecture
    offers a new pathway for developing accurate, robust, trainable and hardware efficient
    quantum machine learning models.
