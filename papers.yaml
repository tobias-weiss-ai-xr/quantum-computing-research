- title: Quantum non-demolition measurements as a practical primitive for fault-tolerant
    computation against biased noise
  date: 2026-05
  url: https://arxiv.org/abs/2605.24262
  category: quantum-error-correction
  subcategory: method
  authors:
  - Christophe Vuillot
  - Diego Ruiz
  - Jérémie Guillaud
  abstract: 'Leveraging noise bias, where phase-flip errors dominate over bit-flips,
    can drastically reduce the hardware overhead of fault-tolerant quantum computation,
    but existing approaches require bias-preserving CNOT gates whose implementation
    remains experimentally challenging and is provably impossible for strictly two-dimensional
    systems. We show that high-fidelity quantum non-demolition (QND) multi-qubit Pauli
    $Z$ measurements provide an equally powerful yet more accessible primitive. We
    demonstrate that such measurements can fully replace bias-preserving CNOT gates
    for compiling all operations required by bias-tailored error correction, including
    stabilizer measurements for repetition codes, XZZX surface codes, and LDPC codes.
    We propose concrete physical implementations of this primitive for two platforms:
    solid-state nuclear spins coupled to electron spin ancillas, and dissipatively
    stabilized superconducting cat qubits. Through circuit-level numerical simulations,
    we show that an asymmetric XZZX surface code implemented with weight-four QND
    $Z$ measurements achieves a phase-flip threshold of $\sim\!1.25\%$ and provides
    a qubit overhead reduction of up to $6\times$ compared to a bias-unaware surface
    code at noise bias $η= 10^4$. In the regime of very large bias, a repetition code
    with QND $Z$ measurements attains a threshold of $\sim\!2.3\%$ and achieves overhead
    comparable to that of a bias-preserving CNOT scheme, without requiring such a
    gate. Our results establish QND multi-$Z$ measurements as a practical and hardware-efficient
    route to fault-tolerant quantum computation for a broad class of biased-noise
    platforms.'
  venue: arXiv (Cornell University)
- title: A brief review of quantum machine learning techniques for financial services
  date: 2026-03
  url: https://arxiv.org/abs/2407.12618
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Mina Doosti
  - Petros Wallden
  - Conor Brian Hamill
  abstract: Abstract This review paper examines state-of-the-art algorithms and techniques
    in quantum machine learning (QML) with potential applications in finance. We discuss
    QML techniques in supervised learning tasks, such as quantum variational classifiers,
    quantum Kernel estimation, and quantum neural networks, along with quantum generative
    AI techniques like quantum transformers and quantum graph neural networks. The
    financial applications considered include risk management, credit scoring, fraud
    detection, and stock price prediction. We also provide an overview of the challenges,
    potential, and limitations of QML, both in these specific areas and more broadly
    across the field. We hope that this can serve as a quick guide for data scientists,
    professionals in the financial sector, and enthusiasts in this area to understand
    why quantum computing and QML in particular could be interesting to explore in
    their field of expertise.
  venue: Machine Learning Science and Technology
- title: Polynomially efficient quantum enabled variational Monte Carlo for training
    neural-network quantum states for physico-chemical applications
  date: 2026-05
  url: https://arxiv.org/abs/2412.12398
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Manas Sajjan
  - Vinit Kumar Singh
  - Sabre Kais
  abstract: With diverse architectures and strong expressivity, neural-network quantum
    states (NQS) offer an alternative to traditional variational ansätze for simulating
    physical systems. Energy-based models such as Hopfield networks and Restricted
    Boltzmann Machines draw on statistical physics, mapping quantum states onto energy
    landscapes as associative memories. We show these models can be trained efficiently
    with Monte Carlo accelerated by quantum devices. Our algorithm scales linearly
    with circuit width and depth, uses constant measurements, avoids mid-circuit measurements,
    and requires polynomial storage. It treats both phase and amplitude fields, enlarging
    the trial space. Sampling on quantum hardware shortens mixing times and yields
    more faithful estimates, revealing a quantum-assisted advantage. We demonstrate
    accurate learning of ground states for local spin models and nonlocal electronic-structure
    Hamiltonians, including at distorted geometries with strong multi-reference correlation.
    Benchmarks show close agreement and high robustness highlighting promise of machine-learning
    protocols paired with near-term quantum devices for state learning in chemistry
    and condensed-matter physics.
  venue: npj Quantum Information
- title: A novel quantum convolutional neural network framework for quantum-enhanced
    classification of pixelated colour images
  date: 2026-03
  url: https://doi.org/10.1038/s41598-026-45140-w
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Chisomo Daka
  - Somnath Bhattacharyya
  abstract: As image datasets grow in scale and complexity, classical convolutional
    neural networks (CNNs) increasingly face limitations in computational efficiency,
    scalability, and generalisation in low-data regimes. Quantum machine learning
    (QML) offers a promising alternative, with quantum convolutional neural networks
    (QCNNs) exploiting quantum parallelism and entanglement for feature extraction.
    This paper introduces the Novel Quantum Convolutional Neural Network (No-QCNN),
    which differs from recent hybrid QCNN/QCQ-CNN architectures by employing an end-to-end
    quantum convolution-pooling pipeline without inserting an intermediate classical
    CNN block. No-QCNN is a hybrid quantum-classical model that employs a variational
    quantum classifier (VQC) optimised via the COBYLA algorithm and is designed for
    binary and multiclass classification of low-resolution colour images on near-term
    quantum devices. A key innovation is a problem-specific quantum feature map that
    pre-processes each image into a structured three-dimensional block-matrix representation,
    jointly encoding pixel colour (R, G, B) and spatial position before mapping this
    information into a hierarchical ZZFeatureMap. This encoding captures spatial-chromatic
    correlations at shallow circuit depth, making it compatible with noisy intermediate-scale
    quantum (NISQ) constraints. The model is implemented using IBM-Qiskit on a local
    quantum simulator and benchmarked against a classical CNN. For a six-class classification
    task on a 50-image dataset, No-QCNN achieves a validation accuracy of 82.05%,
    substantially outperforming the classical CNN's 40.00%, indicating improved generalisation
    and reduced overfitting in low-data, multiclass settings. Conversely, for a simpler
    binary classification task, the classical CNN achieves perfect validation accuracy
    of 100%, surpassing the No-QCNN's 89.7%. We further observe that No-QCNN performance
    declines with increasing dataset size and training time due to limited circuit
    expressibility, data-encoding overhead, and finite-sampling noise inherent to
    NISQ models. Overall, these results position No-QCNN as a complementary framework
    best suited to low-data, correlation-rich classification tasks, defining a realistic
    niche for quantum-enhanced artificial vision and quantum perception in the NISQ
    era.
  venue: Scientific Reports
- title: Resource-efficient equivariant quantum convolutional neural networks
  date: 2026-04
  url: https://arxiv.org/abs/2410.01252
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Koki Chinzei
  - Quoc Hoan Tran
  - Yasuhiro Endo
  abstract: Abstract Equivariant quantum neural networks (QNNs) are promising variational
    models that exploit symmetries to improve machine learning capabilities. Despite
    theoretical developments in equivariant QNNs, their implementation on near-term
    quantum devices remains challenging due to limited computational resources. This
    study proposes a resource-efficient model of equivariant quantum convolutional
    networks (QCNNs) called equivariant split-parallelizing QCNN (sp-QCNN). Using
    a group-theoretical approach, we encode general symmetries into our model beyond
    the translational symmetry addressed by previous sp-QCNNs. We achieve this by
    splitting the circuit at the pooling layer while preserving symmetry. This splitting
    structure effectively parallelizes QCNNs to improve measurement efficiency in
    estimating the expectation value of an observable and its gradient by order of
    the number of qubits. Our model also exhibits high trainability and generalization
    performance, including the absence of barren plateaus. Numerical experiments demonstrate
    that the equivariant sp-QCNN can be trained and generalized with fewer measurement
    resources than a conventional equivariant QCNN in a noisy quantum data classification
    task. Our results contribute to the advancement of practical quantum machine learning
    algorithms.
  venue: Quantum Machine Intelligence
- title: Benchmarking quantum machine learning methods for intrusion detection on
    noisy quantum computers
  date: 2026-03
  url: https://doi.org/10.1007/s42484-026-00379-4
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Franco Cirillo
  - Christian Esposito
  - Jung Taek Seo
  abstract: Abstract Intrusion detection systems (IDS) are essential for identifying
    cyber threats in complex digital environments. Machine learning (ML) is widely
    used to improve IDS by detecting anomalies, but classical ML methods often struggle
    with high-dimensional data and evolving threats. Quantum machine learning (QML)
    has been proposed as a potential paradigm to overcome some of these limitations,
    but is constrained by noisy intermediate-scale quantum (NISQ) challenges, affecting
    quality. This study systematically evaluates three QML models, Pegasos Quantum
    Support Vector Classifier (QSVC), Variational Quantum Classifier (VQC), and a
    Hybrid Quantum–Classical Neural Network (HQNN), for network anomaly detection.
    The models were optimized and tested on the ToN_IoT and NSL-KDD datasets using
    IBM quantum simulators under both ideal and noisy conditions. Performance was
    analyzed through the F1-score distribution as a function of circuit complexity,
    revealing how entanglement and noise affect robustness across different backends.
    Comparisons with classical models contextualize the current maturity of QML for
    cybersecurity, while computational time was used as an indicator of model complexity
    to explore accuracy–efficiency trade-offs. Among all configurations, Pegasos-QSVC
    achieved the best results, with 94.60% accuracy and an F1-score of 94.13%. The
    findings provide practical guidelines for designing noise-resilient QML models
    and highlight their potential for reliable intrusion detection under realistic
    quantum conditions.
  venue: Quantum Machine Intelligence
- title: Exploring the potential of Quantum Graph Neural Networks in analyzing Large-Scale
    Structure of Universe
  date: 2026-03
  url: https://doi.org/10.1016/j.ascom.2026.101095
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Farida Farsian
  - F. Schillirò
  - Andrea Bulgarelli
  abstract: The large-scale structure (LSS) of the Universe, characterized by the
    distribution of clusters, filaments, walls, and voids, encodes fundamental information
    about cosmology and structure formation. Standard cosmological analyses, based
    on abundances as well as two-point and higher-order correlation functions, have
    been widely used to extract information from LSS. While powerful, these techniques
    can only access a subset of the full information content, leaving much of the
    encoded structure underexploited. This motivates the use of more flexible approaches
    capable of learning directly from the raw, graph-like nature of the cosmic web
    without relying on strong compression or dimensionality reduction. Recent advances
    in machine learning, particularly graph neural networks (GNNs), provide a natural
    framework for this task by capturing the non-Euclidean connectivity of cosmic
    structures. Building on these developments, recent progress in quantum machine
    learning (QML) offers an intriguing opportunity to further enhance representation
    power through quantum-enhanced models. In this work, we investigate the potential
    of quantum graph neural networks (QGNNs) as an alternative computational framework
    for analyzing LSS, focusing on structure identification and classification with
    an emphasis on distinguishing clusters and voids. Leveraging the hybrid quantum–classical
    paradigm implemented in PennyLane, we construct variational quantum circuits to
    encode graph representations of cosmological data and compare their performance
    against state-of-the-art classical GNNs. Our study evaluates the accuracy and
    expressivity of QGNNs relative to classical models, with particular attention
    to their ability to capture complex correlations in sparse, high-dimensional astrophysical
    datasets. Preliminary results indicate that QGNNs achieve comparable classification
    performance, while highlighting both the opportunities and current limitations
    of quantum-enhanced approaches in cosmological applications.
  venue: Astronomy and Computing
- title: Spectral invariance and maximality properties of the frequency spectrum of
    quantum neural networks
  date: 2026-03
  url: https://doi.org/10.1007/s42484-026-00372-x
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Patrick Holzer
  - Ivica Turkalj
  abstract: Abstract Quantum Neural Networks (QNNs) are a popular approach in Quantum
    Machine Learning. We analyze the frequency spectrum using Minkowski sums, which
    yields a compact algebraic description and permits explicit computation. Using
    this description, we prove several maximality results for broad classes of QNN
    architectures. Under some mild technical conditions we establish a bijection between
    classes of models with the same area $$A:=R\cdot L$$ that preserves the frequency
    spectrum, where R denotes the number of qubits and L the number of layers, which
    we consequently call spectral invariance under area-preserving transformations.
    With this we explain the symmetry in R and L in the results often observed in
    the literature and show that the maximal frequency spectrum depends only on the
    area $$A=RL$$ and not on the individual values of R and L . Moreover, we collect
    and extend existing results and specify the maximum possible frequency spectrum
    of a QNN with an arbitrary number of layers as a function of the spectrum of its
    generators. In the case of arbitrary dimensional generators, where our two introduced
    notions of maximality differ, we extend existing Golomb ruler based results and
    introduce a second novel approach based on a variation of the turnpike problem,
    which we call the relaxed turnpike problem. We clarify comprehensively how the
    generators of a QNN must be chosen in order to obtain a maximal frequency spectrum
    for a given area A , thereby contributing to a deeper theoretical understanding.
    However, our numerical experiments show that trainability depends not only on
    $$A = RL$$ , but also on the choice of ( R , L ), so that knowledge of the maximum
    frequency spectrum alone is not sufficient to ensure good trainability. While
    the maximality analysis limits the space of attainable frequency spectra and characterizing
    these spectra helps to understand the effect of the ansatz choice, it does not
    by itself provide sufficient criteria for ansatz selection, and further considerations
    are required.
  venue: Quantum Machine Intelligence
- title: Parallel Multi-Circuit Quantum Feature Fusion in Hybrid Quantum-Classical
    Convolutional Neural Networks for Breast Tumor Classification
  date: 2026-04
  url: https://arxiv.org/abs/2512.02066
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Ece Yurtseven
  abstract: 'Quantum machine learning has emerged as a promising approach to improve
    feature extraction and classification tasks in high-dimensional data domains such
    as medical imaging. In this work, we present a hybrid Quantum-Classical Convolutional
    Neural Network (QCNN) architecture designed for the binary classification of the
    BreastMNIST dataset, a standardized benchmark for distinguishing between benign
    and malignant breast tumors. Our architecture integrates classical convolutional
    feature extraction with two distinct quantum circuits: an amplitude-encoding variational
    quantum circuit (VQC) and an angle-encoding VQC circuit with circular entanglement,
    both implemented on four qubits. These circuits generate quantum feature embeddings
    that are fused with classical features to form a joint feature space, which is
    subsequently processed by a fully connected classifier. To ensure fairness, the
    hybrid QCNN is parameter-matched against a baseline classical CNN, allowing us
    to isolate the contribution of quantum layers. Both models are trained under identical
    conditions using the Adam optimizer and binary cross-entropy loss. Experimental
    evaluation in five independent runs demonstrates that the hybrid QCNN achieves
    statistically significant improvements in classification accuracy compared to
    the classical CNN, as validated by a one-sided Wilcoxon signed rank test ($\mathbf{p}=0.03125$)
    and supported by large effect size of Cohen''s$\mathbf{d} \boldsymbol{=} \mathbf{2.
    1 4}$. Our results indicate that hybrid QCNN architectures can leverage entanglement
    and quantum feature fusion to enhance medical image classification tasks. This
    work establishes a statistical validation framework for assessing hybrid quantum
    models in biomedical applications and highlights pathways for scaling to larger
    datasets and deployment on near-term quantum hardware.'
  venue: ''
- title: 'TensorHyper-VQC: a tensor-train-guided hypernetwork for robust and scalable
    variational quantum computing'
  date: 2026-02
  url: https://arxiv.org/abs/2508.01116
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Jun Qi
  - Chao-Han Huck Yang
  - Pin‐Yu Chen
  abstract: Abstract Variational Quantum Computing (VQC) faces fundamental scalability
    barriers, primarily due to the presence of barren plateaus and its sensitivity
    to quantum noise. To address these challenges, we introduce TensorHyper-VQC, a
    novel tensor-train (TT)-guided hypernetwork framework that significantly improves
    the robustness and scalability of VQC. Our framework fully delegates the generation
    of quantum circuit parameters to a classical TT network, effectively decoupling
    optimization from quantum hardware. This innovative parameterization mitigates
    gradient vanishing, enhances noise resilience through structured low-rank representations,
    and facilitates efficient gradient propagation. Grounded in Neural Tangent Kernel
    and statistical learning theory, our rigorous theoretical analyses establish strong
    guarantees on approximation capability, optimization stability, and generalization
    performance. Extensive empirical results across quantum dot classification, Max-Cut
    optimization, and molecular quantum simulation tasks demonstrate that TensorHyper-VQC
    consistently achieves superior performance and robust noise tolerance, including
    hardware-level validation on a 156-qubit IBM Heron processor. These results position
    TensorHyper-VQC as a scalable and noise-resilient framework for advancing practical
    quantum machine learning on near-term devices.
  venue: npj Quantum Information
- title: Physics-informed Hamiltonian learning for large-scale optoelectronic property
    prediction
  date: 2026-03
  url: https://doi.org/10.1038/s41467-026-70865-7
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Martin Schwade
  - Shaoming Zhang
  - Frederik Vonhoff
  abstract: Predicting optoelectronic properties of large-scale atomistic systems
    under realistic conditions is crucial for rational materials design, yet computationally
    prohibitive with first-principles simulations. Recent neural network models have
    shown promise in overcoming these challenges, but typically require large datasets
    and lack physical interpretability. Physics-inspired approximate models offer
    greater data efficiency and intuitive understanding, but often sacrifice accuracy
    and transferability. Here we present HAMSTER, a physics-informed machine learning
    framework for predicting the quantum-mechanical Hamiltonian of complex chemical
    systems. Starting from an approximate model encoding essential physical effects,
    HAMSTER captures the critical influence of dynamic environments on Hamiltonians
    using only few explicit first-principles calculations. We demonstrate our approach
    on halide perovskites, achieving accurate prediction of optoelectronic properties
    across temperature and compositional variations, and scalability to systems containing
    tens of thousands of atoms. This work highlights the power of physics-informed
    Hamiltonian learning for accurate and interpretable optoelectronic property prediction
    in large, complex systems.
  venue: Nature Communications
- title: 'Decomposition–Quantum Hybrid Model for Accurate Reservoir Inflow Prediction:
    A Case Study on Khoda Afarin Dam'
  date: 2026-03
  url: https://doi.org/10.3390/earth7020035
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Erfan Abdi
  - Mohammad Taghi Sattari
  - Saeed Samadianfard
  abstract: 'Reservoir management, flood control, and operational planning are the
    benefits of dam inflow forecasting. Decomposition algorithms can decompose complex
    inflow data into intrinsic components and reduce noise and fluctuations, while
    quantum machine learning models use features such as superposition and entanglement
    to manage large datasets and capture nonlinear hydrological behaviors. This study
    used three models: random forest (RF) as a classical benchmark, hybrid quantum
    neural network (HQNN) as a quantum approach, and sequential variational mode decomposition
    with HQNN (SVMD-HQNN) that integrates decomposition and quantum learning. The
    modeling was applied to forecast the inflow to Khoda Afarin Dam over 16 years
    (2009–2024) in two scenarios that included hydrological parameters (precipitation
    and evaporation) and reservoir parameters (water level, volume, and surface area).
    The data was divided into training and testing sets in a ratio of 70:30. The results
    showed that SVMD-HQNN achieved higher accuracy than the other two models with
    RMSE = 34.51, R2 = 0.93, NSE = 0.91, MAPE = 11.48%, and KGE = 0.89 in scenario
    (i) and RMSE = 25.74, R2 = 0.95, NSE = 0.94, MAPE = 8.98%, and KGE = 0.93 in scenario
    (ii). In the first scenario, this approach increased the prediction accuracy by
    43.71%, and in the second scenario, it increased the prediction accuracy by 45.47%
    compared to the HQNN model. The proposed SVMD-HQNN framework is particularly effective
    under climate change conditions, where inflow fluctuations and instability are
    significant, and provides robust and generalizable predictions for reservoirs
    in similar environments.'
  venue: Earth
- title: Quantum Machine Learning for Classification Tasks:Variational Quantum Classifiers
    and Quantum Neural Networks
  date: 2026-03
  url: https://doi.org/10.64771/jsetms.2026.v03.i03.pp395-400
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Dr K N S Lakshmi
  - Bondalapu Sandhya
  - Nasari Durga Prasad
  abstract: Quantum Machine Learning (QML) has emerged as a compelling research domain
    that unites quantum computing principles with classical learning theory to address
    computationally demanding classification problems.This paper investigates two
    principal QML architectures-Variational Quantum Classifiers (VQC) and Quantum
    Neural Networks (QNN)-within the context of binary classification.We present an
    end-to-end hybrid quantum-classical pipeline applied to the UCI Mushroom dataset,
    comprising 22 categorical attributes, and demonstrate that quantumenhanced models
    can achieve competitive classification performance under present-day hardware
    constraints.The pipeline integrates Quantum Random Access Code (QRAC) encoding
    for dimensionality reduction, ZZFeatureMapbased quantum feature mapping, RealAmplitudes
    parameterized ansatz, and classical optimizer-driven parameter updates using the
    COBYLA algorithm.The complete system is deployed through a Flask web interface
    and containerized with Docker for reproducibility.Experimental results on a quantum
    simulator indicate a classification accuracy of 87.4%, precision of 0.891, and
    recall of 0.863, establishing the practical viability of NISQ-era quantum classifiers
    for structured categorical data.The paper further analyzes convergence behavior,
    circuit depth effects, and comparative performance against classical baselines,
    providing insights into the strengths and limitations of current QML architectures
    for real-world classification deployment.
  venue: Journal of Science Engineering Technology and Management Sciences
- title: Quantum State Preparation via Neural Network Encoding in Quantum Machine
    Learning
  date: 2026-05
  url: https://arxiv.org/abs/2605.31006
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Kevin W. Aoun
  - Florian J. Kiwit
  - Carlos A. Riofrío
  abstract: A central challenge in quantum machine learning is the state preparation
    bottleneck that describes the prohibitive computational cost of loading high-dimensional
    classical data into a quantum state. Although amplitude encoding can represent
    $2^n$-dimensional data using only $n$ qubits in principle, preparing arbitrary
    states remains computationally expensive, typically requiring variational optimization
    of a parameterized quantum circuit for each individual data instance. In this
    work, we propose a method that avoids iterative optimization by training a classical
    neural network to map input data directly to the continuous parameters of a fixed
    quantum circuit. We demonstrate the generation of quantum image states with high
    fidelity on data not seen during training. Since all optimization is performed
    once during training, the resulting model encodes new inputs in a single inference
    step, providing a scalable pathway for data loading in near-term quantum algorithms.
    We validate our method on the MNIST and Fashion-MNIST datasets, achieving fidelities
    up to 0.992 on unseen images and reducing the per-data-instance runtime by more
    than 5000-fold.
