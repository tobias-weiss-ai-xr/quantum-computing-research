- title: Introduction to Quantum Computing
  date: 2026-02
  url: https://doi.org/10.1201/9781003674566-1
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Sabia Hassan
  - Syed Naseer Ahmad Shah
  - Kaisar J. Giri
  abstract: Quantum computing is an emerging form of computing that uses the rules
    of quantum physics to process information in ways that are far different from
    how computers do it now. Quantum computing uses quantum bits, or qubits, which
    can exist in superpositions of states and get entangled with each other, which
    is different from classical computing, which uses a bit that represents binary
    values (0 or 1). These characteristics allow quantum devices to execute parallel
    computations, enabling significant speedups for specific categories of problems
    considered intractable for classical machines. This chapter gives a thorough introduction
    to quantum computing, starting with a historical overview of its foundations in
    quantum physics and significant theoretical advancements. It analyzes fundamental
    ideas including superposition, entanglement, quantum interference, and the no-cloning
    theorem, explaining how these elements distinguish quantum computation from traditional
    approaches. The advancement of quantum hardware is examined through several architectures,
    trapped ions, superconducting circuits, photonics, and topological qubits, together
    with software frameworks like Qiskit, Cirq, and PennyLane, which support algorithm
    development and simulation. The chapter examines fundamental quantum algorithms,
    such as Grover’s algorithm for database search, Shor’s algorithm for integer factorization,
    and hybrid variational methods designed for noisy intermediate-scale quantum devices.
    The practical applications in domains including as encryption, optimization, machine
    learning, chemistry, and finance emphasize the real-world significance of quantum
    technology. Challenges like decoherence, noise, scalability, and algorithmic maturity
    are rigorously analyzed, followed by an anticipated discourse on future trajectories
    including fault-tolerant architectures, quantum networking, and the development
    of quantum cloud services. This chapter presents a fundamental introduction for
    students, researchers, and practitioners seeking to comprehend the essential principles,
    functionalities, and possibilities of quantum computing in the post–Moore’s law
    period.
  venue: Auerbach Publications eBooks
- title: QForge™ A Next-Generation Engineering Platform for Scalable Quantum Computing
    Design, Verification, and Industrial Algorithm Development
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21857594
  category: quantum-algorithms
  subcategory: method
  authors:
  - QInsight Labs Pvt Ltd
  abstract: Quantum computing is transitioning from an academic discipline into an
    engineering technology. Yet despite substantial global investment in quantum hardware,
    the software ecosystem remains fragmented and mismatched to that transition. The
    dominant frameworks were built for physicists writing low-level quantum programs,
    and they typically depend on external cloud hardware. They are poorly suited to
    engineering design, industrial deployment, education at scale, and large-scale
    algorithm development. QForge™ was developed to address this gap. QForge is not
    another quantum programming library. It is an engineering-oriented quantumdesign
    environment in which users construct, analyse, optimise, simulate, verify and
    document quantum systems within a single unified workflow. It integrates visual
    circuit design, a multiengine simulation architecture, intelligent execution routing,
    engineering resource estimation, multi-level verification and automated documentation
    — the quantum analogue of what electronic design automation provides to classical
    hardware engineering. Three properties distinguish it. It is an engineering environment,
    not a library. The primary artefact is a circuit on a canvas, not code that generates
    a circuit. A complete workflow — design, validate, simulate, verify, estimate,
    report, export — is achievable without writing a line of anything. Code export
    exists as an exit ramp for users who want it, never as an entry requirement. It
    routes execution intelligently across multiple engines. Rather than relying exclusively
    on brute-force state-vector simulation, QForge analyses circuit structure and
    selects the appropriate computational method automatically. Exact simulation is
    used wherever feasible; specialised analytical methods are invoked for structured
    algorithms. Exact QAOA expectation values have been validated at 48 qubits through
    causal-cone decomposition, and a reduced-space engine handles Grover search on
    problem spaces intractable under naivedense simulation. Vectorised kernel engineering
    has delivered 26 ×–79 × speedups over the platform’s reference implementation.
    It never overstates what it computed.Every result carries explicit method provenance.
    Exact results are labelled exact and can be independently cross-checked. Approximations
    are labelled as approximations and carry their error characteristics. Where the
    platform cannot deliver what was asked, it says so rather than returning something
    adjacent. QForge runs entirely on commodity hardware with no quantum backend,
    no cloud account and no network connection — making it deployable in ordinary
    teaching laboratories, in low-resourceinstitutions, and in air-gapped government
    and defence environments.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Quantum Bit-Parallel Swap Matching
  date: 2026-07
  url: https://doi.org/10.1145/3806645.3816165
  category: quantum-algorithms
  subcategory: method
  authors:
  - Simone Faro
  - Francesco Pio Marino
  - Arianna Pavone
  abstract: Pattern matching with swaps is a well-known non-standard variant of the
    string matching problem in which adjacent characters of the pattern may be swapped,
    under the constraint that each character participates in at most one swap. This
    problem has received considerable attention in the stringology literature due
    to its applications in areas such as computational biology, error-tolerant text
    processing, and pattern discovery. In this paper we investigate the problem in
    the quantum computing model. Building upon the recently introduced framework of
    quantum bit-parallelism, which provides a systematic way to translate classical
    bit-parallel string matching algorithms into quantum circuits, we develop the
    first quantum algorithm for swap matching based on this paradigm. Our approach
    adapts the classical cross-sampling technique for swap matching into a reversible
    quantum procedure that simulates the evolution of two interacting automata configurations
    using quantum registers and bitwise quantum operations. While the resulting quantum
    circuit preserves the near-linear behavior of its classical counterpart in terms
    of circuit depth, its integration with Grover’s search enables a quadratic speedup.
    By embedding the verification procedure within a quantum search framework and
    carefully controlling the size of the search space, we obtain a quantum algorithm
    that solves the swap matching problem in \(\tilde{O}(\sqrt {n})\) time. This result
    extends the applicability of quantum bit-parallelism to non-standard string matching
    problems and provides further evidence that a broad class of classical text searching
    techniques can be systematically lifted to the quantum setting while preserving
    their structural efficiency.
