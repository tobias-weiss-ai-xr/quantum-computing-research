- title: Secure Chat Application using Quantum Cryptography Simulation
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20577641
  category: quantum-cryptography
  subcategory: method
  authors:
  - Swapnil Pagar
  - Gore Sahil
  - Arote Rohit
  abstract: This study introduces a secure chat application based on quantum cryptography
    simulation to strengthen the privacy and security of online messaging. The proposed
    system combines traditional chat functionality with Quantum Key Distribution (QKD)
    to safeguard conversations against eavesdropping and impersonation attacks. Using
    the BB84 quantum protocol, the application performs secure key exchange in a simulated
    environment, ensuring that only authorized users can access the messages. Simulation
    results demonstrate that the system achieves significantly better security than
    conventional encryption methods. This research provides a practical and straightforward
    framework for quantum-enhanced secure communication, highlighting its feasibility
    for real-world deployment in the future.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum Cryptography – Principles, Protocols, and Future Directions: A Review'
  date: 2026-07
  url: https://doi.org/10.62411/jimat.v3i1.15959
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Dian Arif Rachman
  - Muhamad Akrom
  - Didik Hermanto
  abstract: The rapid advancement of quantum computing poses a significant threat
    to classical cryptographic systems that rely on the computational hardness of
    mathematical problems such as integer factorization and discrete logarithm problems.
    In this context, quantum cryptography has emerged as a promising paradigm for
    secure communication based on the fundamental principles of quantum mechanics
    rather than on computational assumptions. This paper presents a comprehensive
    review of quantum cryptography, with a particular focus on Quantum Key Distribution
    (QKD), the most mature application. The study discusses the theoretical foundations
    of quantum security, including superposition, entanglement, and the No-cloning
    theorem, which collectively enable eavesdropping detection and guarantee information-theoretic
    security. Furthermore, the review examines major QKD protocols, such as BB84 and
    E91, as well as their advanced variants designed to address practical vulnerabilities
    and enhance performance. Recent progress in real-world implementations, including
    fiber-optic networks, free-space communication, and satellite-based systems such
    as the Micius satellite, is also analyzed. In addition, the paper highlights critical
    challenges related to scalability, hardware limitations, and security loopholes
    arising from imperfect devices. Finally, emerging research directions, including
    hybrid cryptographic frameworks that integrate quantum and post-quantum approaches,
    are discussed to provide insights into the future of secure communication. This
    review aims to provide a structured, up-to-date understanding of quantum cryptography,
    bridging the gap between theoretical developments and practical implementations,
    and emphasizing its crucial role in shaping next-generation cybersecurity systems.
  venue: Journal of Multiscale Materials Informatics
- title: 'EAQKD: Entanglement-Based Authenticated Quantum Key Distribution'
  date: 2026-03
  url: https://arxiv.org/abs/2603.02375
  category: quantum-cryptography
  subcategory: method
  authors:
  - Noureldin Mohamed Abdelaal Ahmed Mohamed
  - Saif Al-Kuwari
  abstract: The promise of unconditional security in the Quantum Key Distribution
    (QKD) depends on the availability of an authenticated classical channel. However,
    practical implementations often overlook this requirement or rely on computational
    assumptions that compromise long-term security. To overcome these challenges,
    this paper presents Entanglement-Based Authenticated Quantum Key Distribution
    (EAQKD), a novel protocol that addresses critical security and practical limitations
    in quantum cryptographic key exchange. Our approach integrates quantum entanglement
    distribution with information-theoretic authentication. We evaluate EAQKD's performance
    through a comprehensive discrete-event simulation framework modeled on realistic
    channel characteristics and experimental device parameters. Our modeling incorporates
    parameters from practical quantum optics setups, including SPDC entanglement sources,
    superconducting nanowire detectors, and fiber channel imperfections. Our results
    show quantum bit error rates consistently below the 11% security threshold (ranging
    from 1.86% at 10 km to 9.27% at 200 km), with secure key rates achieving $1.12
    \times 10^5$ bits/s at short distances and maintaining practical rates of 9.8
    bits/s at 200 km. When integrated with quantum repeater architectures, our analysis
    projects that EAQKD can extend secure communication beyond 500 km while providing
    information-theoretic security guarantees. Comparative analysis against the BB84,
    E91, and Twin-Field QKD protocols demonstrates EAQKD's superior balance of security,
    practical performance, and implementation robustness. This work advances quantum
    cryptography by providing a rigorously analyzed engineering reference for secure
    key distribution in future quantum communication networks.
  venue: arXiv (Cornell University)
- title: 'Quantum Cryptography and Quantum-Enhanced Cybersecurity: A Systematic Review
    of Issues, Technologies, Algorithms, and Applications'
  date: 2026-03
