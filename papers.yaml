  venue: Quantum
- title: 'Discriminating Thomas–Wigner from Pancharatnam–Berry Rotations in Sequential
    Weak Qubit Measurements: A Variable-Visibility Protocol'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19722697
  category: quantum-hardware
  subcategory: theory
  authors:
  - Bharath Srivats
  abstract: 'The Fisher–Lorentz identity I(V) = γ²(V) = 1/(1−V²) for binary quantum
    measurements predicts that sequential non-collinear weak measurements on a qubit
    accumulate a Thomas–Wigner (TW) rotation with a specific, visibility-dependent
    closed form. This prediction is numerically distinct from the Pancharatnam–Berry
    (PB) geometric phase that governs the same measurement cycle under the standard
    pure-state geometric-phase interpretation. This paper presents a pre-registered
    experimental protocol that discriminates between the two predictions on existing
    superconducting, trapped-ion, and neutral-atom platforms by sweeping the measurement
    visibility V ∈ [0.3, 0.99]. For the octant spherical triangle ẑ → x̂ → ŷ → ẑ,
    the PB prediction is Ω_PB = 45° (fixed by the enclosed solid angle of π/2 sr),
    while Ω_TW varies from 2.70° at V = 0.30 to 73.94° at V = 0.99, crossing the PB
    baseline at V_× ≈ 0.9102. The signed discrepancy Ω_TW − Ω_PB ranges from −42°
    to +29° across the sweep and provides two independent discrimination landmarks:
    a monotonic V-dependence and a sign-flipping crossing point. Shot counts, tomographic
    precision, readout fidelity, and systematic-error budgets sufficient for 3σ discrimination
    are specified per platform (≈45k shots total for pure initial state, ≈180k for
    mixed-state preparation at |r| ≈ 0.5). The protocol requires no new hardware.
    A successful run on any reasonable-fidelity qubit platform (IBM, Google, Rigetti,
    OQC, IQM transmons; Quantinuum or IonQ trapped ions; QuEra, Atom Computing, or
    Pasqal Rydberg arrays) either confirms a central prediction of the Fisher–Lorentz
    framework or falsifies it at 3σ. This is a methods paper: its purpose is to enable
    the experiment, not to re-establish the theory. Relation to companion preprints
    — This paper operationalises predictions derived in the Fisher–Lorentz framework
    developed in Srivats (2026), Fisher information is the squared Lorentz factor:
    why the qubit is special[10.5281/zenodo.19363449] and Srivats (2026), From measurement
    to reality: I(V) = γ²(V) and the geometry of binary distinction [10.5281/zenodo.19486140].
    The SL(2,ℂ) ≅ Spin⁺(1,3) boost-composition structure on monitored qubits is established
    independently by Burns, Greenfield, and Dressel (Quantum Stud.: Math. Found. 13,
    art. 10, 2026); the present work extracts and pre-registers a specific crossing-point
    prediction (V_× ≈ 0.9102) as an operational TW/PB discriminator.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: <b>Cooling Lithium and Cesium Single Atoms in Optical Tweezers</b>
  date: 2026-07
  url: https://figshare.com/articles/thesis/_b_Cooling_Lithium_and_Cesium_Single_Atoms_in_Optical_Tweezers_b_/32867018
  category: quantum-hardware
  subcategory: theory
  authors:
  - Saumitra S. Phatak
  abstract: 'This dissertation advances optical tweezer platforms for neutral-atom
    quantum processors by addressing three interconnected bottlenecks: imaging survival,
    motional ground-state preparation, and narrow-line cooling, through experimental
    and theoretical work on single lithium and cesium atoms.For Li, the lightest stable
    alkali atom, this work demonstrates a per-image survival probability of 99.950(2)%
    and a state-detection fidelity of 99.97(2)% across 2000 consecutive 15 ms images,
    a record for any trapped neutral atom at the time of publication. This was achieved
    by applying Λ-enhanced gray-molasses (Λ-GM) cooling continuously on the D1 line
    while simultaneously imaging with the same beam, and represents the first demonstration
    of loading lithium into a tweezer directly from a MOT. To explain this performance,
    the dissertation develops a unified Lindblad master-equation formalism for laser
    cooling in a tightly confined harmonic trap, encompassing polarization-gradient,
    gray-molasses, EIT, Λ-GM, and single-photon sideband cooling within a single theoretical
    framework, with 1D simulations that correctly predict steady-state temperature,
    excited-state fraction, and cooling efficiency across these techniques.For133133Cs,
    the work exploits the forbidden electric-quadrupole transition 6S1/2→5D5/26S1/2​→5D5/2​
    at 685 nm (Γ ≈ 2π × 117.6 kHz) to demonstrate background-free imaging and narrow-line
    sideband cooling for the first time in an alkali atom. By positioning the atom
    at the intensity node of a Laguerre-Gaussian vortex beam, the drive is enhanced
    while cascade fluorescence at 852 nm is optically isolated from the excitation
    light, enabling both high-fidelity background-free detection and single-photon
    sideband cooling to near the motional ground state.Beyond the core cooling and
    imaging results, the dissertation includes a comprehensive experimental techniques
    chapter (fiber coupling, AOM design, polarimetry, laser locking, optical pumping,
    and a Gaussian-process optimization framework), a chapter on quadrupole transition
    theory and orbital-angular-momentum selection rules, and a concluding survey of
    the competitive quantum computing landscape across neutral-atom, superconducting,
    trapped-ion, photonic, spin, and topological qubit platforms. Together, this work
    establishes the Cs and Li cooling/imaging toolbox as a foundation for future assembly
    of ultracold LiCs polar molecules in optical tweezer arrays.'
  venue: Figshare
- title: 'The SQU, TriQ, and SevenQ: Standard Hardware for the Origami ISA'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20581486
  category: quantum-hardware
  subcategory: systems
  authors:
  - Ian Richard C Buckley
  abstract: 'CORRECTION NOTICE (2026-08). The figure "4.3× directed magic-routing
    efficiency", quoted three times and attributed to a companion paper, does not
    appear in that paper. It is unsourced and should be disregarded. A revised version
    is in preparation. The Origami Instruction Set Architecture (O-ISA) was introduced
    alongside a conjectural exotic hardware substrate — the Resonance Processing Unit
    (RPU) — requiring non-associative materials to support octonion computation. This
    paper establishes that the base Origami ISA requires no exotic hardware whatsoever.
    It runs today on any quantum processor supporting three-qubit gates: superconducting
    transmons, trapped ions, neutral atoms, and photonic chips. Two complementary
    architectural primitives are specified. The TriQ (Origami Triple) is the fundamental
    three-qubit register: three physical qubits in Fano-plane incidence connectivity,
    corresponding to one logical qubit in the [[7,1,3]] Steane code. The SQU (Symplectic
    Quantum Unit) is the full processor architecture built from TriQ registers, with
    the Magic-ISA opcode set and inter-register typed routing. The SevenQ is the complete
    seven-qubit Fano register: all seven points of PG(2,2) simultaneously realised,
    corresponding to the full [[7,1,3]] Steane code with its six gauge degrees of
    freedom corresponding bijectively to the six non-classical Fano orbit valences.
    The key diagnostic opcode is ORBIT: seven simultaneous Pauli measurements returning
    the Fano orbit valence label of the register state, replacing the conjectured
    Freudenthal determinant ALU with seven standard readout operations. The SQU achieves
    fault-tolerant universal quantum computation with 7 physical qubits per logical
    qubit for CS-family gates via gauge-orbit selection, and 15 for CCZ gates via
    code switch — both at zero magic-state distillation overhead. A critical non-obvious
    result: SevenQ ORBIT is identical to standard Steane syndrome extraction. The
    seven syndrome measurements already performed at every error correction cycle
    are the ORBIT opcode, with the orbit valence label computed in classical post-processing
    at zero additional hardware cost. Three hardware tiers are defined: SQU (standard
    qubits, available today), SQU-diode (6-7 directed Fano coupling topology, near-term),
    and RPU (non-associative materials, long-term). The SevenQ-diode variant applies
    the 6-7 broken-symmetry topology to the full seven-qubit register for directed
    magic routing at 4× symmetric efficiency. The paper also establishes the exploration
    order for the projective tower: TriQ (3 qubits, minimal n=3) → SevenQ (7 qubits,
    complete n=3) → 1531-Anvil (15 qubits, first n=4). Keywords Origami ISA, TriQ,
    SevenQ, SQU, Symplectic Quantum Unit, Fano Plane, PG(2,2), Magic-ISA, ORBIT Opcode,
    Steane Code, [[7,1,3]] Code, Fault-Tolerant Quantum Computation, Magic State Distillation,
    CS Gate, Gauge Selection, Quantum Error Correction, Coherent Error Detection,
    Magic Valence, Fano Orbit, Superconducting Qubits, Trapped Ions, Neutral Atoms,
    Quantum Hardware, Instruction Set Architecture, 6-7 Topology, Directed Magic Routing,
    SevenQ-Diode, SQU-Diode, Adelic Simplicial Architecture, Resonance Processing
    Unit'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum Computing: Next-Generation Computational Paradigm'
  date: 2026-04
  url: https://doi.org/10.22214/ijraset.2026.80467
  category: quantum-hardware
  subcategory: theory
  authors:
  - Adarsh Tripathi
  abstract: The maturation of quantum computing from theoretical physics to engineering
    reality presents a complex landscape for stakeholders navigating the transition
    from Noisy Intermediate-Scale Quantum (NISQ) devices toward Fault-Tolerant Quantum
    Computation (FTQC). This report provides a comprehensive, technically rigorous
    analysis of the current quantum ecosystem, examining the hardware mosaic of leading
    qubit modalities—superconducting circuits, trapped ions, neutral atoms, and silicon
    spin qubits—and evaluating them against operational metrics, including coherence
    times, gate fidelities, and cryogenic infrastructure requirements. We dissect
    the full software stack, differentiating the near-term utility of error mitigation
    techniques such as Zero-Noise Extrapolation (ZNE) from the long-term necessity
    of Quantum Error Correction (QEC) and the milestone of logical qubit break-even.
    The analysis benchmarks hybrid algorithms (VQE, QAOA) and circuit knitting strategies
    against current cloud-accessible hardware performance, while also addressing the
    imminent non-computational impact of PostQuantum Cryptography (PQC) migration.
    Experimental data synthesised from leading vendor roadmaps and pre-print literature
    indicate that superconducting platforms currently lead in gate speed (nanosecond
    regime) but face crosstalk scaling challenges beyond 1,000 qubits. In contrast,
    trapped-ion and neutral-atom architectures demonstrate superior connectivity and
    coherence. The report concludes with a grounded, evidence-based five-year projection,
    identifying high-value vertical use cases in pharmaceuticals and finance, and
    providing a strategic framework for enterprises to separate quantum hype from
    tangible commercial opportunity. Future research directions include the realisation
    of low-overhead Quantum LDPC codes and the development of modular photonic interconnects
    to scale beyond single-chip architectures.
  venue: International Journal for Research in Applied Science and Engineering Technology
- title: 'InterQ: Communication-Aware Scheduling Across Modular QPUs with Classical
    and Quantum Links'
  date: 2026-05
  url: https://arxiv.org/abs/2605.17769
  category: quantum-hardware
  subcategory: method
  authors:
  - Vinooth Kulkarni
  - Jaehyun Lee
  - L.T. Li
  abstract: 'As quantum computing scales toward practical workloads, future systems
    are expected to move beyond single monolithic processors toward modular architectures
    that connect multiple QPUs. Different platforms realize this modularity through
    different communication models: superconducting systems rely on real-time classical
    links and dynamic-circuit coordination, trapped-ion systems use photonic interconnects
    for remote entanglement, and neutral-atom systems provide strong intra-core connectivity
    with proposed optical links for inter-core communication. This heterogeneity makes
    communication-aware scheduling essential for shared modular quantum cloud environments.
    We present InterQ, a communication-aware scheduler for modular QPU architectures
    with heterogeneous communication models. InterQ jointly considers qubit capacity,
    placement, parallel execution, and communication-driven dependencies across distributed
    subcircuits, while enabling adaptive circuit cutting to reduce makespan while
    balancing fidelity and communication overhead. The framework distinguishes classical-link
    execution, where measurement and feedforward impose synchronization constraints,
    from quantum-link execution, where entanglement distribution and state transfer
    determine coordination cost. Using a unified simulation framework to compare superconducting,
    trapped-ion, and neutral-atom modular systems, InterQ shows how communication
    models and scheduler-driven cutting decisions affect throughput, latency, and
    fidelity. Across evaluated workloads, InterQ exposes an architecture-dependent
    tradeoff: neutral-atom modular QPUs achieve the highest fidelity, superconducting
    systems minimize runtime, and trapped-ion systems provide a balanced intermediate
    profile across fidelity and makespan.'
  venue: arXiv (Cornell University)
- title: Current Technological Advances in Quantum Computing
  date: 2026-06
  url: https://doi.org/10.4018/979-8-2600-0156-1.ch011
  category: quantum-hardware
  subcategory: theory
  authors:
  - Pradeep Yadav
  - Jyoti Kumari
  abstract: Quantum computing continues to make great progress, impacting not only
    the theory of computer science but also technological innovations. This chapter
    gives an overview of the subject matter, presenting the current state-of-the-art
    in qubit architectures, quantum algorithms, hardware achievements made since 2019
    through 2024, potential applications, and difficulties ahead for wide-scale implementation.
    Utilizing the latest results of research and innovation efforts conducted by top
    industry leaders, the chapter covers topics such as the comparison of superconducting,
    trapped ion, neutral atom, photonic, and topological qubits, quantum algorithms,
    applicability in various industries like cryptography, optimization, material
    sciences, and artificial intelligence, and the advancement of quantum error correction
    and fault-tolerant computing. Finally, the chapter takes a closer look at prevalent
    myths associated with near-term quantum advantage and focuses on true developments
    in quantum hardware and logical qubits.
  venue: Advances in computational intelligence and robotics book series
- title: Energy efficiency of quantum computers
  date: 2026-05
  url: https://arxiv.org/abs/2605.15090
  category: quantum-hardware
  subcategory: method
  authors:
  - Miquel Carrasco-Codina
  - Pau Escofet
  - Paul Hilaire
  abstract: 'How much energy does a quantum computer consume? Are they more efficient
    than their classical counterparts? In this work, we make a step towards answering
    these questions. We define the energy efficiency of a quantum computer as the
    ratio of the number of algorithms it can perform during a given time over the
    energy consumed by the hardware during this time. We analyze the most representative
    physical platforms currently envisioned to be used as building blocks of quantum
    computers: superconducting qubits, silicon spin qubits, trapped ions, neutral
    atoms and photonic qubits. Including insights from experts in all these technologies
    and taking into account algorithm compilation constraints, we discuss the advantages
    and inconveniences of each platform from an energy standpoint. Beyond providing
    concrete values of the energy consumption of current quantum computers, we lay
    the foundation of a framework to benchmark the energy efficiency of any future
    quantum computing architecture.'
  venue: HAL (Le Centre pour la Communication Scientifique Directe)
- title: 'XCOM: Full Mesh Network Synchronization and Low-Latency Communication for
    QICK (Quantum Instrumentation Control Kit)'
  date: 2026-03
  url: https://arxiv.org/abs/2603.18977
  category: quantum-hardware
  subcategory: application
  authors:
  - Diego R. Martín
  - Horacio Arnaldi
  - Kenneth Treptow
  abstract: Quantum computing experiments and testbeds with large qubit counts have
    until recently been a privilege afforded only to large companies or quantum technologies
    where scaling to hundreds or thousands of qubits does not require a substantial
    increase in quantum control hardware (neutral atoms, trapped ions, or spin defects).
    Superconducting and spin qubit testbeds critically depend on scaling their control
    systems beyond what a single electronics board can provide. Multi-board control
    systems combining RF, fast DC control, bias, and readout require precise synchronization
    and communication across many hardware and firmware components. To address this,
    we present XCOM, a network that synchronizes QICK boards and the absolute clocks
    governing quantum program execution to within 100 ps, free of drift and loss of
    lock. XCOM also provides deterministic, all-to-all simultaneous data communication
    with latency below 185 ns. Like QICK itself, XCOM is compatible with a broad range
    of qubit technologies and is designed to scale to large systems.
  venue: arXiv (Cornell University)
- title: 'Plaquette: A hardware-aware design platform for fault-tolerant quantum computers'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08767
  category: quantum-hardware
  subcategory: theory
  authors:
  - Raul Conchello Vendrell
  - Carlos Díaz López
  - Ish Dhand
  abstract: 'Hardware teams building fault-tolerant quantum computers (FTQCs) must
    decide which imperfections to suppress, and that decision requires the logical
    performance of the architecture under the device''s actual noise. Hardware noise
    often departs from the stochastic Pauli models used by scalable stabilizer simulators:
    superconducting transmons leak out of the computational subspace, neutral atoms
    scatter through intermediate states, trapped ions heat as their motional modes
    absorb phonons, and miscalibrated controls over-rotate coherently. We present
    Plaquette, a theoretical framework and software suite that computes the logical
    performance of fault-tolerant architectures directly from the physics of such
    imperfections. In Plaquette, a hardware error model is specified once, as Kraus
    operators, Hamiltonian-Lindblad dynamics, or an experimentally reconstructed quantum
    channel, and is compiled automatically into the exact or approximate representation
    required by each of four sampler classes: stabilizer sampling for Pauli noise,
    the new XPauli sampler for leakage and environment sectors, near-Clifford samplers
    for coherent errors, and full-state simulation for exact reference calculations.
    We validate the XPauli and near-Clifford samplers against full-state simulation,
    which they can match within statistical uncertainty while Pauli twirling can fall
    short depending on the error model. We demonstrate the framework on three error
    models: leakage in superconducting qubits, intermediate-state scattering in neutral
    atoms, and heating in trapped ions. The size of the discrepancy between Plaquette
    and Clifford-only simulations varies with platform and noise process, so reliable
    thresholds, error budgets, and overhead estimates require the most accurate simulation
    available. Plaquette provides a direct path from the open-system physics of a
    device to the logical performance of the FTQC built on it.'
  venue: arXiv (Cornell University)
- title: 'Origami: An Open Instruction Set Architecture for Quantum Computing'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21428854
  category: quantum-hardware
  subcategory: method
  authors:
  - Ian Richard C Buckley
  abstract: 'A manifesto and open standard proposal for Origami: a minimal, hardware-agnostic
    instruction set architecture (ISA) for quantum computing positioned above physical
    gate sets and below algorithms. Origami has five opcodes - LABEL (initialisation),
    ORBIT (symmetry/permutation), TWIST (phase rotation), BIND (entanglement), FLIP
    (measurement) - stratified by cohomological tier H0/H1/H2. Simulability is a structural
    property: a programme is classically simulable if and only if it contains no BIND
    opcode. Every opcode has a canonical realisation on superconducting, trapped-ion,
    photonic, neutral-atom, and topological qubit hardware. A beta-deformation provides
    a principled NISQ framework. The H1 layer subsumes ZX-calculus; the H2 layer extends
    it to universal quantum computation. A call to the quantum computing community
    to adopt Origami as an open standard enabling a RISC-V-style software compounding
    effect for the quantum age.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Towards automatic evaluation of circuit fault-tolerance
  date: 2026-05
  url: https://aaltodoc.aalto.fi/handle/123456789/144709
  category: quantum-hardware
  subcategory: method
  authors:
  - Ayman Mondol
  abstract: 'Quantum error correction codes are essential for fault-tolerant quantum
    computing. They are a method of detecting and correcting errors in a quantum computer
    by encoding logical qubits across multiple physical qubits. Several prominent
    error correction codes have been developed and larger and more complex codes are
    being developed continuously. However, evaluating the fault-tolerance of these
    larger codes is becoming exponentially more complicated. While conventional methods
    of proving and evaluating the fault-tolerance of these circuits have worked thus
    far, they are soon to be obsolete. The aim of this thesis is to develop a framework
    that automatically evaluates the fault-tolerance of a quantum error correction
    circuit across different hardware architectures. The framework works as follows:
    it takes a noiseless quantum error correction code; injects hardware-realistic
    noise into it; and evaluates the fault-tolerance of the resulting noisy circuit
    by estimating its logical error rate through Monte Carlo sampling. For the injection
    of hardware-realistic noise, this thesis considers noise stemming from five different
    quantum computing hardware architectures: superconducting qubits, neutral atoms,
    trapped ions, photonic qubits, and spin qubits. The noise model was constructed
    by extracting single-qubit gate, two-qubit gate and measurement error fidelities
    from current experimental literature. The noise model and circuit generation is
    implemented in Python, circuit representation and noise injection is executed
    in Stim and decoding and estimating the logical error rate is achieved through
    PyMatching. The framework is evaluated on the repetition code, the surface code,
    and the color code; the logical error rate is estimated across all five hardware
    architectures under the noise model; and the results are discussed in the context
    of hardware compatibility for the given codes.'
  venue: Aaltodoc (Aalto University)
- title: The Landauer Equality for Quantum Error Correction
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18921524
  category: quantum-hardware
  subcategory: theory
  authors:
  - Rolando Pablo Hong Enriquez
  abstract: Quantum error correction protects logical qubits from decoherence but
    requires repeated syndrome extraction whose fundamental thermodynamic cost has
    not been characterized exactly. We prove five theorems and two corollaries that
    supply this characterization for stabilizer codes. First, a no-go result establishes
    that every error-correction cycle requires strictly positive work, ruling out
    passive error correction. Second, a duality identity shows that the combined measurement
    and erasure cost per syndrome-extraction round is determined solely by the number
    of stabilizer generators; only the split between measurement and erasure depends
    on the error rate. Third, a coherence dissipation theorem quantifies the additional
    irreversible work generated when projective stabilizer measurements destroy quantum
    coherence in the data register. CSS codes eliminate this cost for generators aligned
    with the noise channel’s eigenbasis, yielding a thermodynamic criterion for code
    selection under non-Pauli noise. Fourth, a Crooks fluctuation theorem for the
    full syndrome cycle yields a Jarzynski equality and exponential tail bounds on
    rare work fluctuations. Fifth, a variance formula captures the effect of syndrome
    correlations among stabilizers that share physical qubits. We evaluate all results
    across eleven codes, from a three-qubit repetition code to a 144-qubit quantum
    low-density parity-check code, establishing a Pareto trade-off between thermodynamic
    cost and error-suppression capability. Comparison with four experimental platforms—two
    superconducting, one trapped-ion, and one neutral-atom—shows that current hardware
    operates five to eleven orders of magnitude above the Landauer limit, with control
    and readout hardware, not syndrome extraction, as the dominant source of dissipation.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum Technologies: System-Level Performance and Engineering Priorities'
  date: 2026-08
  url: https://doi.org/10.48577/jpl.kfhmwq
  category: quantum-hardware
  subcategory: development
  authors:
  - Slava Turyshev
  abstract: Quantum technologies now encompass processors, programmable simulators,
    communication links, random-number sources, sensors, and frequency standards whose
    performance is governed by distinct physical mechanisms. This review relates those
    mechanisms to demonstrated system performance across superconducting circuits,
    trapped ions, neutral atoms, photonic platforms, semiconductor spins, color centers,
    atomic ensembles, and nuclear-transition spectroscopy. Quantitative comparisons
    are made within common technological functions and retain the source configuration,
    operating conditions, uncertainty or security convention, and classical reference.
    Representative results include a distance-7 surface-code memory with logical error
    (1.43±0.03)×10−3 per cycle, a 98-qubit trapped-ion processor with mean two-qubit
    infidelity 7.9(2) ×10−4, single-clock systematic uncertainty of 4.4 ×10−19, finite-key
    quantum key distribution (QKD) through 71.9 dB measured loss, and frequency-dependent
    squeezed readout with quantum-noise reduction up to 6.1 dB in the Advanced Laser
    Interferometer Gravitational-Wave Observatory (Advanced LIGO). The dominant constraints
    are decoherence and correlated error, multiplicative interface loss, thermal and
    nonequilibrium excitation, measurement efficiency, control bandwidth, calibration
    drift, fabrication variability, and error-correction overhead. Classical tensor-network,
    sparse-Pauli, and high-performance simulations have repeatedly shifted quantum–classical
    crossover estimates, demonstrating that advantage claims are properties of a specified
    task, accuracy, and cost model rather than hardware alone. Artificial intelligence
    (AI) is considered only where it measurably improves calibration, control, readout,
    model identification, or decoding. Credible progress is defined by reproduced
    logical workloads, prospectively validated simulations, repeater links outperforming
    direct transmission, long-duration calibrated sensors and clocks, and integrated
    hardware with predictable yield and reliability.
  venue: JPL Data
- title: 'Quantum Computed Moments: A New Paradigm for Simulating Molecular Properties
    in Drug Discovery'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19659140
  category: quantum-hardware
  subcategory: theory
  authors:
  - quantum chemical science
  abstract: 'Quantum Computed Moments (QCM) represents a paradigm shift in computational
    chemistry, offering a robust method for simulating molecular properties crucial
    for drug discovery. This approach leverages Hamiltonian moments (⟨Hⁿ⟩) within
    the Lanczos expansion framework to correct variational estimates, providing enhanced
    accuracy and stability on noisy intermediate-scale quantum (NISQ) hardware. Unlike
    the iterative Variational Quantum Eigensolver (VQE), QCM computes corrections
    from a single trial state, demonstrating innate resilience to gate errors and
    shot noise. This has been empirically validated in calculating the electric dipole
    moment of the water molecule, where QCM reduced errors by over 50% compared to
    direct VQE measurements. The article provides comprehensive protocols for implementing
    QCM and related hybrid strategies. It details the use of problem decomposition
    techniques like Density Matrix Embedding Theory (DMET) to simulate large molecules,
    such as cyclohexane conformers, on current quantum devices with chemical accuracy.
    It also explores applications on various hardware platforms, including superconducting
    qubits, trapped ions, and neutral-atom systems, which offer unique advantages
    like native multi-qubit gates. Case studies on systems like the Mn4O5Ca oxygen-evolving
    complex and alkaline-earth fluorides highlight the method''s utility in resolving
    complex electronic structures and spin states. By integrating with classical high-performance
    computing and advanced error mitigation techniques, QCM and other quantum-centric
    workflows are paving the way for practical quantum advantage, promising to accelerate
    the design of new therapeutics by enabling more precise predictions of protein-ligand
    binding, hydration effects, and other key molecular interactions. Source: https://www.quantumchemsci.com/posts/quantum-computed-moments-a-new-paradigm-for-simulating-molecular-properties-in-drug-discovery'
