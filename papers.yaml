- title: 'Practical Guide to Using a Quantum Computer (Based on Materials from the
    International Quantum Center at CERN, Switzerland) # 7'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18861780
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Mikhail Pavlov
  abstract: Abstract This laboratory work presents a practical implementation of Grover’s
    search algorithm using the Qiskit framework. The material is based on educational
    resources developed by the International Quantum Center at CERN (Switzerland)
    and is intended to provide hands-on experience with amplitude amplification and
    oracle-based quantum search. In Laboratory Work No. 7, participants construct
    Grover’s algorithm step by step. The implementation begins with defining a function
    that initializes the quantum registers and prepares the initial stage of the circuit.
    The output qubit associated with the oracle is set to the state ∣1⟩|1\rangle∣1⟩
    to enable phase inversion through the phase kickback mechanism. Hadamard gates
    are then applied to create a uniform superposition over the search space. The
    oracle is designed to mark the target state by applying a phase shift, effectively
    flipping the sign of the amplitude corresponding to the solution. This is followed
    by the diffusion operator (inversion about the mean), which amplifies the probability
    amplitude of the marked state. The Grover iteration—composed of the oracle and
    diffusion operator—is repeated an optimal number of times to maximize the probability
    of measuring the correct result. The laboratory exercise emphasizes the principles
    of quantum amplitude amplification, circuit modularization, oracle construction,
    and measurement-based verification. By executing the algorithm on simulators and
    cloud-accessible quantum hardware, participants observe the quadratic speedup
    of Grover’s algorithm compared to classical linear search methods. This practical
    guide bridges theoretical understanding of quantum search with executable quantum
    circuits, reinforcing the operational aspects of quantum algorithm design within
    modern quantum computing
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Cobble: Compiling Block Encodings for Quantum Computational Linear Algebra'
  date: 2026-06
  url: https://arxiv.org/abs/2511.01736
  category: quantum-algorithms
  subcategory: method
  authors:
  - Charles Yuan
  abstract: Quantum algorithms for computational linear algebra promise up to exponential
    speedups for applications such as simulation and regression, making them prime
    candidates for hardware realization. But these algorithms execute in a model that
    cannot efficiently store matrices in memory like a classical algorithm does, instead
    requiring developers to implement complex expressions for matrix arithmetic in
    terms of correct and efficient quantum circuits. Among the challenges for the
    developer is navigating a cost model in which conventional optimizations for linear
    algebra, such as subexpression reuse, can be inapplicable or unprofitable. In
    this work, we present Cobble, a language for programming with quantum computational
    linear algebra. Cobble enables developers to express and manipulate the quantum
    representations of matrices, known as block encodings, using high-level notation
    that automatically compiles to correct quantum circuits. Cobble features analyses
    that compute the time and space usage of programs, as well as optimizations that
    reduce overhead and generate efficient circuits using state-of-the-art techniques
    such as the quantum singular value transformation. We evaluate Cobble on benchmark
    kernels for simulation, regression, search, and other applications, showing 2.6x-25.4x
    speedups on these benchmarks compared to the unoptimized baseline.
  venue: Proceedings of the ACM on Programming Languages
- title: 'Practical Guide to Using a Quantum Computer (Based on Materials from the
    International Quantum Center at CERN, Switzerland) # 6'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18861744
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Mikhail Pavlov
  abstract: Abstract This laboratory work presents a practical implementation of the
    Deutsch–Jozsa algorithm using the Qiskit framework, complemented by the application
    of artificial intelligence tools such as GPT-based systems to assist in circuit
    design, debugging, and conceptual analysis. The material is based on educational
    resources developed by the International Quantum Center at CERN (Switzerland)
    and aims to bridge theoretical quantum algorithms with executable quantum programs.
    In Laboratory Work No. 6, participants construct the Deutsch–Jozsa algorithm for
    n=4n = 4n=4 input qubits within an oracle-based computational model. The circuit
    includes a quantum register qqq representing the oracle input qubits, an output
    qubit outoutout, and a classical register ccc for measurement results. The algorithm
    begins by applying Hadamard (H) gates to all oracle qubits to create a uniform
    superposition over the input space. The output qubit is prepared using Pauli-X
    (X) and Hadamard (H) gates to establish the appropriate phase kickback configuration.
    A visual barrier is introduced in the circuit to clearly separate initialization,
    oracle evaluation, and interference stages. After the oracle operation, a second
    layer of Hadamard gates is applied to the input qubits, followed by measurement
    into classical bits. The resulting measurement pattern allows deterministic distinction
    between constant and balanced Boolean functions with a single oracle query—demonstrating
    exponential speedup compared to classical deterministic algorithms. The laboratory
    exercise emphasizes structured circuit design, oracle modeling, phase interference
    analysis, and measurement interpretation. Additionally, GPT-based AI tools are
    used to support code generation, algorithm explanation, and optimization, illustrating
    how modern artificial intelligence systems can enhance quantum programming workflows.
    Through simulation and execution on cloud-based quantum hardware, participants
    gain both theoretical insight and practical experience with one of the foundational
    quantum algorithms and its implementation in contemporary quantum computing ecosystems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Hamiltonian simulation with explicit formulas for digital-analog quantum
    computing
  date: 2026-05
  url: https://arxiv.org/abs/2511.11404
  category: quantum-simulation
  subcategory: method
  authors:
  - Mikel Garcia de Andoin
  - Thorge Müller
  - Gonzalo García Camacho
  abstract: Digital-analog is a quantum computational paradigm that employs the natural
    interaction Hamiltonian of a system as the entangling resource, combined with
    single qubit gates, to implement universal quantum operations. As in the case
    of its digital gate-based counterpart, designing digital-analog circuits that
    employ optimal quantum resources often requires an exceedingly large classical
    computational time. In this work we find a suboptimal solution to this exponentially
    large problem, showing that it can be solved within polynomial computational time.
    In particular, we provide an exact solution for the problem of expressing arbitrary
    two-body Hamiltonians as the sum of local unitary transformations of an arbitrary
    Ising Hamiltonian, with the total number of required terms being at most quadratic
    in system size. This allows us to design a digital-analog simulation protocol
    that avoids employing numerical optimization over a large parameter space at the
    preprocessing stage, minimizing computational resources and allowing for further
    scaling.
  venue: Physical Review A
- title: A Rust-accelerated, topology-informed workflow for Kuramoto--XY quantum simulation
    and NISQ benchmarking
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20382138
  category: quantum-simulation
  subcategory: method
  authors:
  - Miroslav Sotek
  abstract: This methods preprint describes the software and experimental workflow
    behind scpn-quantum-control, an open-source framework for mapping heterogeneous
    Kuramoto-type oscillator networks to XY spin Hamiltonians, compiling topology-informed
    variational ansatze, benchmarking simulation paths, and executing reproducible
    NISQ hardware experiments. The workflow combines Python/Qiskit orchestration with
    a Rust/PyO3 acceleration layer for hot-path kernels including coupling-matrix
    construction, Hamiltonian assembly, trajectory features, hybrid digital--analog
    partitioning, and protected-subspace diagnostics. The manuscript reports artefact-generated
    timings across local workstation, ML350, Vertex AI CPU, and Vertex AI Tesla T4
    contexts, with checksum parity across Python, Rust, and Go kernels. The record
    includes manuscript source, notes bibliography, and PDF. It is an archival methods
    record for the repository and its reproducibility artefacts, not an independent
    claim of broad quantum advantage.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Analog-Digital Quantum Computing with Quantum Annealing Processors
  date: 2026-03
  url: https://arxiv.org/abs/2603.15534
  category: quantum-simulation
  subcategory: theory
  authors:
  - Rahul Deshpande
  - Majid Kheirkhah
  - Chris Rich
  abstract: 'Quantum annealing processors typically control qubits in unison, attenuating
    quantum fluctuations uniformly until the applied system Hamiltonian is diagonal
    in the computational basis. This simplifies control requirements, allowing annealing
    QPUs to scale to much larger sizes than gate-based systems, but constraining the
    class of available operations. Here we expand the class by performing analog-digital
    quantum computing in a highly-multiplexed, superconducting quantum annealing processor.
    This involves evolution under a fixed many-body Hamiltonian that, in the weak-coupling
    regime, is well-described by an effective XY model, together with arbitrary-basis
    initialization and measurement via auxiliary qubits. Operationally, this is equivalent
    to implementing single-qubit gates at the beginning and end of an analog quantum
    evolution. We demonstrate this capability with several foundational applications:
    single-qubit and two-qubit coherent oscillations with varying initialization and
    measurement bases, a multi-qubit quantum walk with fermionic dispersion in line
    with theory, and Anderson localization in a disordered chain. These experiments
    open the door to a wide range of new possibilities in quantum computation and
    simulation, greatly expanding the applications of commercially available quantum
    annealing processors.'
  venue: arXiv (Cornell University)
- title: Hamiltonian formulations of lattice gauge theories for quantum simulation
  date: 2026-06
  url: https://doi.org/10.22323/1.518.0007
  category: quantum-simulation
  subcategory: method
  authors:
  - Indrakshi Raychowdhury
  abstract: 'The development of quantum technology and the advent of quantum computation
    have renewed interest in Hamiltonian formulations of lattice gauge theories. In
    contrast to Euclidean Monte Carlo calculations, Hamiltonian simulation requires
    a direct representation of the physical Hilbert space, an efficient treatment
    of enforcing Gauss'' law as constraints, and a formulation of real-time dynamics
    in terms of degrees of freedom that can be encoded on quantum or quantum-inspired
    classical platforms. The starting point corresponds to finding a suitable basis
    for Hamiltonian lattice gauge theories. The existing literature focuses on several
    complementary approaches: electric basis, magnetic basis, gauge-fixed, quantum-link,
    qubit-regularised, finite-group, and orbifold formulations. This article primarily
    focuses on the prepotential and loop--string--hadron formulations, where non-Abelian
    Gauss laws are solved locally and the dynamics is written directly in terms of
    gauge-invariant loop, string and hadron excitations. The discussion covers the
    SU(2) and SU(3) constructions in one spatial dimension, the role of residual Abelian
    Gauss laws, and the extension to higher dimensions through point splitting. We
    conclude by highlighting its direct applications: eliminating redundant gauge
    degrees of freedom makes exact diagonalisation and tensor network calculations
    feasible for studying real-time dynamics, provides insights into thermalisation
    properties, enables mapping of physical degrees of freedom onto analog and digital
    quantum hardware, and enables quantum simulation of dynamics.'
  venue: ''
- title: Bounded-Error Quantum Simulation via Hamiltonian and Lindbladian Learning
  date: 2026-07
  url: https://doi.org/10.1103/s96t-n8tx
  category: quantum-simulation
  subcategory: theory
  authors:
  - Anonymous
  - Manoj K. Joshi
  - William T. Lam
  abstract: Analog quantum simulators offer a route to exploring strongly correlated
    many-body dynamics beyond classical computation, but their predictive power remains
    limited by the absence of quantitative error estimation. Establishing rigorous
    uncertainty bounds is essential for elevating such devices from qualitative demonstrations
    to quantitative scientific tools. Here we introduce a general framework for bounded-error
    quantum simulation, which provides predictions for many-body observables with
    experimentally quantifiable uncertainties. The approach combines Hamiltonian and
    Lindbladian Learning—a statistically rigorous inference of the coherent and dissipative
    generators governing the dynamics—with the propagation of their uncertainties
    into the simulated observables, yielding confidence bounds directly derived from
    experimental data. We demonstrate this framework on trapped-ion quantum simulators
    implementing long-range Ising interactions with up to 51 ions. We analyze error
    bounds on two levels. First, we learn an open-system model from experimental data
    collected in an initial time window of quench dynamics, simulate the corresponding
    master equation, and quantitatively verify consistency between theoretical predictions
    and measured dynamics at long times. Second, we discuss short-time error bounds
    directly from experimental measurements alone, without relying on classical simulation—crucial
    for entering regimes of quantum advantage. In both cases, the learned models reproduce
    the experimental evolution within the predicted bounds, demonstrating quantitative
    reliability and internal consistency. By integrating statistical learning, open-system
    modeling, and precise experimental control, bounded-error quantum simulation provides
    a scalable foundation for trusted analog quantum computation, bridging the gap
    between experimental quantum platforms and predictive many-body physics. The techniques
    presented here directly extend to digital quantum simulation.
  venue: Physical Review X
- title: Tight bound for the total time in digital-analog quantum computation
  date: 2026-05
  url: https://arxiv.org/abs/2512.11619
  category: quantum-simulation
  subcategory: theory
  authors:
  - Mikel Garcia de Andoin
  - Mikel Sanz
  abstract: Digital-analog quantum computing (DAQC) is a universal computational paradigm
    that combines the evolution under an entangling Hamiltonian with the application
    of single-qubit gates. Since any unitary operation can be decomposed into a sequence
    of evolutions generated by two-body Hamiltonians, DAQC is inherently well suited
    for realizing such operations. Suboptimal upper bounds for the total time required
    to perform these evolutions have been previously proposed. Here, we improve these
    limits by providing a tight bound for this crucial parameter, which shows a linear
    dependence with the number of couplings. This result enables a precise estimation
    of the time resources needed for quantum simulations and quantum algorithms implemented
    within the DAQC framework, facilitating a rigorous comparison with other approaches.
  venue: Physical Review Research
- title: Hybrid Analog-Digital Simulation of the Abelian Higgs model
  date: 2026-03
  url: https://arxiv.org/abs/2603.12391
  category: quantum-simulation
  subcategory: theory
  authors:
  - Muhammad Asaduzzaman
  - Rayleigh W. Parker
  - Noah Goss
  abstract: To investigate gauge theories with near-term quantum computers warrants
    exploration of nontraditional quantum simulators to find resource-efficient simulation
    protocols and ultimately access exotic features of different field theories, including
    unexplored regimes of the QCD phase diagram. In this work, using superconducting
    transmon qutrit processors, we formulate and implement a pulse-based, three-level,
    hybrid analog-digital simulation protocol of the (1+1) dimensional Abelian Higgs
    model (AHM) on two sites. Alongside this approach, we experimentally realize a
    gate-based implementation of the same model. Using the natural mapping of the
    three-level truncation of the transmon Hilbert space to the spin-1 truncated AHM,
    we observe real time dynamics of AHM field observables, which are analogous to
    electric field operators, with both protocols. For the analog-digital protocol,
    we engineer a Floquet simulation with a combination of local analog drives, driven
    modification of the natural interaction Hamiltonian of the two transmons, and
    dynamical decoupling pulses. For the digital protocol, we use a state-of-the-art
    qutrit processor to implement a Trotterized simulation of the model incorporating
    advanced error mitigation techniques. We further discuss the scalability of the
    two approaches, and their potential to be extended to the simulation of other
    model Hamiltonians. Our experiments demonstrate a viable platform for future studies
    of spin-1 and SU(3) based gauge theory models on current and near-term transmon
    qutrit processors.
  venue: arXiv (Cornell University)
- title: A universal and efficient hybrid digital-analog fermionic quantum simulator
  date: 2026-06
  url: https://arxiv.org/abs/2606.05517
  category: quantum-simulation
  subcategory: theory
  authors:
  - Haotian Wei
  - Kaden R. A. Hazzard
  abstract: We present a universal framework to harness fermionic ultracold atom platforms
    for quantum simulation, showing how variational algorithms on existing hardware
    can simulate many-body systems well beyond the hardware's native Hamiltonian.
    Our analysis provides evidence that one can quantum simulate the ground-state
    properties of a broad class of gapless target Hamiltonians of local observables
    in a quantum evolution time that grows polynomially with the inverse relative
    error, $T\sim O(\mathrm{poly}(1/ε))$ up to logarithmic corrections, offering an
    exponential speedup over na{ï}ve classical algorithms such as exact diagonalization.
    We provide numerical evidence and theoretical argument that this holds for energy
    density, density-density, and spin-spin correlations in three qualitatively distinct
    models -- the repulsive Hubbard model; a Hubbard model augmented with nearest-neighbor
    attractive interactions, which introduces the phenomenon of pairing; and the Hofstadter-Hubbard
    model, which introduces a gauge field and fractional quantum Hall physics. This
    work demonstrates quantum simulation using current fermionic platforms far beyond
    the models natively implemented in the hardware.
  venue: arXiv (Cornell University)
- title: A Verified Compiler for Trotter-based Hamiltonian Simulation
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.19078098
  category: quantum-simulation
  subcategory: theory
  authors:
  - Anonymous
  abstract: 'Hamiltonian simulation is a central application of quantum computing,
    yet existing compilers provide no formal guarantees that compiled circuits faithfully
    implement the intended physical dynamics. We present QBlue, the first end-to-end
    verified compiler for Trotter-based Hamiltonian simulation. QBlue treats a Hamiltonian
    as a typed constraint specification and its time evolution as the compiled program,
    connecting the two through a mechanized compilation pipeline in the Rocq proof
    framework. The pipeline spans second-quantized input programs, a Pauli-string
    intermediate representation, four Trotterization algorithms with certified error
    bounds, and three backends targeting digital gate sequences, IBM analog superconducting
    hardware, and trapped-ion processors. All compilation paths are verified end-to-end:
    for any well-typed Hamiltonian and user-supplied error bound, the compiled circuit
    is proven to approximate the ideal time evolution within that bound. We evaluate
    QBlue on 279 real-world benchmark programs and show it produces circuits up to
    three orders of magnitude smaller than state-of-the-art unverified compilers.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: First- and Second-Order Digital Quantum Simulation of Three-Level Jaynes-Cummings
    Dynamics on Superconducting Quantum Processors
  date: 2026-02
  url: https://arxiv.org/abs/2602.20614
  category: quantum-simulation
  subcategory: development
  authors:
  - J. Thirunirai Selvam
  - S. Saravana Veni
  - Ria Rushin Joseph
  abstract: This work presents a digital quantum simulation of a three-level atomic
    system interacting with a single-mode electromagnetic field based on the Jaynes-Cummings
    model, implemented on IBM Quantum superconducting processors. A qutrit is encoded
    using two physical qubits to represent the atomic states, while an additional
    qubit encodes the truncated field mode, enabling the realization of effective
    $Λ$-type atomic dynamics.The continuous-time light-matter interaction is implemented
    in a digital form by discretizing the evolution using Suzuki-Trotter decomposition.
    In contrast to an analog realization, the digital simulation replaces the continuous
    evolution with a sequence of quantum gates whose parameters are explicitly controlled.
    Phase evolution arising from the interaction Hamiltonian is digitally encoded
    using calibrated $R_Z$ gates, whose rotation angles are fixed by the physically
    relevant coupling scale and the chosen Trotter time step.State preparation is
    achieved using Hadamard and parametrized rotation gates, while the interaction
    dynamics are implemented through controlled operations. A comparative analysis
    between first- and second-order Trotter implementations reveals a trade-off between
    digital accuracy and hardware-induced noise. Overall, the results demonstrate
    that calibrated gate operations and noise-aware circuit design enable reliable
    digital simulation of multi-level light-matter interactions on noisy intermediate-scale
    quantum platforms.
  venue: arXiv (Cornell University)
- title: CLASSICAL AND QUANTUM SIMULATIONS OF MANY-BODY QUANTUM MAGNETS
  date: 2026-04
  url: https://doi.org/10.25394/pgs.32065893.v1
  category: quantum-simulation
  subcategory: theory
  authors:
  - Ammar Ali
  abstract: 'The investigation of many-body quantum systems stands as a cornerstone
    in contemporary physics research. These systems exhibit a richness of phenomena,
    characterized by the emergence of collective behavior, which leads to the formation
    of quasi-particle excitations with occasionally unconventional statistics, alongside
    the occurrence of quantum phase transitions. Their significance extends further
    as they serve as models for understanding the behavior of real quantum materials,
    underlining the necessity for their comprehension.In the realm of theoretical
    physics, exact solutions are often elusive for many-body systems and are limited
    to a few select cases or toy models. However, real materials are often more complicated
    with additional dominant interactions beyond solvable limits. Consequently, the
    study and understanding of generic Hamiltonians necessitate resorting to computational
    simulations. Utilizing computational resources becomes indispensable, albeit challenging,
    as the Hilbert space expands exponentially with the number of spins, demanding
    substantial memory and computational bandwidth.However, recent advancements in
    quantum computing present a promising avenue for tackling these challenges. Quantum
    computers offer the potential to simulate many-body quantum systems with minimal
    overhead, overcoming the limitations of classical computational techniques. Although
    current quantum computing platforms operate within the confines of the NISQ era
    -noisy intermediate-scale quantum- they hold immense promise for the exact modelling
    of many-body systems.In this doctoral research, our objective is to investigate
    the predictive capabilities of quantum computers through simulating and benchmarking
    quantum many-body systems relevant to magnetic materials. We showcase three different
    projects on studying frustrated magnetism: 1) simulating non-equilibrium dynamics
    of frustrated Ising models on an analog quantum annealer, 2) studying frustrated
    Rydberg atom quench dynamics on a neutral atom platform, and 3) simulating the
    Kitaev honeycomb model and probing its topological order on a digital quantum
    computer. By leveraging the potential of quantum computing in this domain, this
    research aims to advance both theoretical understanding and practical applications
    in quantum physics.'
  venue: Purdue
- title: Precision quantum simulation of magnon spectra and interactions
  date: 2026-07
  url: https://arxiv.org/abs/2607.13301
  category: quantum-simulation
  subcategory: application
  authors:
  - Trond I. Andersen
  - Nikita Astrakhantsev
  - Jeronimo Martinez
  abstract: Quantum simulation promises to advance materials discovery by accurately
    simulating complex states of matter, their microscopic excitations, and macroscopic
    response functions. The central challenge in resolving the underlying interacting
    dynamics is to combine high-fidelity evolution with the sophisticated control
    necessary to manipulate individual quasi-particles in quantum many-body states.
    Here, we report on high-precision simulation of both linear and non-linear response
    functions in a 2D XY spin-1/2 magnet using an analog-digital superconducting processor
    of up to 97 qubits. By interleaving digital gates with analog evolution precisely
    characterized via Hamiltonian learning, we selectively excite magnons at tunable
    energy densities. Measuring first the linear magnon response -- a central probe
    in neutron-scattering experiments -- we extract temperature-dependent spectra
    and lifetimes. Our results reveal stark variations in magnon decay rates across
    the Brillouin zone, with enhancement near van Hove singularities and suppression
    for edge-localized modes. Next, we perform a suite of nonlinear measurements,
    including the study of self-scattering mechanisms, as well as pump-probe spectroscopy
    to directly characterize the magnon interactions. While matrix-product state simulations
    capture the dynamics well in either small systems or at low temperatures, their
    predictions become inaccurate away from these limits. This work demonstrates precise
    simulation of the interacting dynamics in quantum magnets, and provides key insights
    into quasi-particles and their microscopic scattering mechanisms.
  venue: arXiv (Cornell University)
- title: Simulation of Electron Transfer on Noisy Quantum Computers
  date: 2026-07
  url: https://elib.dlr.de/225561/1/Abstract_Heilbronn_2026.pdf
  category: quantum-simulation
  subcategory: method
  authors:
  - Marvin Gajewski
  - Alejandro Somoza
  - Birger Horstmann
  abstract: We present a framework [1] for the digital-analog simulation of open quantum
    systems governed by Hamiltonians with linear-vibronic coupling (LVC) and structured
    vibrational environments. Our approach exploits the intrinsic dissipation of qubits
    in near-term quantum hardware as a resource to emulate vibrational relaxation,
    combined with a model-specific error mitigation scheme to filter out noise sources
    incompatible with the target open system. We validate our strategy by resolving
    the vibronic transfer spectra of a one-dimensional donor-acceptor chain on IBM
    superconducting processors, reproducing non-Markovian dynamics and scaling the
    chain length up to 10 electronic sites, an unprecedented scale for chemical dynamics
    on quantum computers. Our model of vibronic electron transfer offers a portable,
    application-oriented benchmark for simulating long-lived entangled states on NISQ
    computers. [1] Gajewski et al, Nat. Comm. 17, 4779 (2026)
  venue: elib (German Aerospace Center)
- title: Entanglement distillation based on Hamiltonian dynamics
  date: 2026-03
  url: https://arxiv.org/abs/2603.10843
  category: quantum-simulation
  subcategory: theory
  authors:
  - Zitai Xu
  - Guoding Liu
  abstract: 'Efficient entanglement distillation is a central task in quantum information
    science and future quantum networks. At the core of distillation protocols are
    the quantum error correction and detection schemes which enhance the fidelity
    of entangled pairs. Conventional protocols focus on digital systems, which typically
    require complicated compiled circuits, high-fidelity multi-qubit operations and
    delicate pulse-level control that impose high demands on near-term hardware. Crucially,
    the leading physical platforms for quantum networks, trapped ions and neutral
    atoms, are governed by native many-body Hamiltonians inherently suited for analog,
    continuous-time evolution. Adopting these natural dynamics is simpler than engineering
    digital logic via delicate pulse-level control. Motivated by this experimental
    reality, we seek to leverage the intrinsic analog capabilities for efficient entanglement
    distillation. In this work, we introduce the Hamiltonian entanglement distillation
    protocol, which exploits the intrinsic information scrambling generated by random
    time evolution under native Hamiltonians. We establish a quantitative connection
    between output fidelity and Out-of-Time-Order Correlators, showing that efficient
    scrambling directly implies good distillation performance. Since generic Hamiltonians
    are naturally efficient scramblers, the capability for distillation is ubiquitous:
    almost all Hamiltonians in the Hilbert space suffice for high-fidelity distillation.
    Numerical simulations of representative Rydberg-atom and trapped-ion systems further
    confirm that robust performance could be achieved using only short-range interactions
    and evolution times feasible in current experiments. By avoiding the complexity
    of digital circuit control, our approach substantially relaxes experimental requirements,
    providing a scalable route to entanglement engineering on current analog quantum
    platforms.'
  venue: arXiv (Cornell University)
- title: Exploring Variational Entanglement Hamiltonians
  date: 2026-06
  url: https://arxiv.org/abs/2505.10530
  category: quantum-simulation
  subcategory: theory
  authors:
  - Yanick S. Kind
  - Benedikt Fauseweh
  abstract: Recent advances in analog and digital quantum-simulation platforms have
    enabled exploration of the spectrum of entanglement Hamiltonians via variational
    algorithms. In this work we analyze the convergence properties of the variationally
    obtained solutions and compare them to numerically exact calculations in quantum
    critical systems. We demonstrate that interpreting the cost functional as an integral
    permits the deployment of iterative quadrature schemes, thereby reducing the required
    number of measurements by more than an order of magnitude even in the presence
    of noise. We further show that a modified ansatz captures deviations from the
    Bisognano-Wichmann form in lattice models, improves convergence, improves trainability
    and provides a cost-function-level diagnostic for quantum phase transitions. Finally,
    we establish that a low cost value does not by itself guarantee convergence in
    trace distance. Nevertheless, it faithfully reproduces degeneracies and spectral
    gaps, which are essential for applications to topological phases.
  venue: Quantum
- title: State preparation and detection for quantum simulation of particle collisions
  date: 2026-07
  url: https://arxiv.org/abs/2607.26142
  category: quantum-simulation
  subcategory: theory
  authors:
  - Federica Maria Surace
  - Sary Bseiso
  - John Preskill
  abstract: 'Simulating the real-time dynamics of particle collisions is a promising
    application of quantum simulators, because classical methods such as tensor networks
    struggle to capture the highly entangled states generated in high-energy scattering.
    Realizing such simulations requires both the preparation of incoming wave packets
    and the detection of the outgoing scattering products. In this work, we propose
    protocols that address both challenges on programmable analog and digital quantum
    simulation platforms. Our state-preparation scheme uses a weakly coupled auxiliary
    qubit - or, more generally, a customized local quench - to inject a single quasiparticle
    with well-defined momentum. Because it relies only on conservation of energy,
    this scheme requires no fine-tuning or prior knowledge about particle eigenstates,
    making it robust against errors in calibration and implementation. The momenta
    of scattering products are then extracted, using only local measurements, from
    the interference pattern that arises when particles are reflected at the system''s
    boundary. We validate our protocols through numerical simulations, first in a
    simple single-particle model and subsequently in two interacting many-body systems:
    a Rydberg atom chain and an Ising chain in a mixed field. We demonstrate how high-energy
    regimes, necessary to access inelastic scattering processes, can be reached through
    an adiabatic ramp, and how the wave packet shape can be optimized by spatially
    modulating the Hamiltonian. Finally, we show how the protocol can be generalized
    to systems with more than one spatial dimension. Our proposal provides a versatile
    approach to the quantum simulation of scattering phenomena, and is compatible
    with several quantum simulation platforms that are already experimentally available.'
  venue: arXiv (Cornell University)
- title: Dynamic Induction of Lattice Gauge Theories on a Quantum Computer
  date: 2026-08
  url: https://arxiv.org/abs/2608.02756
  category: quantum-simulation
  subcategory: theory
  authors:
  - Bárbara Andrade
  - D. A. Millar
  - Lewis Anderson
  abstract: Gauge invariance is central to modern physics and underpins quantum simulations
    of lattice gauge theories (LGTs). Existing quantum simulation approaches employ
    Gauss's law either to energetically suppress gauge-violating processes in analog
    platforms or to detect and discard gauge-violating outcomes in digital devices.
    Here we introduce a third paradigm, in which Gauss's law is used to dynamically
    generate the gauge theory itself from a substantially simpler Hamiltonian. Starting
    from a readily programmable three-body XXX model, we employ experimentally efficient
    single-qubit U(1) gauge symmetry-generator terms that induce the dynamics of a
    U(1) LGT. We implement this approach using 101 qubits on a 156-qubit IBM quantum
    processor and observe real-time dynamics in quantitative agreement with the target
    LGT while reducing the entangling-gate depth per Trotter step by a factor of five
    compared with a direct implementation. Our results establish gauge protection
    as a resource for Hamiltonian engineering rather than merely symmetry preservation,
    opening a scalable resource-efficient route towards digital quantum simulations
    of increasingly complex gauge theories in higher spatial dimensions.
  venue: arXiv (Cornell University)
- title: Simulating Chemical Dynamics on Noisy Quantum Computers
  date: 2026-06
  url: https://elib.dlr.de/225575/1/Abstract_Firenze_2026.pdf
  category: quantum-simulation
  subcategory: method
  authors:
  - Marvin Gajewski
  - Alejandro Somoza
  - Birger Horstmann
  abstract: We present a framework for the digital-analog simulation of Hamiltonians
    with linear-vibronic coupling (LVC) on quantum computers, and apply it to electron
    transfer in organic donor-acceptor systems, which present a promising platform
    for efficient charge separation in organic photovoltaic devices. Our approach
    turns the noise intrinsic to quantum hardware into a resource to emulate vibrational
    relaxation. Using superconducting quantum processors, we simulate charge separation
    from an electron donating thiophene polymer along a one-dimensional chain of fullerene
    acceptor molecules on, reproducing non-Markovian dynamics and scaling the chain
    length up to 10 acceptor sites, an unprecedented scale for chemical dynamics on
    quantum computers. Our model of vibronic electron transfer offers a portable,
    application-oriented benchmark for simulating long-lived entangled states on NISQ
    computers.
  venue: elib (German Aerospace Center)
- title: Multimode Cavities for Quantum Science
  date: 2026-06
  url: https://doi.org/10.6082/pk56z-mec90
  category: quantum-simulation
  subcategory: method
  authors:
  - Lukas Palm
  abstract: Over the last decade, quantum simulation and computation has progressed
    from a purely scientific testbed of quantum mechanics to a mature field that is
    starting to offer new insights into materials, quantum effects, and algorithms
    that are intractable with even the most state-of-the-art classical computation.
    Simulating certain quantum Hamiltonians that are theorized to be at the heart
    of high-Tc superconductivity, topological quantum systems such as the fractional
    quantum Hall effect or fundamental questions of thermalization quickly exceed
    the available memory of even the most advanced supercomputers – and in fact all
    memory in the world – due to the exponential growth of the Hilbert space with
    system size. As postulated by Feynman himself, the computational system best suited
    for solving quantum problems is to use a quantum system itself, as it can intrinsically
    represent the entanglement that is the key resource making quantum computing challenging
    but also promising. Apart from simulating problems in physics and chemistry, there
    is also tremendous excitement for quantum computers to provide speedups for general
    algorithms in optimization at a rate that is exponentially faster than existing
    classical programming. So far only a small class of algorithms has been actually
    proven to provide such a speedup, most prominently Shor's algorithm which can
    factor large prime numbers, and several other search and oracle algorithms. In
    the last two decades, many experiments using ultracold atoms, ions, or superconducting
    circuits have focused on analog quantum simulation. Here, a model Hamiltonian
    that is believed to capture all the relevant physics of the system of study is
    experimentally realized using different building blocks and interactions but replicating
    condensed matter effects at an increased scale. This has led to a number of bespoke
    experiments such as BEC/Fermigass machines, quantum gas microscopes and more exotic
    setups that are purpose built to study a particular effect. More recently, there
    has been a shift to develop more universal simulation platforms and optical tweezer
    arrays have emerged as a leading solution due to their high degree of reconfigurability.
    Through tremendous improvements in the degree of control and measurement of single
    qubits, error correction has become a viable route to build a true universal digital
    quantum computer. Even as we transition into the digital age of quantum simulation,
    certain classes of problems with additional physics constraints such as Fermionic
    statistics, gauge fields and lattice gauge theories still incur too large of an
    overhead to be encoded on these digital simulators. In this thesis, we use a highly
    degenerate twisted cavity to simulate the effect of a magnetic field on a two-dimensional
    system of interacting photons to enable realization of states of the quantum Hall
    effect. We design, build, and commission a new lens based cavity apparatus realizing
    a lowest Landau level for a mesoscopic number of modes. We demonstrate the integration
    of highly excited Rydberg atoms to mediate strong interactions and demonstrate
    photon blockade as well as mean field interactions. As a second application of
    cavities to quantum information leveraging our newfound comfort with intra-cavity
    optics, and experience with aberration modeling in resonators, we demonstrate
    a new class of small waist optical resonators enabled by lens-based cavities and
    then apply our understanding of optical aberrations in cavities to the development
    of a new class of cavity array. This Cavity Array Microscope (CAM) realizes a
    large number of cavities (up to currently 600) using only a fixed number of free
    space optics and is both scalable with constant overhead as well as compatible
    with Rydberg atoms. This platform provides a route to highly parallel quantum
    repeater operation or entanglement generation between atom arrays in the future.
  venue: University of Chicago
- title: Simulating electron transfer on noisy quantum computers
  date: 2026-05
  url: https://arxiv.org/abs/2508.18141
  category: quantum-simulation
  subcategory: method
  authors:
  - Marvin Gajewski
  - Alejandro D. Somoza
  - Gary Schmiedinghoff
  abstract: While simple spin-boson models have been realized on quantum hardware,
    simulating extended electronic networks with local vibrational environments remains
    a fundamental challenge in the presence of non-equilibrium, long-lived electronic-vibrational
    (vibronic) coherence. We present a framework for the digital-analog simulation
    of open quantum systems governed by Hamiltonians with linear-vibronic coupling
    (LVC) and structured vibrational environments. Our approach exploits the intrinsic
    dissipation of qubits in near-term quantum hardware as a resource to emulate vibrational
    relaxation, combined with a model-specific error mitigation scheme to filter out
    noise sources incompatible with the target open system. We validate our strategy
    by resolving the vibronic transfer spectra of a one-dimensional donor-acceptor
    chain on IBM superconducting processors, reproducing non-Markovian dynamics and
    scaling the chain length up to 10 electronic sites, an unprecedented scale for
    chemical dynamics on quantum computers. Our model of vibronic electron transfer
    offers a portable, application-oriented benchmark for simulating long-lived entangled
    states on NISQ computers.
  venue: Nature Communications
- title: Realization of fermionic Laughlin state on a quantum processor
  date: 2026-06
  url: https://doi.org/10.1038/s41467-026-72769-y
  category: quantum-simulation
  subcategory: application
  authors:
  - Lingnan Shen
  - Mao Lin
  - Cedric Yen-Yu Lin
  abstract: Strongly correlated topological phases of matter are central to modern
    condensed matter physics and quantum information technology but often challenging
    to probe and control in material systems. The experimental difficulty of accessing
    these phases has motivated the use of engineered quantum platforms for simulation
    and manipulation of exotic topological states. Among these, the Laughlin state
    stands as a cornerstone for topological matter, embodying fractionalization, anyonic
    excitations, and incompressibility. Although its bosonic analogs have been realized
    on programmable quantum simulators, a genuine fermionic Laughlin state has yet
    to be demonstrated on a quantum processor. Here, we realize the ν = 1/3 fermionic
    Laughlin state on IonQ's trapped-ion quantum computer using an efficient and scalable
    Hamiltonian variational ansatz with 369 two-qubit gates on a 16-qubit circuit.
    Employing symmetry-verification error mitigation, we extract key observables that
    characterize the Laughlin state, including correlation hole, bulk-edge correspondence,
    and topological entanglement entropy, with strong agreement to exact diagonalization
    benchmarks. This work demonstrates an end-to-end workflow to simulate material-intrinsic
    topological orders and provides a starting point to explore its dynamics and excitations
    on digital quantum processors.
  venue: Nature Communications
- title: Quantum algorithms for viscosity solutions to nonlinear Hamilton–Jacobi equations
    based on an entropy penalization method
  date: 2026-06
  url: https://doi.org/10.1073/pnas.2607144123
  category: quantum-simulation
  subcategory: method
  authors:
  - Shi Jin
  - Nana Liu
  abstract: We present a framework for efficient extraction of the viscosity solutions
    of nonlinear Hamilton-Jacobi equations with convex Hamiltonians. These viscosity
    solutions play a central role in areas such as front propagation, mean-field games,
    optimal control, machine learning, and a direct application to the forced Burgers'
    equation. Our method is based on an entropy penalization method which generalizes
    the Cole-Hopf transform from quadratic to general convex Hamiltonians, allowing
    an approximation of viscous Hamilton-Jacobi dynamics by a discrete-time linear
    dynamics which approximates a linear heat-like parabolic equation, and thus can
    also extend to continuous-time dynamics. This makes the method suitable for quantum
    simulation. The validity of these results hold for arbitrary nonlinearity that
    correspond to convex Hamiltonians, and for arbitrarily long times, thus obviating
    a chief obstacle in most quantum algorithms for nonlinear partial differential
    equations. We provide quantum algorithms-both analog and digital-for extracting
    pointwise values, gradients, minima, and function evaluations at the minimizer
    of the viscosity solution, without requiring nonlinear updates or full state reconstruction.
  venue: Proceedings of the National Academy of Sciences
- title: Imaginary Time Evolution and Ground State Preparation Using Unitary Multi-Copy
    Protocols
  date: 2026-07
  url: https://doi.org/10.1103/1tf6-bc55
  category: quantum-simulation
  subcategory: theory
  authors:
  - Anonymous
  - Torsten V. Zache
  - Hannes Pichler
  abstract: 'Efficient low-energy state preparation is a key objective in quantum
    computation and quantum simulation. Quantum imaginary-time evolution replaces
    real-time dynamics with imaginary-time dynamics, exponentially suppressing higher-energy
    eigenstates. We introduce deterministic unitary protocols that approximate imaginary-time
    evolution for ground state preparation. The protocols require multiple copies
    of the system, real-time evolution under the system Hamiltonian, and controlled-
    operations (or more general -generated unitaries). Our analysis focuses on two
    concrete circuit families: a tree architecture with provable polynomial-in-depth
    convergence but rapidly growing width, and a compact “hedge” architecture that
    achieves comparable accuracy with only polynomial width in a heuristic construction
    supported by numerics. Numerical evidence indicates that mid-circuit post-selection
    can accelerate convergence with practical success probabilities. Separately, we
    demonstrate that circuit volume can be traded for the shot complexity of post-circuit
    observable estimation in the ground state preparation setting. Finally, we outline
    concrete platform-specific implementations in which multi-copy registers and -mediated
    couplings are natural, illustrating how these hybrid analog-digital circuits can
    complement existing state-preparation methods in the near term.'
  venue: PRX Quantum
- title: Rigorous error bounds for dissipative thermal state preparation from weak
    system-bath coupling
  date: 2026-05
  url: https://arxiv.org/abs/2605.03011
  category: quantum-simulation
  subcategory: theory
  authors:
  - Christopher J. Ong
  - S. A. Parameswaran
  - Benedikt Placke
  abstract: Thermal state preparation is a central challenge in the simulation of
    quantum many-body systems. Yet, provably efficient algorithms for this task were
    only introduced recently [Chen et al. Nature 646, 561 (2025)]. These algorithms
    are based on dissipative Lindbladian evolution which exactly fixes the thermal
    state. Controlled and efficient digital simulation of this evolution, although
    possible in principle, remains out of reach for present-day quantum hardware.
    Subsequent work has therefore focused on analog approximations of the proposed
    Lindbladians via `collision models' with relatively modest requirements -- a resettable
    bath of ancilla qubits whose couplings to the system can be tuned in time-dependent
    fashion -- while still admitting rigorous fixed-point error bounds. Existing rigorous
    approaches, however, do not exploit the fact that these constructions generically
    implement not only the desired Lindblad dynamics, but also an additional unitary
    evolution generated by the system Hamiltonian which may aid convergence to the
    thermal state [Lloyd and Abanin arXiv:2506.21318 (2025)]. Here, we show that this
    unitary contribution does indeed tighten the fixed-point error bound and demonstrate
    that it is rigorously controlled by the system-bath coupling strength $J$, scaling
    as $J^2$. This demonstrates that the effect of the spurious `Lamb shift' term
    generated by the system-bath interaction can be controlled by tuning $J$. We clarify
    the role, previously observed, of a randomized implementation in suppressing possible
    resonances of the drive with the many-body spectrum, and bound the additional
    variance that this randomization imposes on observables. Finally, we numerically
    study aspects of the protocol which are relevant for its practical realization,
    such as the mixing time.
