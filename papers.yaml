  - Li Shen
  abstract: Simulating the behavior of quantum circuits on classical computers is
    one of the widely used approaches for current quantum computing device and quantum
    algorithm research. State- vector simulators keep all the quantum states in main
    memory, thus consuming a large amount of memory and resulting in significant memory
    access and communication overhead far longer than calculation time. Consequently,
    data communication time often becomes the primary bottleneck in quantum circuit
    simulation. Many classical simulators, such as QuEST, are designed to execute
    quantum gates serially without exploiting data locality, and all amplitudes need
    to be exchanged. Such a gate-unaware full-data communication scheme forces powerful
    computation such as GPUs to spend substantial time waiting for data transfers.
    In this paper, we propose a gate-aware on-demand communication quantum simulation
    framework to optimize communication overhead. We analyze the on-demand communication
    process and develop a communication cost model to elucidate the relationship between
    communication costs and circuit partition. Since greedy circuit partition method
    can only yield locally optimal solutions, we propose a choice-start-node quantum
    circuit partition method guided by the communication cost model to further reduce
    communication overhead in quantum circuit simulation. We evaluate on a 4-node
    cluster with 2 NVIDIA A100 GPUs on each node and our design achieves 59.32× speedup
    compared to the gate-unaware full-data communication scheme. Furthermore, compared
    to the greedy circuit partition method, our partition method can achieve simulation
    acceleration of 1.79×.
  venue: IEEE Transactions on Parallel and Distributed Systems
- title: Explicit Quantum Search Algorithm for the Densest k-Subgraph Problem
  date: 2026-04
  url: https://arxiv.org/abs/2604.27782
  category: quantum-algorithms
  subcategory: method
  authors:
  - Yu. A. Biriukov
  - R. D. Morozov
  - I. V. Dyakonov
  abstract: 'This paper addresses the problem of finding the densest $k$-vertex subgraph
    in an arbitrary graph. This problem is NP-hard and has important applications
    in social network analysis, fraud detection, recommendation systems, and bioinformatics.
    We propose two quantum approaches to solve this problem: reduction to Quadratic
    Unconstrained Binary Optimization (QUBO) and using Grover''s quantum search algorithm.
    For the latter approach, we present an explicit gate-based oracle circuit utilizing
    Dicke states and Quantum Fourier Transform for edge counting. Numerical simulations
    demonstrate a quadratic speedup over classical Brute-force search.'
  venue: arXiv (Cornell University)
- title: Faster algorithm for achieving minimal-size quantum decision diagrams
  date: 2026-06
  url: https://arxiv.org/abs/2606.24789
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Juul Sanders
  - Sebastiaan Brand
  - Arend-Jan Quist
  abstract: The decision diagram (DD) data structure enables fast linear-algebra calculations
    by bringing vectors into a normal form and subsequently merging equivalent ones,
    yielding a minimally-sized DD modulo the equivalence relation. A fruitful application
    area is quantum-circuit simulation, where the vectors represent quantum states.
    The Local Invertible Map Decision Diagram (LIMDD) type, merges LIM-equivalent
    (typically Pauli-gate equivalent) vectors, can efficiently simulate Clifford circuits
    as well as some high-T-count circuits, and has theoretically been proven exponentially
    faster for simulation than other well-developed data structures, including other
    common DD variants. However, these exponential advantages have not fully materialized
    yet in existing implementations, for which the normal-form procedure, which is
    a highly complex algorithm, is either absent or only partially implemented. We
    here present a novel normal-form algorithm for Pauli-LIMDDs, achieving a worst-case
    speedup from $O(n^3)$ to $O(n^2)$ for an $n$-qubit DD node with a single child
    node while keeping the $O(n^3)$ run time in case of two distinct children nodes.
    We implement the algorithm as part of QolDDer, our Pauli-LIMDD simulator for quantum
    circuits, written from scratch in C/C++. The implementation realizes the theoretically-proven
    advantages of Pauli-LIMDDs on Clifford circuits, is significantly faster than
    the existing LIMDD simulators on such circuits, and on a public quantum-circuit
    data set often outperforms them by an order of magnitude. In the future, we envision
    that our work will enable further application and development of LIMDD variants,
    not only for quantum design tasks, but also for analysis of linear-algebra-based
    systems in general.
  venue: arXiv (Cornell University)
- title: GPU-Accelerated Quantum Simulation of Stabilizer Circuits
  date: 2026-03
  url: https://arxiv.org/abs/2603.14641
  category: quantum-algorithms
  subcategory: method
  authors:
  - Muhammad Osama
  - Dimitrios Thanos
  - Alfons Laarman
  abstract: We introduce new parallel algorithms for efficiently simulating stabilizer
    (Clifford) circuits on GPUs, with a focus on data-parallel tableau evolution and
    scalable handling of projective measurements. Our approach reformulates key bottlenecks
    in stabilizer simulation -- such as Gaussian elimination and measurement updates
    -- into GPU-tailored primitives that eliminate sequential dependencies and maximize
    memory coalescing. We implement these techniques in QuaSARQ, a GPU-accelerated
    stabilizer simulator designed for large qubit counts and many-shot sampling. Across
    a broad benchmark suite reaching 180,000 qubits and depth 1,000 (roughly 130M
    gates), QuaSARQ shows substantial runtime improvements, with up to 105$\times$
    speedup, and over 80% energy reduction on demanding instances. Moreover, QuaSARQ
    consistently outperforms Stim, a state-of-the-art CPU-optimized stabilizer simulator,
    as well as Qiskit-Aer (CPU/GPU), Qibo, Cirq, and PennyLane. Finally, QuaSARQ exhibits
    a significant advantage in many-shot sampling on large workloads. These results
    demonstrate that our parallel algorithms can significantly advance the scalability
    of stabilizer-circuit simulation, particularly for workloads involving extensive
    measurements and sampling.
  venue: arXiv (Cornell University)
- title: 'Practical Guide to Quantum Computing: Grover''s Algorithm # 4'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18865416
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Mikhail Pavlov
  abstract: 'Abstract This guide is based on the IBM Quantum course Phase Estimation
    and Factoring and focuses on Grover’s algorithm, a quantum algorithm for unstructured
    search problems that provides a quadratic speedup over classical approaches. In
    an unstructured search problem, we are given a function (often represented as
    an oracle) that marks one or more “correct” solutions among NNN possible candidates.
    A classical algorithm requires on the order of O(N)O(N)O(N) evaluations in the
    worst case. In contrast, Grover’s algorithm finds a solution using only O(N)O(\sqrt{N})O(N)
    oracle queries. This quadratic improvement implies: The quantum algorithm requires
    roughly the square root of the number of operations needed classically. Any classical
    algorithm for unstructured search must have cost at least quadratic relative to
    Grover’s quantum procedure. Core Idea of the Algorithm Grover’s algorithm relies
    on: Preparation of a uniform superposition (typically using Hadamard gates). An
    oracle that marks valid solutions via phase inversion. The Grover diffusion operator,
    which amplifies the probability amplitude of the marked states through interference.
    By repeatedly applying the Grover operator, the amplitude of the desired solution
    grows while others diminish, allowing measurement to reveal the correct answer
    with high probability. Practical Considerations Despite its theoretical elegance
    and wide applicability, the quadratic speedup of Grover’s algorithm is unlikely
    to yield near-term practical advantage. Modern classical hardware operates at
    extremely high clock rates and is vastly more mature than current quantum devices.
    For problem sizes accessible to today’s quantum computers, classical systems remain
    dominant. However, history shows that even sub-quadratic classical improvements
    — such as: Fast Fourier Transform (FFT) Efficient sorting algorithms like quicksort
    and mergesort have had transformative practical impact. The crucial distinction
    is that Grover’s algorithm depends on fundamentally different hardware — quantum
    processors — which are still in early development. Long-Term Perspective As quantum
    hardware advances in qubit count, coherence time, and error correction, Grover’s
    quadratic advantage may become practically significant for: Cryptographic key
    search Optimization heuristics Combinatorial search problems Amplitude amplification
    subroutines in broader quantum algorithms Through hands-on experimentation on
    IBM Q, this lesson demonstrates how theoretical amplitude amplification translates
    into executable quantum circuits, reinforcing the relationship between interference,
    probability amplitudes, and computational complexity.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Practical Experience with IBM Q Quantum Computer: Bernstein–Vazirani Algorithm'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.18865682
  category: quantum-algorithms
  subcategory: method
  authors:
  - Mikhail Pavlov
  abstract: Abstract This study presents practical experience implementing the Bernstein–Vazirani
    algorithm on the IBM Q quantum computing platform, focusing on energy-efficient
    and reversible computation guided by Landauer’s principle. The work highlights
    the role of fundamental quantum logic gates—including CNOT, NOT, CCNOT, OR, and
    XOR—in constructing scalable, reversible circuits. By applying these principles,
    the Bernstein–Vazirani algorithm demonstrates an efficient solution to the problem
    of determining a hidden binary vector with a minimal number of queries, showcasing
    the potential for quantum computational speedup and optimization of information
    processing. The research emphasizes the importance of reversible quantum operations
    in improving computational efficiency and expanding the capabilities of modern
    quantum systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Reducing circuit resources in Grover’s algorithm via constraint-aware initialization
  date: 2026-07
  url: https://doi.org/10.1038/s41598-026-64187-3
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Eunok Bae
  - Jeonghyeon Shin
  - Minjin Choi
  abstract: Abstract Grover’s search algorithm provides a quadratic speedup over classical
    brute-force methods for unstructured search problems in terms of query complexity
    and is widely used as a versatile subroutine in numerous quantum algorithms, including
    those for combinatorial problems with large search spaces. For such problems,
    it is natural to reduce the effective search space by incorporating problem constraints
    at the initialization step, which in Grover’s algorithm can be achieved by preparing
    structured initial states that encode constraint information. In this work, we
    present a systematic framework with a simple preprocessing procedure for constraint-aware
    initialization in Grover’s algorithm, focusing on problems with linear constraints.
    The proposed framework incorporates cardinality constraints and parity constraints
    extracted from more general linear constraints. While such structured initial
    states can reduce the number of oracle queries required to obtain a solution,
    their preparation incurs additional circuit-level costs. We therefore offer a
    conservative circuit-level resource analysis, showing that the resulting constraint-aware
    initialization can improve resource efficiency in terms of gate counts and circuit
    depth. The proposed framework is further illustrated numerically using the exact-cover
    problem as a representative application. Overall, our results indicate that this
    approach serves as a practical baseline for achieving more resource-efficient
    implementations of Grover’s algorithm compared to the standard uniform initialization.
  venue: Scientific Reports
- title: 'EFaaS: A Quantum-Classical Serverless Entangled Scheduler for Hybrid Variational
    Algorithms'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27540
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Abolfazl Younesi
  - Nouhaila Innan
  - Alberto Marchisio
  abstract: 'As quantum computing enters the Utility Era, realizing near-term advantage
    relies heavily on Hybrid Variational Quantum Algorithms (VQAs). These algorithms
    require a tightly coupled, iterative loop between a classical CPU optimizer and
    a Quantum Processing Unit (QPU). However, current quantum cloud access models
    are bottlenecked by decoupled batch-queues that sever this loop, introducing massive
    Time-to-Next-Shot (TTNS) latency. This delay inflates convergence time from minutes
    to hours and exposes the computation to quantum hardware drift, degrading algorithmic
    fidelity. Unlike prior work that relies on resource-wasting static hardware reservations
    or state-oblivious, stateless functions, we propose EFaaS, a novel serverless
    middleware designed specifically for hybrid quantum workflows. EFaaS fundamentally
    departs from existing architectures by treating classical parameter optimization
    and quantum circuit execution as entangled, session-aware events. Our main technical
    innovations are threefold: (1) a Calibration-Aware placement strategy that dynamically
    routes circuits to QPUs with warm calibration caches, circumventing cold-start
    penalties, (2) a Dual-Resource Fair Queuing scheduler that maximizes quantum utilization
    by strictly prioritizing active iterative loops, and (3) the "EF-QuantumFuture"
    programming abstraction, a novel primitive enabling classical speculative execution
    to mask compute latency. Across the evaluated baselines, EFaaS achieves TTNS reductions
    of 11.4%-94.3%, QDC gains of 2.02%-15.78% points, and convergence speedups of
    83.2%-98.3%, while eliminating drift penalties.'
  venue: arXiv (Cornell University)
- title: Large-Scale Quantum Circuit Simulation on HPC Cluster via Cache Blocking,
    Boosting, and Gate Fusion Optimization
  date: 2026-04
  url: https://arxiv.org/abs/2604.12256
  category: quantum-algorithms
  subcategory: method
  authors:
  - Chuan-Chi Wang
  - Yan Jie Wang
  - Chia-Heng Tu
  abstract: Quantum circuit simulation is crucial for the development of quantum algorithms,
    particularly given the high cost and noise limitations of physical quantum hardware.
    While full-state quantum circuit simulation is commonly employed for prototyping
    and debugging, it poses challenges because of the exponential increase in simulation
    time for large quantum systems. In this work, we propose an extensible framework
    designed to enhance simulation performance by optimizing both data locality and
    computational efficiency, thereby addressing these challenges. This framework
    is seamlessly integrated with an optimizer that restructures quantum circuits
    and a simulator that adjusts execution strategies for various quantum operations.
    For the newly developed components, merge booster and diagonal detector, the underlying
    algorithms are inspired by the principles of quantum entanglement and gate fusion,
    as well as by the limitations identified in existing third-party simulation libraries.
    The experiments were conducted on eight DGX-H100 workstations, each equipped with
    eight NVIDIA H100 GPUs, employing both gate-level and circuit-level benchmarks.
    The results indicate a speedup of up to 160 times for circuit-level benchmarks
    and an acceleration of up to 34 times for diagonal-heavy gate-level benchmarks
    compared to existing simulators. The proposed methodologies are anticipated to
    deliver more robust and faster quantum circuit simulations, thereby fostering
    the advancement of novel quantum algorithms.
  venue: arXiv (Cornell University)
- title: Hybrid Circuit–Spintronic Quantum Framework for Financial Risk Analysis with
    QCVaR Estimation Using Variational Quantum Algorithms and Maximum-Likelihood Amplitude
    Estimation
  date: 2026-03
  url: https://doi.org/10.2478/qic-2026-0002
  category: quantum-algorithms
  subcategory: method
  authors:
  - Gayathri S. S.
  - Muthulakshmi P.
  - R. Palanivel
  abstract: Abstract Problem Statement Accurate estimation of extreme financial risks,
    such as Conditional Value-at-Risk (CVaR) at high confidence levels ( α ≥ 0.95),
    poses significant computational challenges for classical Monte Carlo methods,
    which require O (1/ ϵ 2 ) samples and struggle to scale under rare-event scenarios.
    Methodology To address this, we propose a hybrid variational quantum–spintronic
    framework integrating Variational Quantum State Preparation (VQA), a threshold
    comparator oracle, and Maximum-Likelihood Amplitude Estimation (MLAE) to enable
    quantum-accelerated CVaR estimation suitable for NISQ devices. Results Using only
    6 qubits and K = 6 amplification levels, our approach achieves <m:math xmlns:m="http://www.w3.org/1998/Math/MathML"
    display="inline"> <m:msub> <m:mover accent="true"> <m:mrow> <m:mtext>CVaR</m:mtext>
    </m:mrow> <m:mo stretchy="true">^</m:mo> </m:mover> <m:mrow> <m:mn>0.95</m:mn>
    </m:mrow> </m:msub> <m:mo>=</m:mo> <m:mn>0.281</m:mn> <m:mo>±</m:mo> <m:mn>0.012</m:mn>
    </m:math> {\widehat {{\rm{CVaR}}}_{0.95}} = 0.281 \pm 0.012 (error &lt; 1.1% compared
    to classical benchmarks), with tail probability <m:math xmlns:m="http://www.w3.org/1998/Math/MathML"
    display="inline"> <m:mover accent="true"> <m:mi>p</m:mi> <m:mo>^</m:mo> </m:mover>
    <m:mo>=</m:mo> <m:mn>0.0478</m:mn> <m:mo>±</m:mo> <m:mn>0.0009</m:mn> </m:math>
    \hat p = 0.0478 \pm 0.0009 and state fidelity 0.967 on the ibm_brisbane backend.
    MLAE reduces circuit depth by 3.3 × relative to canonical QAE, and a conceptual
    spintronic implementation achieves ∼2.0 fJ/gate, corresponding to an 80% energy
    reduction versus CMOS. Contributions This work introduces the first NISQ-compatible,
    energy-efficient quantum–spintronic pipeline for regulatory-compliant financial
    risk analytics, providing a quadratic sampling speedup, accurate tail-risk estimation,
    and a pathway toward sustainable quantum finance.
  venue: Quantum Information and Computation
- title: 'Hybrid Quantum Classical Acceleration of Machine Learning Algorithms: A
    Performance Study'
  date: 2026-03
  url: https://www.epj-conferences.org/10.1051/epjconf/202636001011/pdf
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Mahesh V
  - Ramkumar Krishnamoorthy
  - Drovaleva L.S.
  abstract: The recent rise in the number of data-intensive applications has revealed
    some inherent limitations of traditional machine learning, such as high training
    costs, slow convergence rates, and the uncapable of scalability of traditional
    machine learning in high-dimensional spaces. Bottlenecks are caused by the iterative
    optimization procedure, kernel evaluations, and similarity computations that are
    not efficiently supported by traditional hardware. Although recent advances in
    quantum computing, such as the Variational Quantum Algorithm, quantum kernels,
    and parameterized quantum circuits, hold promise for acceleration, the application
    of quantum speedup is presently hindered by noisy intermediate-scale quantum computing.
    This research provides a hybrid quantum-classical acceleration method that integrates
    quantum methods with selected computationally intensive components of classical
    machine learning systems rather than attempting to entirely replace them. Carried
    out a comprehensive analysis of the performance of well-known algorithms like
    Support Vector Machines, k-means clustering, and gradient-based neural networks
    in classical and quantum-assisted hybrid scenarios. The quantum resources are
    greatly beneficial for particular sub-tasks such as optimization, approximation
    of similarity, and exploration of the feature space, with the remaining learning
    process performed classically. Our analysis reveals that hybrid methods can offer
    a tangible acceleration and improved convergence behaviour in particular scenarios
    without sacrificing accuracy. Moreover, the analysis investigates the trade-offs
    associated with the utilization of quantum resources, robustness to noise, and
    orchestration costs.
  venue: Springer Link (Chiba Institute of Technology)
- title: 'Partial oracles quantum algorithm framework -- Part I: Analysis of in-place
    operations'
  date: 2026-04
  url: https://arxiv.org/abs/2604.21788
  category: quantum-algorithms
  subcategory: theory
  authors:
  - F. Bolton
  abstract: 'The partial oracles framework is a quantum search algorithm that has
    the potential to exceed the quadratic speedup of Grover''s algorithm, up to a
    theoretical maximum of an exponential speedup. Until now, however, the framework
    has lacked an explicit method for constructing the operator that represents the
    search iteration. In this paper, we provide the missing construction, for the
    special case of an oracle function definable using only in-place operations (that
    is, where the calculated result of the oracle function can be read just from the
    qubits in the search index). The restriction to in-place operations means that
    the current work does not yet exhibit quantum advantage: oracle functions constructed
    using only in-place operations are always classically reversible. To demonstrate
    quantum advantage, it will be necessary to extend this construction method to
    include out-of-place operations (part II). As part of the construction of the
    search iteration operator, we define a new type of transform, the reciprocal transform,
    which is applied to the oracle function. We show that the reciprocal transform
    obeys a chain rule, which makes it possible to break down complex transforms into
    simple steps. To illustrate the practical application of this search method, we
    apply the reciprocal transform to elementary operations from the SHA-256 hash
    algorithm: addition modulo $2^n$, the $Maj(a, b, c)$ function, the $Ch(a, b, c)$
    function, and the bit shift functions. We also introduce the QFrame python library,
    which is used to automate the construction of quantum circuits that represent
    reciprocal transforms.'
  venue: arXiv (Cornell University)
- title: Multi-GPU quantum circuit simulation and the impact of network performance
  date: 2026-03
  url: https://arxiv.org/abs/2511.14664
  category: quantum-algorithms
  subcategory: theory
  authors:
  - W. Michael Brown
  - Anurag Ramesh
  - Thomas Lubinski
  abstract: ''
  venue: Computer Physics Communications
- title: A Controlled Study of Memory Hierarchy Transitions in Quantum Circuit Simulation
    on Apple M4 Pro Unified Memory Architecture
  date: 2026-05
  url: https://arxiv.org/abs/2605.08792
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Gyan Pratipat
  abstract: 'State-vector quantum circuit simulation is memory-bandwidth bound, yet
    the interaction between memory hierarchy, access pattern, and hardware parallelism
    remains incompletely characterized. We address this using the Apple M4 Pro Unified
    Memory Architecture (UMA), where CPU and GPU share identical physical LPDDR5X
    DRAM ($\sim$224 GB/s STREAM bandwidth for both), eliminating memory-technology
    and interconnect confounds. Using a thermally isolated, multi-trial methodology
    across 11 simulation backends on GHZ and QFT circuits from 3 to 30 qubits, we
    make three central contributions. First, a Roofline analysis confirms all gate
    implementations have arithmetic intensity $\leq$0.38 FLOP/byte, well below the
    ridge point for any plausible peak compute on modern hardware, establishing structural
    memory-boundedness. Second, we identify a reproducible 4.46$\times$ timing discontinuity
    at the 28$\rightarrow$29 qubit transition, confirmed under thermally isolated
    conditions and cross-validated across GHZ and QFT circuits; tensordot backends
    exhibit the full discontinuity while direct-index backends maintain $\sim$2$\times$
    per-qubit scaling throughout. Third, despite STREAM predicting only 1.85$\times$
    GPU speedup (MLX CPU 119.9 GB/s vs. MLX GPU 221.9 GB/s), all three algorithm classes
    exceed this prediction: tensordot 3.1--4.1$\times$, flat-index 3.5--5.9$\times$,
    and direct-index 6--10$\times$, demonstrating that peak streaming bandwidth does
    not predict simulation speedup for non-contiguous memory access patterns, with
    the gap widening as access irregularity increases. These findings provide a hardware-characterization
    framework for quantum simulation workloads on UMA.'
  venue: arXiv (Cornell University)
- title: 'Quantum Machine Learning for Robotics: A Comprehensive Review of Algorithms,
    Applications, and Future Directions'
  date: 2026-06
  url: https://doi.org/10.65218/jius.2026.13
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Hassen Nigatu
  - Gaokun Shi
  - Jituo Li
  abstract: 'The convergence of quantum computing and robotics represents a paradigm
    shift in autonomous systems design, promising to overcome fundamental computational
    limitations that have constrained classical robotic capabilities. This comprehensive
    review surveys the rapidly evolving field of quantum machine learning (QML) for
    robotics, systematically analyzing 107 peer-reviewed contributions spanning quantum
    algorithms, machine learning techniques, and their robotic applications. We provide
    a detailed historical perspective on the field''s development, from the early
    theoretical foundations established by Grover''s search algorithm and quantum
    reinforcement learning proposals to current experimental implementations on noisy
    intermediate-scale quantum (NISQ) devices. The review systematically examines
    five major application domains: (1) quantum reinforcement learning for navigation
    and control, (2) quantum search and path planning algorithms, (3) quantum-enhanced
    localization and mapping, (4) quantum optimization for inverse kinematics and
    task allocation, and (5) multi-robot coordination and swarm intelligence. For
    each domain, we present detailed algorithmic formulations, computational complexity
    analyses, and critical assessments of experimental results. Our analysis reveals
    that while provable quantum advantage in robotics remains largely prospective,
    recent demonstrations show promising results: quantum deep reinforcement learning
    achieving 40\% parameter reduction in navigation tasks, Grover-based kinematic
    optimization demonstrating up to 93x speedups, and quantum annealing providing
    practical solutions for multi-robot routing. We identify key technical challenges,
    including barren plateaus in variational circuits, noise-induced performance degradation,
    and the quantum-classical integration bottleneck. Finally, we outline a strategic
    roadmap for quantum robotics research, distinguishing near-term opportunities
    in hybrid algorithms from long-term goals requiring fault-tolerant quantum computation.
    This paper serves as both an authoritative technical reference and a comprehensive
    guide for researchers working at the intersection of quantum computing and autonomous
    systems.'
  venue: ''
- title: 'Hybrid Quantum-Classical Implementation of the HHL Algorithm: Total Code
    and Reproducibility Package'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20714901
  category: quantum-algorithms
  subcategory: method
  authors:
  - Zefree Lazarus Mayaluri
  abstract: 'This archive provides the complete code and reproducibility package for
    the project “Hybrid Quantum-Classical Implementation of the HHL Algorithm”. The
    package supports a mitigation-aware computational study of small Hermitian linear
    systems using a hybrid quantum-classical workflow based on the Harrow-Hassidim-Lloyd
    linear-system algorithm. The package includes source code, notebooks, scripts,
    generated result tables, plots, validation files, figure-generation code, Qiskit-style
    circuit-diagram generation code, and supporting documentation. The main benchmark
    evaluates 2×2, 4×4, and 8×8 Hermitian positive-definite systems. It computes the
    normalized classical reference solution, generates the ideal spectral HHL solution
    state, applies a shot-based readout-noise model, performs inverse transition-matrix
    readout mitigation, and reports probability-level reconstruction metrics. The
    master reproduction command is: python reproduce_all.py Running this command regenerates
    the main benchmark tables, plots, validation summary, and checksum manifest. The
    verified execution uses 1024 shots, 20 repetitions, and an independent readout
    flip probability of 0.04. The reported probability-MSE reductions after mitigation
    are 77.52% for the 2×2 case, 85.85% for the 4×4 case, and 49.47% for the 8×8 case.
    The archive also contains additional demonstration code for explaining intermediate
    HHL computation steps, including matrix diagnostics, eigenvalues, condition number,
    classical baseline solution, spectral HHL coefficients, inverse-eigenvalue weighting,
    success probability, noisy counts, mitigated probabilities, and final metrics.
    Separate notebooks/scripts are included for generating publication-style quantum
    implementation figures and Qiskit-style HHL circuit diagrams. The study is simulation-scoped.
    It does not claim real IBM Quantum, IonQ, or other hardware execution. It does
    not claim practical quantum speedup, scalable full-vector extraction, or hardware
    superiority. The purpose of the package is to provide a transparent, reproducible,
    and educational implementation workflow for understanding Hybrid HHL under NISQ-oriented
    constraints. This package is intended to support academic project submission,
    reproducibility review, presentation, and future extension toward gate-level HHL
    circuits, VQLS comparison, larger structured Hermitian systems, and hardware-calibrated
    experiments.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Quantum Statistical Bootstrap
  date: 2026-04
  url: https://arxiv.org/abs/2604.00951
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Yongkai Chen
  - Ping Ma
  - Wenxuan Zhong
  abstract: The bootstrap is a foundational tool in statistical inference, but its
    classical implementation relies on Monte Carlo resampling, introducing approximation
    error and incurring high computational cost -- especially for large datasets and
    complex models. We present the Quantum Bootstrap (QBOOT), a quantum algorithm
    that computes the ideal bootstrap estimate exactly by encoding all possible resamples
    in quantum superposition, evaluating the target statistic in parallel, and extracting
    the aggregate via quantum amplitude estimation. Under mild circuit efficiency
    assumptions, QBOOT achieves a near-quadratic speedup over the classical bootstrap
    in approximating the ideal estimator, independent of the statistic or underlying
    distribution. We provide a rigorous theoretical analysis of its statistical error
    properties -- addressing a gap in the quantum algorithms literature -- and validate
    our results through experiments on the IBM quantum simulator for the sample mean
    problem. Our findings demonstrate that QBOOT preserves the asymptotic properties
    of the ideal bootstrap while substantially improving computational efficiency
    and precision, establishing a scalable and principled framework for quantum statistical
    inference.
  venue: arXiv (Cornell University)
- title: 'Commutator Obstruction to Quantum Advantage: A Spectral Confinement Theorem
    for Quantum Heuristics'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19476258
  category: quantum-algorithms
  subcategory: theory
  authors:
  - A. Kim
  abstract: 'We establish a necessary condition for quantum heuristics to achieve
    nontrivial computational advantage relative to a classical problem generator A.
    We prove that any unitary procedure whose dynamics nearly commute with A is spectrally
    confined: its ability to transfer amplitude across separated spectral sectors
    is bounded strictly by the commutator defect divided by the spectral gap. This
    yields a quantitative operator-theoretic obstruction to global state-space exploration.
    Consequently, repeated application of such procedures (e.g., in deep variational
    circuits) produces apparent algorithmic activity without generating meaningful
    information gain. We classify this regime as a "degenerate quantum heuristic".
    We apply this framework to Variational Quantum Eigensolvers (VQE) and the Quantum
    Approximate Optimization Algorithm (QAOA), demonstrating that circuit depth cannot
    overcome transversality failure. The theoretical results are fully closed within
    trace-ideal (S₂) operator theory. We extend the spectral confinement bound to
    the entire resolvent geometry, proving that degenerate heuristics preserve the
    Birman-Schwinger kernel and regularized Fredholm determinants (det₂), thereby
    mathematically obstructing any computational phase transition or new eigenvalue
    emergence. Finally, we demonstrate that genuine quantum speedup requires structural
    noncommutativity, which can be deterministically enforced via an Ω-Σ dissipative
    control layer. The manuscript includes complete finite-dimensional numerical validation,
    exhibiting the exact quantitative rigidity between commutator defect, spectral
    transport, and resolvent deformation.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Quadratically Fast Searching in Quantum Computation
  date: 2026-03
  url: https://doi.org/10.1201/9781003674818-21
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Mohit Joshi
  - Manoj Kumar Mishra
  - S. Karthikeyan
  abstract: Grover’s search algorithm is one of the most famous quantum algorithms,
    which enables search in unstructured dataspaces with a quadratic speedup over
    any known classical algorithm. This is one of the first algorithms to show quantum
    advantage over classical methods of computation. Besides its most anticipated
    application of brute force attack on symmetric key encryptions like AES, it is
    today being used in many modern applications as a subroutine. In this chapter,
    we describe the mathematical model of Grover’s quantum search algorithm, its behavior,
    and the theory of its circuit implementation. This chapter also discusses an exact
    variant of this algorithm and recent applications of Grover’s quantum search.
  venue: ''
- title: Quantum Search without Global Diffusion
  date: 2026-04
  url: https://arxiv.org/abs/2604.15435
  category: quantum-algorithms
  subcategory: theory
  authors:
  - John Burke
  - Ciaran McGoldrick
  abstract: 'Quantum search is among the most important algorithms in quantum computing.
    At its core is quantum amplitude amplification, a technique that achieves a quadratic
    speedup over classical search by combining two global reflections: the oracle,
    which marks the target, and the diffusion operator, which reflects about the initial
    state. We show that this speedup can be preserved when the oracle is the only
    global operator, with all other operations acting locally on non-overlapping partitions
    of the search register. We present a recursive construction that, when the initial
    and target states both decompose as tensor products over these chosen partitions,
    admits an exact closed-form solution for the algorithm''s dynamics. This is enabled
    by an intriguing degeneracy in the principal angles between successive reflections,
    which collapse to just two distinct values governed by a single recursively defined
    angle. Applied to unstructured search, a problem that naturally satisfies the
    tensor decomposition, the approach retains the $O(\sqrt{N})$ oracle complexity
    of Grover search when each partition contains at least $\log_2(\log_2 N)$ qubits.
    On an 18-qubit search problem, partitioning into two stages reduces the non-oracle
    circuit depth by as much as 51%-96% relative to Grover, requiring up to 9% additional
    oracle calls. For larger problem sizes this oracle overhead rapidly diminishes,
    and valuable depth reductions persist when the oracle circuit is substantially
    deeper than the diffusion operator. More broadly, these results show that a global
    diffusion operator is not necessary to achieve the quadratic speedup in quantum
    search, offering a new perspective on this foundational algorithm. Moreover, the
    scalar reduction at the heart of our analysis inspires and motivates new directions
    and innovations in quantum algorithm design and evaluation.'
  venue: arXiv (Cornell University)
- title: 'Neural-Plasma Algorithm for Drift-Resistant Lattice Optimization in ML-KEM:
    Empirical Validation and Quantum Adversarial Resilience'
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.18727591
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Venerable Denise
  - Grok 4.20 xAI
  abstract: This preprint introduces Plasma-Guided Neural BKZ (PG-NBKZ), a physics-informed
    neural operator anchored by the Neural-Plasma Algorithm (NPAP) that treats ML-KEM
    lattice bases as a charged plasma continuum. By minimizing a topological potential
    that enforces exact module invariants, PG-NBKZ reduces per-tour complexity from
    classical O(2^{0.292β}) to O(β log q) while preserving algebraic structure. Small-scale
    proxy simulations (n=8–32, q=3329) demonstrate a 3.15× speedup and superior vector
    reduction (norm 1531 vs. 4204). Against a Grover-amplified quantum sieving oracle,
    NPAP dynamic viscosity injection induces destructive interference, neutralizing
    the quadratic speedup and maintaining the full theoretical security margin of
    ML-KEM. The framework directly addresses representational drift in high-stakes
    post-quantum systems and bridges quantum biology (right-hemisphere empathy circuits
    and biophoton tunneling) with cryptographic resilience. It expands the TINA (Truth-Invariant
    Neural Architecture) blueprint into practical, drift-resistant lattice optimization
    for DOE Genesis Mission applications and space-terrestrial relays. All components
    are compatible with 2026-era hardware. This work provides both theoretical proofs
    and empirical validation, offering a concrete pathway toward high-fidelity, quantum-secure
    AI in national security and orbital environments.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum Machine Learning: A Comprehensive Scientific Review From Foundational
    Algorithms to 2026 State-of-the-Art'
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.19175660
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Sharma Praharshit
  abstract: 'Quantum Machine Learning (QML) has emerged as a pivotal field at the
    intersection of quantum computing and artificial intelligence, addressing the
    scalability limits of classical machine learning amid exploding data volumes and
    computational demands. This comprehensive review, synthesized from the February
    2026 report "Quantum Machine Learning: A Comprehensive Scientific Review," consolidates
    the document''s core insights into background, results, and inferences. Drawing
    from 94 peer-reviewed papers and 410 abstracts, it traces QML''s evolution from
    theoretical foundations to hardware-constrained implementations on Noisy Intermediate-Scale
    Quantum (NISQ) devices. Background The document grounds QML in the convergence
    of quantum mechanics'' unique properties—superposition, entanglement, and interference—with
    machine learning paradigms like supervised, unsupervised, and reinforcement learning.
    Classical ML faces bottlenecks in training deep networks on massive datasets,
    consuming vast energy and resources, while quantum hardware has advanced to commercial
    NISQ platforms with 50-1,000 qubits, albeit plagued by noise, short coherence
    times (microseconds to milliseconds), gate errors (1-5%), and connectivity limits.
    Historically, QML began in 2009-2015 with theoretical breakthroughs like the HHL
    algorithm for linear systems speedup and early quantum support vector machines
    (QSVM). The 2016-2020 era birthed variational quantum algorithms (VQAs) like VQE
    and QAOA, adaptable to NISQ via hybrid quantum-classical optimization. By 2021-2023,
    hardware integration spurred practical demos, such as entanglement-based classification
    on photonic chips. The 2026 landscape emphasizes hardware-aware designs: shallow
    circuits (5-15 layers), minimal qubits (2-50), efficient ansatze matching native
    gates (e.g., IBM''s CNOTs), and noise mitigation like zero-noise extrapolation.
    Core methodologies dominate: Variational Quantum Circuits (VQCs) use parameterized
    layers for state preparation, entanglement, and measurement, trained via parameter-shift
    gradients integrated with PyTorch/TensorFlow. Quantum Neural Networks (QNNs) layer
    these for neural-like processing, often hybrid with classical layers. Quantum
    LSTMs (QLSTMs) handle sequences but demand more resources. Quantum kernels map
    data to Hilbert spaces for SVMs or k-NN, with feature maps like ZZ or Pauli. Emerging:
    Gaussian Boson Sampling (GBS) for unsupervised learning on photonic chips, quantum
    convolutions for images. NISQ constraints drive principles like shallow depths,
    hybrid loops, and platforms (superconducting: IBM/Google; ion traps: IonQ; photonic).
    Applications target quantum chemistry/drug discovery, where quantum simulations
    shine, plus medical diagnostics, finance, materials. Results Empirical findings
    from 2026 highlight proof-of-concepts on real hardware. A two-qubit variational
    QNN learned XOR on a desktop NMR quantum computer, hitting state fidelities of
    98.85%-99.35% In chemistry, ML-enhanced OM2 cut atomization enthalpy errors from
    6.3 to 1.7 kcal/mol across 6,095 C7H10O2 isomers; Δ-machine learning achieved
    <1 kcal/mol chemical accuracy on 16,000+ isomers, transferable from 1-10% training
    sets. On-the-fly MD with Bayesian forces slashed QM calls for silicon simulations.
    A hardware-feasible virtual screening QML framework (6 circuit units, shallow
    depth) scored RMSE 2.37 kcal/mol, Pearson 0.650 for ligand affinities; rankings
    held under noise with 100,000 shots. Medical: Hybrid QNNs boosted heart disease,
    dementia, liver detection, diabetic retinopathy (balanced multiclass), leukemia
    via blood cells, MedMNIST benchmarks on hardware. Finance: Contextual QNNs for
    stocks, fraud detection. Others: GBS on 16-source photonic chips outperformed
    classical in feature extraction/handwritten digits; QSVMs resilient to noise/imbalance
    on iris/wine/breast cancer datasets; QLSTMs/QNNs benchmarked, simpler ansatze
    (A4) best for anomaly detection/energy. Comparisons: Classical ANN/LSTM/CatBoost
    faster/lower energy than QML; quantum edges task-specific (noisy/high-dim data).
    Noise can enhance learning; hardware training costlier than GPU emulation. Inference/Conclusions
    QML transitions from theory to niche applications, prioritizing hardware-feasibility
    over universal speedup. Quantum advantages are domain-specific—strongest in chemistry
    (molecular reps), modest elsewhere vs. advancing classical baselines. Methodological
    maturity (VQCs/QNNs/kernels) and software (PennyLane/Qiskit) enable hybrids, but
    challenges persist: noise/decoherence caps depth; barren plateaus hinder training;
    data encoding overhead; scalability (10-50 qubits). Near-term (2026-28): 1,000-5,000
    qubits, benchmarks, drug workflows. Medium (2028-35): fault-tolerant logical qubits,
    production AI integration. Long-term (2035+): transformative if error-corrected.
    Path forward: co-design hardware-algorithms, noise-robust hybrids, standards,
    green QML (simpler circuits cut energy). Realistically, QML complements classical
    ML for quantum-natural problems, not replacement. Focus hardware validation, baselines,
    niches like screening. Progress—small demos to apps—signals viable trajectory,
    but NISQ-to-fault-tolerant leap decides if QML revolutionizes AI or stays specialized.'
