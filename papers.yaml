- title: 'Quantum computing for natural language processing: a comprehensive review'
  date: 2026-07
  url: https://doi.org/10.1117/12.3119914
  category: survey
  subcategory: theory
  authors:
  - Ans Alghamdi
  abstract: The intersection of quantum computing and natural language processing
    (NLP) has emerged as a compelling research frontier, offering novel computational
    paradigms for linguistic tasks. This review provides a comprehensive survey of
    quantum natural language processing (QNLP), examining theoretical foundations,
    experimental implementations, and empirical results from 2010 to 2025. We trace
    the evolution from foundational compositional distributional categorical (DisCoCat)
    models to contemporary quantum neural network architectures implemented on noisy
    intermediate-scale quantum (NISQ) devices. Our analysis covers key application
    domains including text classification, sentiment analysis, question answering,
    and semantic similarity, synthesizing performance metrics across diverse experimental
    settings. We examine quantum-enhanced attention mechanisms, variational quantum
    circuits for word embeddings, and hybrid quantum-classical architectures. Importantly,
    we critically evaluate the current state of empirical validation, noting that
    most comparisons involve shallow classical baselines rather than state-of-the-art
    transformer models, and that the majority of experiments rely on quantum simulators
    rather than actual hardware with realistic noise characteristics. We also address
    fundamental challenges including quantum data encoding bottlenecks, the limitations
    of compositional models in capturing pragmatics and world knowledge, scalability
    constraints, hardware noise, and the barren plateau phenomenon. This review identifies
    gaps in current research and outlines trajectories toward practical quantum advantage
    in language processing.
  venue: ''
- title: 'Quantum-Accelerated Artificial Intelligence for Edge Devices: A Review of
    Encodings, Models, Hybrid Architectures, and NISQ-Era Realities'
  date: 2026-06
  url: https://doi.org/10.3390/electronics15132832
  category: survey
  subcategory: theory
  authors:
  - Rita Singh
  - Angel Deborah Suseelan
  abstract: 'Edge artificial intelligence (Edge AI) requires real-time inference under
    stringent constraints on computation, memory, energy, and connectivity. Although
    training can be offloaded to servers, efficient, high-capacity inference and rapid
    on-device adaptation remain central challenges. Cloud-based inference offers substantial
    computational power but depends on connectivity, latency, privacy, and reliability
    conditions that edge deployments cannot always guarantee. Classical model-compression
    methods—including quantization, pruning, distillation, and neural architecture
    search—have extended the feasibility of on-device inference, yet they leave largely
    unchanged the fundamental cost of the linear-algebraic, sampling, and optimization
    primitives that dominate modern deep learning. Quantum computing has therefore
    been proposed as a complementary accelerator for selected AI workloads, with theoretical
    advantages in linear systems, singular value decomposition, sampling, kernel evaluation,
    and optimization. This review surveys the emerging field of quantum-accelerated
    AI for edge systems under a hybrid architectural premise: edge devices remain
    classical, while quantum processors operate as remote, cloud, MEC, or near-edge
    accelerators. We synthesize advances across quantum learning models, hybrid optimization
    methods, hardware and deployment architectures, and quantum-inspired approaches
    suitable for constrained devices. We also assess the practical barriers that currently
    separate asymptotic quantum advantage from deployable edge intelligence, including
    data loading, measurement overhead, noise, latency, and benchmarking gaps. Finally,
    we outline a staged research roadmap from near-term hybrid workflows to fault-tolerant
    and integrated quantum-edge architectures.'
  venue: Electronics
- title: 'Quantum Computing: Today, Tomorrow, and the Future: A Comprehensive Survey
    of Foundations, Hardware, Algorithms, Markets, Education, and Careers'
  date: 2026-08
  url: https://doi.org/10.20944/preprints202608.0864.v1
  category: survey
  subcategory: theory
  authors:
  - Muhammad Saddam Khokhar
  - Misbah Ayoub
  - Zakria Jamali
  abstract: Quantum computing has moved from a theoretical curiosity to a strategic
    technological priority for governments, hyperscale technology companies, and a
    fast-growing ecosystem of specialized start-ups. This survey provides a comprehensive,
    self-contained overview of the field as it stands in 2026. We first lay out the
    physical and mathematical foundations of quantum computation, superposition, entanglement,
    interference, and measurement, and contrast them systematically with classical
    computing. We then survey the competing hardware modalities (superconducting,
    trapped-ion, photonic, neutral-atom, topological, and spin qubits) and the logic
    gates and circuit model that operate on them, before reviewing the canonical quantum
    algorithms that motivate the field. We classify the major computing paradigms
    (gate-based, annealing, adiabatic, measurement-based, and topological), and examine
    the current state of the market, the national strategies of leading countries,
    and the roles played by IBM, Google, Microsoft, Amazon, NVIDIA, and a cohort of
    pure-play companies. Dedicated sections map undergraduate and graduate education
    pathways, including specific universities offering quantum-focused degrees, the
    domains in which quantum computers are expected to create value, and the career
    paths now opening in the field. We close with an explicit three-phase roadmap
    \qtoday{}, \qtomorrow{}, and the \qfuture{} and a candid discussion of the open
    scientific and engineering problems that stand between the present noisy intermediate-scale
    quantum (NISQ) era and a fault-tolerant, utility-scale quantum computing industry.
  venue: Preprints.org
- title: 'Quantum Image Processing for Medical Image Analysis: A Comprehensive Literature
    Survey'
  date: 2026-04
  url: https://doi.org/10.1109/aimla67915.2026.11522292
  category: survey
  subcategory: theory
  authors:
  - K. L. Sujitha
  - Umamaheswaran S
  abstract: This literature review analyses the convergence of unsupervised learning
    and quantum image processing for medical imaging applications. It aims to look
    at advancements in quantum convolutional neural networks (QC-NNs), variational
    quantum algorithms (VQAs), quantum-enhanced neural architectures, and hybrid quantum-classical
    systems with a focus on image classification and enhancement. The goal of this
    project is to explore possible solutions for medical image analysis, so that it
    can be more accurate and efficient by using unsupervised learning and quantum
    computing frameworks. The survey explores how quantum-assisted workflows can enhance
    the images from medical images, providing new avenues to diagnosis and visualization.
    While the NISQ era is promising, the limitations of NISQ are not permitting full
    quantum advantage in clinical practice at this time. To augment medical imaging
    with quantum-assisted unsupervised learning, this study presents research gaps
    and a path forward.
  venue: ''
- title: 'QUANTUM MACHINE LEARNING IN HEALTHCARE: ACOMPREHENSIVE SURVEY OF RECENT
    ADVANCES'
  date: 2026-05
  url: https://doi.org/10.58532/nbennurambh4
  category: survey
  subcategory: theory
  authors:
  - P. Kranthi Kumar
  - Perla Abhishek
  - Deva Uma Devi
  abstract: Quantum machine learning (QML) has emerged as a transformative paradigm
    that leverages quantum mechanical phenomena superposition, entanglement, and quantum
    interference to enhance computational approaches in healthcare. This comprehensive
    survey systematically examines advances in QML for healthcare applications from
    2020 to 2025, analyzing cutting-edge algorithms, recent implementations, and emerging
    prospects across drug discovery, medical imaging, genomics, and clinical decision
    support. We review Quantum Support Vector Machines (QSVM), Variational Quantum
    Circuits (VQC), Quantum Neural Networks (QNN), and hybrid quantum-classical frameworks.
    Our analysis of 150+ recent publications reveals significant theoretical progress
    alongside persistent hardware constraints and algorithmic challenges. We provide
    a comprehensive taxonomy of QML algorithms, a comparative performance analysis
    against classical baselines, a detailed examination of NISQ-era limitations, and
    a technology roadmap spanning near-term hybrid approaches through long-term fault-tolerant
    quantum computing. This survey serves as an updated reference for researchers
    and practitioners navigating the rapidly evolving intersection of quantum computing
    and medical informatics.
  venue: ''
- title: 'A Survey on Resource Management in the Quantum Era: Taxonomy, Cross-Sectoral
    Applications, and Strategic Roadmap'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.21224183
  category: survey
  subcategory: theory
  authors:
  - Gopal K. Shyam
  - Ila Chandrakar
  abstract: 'Abstract: The accelerated development of quantum computing is offering
    new paradigms on how computationally intensiveproblems can be solved, which are
    beyond the feasibility bound aries of classical systems. Optimal quantum system
    operationin resources has thus become a research challenge of particular concern
    especially when considering hybrid quantum-classicalinfrastructure and near-term
    Noisy Intermediate-Scale Quantum (NISQ) devices. This survey is an overview of
    recent studies inthe area of quantum resource management, including more than
    40 academic articles published since 2015. This paper suggests a four-layer taxonomy,
    where hardware level (quantum resource, quantum memory, coherence time,and quantum
    memory), algorithm-level (quantum optimization algorithm: QAOA and VQE), system-level
    (scheduling, allocation,and hybrid cloud integration) and application-level (quantum
    resource, application domain) deployments are used to categorize quantum resource
    management mechanisms. Moreover, the survey reviews cross-sectoral uses of quantum
    computing inagriculture, healthcare, industrial optimization, and the systems
    of the public, which is a promising use of quantum-enableddecision support and
    large-scale optimization. In addition to a synthesis of the available studies,
    the paperreveals the major constraints associated with current methods such as
    difficulties in scalability, sensitivity to noise, and thelack of developed resource
    orchestration systems. On the basis of these observations, a research roadmap
    is suggested, whichrepresents how quantum resource management may evolve be yond
    NISQ-implementation-based approaches to scalable faulttolerant quantum infrastructures.
    The survey is expected to give a systematic view of the new quantum resource managementstrategies
    to the researchers and practitioners, and also display potential directions of
    future research.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum Computing Disruption in the Banking Sector: Empirical Analysis of
    Risks and Opportunities'
  date: 2026-05
  url: https://doi.org/10.55041/ijcope.v2i5.834
  category: survey
  subcategory: method
  authors:
  - Dr CHANDRA SEKHAR RAJANALA Dr CHANDRA SEKHAR RAJANALA
  abstract: 'Quantum computing (QC) stands at the forefront of a technological revolution
    poised to disrupt the global banking industry. By harnessing superposition, entanglement,
    and quantum interference, QC offers exponential or quadratic speedups for complex
    financial computations that challenge classical systems. This study provides a
    comprehensive empirical analysis of QC’s dual impact—transformative opportunities
    in portfolio optimization, risk modeling, derivative pricing, fraud detection,
    and Monte Carlo simulations, alongside substantial risks including cryptographic
    vulnerabilities (e.g., Shor’s algorithm threatening RSA/ECC), high capital costs,
    talent shortages, and NISQ-era noise limitations. Adopting a mixed-methods approach,
    the research integrates an extensive literature review, a survey of 120 banking
    and fintech professionals, expert insights, and hybrid quantum-classical simulations
    using frameworks like Qiskit and PennyLane on benchmark datasets (50–10,000 assets/scenarios).
    Findings indicate potential speedups of 20–30x in optimization and risk calculations,
    with 15–40% improvements in metrics such as Sharpe ratios and fraud detection
    accuracy. McKinsey projects $400–600 billion in annual value for finance by 2035,
    yet “harvest now, decrypt later” (HNDL) attacks pose systemic threats if post-quantum
    cryptography (PQC) migration lags. The study highlights hybrid approaches as the
    pragmatic near-term path and proposes a quantum readiness framework tailored for
    banks, with emphasis on emerging markets. Strategic recommendations address governance,
    investment prioritization, talent development, and regulatory collaboration. This
    research contributes actionable insights for bank executives, policymakers, and
    researchers navigating the quantum transition. Keywords: Quantum computing, banking
    disruption, portfolio optimization, risk management, post-quantum cryptography,
    hybrid quantum-classical systems, financial innovation, quantum readiness, empirical
    simulation'
  venue: International Journal of Creative and Open Research in Engineering and Management
- title: 'Backdoor Threats in Variational Quantum Circuits: Taxonomy, Attacks, and
    Defenses'
  date: 2026-06
  url: https://arxiv.org/abs/2605.13796
  category: survey
  subcategory: theory
  authors:
  - Lei Jiang
  - Fan Chen
  abstract: Variational quantum algorithms (VQAs) are a central paradigm for noisy
    intermediate-scale (NISQ) quantum computing, yet their reliance on predesigned
    and pretrained variational quantum circuits (VQCs) introduces critical security
    vulnerabilities, particularly backdoor attacks. These attacks embed hidden malicious
    behaviors that remain dormant under normal conditions but are activated by specific
    triggers, leading to adversarial outcomes such as incorrect predictions or manipulated
    objective values. This paper presents a survey of backdoor attacks in VQCs, covering
    data-poisoning, compiler-level, and quantum-native mechanisms. We formalize key
    terminology and threat models, and review existing attack strategies along with
    their empirical characteristics. We also analyze current detection and defense
    approaches, highlighting their limitations, especially against quantum-specific
    threats. By synthesizing recent advances, this survey outlines the evolving security
    landscape of VQCs and identifies key challenges and future directions for developing
    robust, quantum-aware defenses in hybrid quantum–classical systems.
