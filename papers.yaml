- title: A Survey on AI-Driven Threat Detection in Quantum Key Distribution Systems
    with Automated Response Mechanisms
  date: 2026-06
  url: https://www.ijert.org/a-survey-on-ai-driven-threat-detection-in-quantum-key-distribution-systems-with-automated-response-mechanisms
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Prof.  Mohini A.  Thorat
  - Janhvi Chavan
  - Anushka Kumbhar
  abstract: Quantum computing advancements pose a growing threat to conventional cryptographic
    systems based on com- putational hardness assumptions such as RSA and Elliptic
    Curve Cryptography. Quantum Key Distribution (QKD) has emerged as a theoretically
    secure alternative by leveraging the fundamental principles of quantum mechanics
    to establish shared secret keys between communicating parties. However, practical
    QKD deployments remain vulnerable to channel noise, hardware imperfections, side-channel
    attacks, and sophisticated intercept- resend strategies that exploit implementation
    weaknesses. Tra- ditional QKD security analysis relies on static Quantum Bit Error
    Rate (QBER) thresholds, which are insufficient for dis- tinguishing malicious
    eavesdropping from natural environmental disturbances. Recent advancements in
    artificial intelligence and machine learning have introduced intelligent anomaly
    detec- tion techniques capable of analyzing complex quantum channel behaviour
    in real time. This paper presents a comprehensive survey of AI-driven threat detection
    and response systems for quantum cryptographic networks. Various techniques including
    Random Forest classifiers, deep learning models, Support Vector Machines, and
    reinforcement learning-based adaptive response mechanisms are discussed along
    with their strengths and limita- tions. The paper also highlights major research
    challenges such as false-positive detection, computational overhead, hardware
    dependency, and limited integration of automated mitigation strategies. Furthermore,
    a conceptual multimodal framework combining IBM Qiskit-based BB84 simulation,
    machine learning- based threat classification, and automated Privacy Amplification
    is discussed as a promising solution for securing next-generation quantum communication
    infrastructures.
  venue: Open MIND
- title: 'AQCTCS: An Adaptive Quantum–Classical Trust-Based Secure Communication System'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20254920
  category: quantum-cryptography
  subcategory: method
  authors:
  - K. Sivasankar rao, M. Swagath Kumar, T. Shasi Kiran, R. Shanmuka Srinivas, Ms.
    D. Sasikala
  abstract: 'Abstract— The advancement of quantum computing presents significant risks
    to conventional cryptographic systems that secure modern communication networks.
    This paper proposes an Adaptive Quantum–Classical Trust Communication System (AQCTCS),
    a hybrid secure messaging framework designed to enhance resilience against both
    classical and quantum threats. The system integrates three security layers: AES-256
    for classical encryption, Post-Quantum Cryptography (PQC) for quantum-resistant
    protection, and a BB84-based Quantum Key Distribution (QKD) simulation for high-risk
    scenarios. A Trust Engine continuously evaluates security indicators, including
    anomaly detection parameters and Quantum Bit Error Rate (QBER), to compute a dynamic
    trust score. Based on this score, an Adaptive Security Controller automatically
    selects the appropriate encryption mode, balancing performance and security. The
    platform is implemented as a web application using React for the frontend, FastAPI
    for backend services, and Qiskit for QKD simulation. AQCTCS demonstrates an adaptive,
    scalable, and future-ready communication architecture suitable for post-quantum
    environments. Keywords— Quantum Key Distribution, Post-Quantum Cryptography, AES-256,
    Trust Engine, BB84 Protocol, Adaptive Encryption, Secure Messaging, QBER.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Quantum-enhanced Network Tomography
  date: 2026-04
  url: https://arxiv.org/abs/2604.25194
  category: quantum-information
  subcategory: method
  authors:
  - Yufei Zheng
  - Zihao Gong
  - Saikat Guha
  abstract: Network tomography refers to the use of inference techniques for inferring
    internal network states from end-to-end probes. Quantum probes, implemented by
    sending blocks of $n$ coherent-state pulses augmented with continuous-variable
    (CV) squeezing ($n=1$) or weak temporal-mode entanglement ($n>1$) over a lossy
    channel to a receiver with homodyne detection capabilities, are known to carry
    information about the channel transmissivity. Assuming a subset of nodes in an
    optical network is capable of sending and receiving such probes through intermediate
    nodes with all-optical switching capabilities, we leverage these quantum probes
    to estimate link transmissivities. To determine how to route the probes in a network,
    we propose a probe construction algorithm that guarantees link identifiability,
    while maximizing the number of information orthogonal sets of transmissivities.
    A set of probes induces a Fisher information matrix (FIM). We then derive two
    metrics, the determinant of the FIM and the trace of its inverse, to evaluate
    the performance of the probes. In particular, our results can be used to characterize
    the quantum improvement in estimating link transmissivities in a general optical
    network.
  venue: arXiv (Cornell University)
- title: Quantum Tomography and Entanglement in Semi-Leptonic $h\to VV^*$ Decays at
    Higher Orders
  date: 2026-04
  url: https://arxiv.org/abs/2604.16218
  category: quantum-information
  subcategory: development
  authors:
  - Dorival Gonçalves
  - Ajay Kaladharan
  - Alberto Navarro
  abstract: Angular correlations in Higgs decays to electroweak gauge bosons, $h \to
    ZZ^*, WW^*$, provide a powerful probe of both new physics effects and quantum
    information observables. We present a systematic study of semi-leptonic Higgs
    decays $h \to V V^* \to \ell^+\ell^- q\bar{q}$ and $\ell^\pm ν_\ell q\bar{q}'$,
    including finite final state fermion masses, NLO QCD, and NLO electroweak corrections.
    We show that finite final state quark masses can induce effects that go beyond
    the two-qutrit description in more inclusive regimes, while remaining controllable
    with suitable kinematic selections. QCD corrections lead to modest percent-level
    shifts, whereas electroweak corrections can significantly modify the angular structure,
    particularly in the $h\to ZZ^*$ channels. We assess the impact of these effects
    on the reconstructed density matrix and entanglement measures, finding that, although
    they modify the angular observables, the semi-leptonic channels are better approximated
    by a two-qutrit description than the fully leptonic decay $h\to e^+e^-μ^+μ^-$.
  venue: arXiv (Cornell University)
- title: 'Entanglement-Coupling Precursors of Decoherence in Quantum Circuits: A Heuristic
    Information-Theoretic Precursor Framework (KA-Quantum)'
  date: 2026-05
  url: https://doi.org/10.20944/preprints202605.0709.v1
  category: quantum-information
  subcategory: theory
  authors:
  - Hikmat Karimov
  - Rahid Zahid Alekberli
  abstract: 'Decoherence is the primary obstacle to reliable quantum computing, yet
    real-time, measurement-driven early warning remains unavailable. Standard metrics
    (fidelity, entanglement entropy) are computed post-hoc or require full state tomography.
    We propose KA-Quantum, a thermodynamic early warning framework grounded in the
    Karimov–Alekberli (KA) causal entropy formalism [1], monitoring three quantum
    channels: C1 (von Neumann entropy deviation), C2 (bipartite correlation entropy
    coupling decay), and C3 (fidelity residual). Using Qiskit Aer density-matrix simulation
    [2] of N=5 qubit circuits across three circuit classes (GHZ, random, variational)
    and three noise models (amplitude damping, phase damping, depolarizing; 30 Monte
    Carlo runs each, linearly increasing noise ramp), we find: 5 of 9 configurations
    achieve DR = 100% (30/30); overall DR = 56% (150/270) including physically non-decaying
    regimes where the specific noise type does not drive fidelity below the 0.9 threshold
    within the simulation window. FPR = 0.00 in all calibration periods. Median lead
    times of 1–15 gate cycles (F &amp;lt; 0.9); lead time is invariant to KA threshold
    θ (2.0/2.5/3.0 tested), confirming empirical threshold invariance [3]. The C2
    entanglement channel provides the earliest indicator, consistent with the structural
    coupling precursor that distinguishes KA across prior KA classical applications
    [4].'
  venue: Preprints.org
- title: Quantum Information Recovery from Hawking Radiation via Dual-Basis Fractal
    Tomography
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.18718721
  category: quantum-information
  subcategory: theory
  authors:
  - Adam L McEvoy
  abstract: '# Quantum Information Recovery from Hawking Radiation via Dual-Basis
    Fractal Tomography: Demonstrating Unitarity with the Fractal Correction Engine
    **Authors:** Adam L McEvoy**Date:** 2026 --- ## Abstract I present a quantum information-tracking
    black hole evaporation simulator that bridges full general relativistic (GR) Hawking
    radiation with quantum entanglement dynamics to demonstrate that information is
    not lost during black hole evaporation. The system emits individual Hawking quanta
    via GR-accurate Monte Carlo sampling with spin-dependent greybody factors, tracks
    entangled interior--exterior Bell pairs, models interior scrambling along infalling
    geodesics, and generates the Page curve with unitarity verification. We introduce
    a novel **dual-basis quantum tomography** method that applies the Fractal Correction
    Engine (FCE) bidirectionally to recover information encoded in complementary quantum
    observables. Where single-basis correlation analysis achieves $\sim$57% reconstruction
    confidence, the dual-basis approach combines four independent channels---amplitude,
    phase, interference, and time-reversed---to reach **85.2% reconstruction confidence**
    (1.5$\times$ improvement). The FCE improves unitarity conservation by 1.14--1.21$\times$
    through $\pi$-based fractal scaling and local curvature analysis applied to entropy
    signals. We validate the system with 27/27 tests passing across 9 analytic benchmarks
    and 6 observed astrophysical black holes (Cygnus X-1, M87*, Sgr A*, GW150914,
    GRS 1915+105, V404 Cygni). The key result: information about a black hole''s interior
    state is encoded in subtle correlations between successive Hawking quanta across
    complementary measurement bases, and is recoverable after the Page time through
    quantum state tomography enhanced by fractal signal analysis. **Keywords:** black
    hole information paradox, Hawking radiation, quantum entanglement, Page curve,
    unitarity, fractal correction, quantum tomography, greybody factors, scrambling,
    Kerr metric --- ## 1. Introduction ### 1.1 The Black Hole Information Paradox
    Hawking''s seminal 1975 discovery that black holes radiate thermally poses a profound
    challenge to quantum mechanics. If the radiation is exactly thermal, then the
    quantum state of infalling matter is irreversibly lost when the black hole evaporates---violating
    the unitarity of quantum mechanical time evolution. This apparent conflict between
    general relativity and quantum mechanics, known as the **black hole information
    paradox**, has driven four decades of theoretical work spanning string theory,
    holography, the AdS/CFT correspondence, and quantum gravity. The resolution, now
    widely accepted in the theoretical physics community, is that Hawking radiation
    is **not** exactly thermal. Subtle quantum correlations between successive Hawking
    quanta encode the interior state, with information becoming recoverable after
    the **Page time**---the halfway point of evaporation as measured by entropy. The
    entanglement entropy of the radiation field follows the **Page curve**: rising
    during early evaporation (each new quantum adds entanglement) then falling after
    the Page time (scrambled interior correlations begin to dominate). The total entropy
    $S_\text{BH} + S_\text{rad}$ is approximately conserved, and full unitarity is
    restored when the black hole completely evaporates. ### 1.2 Motivation Despite
    the theoretical consensus, no existing simulation simultaneously: 1. Generates
    physically accurate Hawking radiation using full GR greybody factors with spin-dependent
    back-reaction across multiple spacetime metrics2. Tracks individual quantum emissions
    as entangled Bell pairs with interior partners3. Models interior scrambling dynamics
    along geodesics with the correct fast-scrambling timescale4. Computes the Page
    curve from first-principles correlation matrices5. Reconstructs information from
    the radiation field using quantum state tomography This work builds on an existing
    full-GR black hole simulator validated against 6 astrophysical black holes (31/31
    tests, see companion paper [1]) and bridges it with quantum information tracking
    to create a unified system that demonstrates the resolution of the information
    paradox through simulation. ### 1.3 The Fractal Correction Engine The **Fractal
    Correction Engine (FCE)** is a universal signal analysis framework that operates
    on any orbit, wave, wavelength, or waveform. The FCE uses $\pi$ and local curvature
    to construct a fractal path identical to the observed path, enabling forward and
    backward time extrapolation and the mapping of wave interference structures. It
    operates through three core mechanisms: **$\pi$-Based Fractal Scaling.** Physical
    trajectories exhibit fractal self-similarity at multiple scales. For a signal
    prediction at step $n$, the fractal contribution scales as: $$\text{scale}(n)
    = \frac{\pi}{n + 1} \cdot e^{-n/\varphi}$$ where $\varphi = (1 + \sqrt{5})/2 \approx
    1.618$ is the golden ratio. This captures the self-similar decay of predictive
    power at progressively longer extrapolation horizons. **Local Curvature Analysis.**
    The FCE computes the extrinsic curvature of any 1D signal: $$\kappa = \frac{|x''''|}{(1
    + x''^2)^{3/2}}$$ and for 3D trajectories: $$\kappa_{3D} = \frac{|\mathbf{r}''
    \times \mathbf{r}''''|}{|\mathbf{r}''|^3}$$ These curvature measures detect deviations
    from smooth evolution, distinguishing physical curvature from numerical error.
    **Wave Interference Mapping.** Any periodic or quasi-periodic signal is decomposed
    via FFT into frequency harmonics, and the FCE maps constructive and destructive
    interference patterns between these harmonics, identifying beat frequencies, phase
    coherence, and resonance structures. In this work, the FCE is applied in a novel
    way: **bidirectional correction of entropy signals** to recover quantum information
    encoded in both the retarded (forward) and advanced (backward) propagator components
    of the radiation field. This is the first application of the FCE to quantum information
    conservation. ### 1.4 Scope and Contributions This paper presents: - A GR-accurate
    Monte Carlo Hawking emission engine with full greybody factors and back-reaction
    (Section 3)- Quantum entanglement tracking through $N \times N$ correlation matrices
    with physically-grounded correlation functions (Section 4)- Interior scrambling
    dynamics satisfying the fast-scrambling bound (Section 5)- Page curve generation
    with unitarity verification (Section 6)- **Dual-basis quantum tomography**: a
    novel reconstruction method combining amplitude, phase, interference, and time-reversed
    channels (Section 7)- FCE application to quantum information conservation (Section
    8)- Validation against 6 astrophysical black holes (Section 9) --- ## 2. Theoretical
    Framework ### 2.1 Hawking Radiation A black hole of mass $M$, angular momentum
    $J = aM$ (with dimensionless spin $a_* = a/M$), and charge $Q$ radiates with the
    Hawking temperature: $$T_H = \frac{\kappa}{2\pi}$$ where $\kappa$ is the surface
    gravity. For a Kerr black hole: $$\kappa = \frac{\sqrt{M^2 - a^2}}{2M\,r_+}, \qquad
    r_+ = M + \sqrt{M^2 - a^2}$$ In SI units: $$T_H = \frac{\hbar\,c^3}{8\pi\,G\,M\,k_B}
    \approx 6.2 \times 10^{-8}\left(\frac{M_\odot}{M}\right)\;\text{K}$$ The differential
    emission rate for a particle of spin $s$ in mode $(l, m)$ is: $$\frac{d^2 N}{dt\,d\omega}
    = \frac{1}{2\pi}\,\Gamma_s(\omega, l)\,\frac{2l + 1}{e^{\omega/T_H} \mp 1}$$ where
    $\Gamma_s(\omega, l)$ is the **greybody factor**---the transmission probability
    through the angular momentum barrier surrounding the black hole---and the $-$
    ($+$) sign applies to bosons (fermions). The greybody factor interpolates between
    the low-frequency absorption cross-section and the geometric optics limit: $$\Gamma_\text{low}
    \sim (\omega\,r_+)^2, \qquad \Gamma_\text{high} = 1 - e^{-\frac{27}{4}(\omega
    M)^2}$$ with a smooth interpolation: $$\Gamma_s(\omega) = (1 - w)\,\Gamma_\text{low}
    + w\,\Gamma_\text{high}, \qquad w = \frac{1}{1 + e^{-2(x - 1)}}, \qquad x = \frac{\omega}{\omega_\text{peak}}$$
    where $\omega_\text{peak} = 1/(2r_+)$. Spin-dependent suppression factors account
    for the higher angular momentum barrier for higher-spin particles: | Spin $s$
    | Species | Suppression Factor ||:--------:|---------|:-----------------:|| 0
    | Scalar | 1.0 || 1/2 | Neutrino | 0.5 || 1 | Photon | 0.25 || 2 | Graviton |
    0.01 | ### 2.2 Black Hole Thermodynamics and Back-Reaction The Bekenstein-Hawking
    entropy is: $$S_\text{BH} = \frac{A}{4\,l_P^2} = \frac{A}{4} \quad (\text{natural
    units})$$ where the horizon area for a Kerr black hole is: $$A = 4\pi(r_+^2 +
