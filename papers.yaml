- title: Measurement Strategies and Estimation Precision in Quantum Network Tomography
  date: 2026-05
  url: https://arxiv.org/abs/2511.01657
  category: quantum-information
  subcategory: theory
  authors:
  - Athira Kalavampara Raghunadhan
  - Matheus Guedes de Andrade
  - Don Towsley
  abstract: 'This work investigates measurement strategies for link parameter estimation
    in Quantum Network Tomography (QNT), where network links are modeled as depolarizing
    quantum channels distributing Werner states. Three distinct measurement schemes
    are analyzed: local Z-basis measurements (LZM), joint Bell-state measurements
    (JBM), and pre-shared entanglement-assisted measurements (PEM). For each scheme,
    we derive the probability distributions of measurement outcomes and examine how
    noise in the distributed states influences estimation precision. Closed-form expressions
    for the Quantum Fisher Information Matrix (QFIM) are obtained, and the estimation
    precision is evaluated through the Quantum Cramer-Rao Bound (QCRB). Numerical
    analysis reveals that the PEM scheme achieves the lowest QCRB, offering the highest
    estimation accuracy, while JBM provides a favorable balance between precision
    and implementation complexity. The LZM method, although experimentally simpler,
    exhibits higher estimation error relative to the other schemes; however, it outperforms
    JBM in high-noise regimes for single-link estimation. We further evaluate the
    estimation performance on a four-node star network by comparing a JBM-only configuration
    with a hybrid configuration that combines JBM and LZM. When two monitors are used,
    the JBM-only strategy outperforms the hybrid approach across all noise regimes.
    However, with three monitors, it achieves a lower QCRB only in low-noise regimes
    with heterogeneous links. The results establish a practical basis for selecting
    measurement strategies in experimental quantum networks, enabling more accurate
    and scalable link parameter estimation under realistic noise conditions.'
