- title: From Primitives to the Limits of Quantum Computation
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20145689
  category: quantum-hardware
  subcategory: theory
  authors:
  - Allen Proxmire
  abstract: 'Since the 1980s, quantum mechanics has been imagined as the basis for
    a new kind of computer. In 1994, Peter Shor proved that a sufficiently large quantum
    computer would break public‑key cryptography in polynomial time. In the four decades
    since, an industry has formed around building such machines: superconducting transmons
    at IBM and Google, trapped ions at IonQ and Quantinuum, photonic qubits at PsiQuantum
    and Xanadu, topological qubits at Microsoft, neutral atoms at QuEra and Atom Computing.
    The largest current devices have on the order of one thousand to ten thousand
    physical qubits, with substantial effort directed at error correction, isolation
    from environmental noise, and gate‑fidelity improvements. The question that hangs
    over the entire program is: how far can it go? Is there a structural ceiling —
    a fundamental, framework‑independent limit on the number of qubits that can be
    held in coherent superposition, or on the depth of circuits that can be executed
    before decoherence overwhelms the computation? Or is the limit purely engineering?
    Standard physics treats decoherence as environmental coupling, with quantum error
    correction sufficient (in principle) to tolerate finite decoherence rates below
    fault‑tolerance thresholds. This is a coherent picture but leaves a structural
    question unanswered: is the substrate of the universe indifferent to whether a
    system is in a coherent superposition, or does the substrate place its own constraints
    on coherent superposition — constraints that engineering cannot work around because
    they are not engineering problems? This walkthrough presents the Event Density
    framework''s answer. The substrate has finite local participation density, finite
    cross‑chain bandwidth, finite‑width V1 and V5 kernels, and primitive commitment‑irreversibility.
    These primitives are not silent on quantum computation; they jointly impose substrate‑level
    conditions on any system performing coherent quantum computation. The conditions
    are codified by Theorem UR‑1 (Unresolved‑Regime Characterization): bounded multiplicity,
    sustained cross‑chain bandwidth, and commitment‑injection below the individuation
    threshold. The conditions are jointly necessary and sufficient. Three substrate
    failure modes drive the three conditions to failure: premature individuation from
    environmental ED‑injection (F1), cross‑endpoint decoupling from Γ_cross collapse
    (F2), and commitment‑pressure cascade from accumulated P11 events (F3). Three
    architectural classes — Class A engineered‑low‑multiplicity, Class B global‑geometric‑rigidity,
    Class C high‑multiplicity‑redundancy — are exhaustive substrate‑permitted strategies.
    Meta‑architectures (error correction, dynamical decoupling, reservoir engineering,
    hybrids) are compositions over the three classes, not separate classes. The classes
    carry three sharp predictions. A Class A wall at the matter‑wave quantum‑classical
    boundary of 140–250 kDa molecular mass — currently 5–10 times beyond the largest
    demonstrated coherent superposition, with active experimental programs targeting
    that range. A Class B exponential coherence advantage in the topological‑protection
    regime, the substrate‑level reason topologically‑protected qubits (Majorana, Fibonacci
    anyons) outperform Class A qubits at sufficiently low temperatures. A Class C
    correlation‑budget plateau as the substrate‑level constraint on how far redundancy‑based
    architectures (large‑scale error correction, neutral‑atom arrays) can push qubit
    count before cross‑bandwidth saturates. The structural payoff: quantum computation
    has a substrate‑level architectural classification with falsifiable predictions,
    and the same substrate Γ_cross structure that produces black‑hole horizons and
    bipartite entanglement monogamy also produces the architectural classification
    of quantum‑computing platforms. The cross‑domain unification — quantum computing
    and black‑hole physics governed by the same substrate mechanism at scales separated
    by fifty orders of magnitude — is the framework''s strongest piece of cross‑platform
    mechanism identity.'
