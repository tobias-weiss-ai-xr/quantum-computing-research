  abstract: Quantum cryptography has emerged as a rapidly advancing field in recent
    years and represents one of the first practical applications of quantum physics
    beyond purely theoretical research. Despite its potential, current quantum cryptographic
    systems remain highly sensitive to noise. High- dimensional implementations offer
    a promising strategy to en- hance robustness. In this work, we investigate high-dimensional
    quantum key distribution protocols. Particular emphasis is placed on maritime
    communication scenarios, where harsh environ- mental conditions, atmospheric turbulence,
    and platform motion introduce significant noise and instability.
