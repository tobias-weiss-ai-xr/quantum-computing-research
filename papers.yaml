- title: 'Satellite-Based Quantum Communication: Performance Evaluation of Discrete-Variable
    Quantum Key Distribution Protocols'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09217
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Muskan
  abstract: Quantum Key Distribution (QKD) has emerged as a fundamentally secure approach
    to communication in the era of quantum computing, offering protection against
    threats posed to classical cryptographic schemes such as RSA and Diffie-Hellman.
    This thesis presents a comprehensive performance analysis of satellite-based QKD
    protocols, focusing on both prepare-and-measure and entanglement-based schemes
    under realistic atmospheric and operational conditions. The study begins by introducing
    the theoretical foundations of quantum communication, including qubits, entanglement,
    and quantum entropy, and motivates the need for satellite-based QKD to overcome
    the distance limitations of fiber-based systems. Subsequently, the thesis evaluates
    four prominent QKD protocols-BB84, B92, BBM92, and E91-using a circular beam propagation
    model that incorporates atmospheric effects such as diffraction, turbulence, attenuation,
    and pointing errors, along with environmental noise contributions for uplink and
    downlink. Comparative numerical simulations reveal that protocol performance is
    strongly influenced by channel asymmetries, beam propagation characteristics,
    and noise, providing guidance on optimal protocol selection for low Earth orbit
    (LEO) satellite links. The research further investigates high-dimensional (HD)
    QKD protocols, specifically HD-BB84 and HD-Extended B92, using the elliptic-beam
    approximation to account for turbulence-induced distortions for both uplink and
    downlink. Simulations under vary ing system dimensions, weather conditions, and
    zenith angles demonstrate that HD-BB84 achieves higher key rates, superior noise
    tolerance, and more favorable probability distributions of the key rate compared
    to HD-Extended B92, highlighting the advantages of high-dimensional encoding for
    robust satellite-based QKD.
  venue: arXiv (Cornell University)
- title: Quantum Key Distribution with Enhanced PQC Validation
  date: 2026-06
  url: https://doi.org/10.24818/issn14531305/30.2.2026.03
