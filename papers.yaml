  abstract: We develop new approximate compilation schemes that significantly reduce
    the expense of compiling the Quantum Approximate Optimization Algorithm (QAOA)
    for solving the Max-Cut problem. Our main focus is on compilation with trapped-ion
    simulators using Pauli- <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
