- title: Quantum Key Distribution (QKD) Enabled Secure Model Update Exchange in Federated
    Learning
  date: 2026-05
  url: https://doi.org/10.54392/irjmt26326
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Venkadeshan Ramalingam
  - Basant Kumar
  - S Jagadeesan
  abstract: Federated Learning (FL) allows the model to be trained cooperatively and
    retain the locality of data, but the exchange of model updates between dispersed
    clients and a central server can be compromised and manipulated. In this paper,
    a secure communication system of federated learning integrating quantum key distribution
    with the use of the BB84 protocol to enhance the establishment of secure keys
    is introduced. The suggested structure will achieve the use of QKD-generated symmetric
    keys along with classical cryptography tools to secure the privacy and integrity
    of model update messages. Federated learning communication and key generation,
    authentication, and encryption overheads are modeled at a system-level by developing
    a simulation environment. Parameters introduced to the simulation include the
    model update size, the number of clients, the communication latency and the cost
    of key refresh, which allows a more detailed examination of the system performance
    and feasibility. The findings show that the introduction of QKD is associated
    with limited and deterministic overhead on the communication latency and key management,
    and no convergence of the learning process is lost. This paper will concentrate
    on communication-layer security and will not consider the learning-layer threats
    e.g., adversarial model poisoning or client malicious behavior. These results
    show that quantum-secured key exchange can be integrated into federated learning
    systems and emphasize that it is a key enabling technology of secure communication
    in distributed learning systems in the future.
  venue: International Research Journal of Multidisciplinary Technovation
- title: 'Quantum Computing in Secure Communication: Challenges, Techniques, and Future
    Directions'
  date: 2026-04
  url: https://doi.org/10.36948/ijfmr.2026.v08i02.73550
  category: quantum-cryptography
  subcategory: theory
  authors:
  - A.V Krishna
  - V. Kumar
  - H. Sathish
  abstract: The emergence of quantum computing has introduced both opportunities and
    threats to modern secure communication systems. Classical cryptographic algorithms,
    which rely on computational complexity, are vulnerable to quantum algorithms capable
    of solving problems such as integer factorization and discrete logarithms efficiently.
    This paper explores the role of quantum computing in secure communication, focusing
    on quantum cryptographic techniques such as Quantum Key Distribution (QKD) and
    Quantum Secure Direct Communication (QSDC). A comprehensive review of existing
    literature is presented, followed by an analysis of methodologies used in quantum-secure
    communication systems. The study evaluates the advantages, limitations, and practical
    challenges of implementing quantum communication technologies. Finally, future
    research directions and the integration of quantum technologies into next-generation
    communication networks are discussed.
