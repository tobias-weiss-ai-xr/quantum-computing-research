- title: 'Entanglement and Wavefunction Collapse as Boundary-Persistence Phenomena:
    A Falsification Test Programme for Open Quantum Systems'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20560850
  category: quantum-information
  subcategory: theory
  authors:
  - Roberto Valtancoli
  abstract: 'This document formulates a pre-registered falsification programme for
    entanglement and wavefunction-collapse phenomenology in open quantum systems.
    The framework adopts a register-oriented convention: an entangled AB preparation
    is represented as a single non-factorisable boundary-informational unit, while
    A and B denote locally addressable access components used in the operational workspace
    for control, marginalisation, tomography, and state-level entanglement readout.
    Measurement is described as apparatus-channel activation of an addressed logical
    sector. This convention fixes the interpretation of the symbols, but the tests
    are stated entirely in terms of operational diagnostics. The core programme compares
    reconstructed open-system descriptions through irreversible entropy production,
    entropy flux, Landauer-deficit variables, dissipator-level synchronisation, non-Markovian
    memory response, entanglement-sudden-death threshold timing, and Sagawa–Ueda feedback-information
    saturation. Five pre-registered predictions are stated. P-EC1 tests the collective-versus-local
    Landauer-deficit ordering in a bright-sector Dicke benchmark. P-EC2 tests the
    finite-rate approach of an apparatus-channel deficit toward the readout-completed
    asymptote under continuous diffusive monitoring, formulated on a stationary-window
    ensemble estimator. P-EC3 tests the spectral dependence of the non-Markovian Landauer-deficit
    excess. P-EC4 compares the first concurrence zero-crossing (entanglement-sudden-death
    threshold) with thermodynamic relaxation timing. P-EC5 tests Sagawa–Ueda bound-saturation
    and saturation-curve behaviour under feedback information, including an operational
    proxy mapping for the Yada et al. iterative-feedback anchor. Each prediction is
    assigned a status in a decision tree with positive controls, quantitative windows,
    consistency bands, platform anchors, and explicit fail conditions. The programme
    distinguishes worked-case consistency checks from independent-platform primary
    falsification tests, and separates core falsification claims from near-future
    or conditional routes. A boundary-clock extension is also recorded as a non-conservative
    layer with its own handles; its near-dark chart-inversion observable, tracked
    by the bounded marker η_chart(t) and the integrated observable 𝐼ₖ₅, is reported
    as a conditional outlook, not as a core prediction. The document therefore does
    not claim to derive the Born rule, prove an ontology of collapse, or modify standard
    quantum mechanics. It asks whether a specific boundary-persistence architecture
    survives a set of pre-registered operational tests.'
