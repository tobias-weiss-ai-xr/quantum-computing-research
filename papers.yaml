- title: 'The Branch-Amplitude Discriminant: A Null Test of Measurement Dynamics with
    Imbalanced Logical GHZ States'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21823149
  category: quantum-hardware
  subcategory: theory
  authors:
  - Denis Bernard
  abstract: 'Abstract. Why a quantum measurement yields a single outcome has remained
    without direct experimental access for a century, largely because the question
    was considered interpretation-dependent and therefore untestable. We argue that
    the era of error-corrected logical qubits changes this status, and we identify
    the specific observable that makes it testable. First, we show that the postselection
    intrinsic to quantum error correction absorbs any event-level anomaly: hypothetical
    decision dynamics (objective collapse and allied mechanisms) can only manifest,
    on a logical register, through changes in functional laws rather than through
    individual events. Exactly two observables survive this filter — the coherence
    decay rate of a logical Greenberger-Horne-Zeilinger (GHZ) state and the syndrome
    acceptance rate. Second, we show that standard quantum mechanics predicts both
    observables to be strictly independent of the branch-amplitude imbalance w = |α|²
    − |β|² of the GHZ state, for all local Markovian noise channels. Third, a systematic
    inventory of the published record — spanning trapped ions, neutral atoms, superconducting
    and photonic platforms — shows that this imbalance has never been varied in any
    GHZ experiment, physical or logical. The amplitude axis of measurement dynamics
    is therefore experimentally virgin. Fourth, we specify a null-test protocol that
    requires only machine time on existing hardware: parity-oscillation scans at five
    imbalance values on logical GHZ states of N = 16 to 94 qubits, with and without
    postselection, at roughly 10⁴ shots per point, reaching slope sensitivities of
    about 10 % of the coherence decay rate and about 1 % absolute on the acceptance
    rate. A measured zero slope bounds all amplitude-coupled decision dynamics at
    values of N never before probed; a nonzero slope would constitute the first measured
    deviation from standard quantum dynamics on a macroscopic entangled register.
    We delineate precisely what such a test can and cannot decide, including a rigorously
    established indiscernibility class (Everett-type, hidden-variable, and retrocausal
    accounts) that no experiment of this kind can separate. The protocol is offered
    to all interested laboratories; its cost is machine time, not development. Preprint
    intended for journal submission (Phys. Rev. A / PRX Quantum). Companion record
    to OCU-IPC V10 (same Zenodo account). The enumeration programs referenced in Appendices
    A and B are included in this record. Contact: Denis Bernard phyborder838@gmail.com'
