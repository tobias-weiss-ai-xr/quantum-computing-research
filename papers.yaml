- title: Partially device-independent quantum cryptography in asymmetric networks
  date: 2026-06
  url: https://doi.org/10.1103/53w8-6v5z
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Jun-Hao Wei
  - Shu-Ming Hu
  - Nuo-Ya Yang
  abstract: Quantum key distribution (QKD) enables secure key generation between distant
    users, yet its standard device-dependent implementations rely on fully characterized
    and accurately modeled devices. Device-independent (DI) QKD removes this assumption
    by certifying privacy solely from Bell inequality violations, but its stringent
    experimental demands severely hinder scalability. In realistic quantum networks,
    asymmetric levels of device trust can naturally arise from diverse implementation
    conditions across nodes. Motivated by this, we investigate partially DI scenarios
    in which only a subset of parties operate trusted devices. Built upon the Brown-Fawzi-Fawzi
    method [], we employ a semidefinite programming hierarchy tailored to estimate
    the conditional von Neumann entropies in such settings. This approach provides
    efficiently computable lower bounds on asymptotic rates of cryptographic protocols
    with broad applicability. By reexamining representative bipartite and tripartite
    communication tasks under the partially DI framework, we demonstrate that enforcing
    trust on the devices of a subset of parties never degrades key or randomness expansion
    rates and, in certain cases, can substantially increase them owing to the network
    asymmetry. Our results highlight the impact of device trustworthiness on cryptographic
    security and facilitate scalable implementations in practical asymmetric network
    architectures.
  venue: Physical Review Research
- title: 'A COMPREHENSIVE REVIEW OF QUANTUM CRYPTOGRAPHY: PRINCIPLES, PROTOCOLS, AND
    PRACTICAL CHALLENGES'
  date: 2026-06
  url: https://doi.org/10.58532/nbennurissdb3p3c1
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Pagalla Bhavani Shankar
  - Babu Reddy Mukkamalla
  - Mullangi David
  abstract: The quantum cryptography approach is a significant change in secure communication
    in the sense that quantum cryptography bases its security on the law of quantum
    physics as opposed to computation difficulty. With classical encryption methods
    rapidly losing their resistance to the power of the underlying computers as well
    as the expected possibilities of the quantum computers, quantum cryptography comes
    into the limelight as a possible method of securing information in the long term.
    The paper is a detailed and systematic review of quantum cryptography along with
    the fundamentals of this practice, the way it works, and its practical implementation.
    It describes the ability of quantum phenomena to be unique (including superposition,
    uncertainty, and disturbance of measurement) and able to secure a key exchange
    as well as ensure any attempt of eavesdropping would be automatically noticed.In
    the review, the authors mainly discuss quantum key distribution (QKD) protocols,
    their functioning principles, security assurances, and the benefits of quantum
    over classical key exchange schemes. Besides that, the paper critically evaluates
    the real issues surrounding the implementation of quantum cryptographic systems
    such as hardware limitations, transmission range, environmental noise, and compatibility,
    to existing compatibility infrastructures. Recent advances in the field of experiments
    and pilot implementations are presented to determine the maturity of new technologies,
    and their suitability to be used on a large scale. Through its analytical review
    of theoretical assets, as well as practical constraints, this paper offers a definite
    and equalist view of the state of quantum cryptography today and also explains
    the research priorities important in its scale, moving away of the test production
    systems to the dependable and extensive security measures.
  venue: ''
- title: 'Privacy-preserving cloud-based dermatological image processing for medical
    applications: a review'
  date: 2026-03
  url: https://doi.org/10.1186/s13677-026-00886-6
  category: quantum-cryptography
  subcategory: method
  authors:
  - Siyan Chen
  - Xueer Zhang
  - E. Liu
  abstract: Dermatology increasingly relies on large-scale, high-resolution imaging
    data for the diagnosis and management of skin diseases. Cloud computing offers
    a flexible, scalable, and cost-effective infrastructure to meet these computational
    and data-intensive demands. By enabling the deployment of deep learning models
    and teledermatology services, cloud platforms support rapid analysis of skin lesion
    images, remote consultations, and global research collaboration, thereby enhancing
    efficiency and expanding access to care. Despite these benefits, the integration
    of cloud technologies introduces critical challenges in privacy, security, and
    regulatory compliance. Sensitive imaging data often contain personally identifiable
    information, making them vulnerable to breaches and misuse if not properly safeguarded.
    Addressing these risks is essential for maintaining patient trust and meeting
    requirements under Health Insurance Portability and Accountability Act (HIPAA)
    in the United States and the General Data Protection Regulation (GDPR) in the
    European Union, and similar frameworks. This review provides a comprehensive overview
    of cloud-based dermatological imaging with a focus on privacy protection. We examine
    key applications, identify major challenges and remedies such as data security,
    latency, and governance, and highlight emerging solutions including hybrid edge–cloud
    models, blockchain integration, privacy-preserving artificial intelligence, the
    Internet of Things-Driven Skin Detection device and synthetic data generation.
    In particular, we discuss the emerging role of hybrid quantum–classical computing
    (HQCC) as a cloud-native paradigm that addresses both computational scalability
    and security constraints. By offloading optimization-intensive tasks to cloud-accessible
    quantum processors while retaining sensitive image data at local or edge nodes,
    HQCC enables quantum-accelerated analysis without exposing raw medical images.
    Furthermore, the integration of quantum cryptography, such as quantum key distribution,
    provides information-theoretic security for federated learning and inter-institutional
    communication.
  venue: Journal of Cloud Computing Advances Systems and Applications
- title: INTEGRATION OF QUANTUM KEY DISTRIBUTION INTO NEXT-GENERATION TELECOM SYSTEMS
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19450362
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Ergashova Durdona Khusniddin kizi
  abstract: As quantum computing threatens to compromise classical cryptographic systems,
    the need for future-proof, information-theoretically secure methods of communication
    has become critical. Quantum Key Distribution (QKD) leverages the fundamental
    principles of quantum mechanics to enable the secure generation and exchange of
    encryption keys, immune to computational attacks. This paper investigates the
    integration of QKD into telecom infrastructures to enable ultra-secure communication.
    We examine the performance of key QKD protocols, such as BB84 and E91, over fiber-optic
    and free-space channels, and simulate their deployment within realistic metropolitan
    network topologies. Results show that secure key rates of up to 10 kbps can be
    maintained over 50–80 km fiber links with Quantum Bit Error Rates (QBER) below
    5%. The study also explores architecture models based on trusted relay nodes and
    WDM coexistence, highlighting practical deployment considerations. Our findings
    suggest that QKD is a viable enhancement for telecom security and a necessary
    foundation for long-term quantum-resilient communication systems.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: State-of-the-Art in Quantum Key Distribution for Next-Generation Wireless
    Networks
  date: 2026-04
  url: https://doi.org/10.1080/03772063.2026.2637621
  category: quantum-cryptography
  subcategory: method
  authors:
  - Shruti Rupa Singh Parmar
  - Naman Garg
  - Ankur Kumar
  abstract: By leveraging the fundamental principles of quantum mechanics, quantum
    cryptography represents a paradigm shift in secure communication by providing
    information-theoretic security, where any eavesdropping attempt can be intrinsically
    detected, and by offering resistance to computational attacks, including those
    posed by future quantum computers that threaten classical cryptographic schemes.
    To establish Quantum Key Distribution (QKD) as a significant tool in cybersecurity,
    this study examines the foundational principles of quantum cryptography, focusing
    on quantum algorithms, quantum bits, and quantum gates. We examine the fundamental
    QKD protocols and conduct a comparative study of prominent QKD protocols, including
    BB84, B92, E91, B92, SARG04, COW, Continuous Variable, Six State, Device Independent,
    and advanced protocols such as MDI-QKD and Twin-Field QKD, to evaluate key rate,
    distance, and security parameters. A systematic review of the literature has been
    conducted on the evolution of QKD protocols and networks, QKD integration with
    advanced technologies like blockchain, IoT, and machine learning, and the practical
    deployment of quantum communication is studied in this paper. The integration
    of AI and ML into QKD systems is investigated to explain future algorithm development
    and performance improvements. Also the function of QKD in quantum networks and
    the Internet of Things (IoT) is assessed. This paper further delves into the operation
    of quantum networks, detailing the roles of quantum relays, routers, repeaters,
    and Free Space Optics (FSO) in enhancing the efficiency and scalability of QKD.
    Assessing simulators such as SimulaQron, Qiskit, QuNetSim, and QKDNetSim, offering
    a perception into experimental implementation and protocol validation, resolves
    the difficulties in quantum-secured communication systems. At last, some security
    threats are discussed, including Laser damage, Trojan horse attacks, photon-number
    splitting, and detector blinding, for mitigation of risk strategies. Overall,
    this work contributes to the importance of QKD and quantum networks in shaping
    the future of secure wireless communication.
  venue: IETE Journal of Research
- title: Quantum-Powered Cryptographic Enhancements through Hybrid Approaches in Network
    Security
  date: 2026-03
  url: https://doi.org/10.1201/9781003674818-25
  category: quantum-cryptography
  subcategory: theory
  authors:
  - S. Thangam
  - Himanshu Shekhar
  - Lakshmi Chandrakanth Kasireddy
  abstract: Digital communication development creates an increasing threat to data
    security because emerging quantum computing technologies easily overcome traditional
    methods of encryption. A security system that integrates traditional encrypting
    with quantum computing methods shows promise for enhancing safety of networks
    mechanisms. The Hybrid Quantum Classical–Advanced Encryption System (HQC–AES)
    integrates the safe symmetrical functionality of the Advanced Encryption Standard
    (AES) with Quantum Key Distribution (QKD) procedures, specifically BB84 and E91,
    to ensure quantum resiliency. A secure key exchange together with real-time eavesdropper
    detection becomes possible through this combined approach, which maintains data
    confidentiality at a high level. A synthesis of post-quantum cryptography methods,
    such as Kyber and Falcon, safeguards traditional ways of communicating alongside
    quantum structures that lack comparability. The HQC–AES model provides solutions
    to three key cryptographic problems including secure key handling and distribution
    as well as encrypted transmission and long-term protection. Quantum mechanics
    enables protection enhancement for both conventional and quantum-based attacks
    by integrating it with advanced classical encryption methods. Theoretically, simulators
    and models show that the hybrid model maintains the technical agility of networks
    via several networked connections while simultaneously securing the reliability
    of data. The architecture delivers scalable security features to protect high-security
    cloud applications and financial systems and Internet of Things (IoT) resources
    by ensuring paramount secure communication capabilities. In safeguarding the transfer
    of data across several network circumstances, the suggested HQC–AES approach attained
    an overall accuracy of 98.7%. The fact that it is resistant to both conventional
    and quantum-based assaults and manages to keep data secure and intact is reflected
    in its excellent accuracy.
  venue: ''
- title: 'IPsec based on Quantum Key Distribution: Adapting non-3GPP access to 5G
    Networks to the Quantum Era'
  date: 2026-03
  url: https://arxiv.org/abs/2603.24426
  category: quantum-cryptography
  subcategory: method
  authors:
  - Asier Atutxa
  - Ane Sanz
  - Eire Salegi
  abstract: The advent of quantum computing will pose great challenges to the current
    communication systems, requiring essential changes in the establishment of security
    associations in traditional architectures. In this context, the multi-technological
    and heterogeneous nature of 5G networks makes it a challenging scenario for the
    introduction of quantum communications. Specifically, 5G networks support the
    unification of non-3GPP access technologies (i.e. Wi-Fi), which are secured through
    the IPsec protocol suite and the Non-3GPP Interworking Function (N3IWF) entity.
    These mechanisms leverage traditional public key cryptography and Diffie-Hellman
    key exchange mechanisms, which should be updated to quantum-safe standards. Therefore,
    in this paper we present the design and development of a Quantum Key Distribution
    (QKD) based non-3GPP access mechanism for 5G networks, integrating QKD keys with
    IPsec tunnel establishment. Besides, we also demonstrate the feasibility of the
    system by experimental validation in a testbed with commercial QKD equipment and
    an open-source 5G core implementation. Results show that the time required to
    complete the authentication and IPsec security association establishment is 4.62%
    faster than traditional cryptography PSK-based systems and 5.17% faster than the
    certificate-based system, while ensuring Information-Theoretic Security (ITS)
    of the QKD systems.
  venue: arXiv (Cornell University)
- title: 'Key parameters of single photon receivers and sources for fi ber-optic quantum
    cryptography systems: parameter analysis and measurement methods'
  date: 2026-05
  url: https://doi.org/10.32446/0368-1025it.2026-2-58-70
  category: quantum-cryptography
  subcategory: theory
  authors:
  - С.Б. Бычков
  - I. S. Korolev
  - S. V. Tikhomirov
  abstract: The development of fi ber-optic communication and data transmission systems
    gives rise to a number of new challenges, among which information protection against
    unauthorized access is of particular relevance. In response to this need, quantum
    cryptography has emerged – optical cryptographic systems with quantum key distribution.
    Such systems protect communication channels by encrypting data with a one-time
    secret key. The theoretical foundation guaranteeing secure key transmission relies
    on the Heisenberg uncertainty principle and the no-cloning theorem for quantum
    states of elementary particles. However, real-world quantum cryptography systems
    exhibit vulnerabilities stemming from imperfections in their components. Single
    photon detectors and single photon sources are critical elements of quantum key
    distribution systems. This work analyses the main types of attacks on quantum
    cryptography equipment and identifi es the key parameters of single photon sources
    and single photon detectors. Knowledge of their actual values can be crucial for
    proving a system’s resilience against attacks. Additionally, the paper describes
    the equipment and methods used to study single-photon sources. The study also
    describes the method and results of investigating the quantum effi ciency and
    false trigger probabilities of gated single-photon detectors with fi ber input.
    The described measurement methods are harmonized with the recommendations of the
    European Telecommunications Standards Institute. Together, the described measurement
    techniques and setups enable the assessment of single photon source and detector
    parameters during expert evaluation of quantum cryptography system vulnerabilities.
    The paper concludes with a call for the establishment of a reference database
    to support metrological assurance of key parameters for single photon sources
    and receivers, in order to advance quantum cryptography systems
  venue: Izmeritel`naya Tekhnika
- title: 'Power Network SCADA Quantum Communications: A Comparison of BB84, B92, E91,
    and SGS04 Quantum Key Distribution Protocols'
  date: 2026-03
  url: https://arxiv.org/abs/2603.01060
  category: quantum-cryptography
  subcategory: method
  authors:
  - Hillol Biswas
  - Kyriakos E. Zoiros
  abstract: The current state, emerging trends, and practical challenges of optical
    fiber-based power network SCADA quantum communication must be addressed to fully
    utilize the technological platform's potential in real-world power system SCADA
    communications involving massive volumes of real-time data, as well as in managing,
    encoding, and applications such as quantum cryptography. Quantum key distribution
    (QKD) is an essential part of the cybersecurity paradigm for quantum communication.
    Even though quantum computing with individual circuits yields probabilistic outcomes
    for the problem at hand, real-world datasets are complex and challenging to handle,
    even with telemetry. When using the cybersecurity triad of availability, confidentiality,
    and integrity (CIA) in reverse order (AIC), availability is given priority in
    electric power networks. This research assesses the use of the BB84, E91, B92,
    and SARG04 cryptographic protocols by applying them to large, multivariate power-system
    SCADA datasets and comparing the outcomes. By leveraging the variety of QKD protocols
    available with quantum electronics hardware, this simulation work provides a promising
    avenue for developing implementable frameworks and deploying SCADA/PMU networks
    in actual power systems.
  venue: arXiv (Cornell University)
- title: 'Q-IoTGuard: Lightweight Quantum Cryptographic Protocols for Resource-Constrained
    IoT Devices'
  date: 2026-05
  url: https://doi.org/10.1109/icicv68925.2026.11554871
  category: quantum-cryptography
  subcategory: theory
  authors:
  - K.Malarkodi
  - G.Sheeba
  - Sarumathi S
  abstract: The explosion of constrained IoT devices with limited resources has increased
    the necessity of having efficient security measures to counter both the classical
    and new quantum threat. In this paper, we introduce Q-IoTGuard, a simple quantum
    cryptography platform that can be used in heterogeneous IoT networks. The model
    combines entanglement-assisted quantum key distribution (QKD) with lattice-based
    post-quantum encryption (PQC) in order to guarantee secure communication with
    a minimum of computational and energy overhead. The methodology commences with
    data preprocessing, in which the traffic of IoT and characteristics of the devices
    are organized, standardized and filtered in order to support the efficient cryptographic
    operations. Raw data is first fed into quantum-assisted key generation with simplified
    BB84 protocols with error correction and privacy amplification. Lightweight PQC
    encrypts then message providing resistance against quantum-enabled attacks. The
    simulation outcomes show that Q-IoTGuard has a low-key generation time, low latency,
    low-energy consumption, and high quantum attack resistance among sensors, actuators,
    and gateway devices. The flow-based architecture, which incorporates preprocessing,
    key gen, and lightweight encryption would make the framework practical to be deployed
    on resource-constrained IoT devices. Q-IoTGuard is a new scalable and energy-efficient
    system of securing next-generation IoT networks that addresses the gap between
    theoretical quantum security and the practical implementation.
  venue: ''
- title: Security Analysis of the BB84 Quantum Key Distribution Protocol Using Qiskit
  date: 2026-03
  url: https://doi.org/10.1109/icdcs68853.2026.11510985
  category: quantum-cryptography
  subcategory: method
  authors:
  - Tushar Kumar Chauhan
  - Sharon Rose J
  - Rinisha Jeshni K
  abstract: The rapid progress of quantum computing demands secure communication protocols
    which are beyond classical cryptographic techniques. This necessity of Quantum
    Key Distribution (QKD) is met by providing security relying on the fundamental
    laws of quantum mechanics. In the work presented, the BB84 protocol is implemented
    using Qiskit platform provided by IBM. The performance is analyzed for both the
    ideal channel conditions and an intercept–resend eavesdropping scenario studying
    its security behavior and performance. 100% key agreement is observed with a QBER
    of 0% for the BB84 protocol executed under the ideal condition. When an eavesdropper
    is introduced, the QBER increases significantly, ranging from 16% to 38%, exceeding
    the acceptable security threshold of 11% and resulting in complete rejection of
    the generated key. Performance analysis carried out for key sizes between 100
    and 1000 qubits shows that the execution time follows O(n) trend growing linearly.
    This simulation validates the correct operation of the BB84 protocol and demonstrates
    a detailed performance and security analysis of a QKD system using IBM Qiskit.
  venue: ''
- title: Enhancing Security in the Smart IoT Systems Using Post‐Quantum Cryptographic
    Block Cipher
  date: 2026-05
  url: https://doi.org/10.1002/9781394347070.ch22
  category: quantum-cryptography
  subcategory: method
  authors:
  - A. Sasikumar
  - Logesh Ravi
  - Malathi Devarajan
  abstract: Industrial Internet of Things networks have expanded thanks to advancements
    in artificial intelligence and computing at the edge. In this era of Industry
    4.0, innovations such as intelligent production and autonomy in decision-making
    are thriving. Referred to as cyber physical systems, they are more vulnerable
    than ever before because of the increased power consumption and Internet connectivity
    of edge devices. Quantum key distribution (QKD) is the math and science of performing
    cryptographic operations and generating a private key; in this research, we will
    utilize the IoT in conjunction with the block cypher RC6 method. Additionally,
    it is necessary to address the issue of data loss caused by noise or external
    drivers during the data change in quantum cryptography. To achieve this, the most
    effective approach is to employ the quantum bit error rate (QBER) to create a
    more secure method of quantum communication among IoT devices. Therefore, this
    chapter introduces a new post-quantum cryptography (PQC) technique to improve
    the privacy measure in IoT communication. In this context, robust IoT devices
    are concerned with intelligent gadgets like smartwatches, safety systems, and
    cellphones. The PQC block cipher algorithm encrypts data and implements QBER;
    one system sends a key to another system for decryption. When we generate a secret
    key, we must determine the quantum accurate chance by comparing it to a threshold
    that the servers have agreed upon.
  venue: ''
- title: A Quantum Assisted Secure Data Transmission Architecture for Hybrid Classical
    Quantum Communication Systems
  date: 2026-03
  url: https://doi.org/10.1109/icesic67389.2026.11496436
  category: quantum-cryptography
  subcategory: theory
  authors:
  - C. Gowdham
  - T Godhandaraman
  - K. Vengatesan
  abstract: In this growing world of cloud computing and the Internet of Things (IoT),
    holistically, security becomes a growing challenge today- the classical cryptographic
    systems and technologies are being overshadowed by quantum computing. Quantum
    Key Distribution (QKD) systems have always been irrelevant so far as they are
    too expensive and have difficult hardware requirements and also don’t scale up.
    We, therefore, took up this research to get some kind of quantum technology to
    be used in secure data transmission. The project further states that provided
    the quantum assurance of the key generation upon which you could share classical
    data loss lessly with symmetric encryption means to prevent all kinds of quantum
    and classical eavesdropping challenges; the project also provides quantum key
    distribution technologies but only on a situational basis. The results show that
    the present measures outperform tested conventional and quantum cryptographic
    systems in terms of key entropy-for immunity to attacks based on quantum theory,
    which appears to be higher throughput than the present cryptographic systems.
    The whole conclusion is that a security system using quantum technology would
    provide communication channel security without full-scale deployment of quantum
    communication systems.
  venue: ''
- title: Securing Swarm Robotics Communication Using Quantum
  date: 2026-07
  url: https://doi.org/10.4018/979-8-3373-3857-6.ch012
  category: quantum-cryptography
  subcategory: method
  authors:
  - Qurat Ul Ain Zam Zam Mirza
  - Humaira Ashraf
  - Rimsha Kanwa
  abstract: 'As swarm robotics evolves into a paradigm-shifting approach for distributed
    autonomous systems, communication vulnerabilities pose risks in hostile environments.
    Conventional cryptography is limited by decentralized nature, energy constraints,
    and node density, while quantum computing threatens public-key encryption via
    Shor''s algorithm. This chapter explores Quantum Key Distribution (QKD) and entanglement-based
    networking for information-theoretic security. We examine mobile quantum networks,
    highlighting drone-based relays and satellite links. Beyond security, quantum
    principles like superposition and entanglement can enhance swarm intelligence,
    task allocation, and coordination. Despite promising validations, hurdles remain:
    SWaP constraints, atmospheric interference, and mobility-induced decoherence.
    Through case studies in aerial, maritime, space, and disaster domains, we propose
    a quantum-native architecture integrating post-quantum cryptography, adaptive
    PAT systems, and hybrid trust models for mission-critical resilience.'
  venue: Advances in computational intelligence and robotics book series
- title: Quantum Safe Cryptographic Frameworks for Securing National Digital Currencies
    and Economic Infrastructure
  date: 2026-02
