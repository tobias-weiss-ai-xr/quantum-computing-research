  abstract: This paper presents a Secure Quantum Communication Architecture based
    on Quantum Key Distribution (QKD) using the BB84 protocol. The system demonstrates
    secure key generation, quantum encoding, transmission, measurement, and eavesdropping
    detection using a simulation-based approach. The proposed architecture highlights
    the effectiveness of quantum cryptography in ensuring secure communication against
