    ### 2.3 The Page Curve and Information Recovery The **Page time** marks the transition
    point where entanglement entropy of the radiation begins to decrease: $$t_\text{Page}
    = \frac{M_0^3}{3\alpha}\left(1 - 2^{-2/3}\right) \approx 0.37\,t_\text{evap}$$
    The Page curve describes the entanglement entropy of the radiation field: $$S_\text{rad}(t)
