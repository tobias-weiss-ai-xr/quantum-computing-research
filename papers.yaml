  - Jay Deshmukh
  - Srijita Das
  - Binoy Nambiar
  abstract: Enhancing qubit connectivity in quantum processors is an important milestone
    for more efficient implementation of algorithms and novel error-correction protocols.
    While all-to-all connectivity has been demonstrated in quantum processors based
    on ion traps and neutral atoms, the exploration of enhanced connectivity in the
    superconducting qubit architecture has been a more recent endeavor. Here, we demonstrate
    the operation of a network comprising six superconducting transmon qubits with
    a novel, beyond-nearest-neighbor connectivity. We use a circular ring resonator
    with six qubits placed on the periphery at <a:math xmlns:a="http://www.w3.org/1998/Math/MathML">
    <a:msup> <a:mn>60</a:mn> <a:mo>∘</a:mo> </a:msup> </a:math> spacing and capacitively
    coupled to it in a three-dimensional circuit-QED architecture. The ring resonator
    acts as a two-path coupler between each pair of qubits, and we present results
    demonstrating that each qubit has finite coupling to three other qubits with negligible
    coupling to the remaining two qubits. In this architecture, with fixed-frequency
    qubits and always-on coupling, we benchmark the single-qubit and two-qubit gates
    using randomized benchmarking. We find that our gate fidelities are strongly affected
    by the enhanced connectivity. We characterize the spread in qubit frequencies
    due to cross-Kerr terms and quantify its detrimental effect on the performance
    of single- and two-qubit gates. Finally, we analyze the effect of the spectator
    qubits using numerical simulations and propose a path toward optimizing this system
    and achieving <b:math xmlns:b="http://www.w3.org/1998/Math/MathML"> <b:mrow> <b:mo>&gt;</b:mo>
    <b:mn>99</b:mn> <b:mo>%</b:mo> </b:mrow> </b:math> two-qubit gate fidelities across
    all connected qubit pairs.
  venue: Physical Review Research
- title: A study of qubit modalities in contemporary quantum computing
  date: 2026-07
  url: https://doi.org/10.1007/s44464-026-00033-9
  category: quantum-hardware
  subcategory: theory
  authors:
  - Arun Govindankutty
  abstract: 'The pursuit of a universal, fault-tolerant quantum computer has transformed
    quantum computing from a predominantly theoretical discipline into a rapidly diversifying
    hardware ecosystem. This review presents a comprehensive and technically grounded
    analysis of the principal physical qubit modalities: superconducting circuits,
    trapped ions, photonic platforms, neutral atoms, semiconductor spin qubits, and
    topological approaches, focusing on their underlying operating principles, performance
    characteristics, and system-level constraints. We examine how these qubit technologies
    are embedded within scalable quantum processor architectures, including control
    and readout infrastructures, connectivity topologies, and quantum error correction
    strategies. The review provides a comparative study of key performance metrics,
    such as coherence times, gate fidelities, error rates, and scalability, reveals
    fundamental trade-offs between speed, robustness, and operational complexity that
    shape distinct technological roadmaps and target applications. We further highlight
    the ongoing transition from noisy intermediate-scale quantum (NISQ) devices toward
    architectures centred on logical qubits, driven by advances in materials engineering,
    precision control, and quantum information theory. Together, these developments
    sketch the emerging routes toward fault-tolerant quantum computing and practical
    quantum advantage, while offering readers a coherent entry point and reference
    guide to the current quantum hardware landscape.'
  venue: Discover Quantum Science
- title: 'Advances in Logical Qubits and Quantum Error Correction: Progress Toward
    Fault-Tolerant Quantum Computing'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20143179
  category: quantum-hardware
  subcategory: theory
  authors:
  - Mirza Adnan Mohtashim
  abstract: Quantum computing has reached a pivotal inflection point with the recent
    demonstration ofbelow-threshold quantum error correction and the emergence of
    logical qubits that outperformtheir physical counterparts. This review synthesizes
    the remarkable progress achieved between2024 and 2026 across multiple quantum
    hardware platforms, including superconducting circuits,trapped ions, and neutral
    atom arrays. We examine the theoretical foundations of quantumerror correction
    codes, with particular emphasis on surface codes and the rapidly advancingquantum
    low-density parity-check (qLDPC) codes. Key experimental milestones are analyzed,including
    Google’s Willow chip demonstration of exponential error suppression, IBM’s modularfault-tolerant
    roadmap culminating in the Starling system, IonQ’s achievement of 48 logicalqubits
    with a 2:1 encoding ratio, and QuEra’s record-efficiency neutral atom error correctionapproaching
    the Teraquop regime. The review further explores critical enabling technologiessuch
    as real-time decoding architectures, magic state distillation protocols, and fault-tolerant
    gateimplementations. We discuss the remaining challenges in scaling to hundreds
    of logical qubits,achieving practical logical error rates of 10−10 to 10−15, and
    realizing end-to-end fault-tolerantalgorithms. By synthesizing these developments,
    this article provides a comprehensive assessmentof the field’s trajectory toward
    practical fault-tolerant quantum computing and identifies the keymilestones that
    will define the next phase of progress.
  venue: Zenodo (CERN European Organization for Nuclear Research)
