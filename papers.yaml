- title: A Semantic Quantum Circuit Cache for Scalable and Distributed Quantum-Classical
    Workflows
  date: 2026-04
  url: https://arxiv.org/abs/2604.26788
  category: quantum-algorithms
  subcategory: method
  authors:
  - Mar Tejedor
  - Javier Conejero
  - Rosa M. Badia
  abstract: 'Hybrid quantum--classical workflows often execute large ensembles of
    circuits that differ syntactically but implement identical operations, leading
    to substantial redundant computation. To address this, we introduce the Quantum
    Circuit Cache, a content-addressable system that detects semantic equivalence
    and reuses previously computed results across executions, backends, and workflow
    stages. Our approach combines ZX-calculus reduction with isomorphism-invariant
    Weisfeiler--Leman graph hashing to generate deterministic circuit identifiers,
    enabling constant-time lookup in distributed caches supporting both lightweight
    LMDB and scalable Redis deployments. The system integrates transparently into
    hybrid HPC workflows and remains backend-agnostic across CPU, GPU, and QPU environments.
    We evaluate the system on MareNostrum 5 with two representative workloads: distributed
    wire cutting and Differential Evolution-based QAOA optimization. For wire cutting,
    caching eliminates up to 91.98% of redundant subcircuit simulations, yielding
    speedups up to 7.0 times on a single node and maintaining advantages at scale,
    with Redis-based caching achieving up to 1.6 times speedups under high parallelism.
    Validation on a 35-qubit superconducting QPU confirms these benefits, achieving
    an 11.2 times speedup on real hardware. In distributed QAOA optimization, equivalence-aware
    caching avoids up to 27.6% of circuit evaluations and consistently reduces execution
    cost without altering the optimization algorithm. In both cases, reuse grows with
    concurrency and circuit structure, highlighting redundancy as a major systems
    bottleneck and demonstrating the effectiveness of our Quantum Circuit Cache.'
  venue: arXiv (Cornell University)
- title: Toward speedup without quantum coherent access
  date: 2026-02
  url: https://arxiv.org/abs/2602.20781
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Nhat A. Nghiem
  abstract: Along with the development of quantum technology, finding useful applications
    of quantum computers has been a central pursuit. Despite various quantum algorithms
    have been developed, many of them often require strong input assumptions, which
    is hardware demanding. In particular, recent advances on dequantization have revealed
    that the quantum advantage is more of a mere artifact of strong input assumptions.
    In this work, we propose a variant of these algorithms, leveraging both classical
    and quantum resources. Provided the classical knowledge (the entries) of the matrix/vector
    of interest, a classical procedure is used to pre-process this information. Then
    they are fed into a quantum circuit which is shown to be a block encoding of the
    matrix of interest. From this block-encoding, we show how to use it to tackle
    a wide range of problems, including principal component analysis, linear equation
    solving, Hamiltonian simulation, preparing ground state, and data fitting. We
    also analyze our protocol, showing that both the classical and quantum procedure
    can achieve logarithmic complexity in the input dimension, thus implying its potential
    for near term realization. We then discuss several implications and corollaries
    of our result. First,, our results suggest there are certain matrices/Hamiltonians
    where our method can provide exponential improvement compared to the existing
    ones with respect to the sparsity. Regarding dense linear systems, our method
    achieves exponential speed-up with respect to the inverse of error tolerance,
    compared to the best previously known quantum algorithm for dense systems. Last,
    and most importantly, regarding quantum data fitting, we show how the output of
    our quantum algorithms can be leveraged to predict unseen data. Thus, it provides
    an end-to-end application, which has been an open aspect of the previous quantum
    data fitting algorithm.
  venue: arXiv (Cornell University)
- title: Quantum algorithm for Clifford multiplication
  date: 2026-07
  url: https://arxiv.org/abs/2607.10473
  category: quantum-algorithms
  subcategory: method
  authors:
  - Kagwe A. Muchane
  abstract: Given two dense multivectors of the Clifford algebra $C\ell(V, Q)$ with
    $N=2^{p+q}$ coefficients, the fastest known classical algorithms compute their
    geometric product in $O(N^{ω/2})$ arithmetic operations, where $ω$ denotes the
    matrix multiplication exponent. I show that, under amplitude encoding, a quantum
    computer executes the geometric product in $O(\operatorname{polylog} N)$ time,
    using logarithmic space with sublogarithmic circuit depth. This exponential speedup
    establishes Clifford multiplication as a quantum primitive, providing an efficient
    computational foundation for quantum geometric algorithms and relativistic simulations.
