- title: Comparing Classical and Quantum Machine Learning Approaches for Crop and
    Weed Detection
  date: 2026-08
  url: https://doi.org/10.1088/2631-8695/ae98fa
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Sneha Kandacharam
  - Poonam Chaudhary
  - Shriram K. Vasudevan
  abstract: Abstract Crop and weed detection is a critical task in precision agriculture,
    traditionally tackled with classical machine learning and, more recently, by exploring
    quantum machine learning (QML). This paper presents a comprehensive comparison
    between classical and quantum approaches for identifying crops versus weeds in
    aerial field imagery. We implement a conventional convolutional neural network
    (CNN) as a classical baseline and two QML models, a quantum support vector classifier
    (QSVC) and a variational quantum classifier (VQC), using a publicly available
    dataset of field images with annotated crops and weeds. The classical CNN achieves
    high accuracy (~94%) on the test set, outperforming the QML models (85-89% accuracy).
    The CNN also offers faster inference (on the order of 10 ms per image) compared
    to the QML methods, which require significantly longer runtime (hundreds of milliseconds)
    due to quantum circuit execution and simulation overhead. However, the quantum
    models use dramatically fewer trainable parameters (tens of parameters) than the
    deep CNN (over one million), highlighting potential efficiency advantages in model
    complexity. In conclusion, classical machine learning remains the state-ofthe-art
    for crop/weed detection in 2025, but continued advancements in QML could eventually
    offer competitive or complementary solutions in precision agriculture.
  venue: Engineering Research Express
- title: 'Hybrid Quantum Neural Networks for Enhanced Breast Cancer Thermographic
    Classification: A Novel Quantum-Classical Integration Approach'
  date: 2026-04
  url: https://arxiv.org/abs/2604.16953
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Riza Alaudin Syah
  - Irwan Alnarus Kautsar
  - Gunawan Witjaksono
  abstract: Breast cancer diagnosis through thermographic image analysis remains a
    critical challenge in medical AI, with classical deep learning approaches facing
    limitations in complex thermal pattern classification tasks. This paper presents
    a novel Hybrid Quantum Neural Network (HQNN) architecture that integrates quantum
    computing principles with classical convolutional neural networks for enhanced
    breast cancer classification. Our approach employs parameterized quantum circuits
    with multi-head attention mechanisms for quantum-aware feature encoding, coupled
    with classical convolutional layers for comprehensive pattern recognition. The
    quantum component utilizes a 4qubit variational circuit with strongly entangling
    layers, while the classical component incorporates advanced attention mechanisms
    for feature fusion. Experimental validation on breast cancer thermographic data
    demonstrates substantial performance improvements over state-of-the-art classical
    architectures, with the quantum-enhanced approach exhibiting superior convergence
    dynamics and enhanced feature representation capabilities. Our findings provide
    evidence for quantum advantage in medical image classification through classical
    simulation, establishing a framework for quantum-classical hybrid systems in healthcare
    applications. The methodology addresses key challenges in quantum machine learning
    deployment while maintaining computational feasibility on near-term quantum devices.
  venue: arXiv (Cornell University)
- title: 'Quantum Machine Learning Models, Limitations, and Opportunities in the NISQ
    Era: A Review'
  date: 2026-07
  url: https://doi.org/10.62411/jimat.v3i1.15955
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Muhamad Akrom
  - Aprilyani Nur Safitri
  - Novianto Nur Hidayat
  abstract: Quantum machine learning (QML) has emerged as a promising interdisciplinary
    field that integrates principles of quantum computing with machine learning techniques
    to address complex computational challenges. By leveraging quantum phenomena such
    as superposition and entanglement, QML aims to enhance learning efficiency, improve
    model performance, and enable the exploration of high-dimensional feature spaces
    that are intractable for classical methods. This paper presents a comprehensive
    review of recent developments in QML, covering fundamental concepts, algorithmic
    taxonomies, data encoding techniques, implementation challenges, and real-world
    applications. Key approaches, including quantum support vector machines (QSVM),
    variational quantum circuits (VQC), and quantum neural networks (QNN), are systematically
    analyzed. Furthermore, critical challenges, including noisy intermediate-scale
    quantum (NISQ) limitations, barren plateaus, data encoding bottlenecks, and the
    lack of demonstrated quantum advantage, are discussed in detail. The review also
    highlights emerging applications in material informatics, energy systems, healthcare,
    and optimization problems. Finally, future research directions are outlined, emphasizing
    the need for advancements in quantum hardware, scalable algorithms, hybrid frameworks,
    and standardized benchmarking. This work aims to provide a structured perspective
    on the current state of QML and to identify opportunities in deploy it effectively
    in solve real-world problems.
