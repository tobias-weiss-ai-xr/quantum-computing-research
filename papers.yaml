- title: Experimental observation of entropic-singularity-induced nonadditive quantum
    communication in a qutrit platypus channel
  date: 2026-05
  url: https://arxiv.org/abs/2605.17418
  category: quantum-information
  subcategory: theory
  authors:
  - Yu Guo
  - Wang Bo-xuan
  - Xiao-Min Hu
  abstract: The nonadditivity of channel capacity is a defining feature that distinguishes
    quantum communication from classical communication. In the quantum realm, the
    channel capacity is determined by coherent information, which is defined through
    the von Neumann entropies of the output and its environment. Despite its fundamental
    importance, experimental evidence of such nonadditive quantum communication has
    been elusive because of the complexity of the required quantum channel. Here,
    we experimentally observe entropic-singularity-induced coherent-information nonadditivity
    using the qutrit platypus channel implemented on a photonic platform. By preparing
    six-dimensional photonic entanglement, we directly measure the coherent information
    of a platypus channel, a qubit amplitude damping channel, and their joint uses,
    revealing a clear violation of additivity. Quantum process tomography further
    reveals the entropic singularity responsible for this effect, demonstrating how
    singular entropy landscapes in low-dimensional channels can enhance quantum communication
    beyond additive limits.
  venue: arXiv (Cornell University)
- title: Modulator-free frequency-bin entanglement certification over multimode channels
  date: 2026-03
  url: https://doi.org/10.1117/12.3079739
  category: quantum-information
  subcategory: method
  authors:
  - Marco Clementi
  - Stéphane Vinet
  - Yujie Zhang
  abstract: We demonstrate a novel, passive method for processing frequency-bin encoded
    quantum information using linear interferometry and time-resolved detection, eliminating
    the need for electro-optic modulation or nonlinear optics. This approach is compatible
    with multimode propagation, a crucial step for free-space quantum communication,
    and favorable for size, weight, and power (SWaP) requirements. Using a high-brightness
    multi-resonator source, we generate frequency-bin entangled photons and show the
    ability to perform arbitrary projective measurements in both single- and multi-mode
    propagation scenarios. For the first time, we measure the joint temporal amplitude
    of the generated state, directly linking its entangled nature to the temporal
    oscillation of non-local correlations. We leverage this to certify entanglement
    with a Bell curve visibility exceeding 95%. Our technique enables full quantum
    state tomography, yielding a state fidelity of up to 91% for a maximally entangled
    state. This work paves the way for robust entanglement deployment over free-space
    and satellite-based links.
