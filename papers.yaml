- title: Single-photon advantage in quantum cryptography beyond QKD
  date: 2026-02
  url: https://arxiv.org/abs/2412.14993
  category: quantum-cryptography
  subcategory: method
  authors:
  - Daniel A. Vajner
  - Koray Kaymazlar
  - Fenja Drauschke
  abstract: Quantum key distribution (QKD) can be used to establish a secret key between
    trusted parties. Many practical use-cases in communication networks, however,
    involve parties who do not trust each other. A fundamental cryptographic building
    block for such distrustful scenarios is quantum coin flipping, which has been
    investigated only in few experimental studies to date, all of which used probabilistic
    quantum light sources imposing fundamental limitations. Here, we experimentally
    implement a quantum strong coin flipping protocol using single-photon states and
    demonstrate a quantum advantage compared to both classical realizations and implementations
    using faint laser pulses. We achieve this by employing a state-of-the-art deterministic
    quantum dot light source in combination with fast, random polarization-state encoding
    enabling sufficiently low quantum bit error ratio. By demonstrating a single-photon
    quantum advantage in a cryptographic primitive beyond QKD, our work represents
    a major advance towards the implementation of complex cryptographic tasks in a
    future quantum internet.
