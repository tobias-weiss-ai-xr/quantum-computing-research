- title: 'PSI-Model & Protocol-P7: Cross-Platform Validation of the Informational
    Shielding Effect (ISE) in NISQ Circuits.'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.20279168
  category: quantum-hardware
  subcategory: theory
  authors:
  - Ignacio Giménez Moreno
  abstract: 'Theoretical Framework and Empirical Validation of the Informational Shielding
    Effect (ISE) This repository provides the theoretical foundations, validation
    datasets, and implementation protocols for the PSI master equation. We investigate
    the Informational Shielding Effect (ISE), wherein internal quantum mutual information
    (I_Q) structurally mitigates the effective decoherence rate of entangled states.
    The core hypothesis is governed by the phenomenological master equation: \gamma_{eff}
    = \sigma - \lambda I_Q In this framework, \lambda \approx 0.18122 \text{ nats}^{-1}
    is characterized as an emergent coupling coefficient, derived empirically from
    observed dynamics rather than imposed as a fixed theoretical constant. Empirical
    Evidence and Methodology The findings are supported by a large-scale analysis
    of 121 independent circuits across high-performance superconducting architectures.
    These experiments reveal an anomalous and highly reproducible bimodal persistence
    regime, where the P7 protocol achieves statistical significance levels of Z =
    81.6\sigma (p < 10^{-28}), marking a distinct departure from conventional Lindblad
    decoherence profiles. Simulation Suite and Cross-Platform Validation This repository
    includes a comprehensive suite of numerical verification tools, designed with
    a strict blind methodology to eliminate circular reasoning. Key features include:
    Cross-Platform Numerical Verification: Robust scripts for diverse environments,
    ranging from generalized density matrix evolution solvers to specialized high-precision
    state simulators. Architecture-Agnostic Implementations: Simulation protocols
    optimized for a variety of hardware encodings, including superconducting circuits,
    trapped-ion systems, neutral atom arrays, and linear photonic architectures. Falsifiable
    Experimental Design: A complete framework for testing decoherence dynamics, ensuring
    robustness against basis mixing and providing verified scaling behavior in multi-qubit
    systems. This work serves as a reproducible resource for exploring dissipative
    quantum systems, offering an operationally grounded and falsifiable alternative
    to standard open-system dynamics. Ignacio Giménez Moreno ORCID 0009-0007-2052-1291.
    Correo Electrónico: igimor1@gmail.com'
