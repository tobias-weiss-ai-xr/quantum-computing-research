  - Ahmed Barnawi
  abstract: Abstract The increasing demand for secure communications in mobile and
    critical infrastructure networks has led to the emergence of Quantum Key Distribution
    (QKD) as a promising technique for enhancing cryptographic security in next-generation
    systems. This paper reviews recent progress in integrating QKD within mobile and
    wireless networks. It focuses on key enabling technologies, such as Software-Defined
    Networking (SDN), satellite-based, and aerial networks. The paper critically analyzes
    how these frameworks can address evolving security requirements in sixth-generation
    (6G) networks and smart city infrastructures. Additionally, it examines the role
    of Machine Learning (ML) in improving QKD performance and adaptability. Challenges
    such as key management, mobility support, scalability, and interoperability are
    explored. These challenges help identify current barriers and research directions.
    By consolidating developments and highlighting unresolved issues, this study offers
    researchers valuable insights. It discusses the convergence of quantum communication
    and advanced mobile architectures, facilitating the design of secure and resilient
    future communication infrastructures.
