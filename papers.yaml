- title: A framework for quantum-secure communications in cyber-physical control systems
    with experimental demonstration in a nuclear reactor
  date: 2026-05
  url: https://doi.org/10.1038/s41598-026-49514-y
  category: quantum-cryptography
  subcategory: method
  authors:
  - Konstantinos Gkouliaras
  - Vasileios Theos
  - True Miller
  abstract: Quantum key distribution (QKD), a cryptographic method grounded in the
    laws of quantum mechanics rather than computational hardness, promises provably
    secure communications. Its integration into critical infrastructure offers a pathway
    to secure resilient operation of next-generation control systems, from power-intensive
    data centers to remotely operated microreactors located in energy-deprived remote
    communities. While QKD has been demonstrated in laboratory and network settings,
    its use in safety-critical control systems remains unexplored where requirements
    on latency, key availability, and operational stability pose unique challenges.
    Here, we introduce a QKD-secured data acquisition and control framework for embedding
    quantum cybersecurity directly into safety-critical cyber-physical systems and
    report the first end-to-end experimental demonstration in a nuclear reactor. The
    framework establishes the conditions necessary to achieve secure, low-latency,
    real-time operation in safety-critical environments. Using a phase-encoding decoy-state
    BB84 system deployed on Purdue's 10 kWth fully digital research reactor (PUR-1)
    we validate the model and achieve real-time encryption and decryption of 2,000
    reactor signals. Experiments demonstrated a stable secret-key rate of 320 kbps
    with a quantum bit error rate of 3.8% at 54 km, and maximum optical-fiber distances
    of 82 km with One-Time Pad (OTP) encryption and 140 km with AES-256. We further
    evaluated compliance with latency and key availability conditions using three
    cryptographic schemes (OTP, AES-256, ASCON), finding that all variants supported
    real-time operation at typical data reporting rates. Our results establish a universal
    framework for quantum-cybersecurity in safety-critical systems, demonstrating
    that quantum communication technologies can enable secure, low-latency, real-time
    operation of nuclear reactors and other critical infrastructure.
  venue: Scientific Reports
- title: Secure multi-party biometric verification using QKD assisted quantum oblivious
    transfer
  date: 2026-06
  url: https://arxiv.org/abs/2501.05327
  category: quantum-cryptography
  subcategory: method
  authors:
  - Mariana F. Ramos
  - Michael Hentschel
  - Federico Valbusa
  abstract: 'We present an experimentally feasible implementation of a secure multiparty
    computation application enabled by quantum oblivious transfer (QOT) on an entanglement-based
    physical layer. The QOT protocol uses polarization-encoded entangled states to
    share oblivious keys between two parties with quantum key distribution (QKD) providing
    authentication. Our system integrates the post-processing for QOT and QKD, both
    sharing a single physical layer, ensuring efficient key generation and authentication,
    respectively. Authentication involves hashing messages into a cryptographic context,
    verifying tags, and replenishing keys. This process uses a parallel QKD pipeline
    specifically for authentication, not for secure key generation. Oblivious keys
    are generated over a distance up to 25.8 km with a channel loss of 8.47 dB. In
    a back-to-back setup, a QOT rate of [Formula: see text] OTs/second is achieved,
    corresponding to 1 minute and 53 seconds per OT, primarily limited by the entanglement
    source. Using pre-distributed oblivious keys improved the rate to 0.11 OTs/second,
    or 9.1 seconds per OT. The considered QOT protocol is statistically correct, computationally
    secure for an honest receiver, and statistically secure for an honest sender,
    assuming a computationally hiding, statistically binding commitment. An experimentally
    feasible use case is demonstrated for privacy-preserving fingerprint matching
    against no-fly lists for border control. The fingerprint is secret-shared across
    two sites, ensuring security, while the matching is performed using the MASCOT
    protocol, supported by QOT. The application required 128 1-out-of-2 OTs, each
    with message length of 128 bits, with the highest security achieved in 20 minutes
    and 39 seconds. This work demonstrates the feasibility of QOT in secure quantum
    communication applications.'
  venue: Scientific Reports
- title: Enhancing Cybersecurity in IoT-Integrated Smart Grids Using Federated Learning
    and Quantum Encryption Techniques
  date: 2026-03
  url: https://doi.org/10.1109/i3ctcon68242.2026.11508099
  category: quantum-cryptography
  subcategory: theory
  authors:
  - M Khaleel Ullah Khan
  - P.Satish Reddy
  - Pailla Thiramal Reddy
  abstract: The rapid growth of smart grids fitted with the IoT has further increased
    the complexity of cybersecurity management placing critical infrastructures at
    risk due to the emergence of novel adversarial and quantum threats in the era.
    Traditional centralized security controls find it hard to maintain information
    confidentiality and flexibility of distributed settings especially when the edge
    resources are limited. Current federated learning models, despite their potential,
    are vulnerable to gradient manipulation and risks of quantum decryption and this
    impedes their resistance to high-stakes cyber-physical ecosystems. In this paper,
    a Federated Quantum-Secured Cyber Defense Framework (FQ-CDF) will be presented
    which combines adaptive federated learning and Quantum Key Distribution (QKD)
    to provide decentralized, quantum-resistant security. The design provides a dynamically
    synchronized policy of model aggregation and key refresh through an adaptive orchestration
    policy, eliminating unnecessary communication with cryptographic integrity. Empirical
    analysis has shown FQ-CDF to be 98.7% intrusion detector, 91.3% defense rate when
    adversarially poisoned, and 22 times faster than latest benchmarks like QFEVAL
    and CAFiKS. These enhancements confirm its capability of supporting performance
    even with quantum-level threat simulation. The suggested framework will contribute
    to the paradigm of intelligent and privacy-sensitive cybersecurity of the intelligent
    IoT and smart grid networks of the future as it provides a scalable journey to
    the quantum-oriented defense infrastructure that learns, adapts and secures itself
    in real time.
  venue: ''
- title: A Web-Based Quantum Key Distribution Simulator with Adaptive Post-Quantum
    Cryptography Fallback
  date: 2026-03
  url: https://doi.org/10.1109/icoeca68095.2026.11485616
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Kr. Senthil Murugan
  - E. J.
  - A.M. Rajeswari
  abstract: 'The rapid advancement of quantum computing poses a critical threat to
    conventional cryptographic systems such as RSA and Elliptic Curve Cryptography
    (ECC). To address this challenge, two major paradigms have emerged: Quantum Key
    Distribution (QKD), which leverages quantum mechanics for theoretically unbreakable
    key exchange, and Post-Quantum Cryptography (PQC), which relies on mathematically
    hard problems resilient to quantum attacks. Current research demonstrates the
    potential of integrating. QKD with lattice-based PQC to achieve hybrid quantum
    resilience; however, most existing works remain theoretical or infrastructure-centric,
    lacking accessible and interactive implementations. This paper presents the design
    and implementation of a web-based QKD simulation platform featuring a real-time
    security scorecard and an automatic PQC fallback mechanism using CRYSTALS-Kyber.
    Built on the BB84 protocol, the simulator models quantum communication between
    Alice, Bob, and Eve under various channel conditions and computes key performance
    metrics such as Quantum Bit Error Rate (QBER), Secret Key Rate (SKR), and efficiency,
    and dynamically switches to Kyber when QKD reliability degrades. Unlike prior
    studies, the proposed system emphasizes interactivity, visualization, and hybrid
    resilience, providing a practical tool for education, research, and industry experimentation.
    The resulting platform bridges the gap between theoretical hybrid cryptography
    and real-world deployment, advancing the broader adoption of quantum-safe communication
    systems.'
  venue: ''
- title: 'Secure Quantum Communication: Simulation and Analysis of Quantum Key Distribution
    Protocols'
  date: 2026-04
  url: https://arxiv.org/abs/2603.16690
  category: quantum-cryptography
  subcategory: method
  authors:
  - Mahendra Rasay
  - Emmanuel Didymus Sebastian
  - Subhash Prasad Sah
  abstract: 'Abstract­­— Quantum computing poses significant threats to conventional
    cryptographic techniques such as RSA and AES, motivating the need for quantum
    secure communication methods. Quantum Key Distribution (QKD) offers information
    theoretic security based on fundamental quantum principles. This paper presents
    a simulation-based analysis of well-known QKD protocols, namely BB84, B92, and
    E91, using the IBM Qiskit framework. Realistic quantum channel effects, including
    noise, decoherence, and eavesdropping, are modeled to evaluate protocol performance.
    Key metrics such as error rate, secret key generation, and security characteristics
    are analyzed and compared. The study highlights practical challenges in QKD implementation,
    including hardware limitations and channel losses, and discusses insights toward
    scalable and robust quantum communication systems. The results support the feasibility
    of QKD as a promising solution for secure communication in the quantum era. Keywords:
    BB84 protocol, B92 protocol, E91 protocol, Quantum communication, Quantum key
    distribution, Quantum security, QBER, Quantum simulation'
  venue: International Scientific Journal of Engineering and Management
- title: QUANTUM KEY DISTRIBUTION FOR ULTRA-SECURE WIRELESS COMMUNICATION
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.19015487
  category: quantum-cryptography
  subcategory: method
  authors:
  - EMERGING TRENDS IN DIGITAL TRANSFORMATION
  abstract: The Wireless communication networks have been increasing their speed at
    a fast pace while the data sent over unsecured channels has become a major concern
    due to security issues. The advancement in cryptography techniques is based mainly
    on computational hardness, which will be endangered as quantum computing technology
    advances. Quantum Key Distribution (QKD) is a way to share keys in a secure manner
    based on quantum mechanics principles, which do not allow any kind of unauthorized
    access. Here we present a wireless communication framework that is secure in nature
    and makes use of Quantum Key Distribution along with support from Grover’s quantum
    search algorithm. In particular, the overall system provides generation, distribution,
    and verification of keys among communicating partners through both quantum channel
    and classical communication channel security features. Using Grover’s algorithmize
    one can make key validation more efficient without much increasing computational
    need for compromising system performance. This will result in high performance
    systems. This thesis proposed model covers the basic aspects of the techniques,
    error correction and key sifters. All this together helps to determine a verifiable
    secret key implementation as a practicable instrument. The system’s performance
    is simulated in an assesment based evaluation for system security strength, rate
    of key generation and resistance to eavesdropping threats .This shows that the
    Security System provides protection against both Classical as well as Quantum
    Threats and also guarantees efficiency in their communication. The method proposed
    above is a scalable and future-ready security solutions for the next generation
    of wireless networks. It does so by contributing to the fortified communication
    systems in the quantum era and helping develop an enhanced quantum cryptographic
    system.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'Quantum-secure networks: A hybrid framework integrating post-quantum cryptography
    and quantum key distribution for ultra-resilient data transmission'
