  authors:
  - Ignacio Giménez Moreno
  abstract: 'This work presents the empirical validation of the PSI Model, a theoretical
    framework proposing that the effective decoherence rate (\gamma_{eff}) of an open
    quantum system is not a constant solely determined by the environment, but is
    conditioned by its internal informational architecture. Through the execution
    of 26 quantum circuits on NISQ hardware (IBM Quantum), we test the fundamental
    ansatz: \gamma_{eff}(t) = \sigma(t) - \lambda \cdot I_Q(t) where \sigma represents
    the bare entropy production rate and \lambda is the Informational Shielding Parameter.
    The methodology, designated as Protocol P7, employs a complete 9-basis Pauli quantum
    state tomography to compare two distinct channels: Channel A (noise baseline,
    I_Q = 0) and Channel B (active entanglement, I_Q > 0). Experimental results reveal
    a critical statistical asymmetry: while Channel A collapses toward a uniform noise
    state, Channel B maintains a bimodal structure with a persistence of 96.9% across
    1024 shots. The robustness of this finding is supported by a statistical significance
    of 10^{-180} and is further verified through a double-CNOT control (Circuit 19),
    which actively falsifies the hypothesis of results being hardware artifacts. This
    study establishes the coefficient \lambda \approx 0.18 as an original operational
    metric, diverging from classical Zurek-type decoherence models by proposing an
    active entropy inhibition mediated by internal mutual information. This provides
    a novel pathway for coherence optimization in real-world quantum systems. Technical
    Rigor Notes: Falsifiability: The abstract prioritizes Circuit 19 as the logical
    anchor that separates systematic gate error from the discovered physical phenomenon.
    Authorship Protection: It explicitly defines \lambda and its predictive function
    as an original contribution, marking a clear boundary against standard Lindblad
    dynamics and Quantum Darwinism. Statistical Weight: The 10^{-180} figure is used
    as the primary scientific argument to invalidate the null hypothesis of hardware
    noise. Ignacio Giménez Moreno ORCID 0009-0007-2052-1291. Correo Electrónico: igimor1@gmail.com'
