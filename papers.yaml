- title: 'From Hilbert''s Tenth Problem to Quantum Speedup: Explicit Oracles for Bounded
    Diophantine Systems'
  date: 2026-05
  url: https://arxiv.org/abs/2605.13980
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Gabriel Escrig
  - M. A. Martin-Delgado
  abstract: Solving non-linear Diophantine systems lies at the mathematical core of
    integer optimization and cryptography. While the general unbounded problem is
    undecidable, even over bounded integer domains it remains classically intractable
    in the worst case. In this work, we introduce a fully reversible quantum algorithmic
    framework tailored to solve arbitrary polynomial Diophantine equations over bounded
    integer domains. The core of our approach is the explicit, gate-level synthesis
    of an evaluation oracle for amplitude amplification. By coherently evaluating
    polynomial constraints via in-place two's complement arithmetic and routing operations
    into a single recycled accumulator, this garbage-free strategy achieves a compact
    and scalable synthesis of the underlying non-linear arithmetic. Through analytical
    derivations and empirical circuit simulations, we prove that the overall spatial
    complexity is bounded by $q = \mathcal{O}((n + d^2)\log_2 N)$ logical qubits for
    $n$ variables, maximum degree $d$, and interval length $N$. The non-Clifford Toffoli
    depth is upper-bounded by $\mathcal{O}(q^2)$. This structural scaling exponent
    remains invariant to the variable count, modulated linearly only by the coefficients'
    Hamming weights. By moving beyond abstract black-box assumptions, this explicit
    architectural synthesis guarantees that the necessary quantum arithmetic acts
    as a bounded polynomial overhead. This ensures a quadratic speedup over classical
    exhaustive search, whether retrieving a unique assignment or dynamically enumerating
    an unknown number of solutions.
  venue: arXiv (Cornell University)
- title: A Quantum Algorithm for Random Number Generation
  date: 2026-06
  url: https://arxiv.org/abs/2606.13034
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Aastha Kataria
  - Devansh Desai
  - Ashwini Dalvi
  abstract: 'We present a quantum algorithm for random number generation that achieves
    a provable quadratic speedup over classical Markov chain mixing, building on the
    Diaconis-Shahshahani Fourier analysis of the top-to-random card shuffle. The algorithm
    integrates three quantum primitives into a unified mixing circuit: the Quantum
    Fourier Transform (QFT), which diagonalizes the Markov transition operator; controlled
    phase rotations, which encode the shuffle eigenvalue spectrum; and the Grover
    diffusion operator, which acts as a quantum analogue of the Aldous-Diaconis strong
    uniform stopping time by reflecting amplitudes about their mean at each iteration.
    For an n-qubit register, the mixing time is O(\sqrt{n \log n}) iterations. Extending
    to m qudits of local dimension d reduces this to O(\sqrt{\log_d N}) iterations,
    where N = d^m, compared to the classical O(n \log n) bound. The qudit formulation
    further reduces QFT circuit depth from O(\log^2 N) to O(\log_d^2 N) gates per
    layer by encoding the same N-state space using m = \log_d N subsystems instead
    of \log_2 N qubits. We validate both variants on IBM superconducting hardware.'
  venue: arXiv (Cornell University)
- title: 'Aicir: A Full-Stack Quantum Circuit Simulator with AscendNPU Support'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09733
  category: quantum-algorithms
  subcategory: method
  authors:
  - Xian Lu
  - Xinying Li
  - Fei Wang
  abstract: Quantum computing is a promising way to study problems that are difficult
    for classical methods, but current quantum hardware still faces limits in scale,
    noise, and fidelity. Running quantum algorithms on physical machines can also
    be costly. Quantum circuit simulators therefore remain important because they
    let researchers design and test algorithms on classical computers before using
    quantum hardware. Most high-performance simulators provide GPU backends, while
    few offer native support for NPUs. This gap limits the computing platforms available
    for quantum-algorithm research. We developed Aicir to provide a full-stack quantum
    circuit simulator with a native Huawei Ascend NPU backend. Aicir connects circuit
    construction, several state representations, measurement, differentiation, variational
    algorithms, quantum machine learning, and quantum architecture search through
    one programming model. It also supports noise simulation, tensor-network and matrix-product-state
    engines, and distributed state simulation. On the NPU, paired real tensors, fixed-rank
    gate views, and hardware-specific formulas keep the tested simulation paths on
    the device. The same representation lets Aicir partition a state across $2^{p}$
    NPUs while retaining reverse-mode differentiation. We validated native execution
    with CPU fallback disabled and checked distributed communication and gradients
    on 2, 4, and 8 NPUs. For the tested fused layered circuits, Aicir's CPU runtime
    is within $0.97$--$1.28\times$ that of Qiskit Aer and $0.76$--$1.10\times$ that
    of Cirq. These results place its CPU execution in the same range as established
    simulators for this workload, while the NPU tests establish correct native execution
    rather than CPU-to-NPU speedup.
  venue: arXiv (Cornell University)
- title: 'C-3PQ: A Closeness Centrality-based Circuit Partitioner for Quantum Simulations'
  date: 2026-07
  url: https://doi.org/10.1145/3797905.3807864
  category: quantum-algorithms
  subcategory: method
  authors:
  - Doru Thom Popovici
  - Harlin Lee
  - Naoki Yoshioka
  abstract: Simulating quantum circuits (QC) on high-performance computing (HPC) systems
    is essential for validating quantum algorithms and probing the potential of large-scale
    quantum computation before the advent of scalable quantum hardware. However, state
    vector simulations are resource-intensive, often requiring large clusters with
    thousands of compute nodes and large amounts of memory. To address this, we introduce
    C-3PQ, an end-to-end framework that minimizes inter-node data movement through
    an efficient circuit partitioning scheme alongside a flexible code generator to
    offer a portable simulation solution. By formulating the distribution of the state
    vector and circuit over multiple nodes as a graph problem, we utilize closeness
    centrality to assess gate importance and design a fast, scalable partitioning
    method. C-3PQ compiles the resulting partitions into highly optimized kernels
    targeting a wide range of hardware platforms from Intel, AMD, NVIDIA and ARM.
    Moreover, compared to a state-of-the-art implementation specific for NVIDIA platforms,
    C-3PQ achieves a speedup of up to \(40\%\) at a fraction of the cost when partitioning
    the state vector.
