- title: BB84 a new hope enhanced QKD for secure email communication with additional
    quantum gates
  date: 2026-03
  url: https://doi.org/10.1140/epjqt/s40507-026-00493-z
  category: quantum-cryptography
  subcategory: method
  authors:
  - Shiiv R S
  - Yuven Senthilkumar
  - V. Karthick
  abstract: 'Abstract The imminent realization of fault-tolerant quantum computing
    presents an existential threat to the cryptographic foundations of the modern
    digital economy. Algorithms such as Shor’s and Grover’s are poised to dismantle
    classical public-key encryption schemes like RSA (Shor in SIAM Rev. 41:303–332,
    1999) and Elliptic Curve Cryptography (ECC) by solving integer factorization and
    discrete logarithm problems in polynomial time (Grover in A fast quantum mechanical
    algorithm for database search, 1996, arXiv [quant-ph]). This vulnerability endangers
    critical infrastructures, particularly secure email correspondence, which remains
    a primary vector for sensitive data exchange. Traditional defenses are proving
    inadequate against the “harvest now, decrypt later” strategies employed by sophisticated
    adversaries who stockpile encrypted traffic in anticipation of Q-Day (Venkatesh
    et al. in J. Sci. Eng. Technol. Manag. Sci. 2:567–577, 2025). Against this backdrop,
    this research introduces BB8-4, an enhanced Quantum Key Distribution (QKD) protocol
    specifically designed for secure email environments. The protocol advances the
    standard BB84 paradigm through two distinct innovations: the integration of a
    Hyper-Entropic 7-Gate State Preparation mechanism and an AI-Driven Dynamic Basis
    Selection engine. Unlike traditional implementations that rely on a limited two-basis
    set, BB8-4 incorporates an expanded library of quantum gates - specifically Identity
    (I), Hadamard (H), Pauli-X, Pauli-Y, Pauli-Z, Phase (S), and the non-Clifford
    $\pi /8$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML"> <mml:mi>π</mml:mi>
    <mml:mo>/</mml:mo> <mml:mn>8</mml:mn> </mml:math> gate (T) - to fundamentally
    augment the indistinguishability and Von Neumann entropy of the transmitted quantum
    states. This “7-gate” approach forces an eavesdropper into a higher-dimensional
    guessing space, significantly degrading the information gain from intercept-resend
    attacks and raising the disturbance threshold required for detection. Furthermore,
    the protocol addresses the inherent 50% sifting inefficiency of standard QKD by
    employing a synchronized Deep Reinforcement Learning (DRL) agent to predict and
    align measurement bases between Alice and Bob without public disclosure (Kaldari
    et al. in Quantum reinforcement learning: Recent advances and future directions,
    2025, arXiv [quant-ph]).'
  venue: EPJ Quantum Technology
- title: Quantum-Secured AI-Driven Drone Logistics for Real-Time Healthcare Delivery
  date: 2026-03
  url: https://doi.org/10.1007/s13369-026-11104-5
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Sana Hafeez
  - Ghulam E Mustafa Abro
  - Maran Marimuthu
  abstract: Abstract This paper presents a quantum-resilient autonomy stack for medical-drone
    delivery that elevates communications and cryptography to first-class, stateful
    variables within motion planning rather than downstream constraints. A three-layer
    Air–Ground–Communications architecture integrates beyond-6 G (FR3/THz) links with
    ultra-reliable low-latency communication (URLLC) fallback and couples BB84-style
    quantum key distribution (QKD) with principled post-quantum cryptography (PQC)
    switching to ensure cryptographic continuity under mobility and adverse weather.
    At the core, a hybrid AI–RKF45 controller fuses a lightweight neural policy with
    the integrator’s local error, co-adapting control aggressiveness and solver step
    size for stiffness-aware manoeuvres and rapid re-optimisation under disturbances.
    The planner directly ingests link SNR, URLLC queueing delay, QKD quantum bit error
    rate (QBER), secure key rate (SKR), key-buffer levels, meteorological risk, and
    battery state-of-health, shaping a multi-objective cost that jointly minimises
    energy and control-loop end-to-end latency (sensing–compute–communication round-trip),
    while enforcing geofencing and Beyond Visual Line of Sight (BVLOS) constraints.
    In large-scale regional simulations (200 km $$\times $$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
    <mml:mo>×</mml:mo> </mml:math> 200 km; up to 200 UAVs), the framework achieves
    a mean control-loop latency of 2.34 s (distinct from door-to-door delivery time),
    an 18% reduction in energy per sortie, and a 98.2% mission success rate, outperforming
    static planners, deep reinforcement learning (PPO/DQN), and model predictive control
    under matched compute budgets. The QKD $$\leftrightarrow $$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
    <mml:mo>↔</mml:mo> </mml:math> PQC state machine applies conservative thresholds
    (QBER $$\le $$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML"> <mml:mo>≤</mml:mo>
    </mml:math> 8%, SKR $$\ge $$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
    <mml:mo>≥</mml:mo> </mml:math> 5 kbps with key-buffer hysteresis), yielding rare,
    millisecond-scale fallbacks that preserve latency guarantees. Complexity scales
    as $$\mathcal {O}\!\left( \frac{n}{\nu }T\right) $$ <mml:math xmlns:mml="http://www.w3.org/1998/Math/MathML">
    <mml:mrow> <mml:mi>O</mml:mi> <mml:mspace/> <mml:mfenced> <mml:mfrac> <mml:mi>n</mml:mi>
    <mml:mi>ν</mml:mi> </mml:mfrac> <mml:mi>T</mml:mi> </mml:mfenced> </mml:mrow>
    </mml:math> , maintaining 2–5 s update times for fleets exceeding 200 vehicles.
    Reproducible artefacts and a staged pathway from hardware-in-the-loop to BVLOS
    trials support near-term healthcare deployment.
