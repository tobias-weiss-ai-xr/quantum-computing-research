- title: Field-trial quantum key distribution with qubit-based frame synchronization
  date: 2026-04
  url: https://doi.org/10.1364/oe.593410
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Guan Rui
  - Chun Yu
  - ZhaoYun Li
  abstract: Quantum key distribution (QKD) is a cryptographic technique that uses
    quantum mechanical principles to enable secure key distribution, offering information-theoretic
    security guaranteed by physical laws. Practical deployment of QKD requires robust,
    cost-effective systems that can operate in challenging field environments. A major
    challenge is achieving reliable clock synchronization without adding hardware
    complexity. Conventional approaches often use separate classical light signals,
    which increase costs and introduce noise that degrades quantum channel performance.
    To address this limitation, we demonstrate a QKD system incorporating a recently
    proposed qubit-based distributed frame synchronization method, deployed over a
    metropolitan fiber network in Nanning, China. Using the polarization-encoded one-decoy-state
    BB84 protocol and the recently proposed qubit-based distributed frame synchronization
    method, our system achieves synchronization directly from the quantum signal,
    eliminating the need for dedicated synchronization hardware. Furthermore, to counteract
    dynamic polarization disturbances in urban fibers, the system integrates qubit-based
    polarization feedback control, enabling real-time polarization compensation through
    an automated polarization controller using data recovered from the qubit-based
    synchronization signals. During 12 hours of continuous operation, the system maintained
    a low average quantum bit error rate of 1.12 ± 0.48%, achieving a secure key rate
    of 26.6 kbit/s under 18 dB channel loss. Even under a high channel loss of 40
    dB, a finite-key secure rate of 115 bit/s was achieved. This study represents
    a successful long-term validation of a frame-synchronization-based QKD scheme
    in a real urban environment, demonstrating exceptional stability and high-loss
    tolerance, and offering an alternative for building practical, scalable, and cost-efficient
    quantum-secure communication networks.
