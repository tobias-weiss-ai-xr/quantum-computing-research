- title: Evaluating Quantum Key Protocols for Secure Hybrid Cryptography
  date: 2026-04
  url: https://doi.org/10.1109/raeeucci67649.2026.11504879
  category: quantum-cryptography
  subcategory: method
  authors:
  - S. Shirley Helen Judith
  - V. Kaliraj
  - K Aruna
  abstract: This study provides an integrated quantum classical and traditional cryptographic
    framework that combines the Device-Independent Quantum Key Distribution to RSA
    and AES for achieving highly enhanced secure communication. Upgrading the previous
    work, involving a BB84 with RSA and AES hybrid scheme. Similarly, this paper advances
    the security by incorporating DI-QKD in which it rejects assumptions about the
    internal functioning of the quantum devices and protects against the side channel
    attacks. In this proposed model, DI-QKD helps to create or generate provably secure
    shared keys, based on Bell-inequality violations whereas RSA ensures reliability
    in authentication and public key exchange. AES provides high-speed symmetric encryption
    for the mass data protection. This paper therefore establishes the complete DI-QKD
    with RSA and AES workflow simulating secure key generation; producing encrypted
    message outputs and the performance metrics such as key generation rate; quantum
    bit error rate; encryption time and overall system throughput is measured. These
    graphical results are compared with the earlier BB84 hybrid model to evaluate
    operational efficiency, resistance to adversarial interference and security robustness
    and too highlights the quantitative improvement offered by DI-QKD especially in
    antagonistic or untrusted device scenarios. Hence this paper demonstrates that
    the DI-QKD with RSA, AES hybrid system offering strengthened quantum safe security
    with classical compatibility, positioning it as a propitious architecture for
    the futuristic cryptographic networks.
  venue: ''
- title: Quantum-Resilient Cryptography and Safe Guarding Post Quantum Cryptographic
    Protocols Against Quantum Threats
  date: 2026-05
  url: https://doi.org/10.1109/icpcsn68523.2026.11543578
  category: quantum-cryptography
  subcategory: method
  authors:
  - S Hemajothi
  - Keerthana B
  - Janani R
  abstract: The Hybrid approach in Quantum Cryptography creates adaptable security
    model which provides the safest Communication in the emerging quantum era. The
    development of quantum computing raise questions about the long-term security.
    Traditional algorithms, such as RSA, ECC, and Diffie-Hellman, which is seemed
    computationally secure but it can be effectively solved by quantum algorithms
    such as Shor's and Grover's. This problem leads to the origination of two key
    trends in current studies, namely Post-Quantum Cryptography (PQC), designing mathematical
    approaches to encryption resistant to quantum attacks; Quantum Key Distribution
    (QKD) using the principles of quantum mechanics to assure security in communications.
    Accordingly, this research proposes a hybrid security framework including reliable
    data encryption and authentication using PQC, combined with the safe key- exchange
    method of QKD. The model is implemented in Python, Qiskit, and PQClean's Kyber
    and Dilithium algorithms to show how these two paradigms can cooperate toward
    quantum- resilient communication. To present the system performance, key exchange
    efficiency, computational overhead, and security strength have been considered.
    According to the results, this hybrid approach gives superior defense against
    quantum threats while maintaining practical effectiveness for real-world applications
    such as cloud security, 6G networks, and the Internet of Things.
  venue: ''
- title: Quantum Cryptography for 6G and Quantum Internet Infrastructure
  date: 2026-03
  url: https://doi.org/10.1109/cine68769.2026.11503001
  category: quantum-cryptography
  subcategory: method
  authors:
  - Nutan Mahapatra
  - Ritik Kumar Singh
  - Saion Kumar
  abstract: The emergence of sixth-generation (6 G) wireless networks and the rapid
    development of Quantum Internet infrastructure have created unprecedented demands
    for ultrasecure communication. Classical cryptographic techniques, which depend
    on computational hardness, are vulnerable to quantum attacks enabled by powerful
    quantum algorithms. Quantum cryptography, particularly Quantum Key Distribution
    (QKD), offers information-theoretic security based on the principles of quantum
    mechanics, making it a foundational element for future network security. This
    paper investigates the integration of quantum cryptography within 6 G architectures
    and Quantum Internet frameworks, focusing on secure key exchange, entanglementassisted
    communication, and quantum-safe protocols. We analyze the challenges posed by
    channel loss, quantum repeater limitations, hardware constraints, and large-scale
    deployment in ultra-dense 6 G environments. Our study highlights the potential
    of hybrid quantum-classical security models and outlines how quantum cryptography
    can support resilient, scalable, and next-generation secure communication systems.
