- title: A quantum game of telephone
  date: 2026-08
  url: https://arxiv.org/abs/2608.03963
  category: quantum-information
  subcategory: theory
  authors:
  - Arefur Rahman
  - Matthew L. Stevens
  - Cory M. Nunn
  abstract: Characterizing multinode quantum networks without ubiquitous local entanglement
    sources presents significant experimental challenges. We introduce ``quantum telephone,''
    an iterative ancilla-assisted process tomography protocol that leverages intermediate
    detection events, effectively treating previously probed links as ancillae for
    subsequent links. Implemented on a deployed multinode fiber network, we observe
    noisy intermediate channels create fundamental parameter degeneracies that compound
    inference errors under sequential estimation. Counterintuitively, the inclusion
    of downstream near-unitary channels provides boundary constraints that, when used
    in tandem with global inference, can resolve ambiguity in channels earlier in
    the sequence. By compensating for localized information loss, this approach obviates
    the strict full-rank requirements of standard ancilla-assisted process tomography,
    even when intermediate states become completely depolarized. Overall, quantum
    telephone offers a hardware-efficient and information-maximizing path toward characterizing
    complex quantum networks with limited resources.
  venue: arXiv (Cornell University)
- title: Tripartite Entanglement in $e^+ e^- \to t \bar{t} Z$
  date: 2026-06
  url: https://arxiv.org/abs/2606.11296
  category: quantum-information
  subcategory: method
  authors:
  - Dorival Gonçalves
  - Alberto Navarro
  - Kazuki Sakurai
  abstract: Multipartite entanglement is a uniquely quantum form of correlation that
    captures collective properties of a composite quantum state beyond those encoded
    in its bipartite subsystems. We investigate this phenomenon in the process $e^+e^-\to
    t\bar tZ$ at a future lepton collider, where the final state spins span the tripartite
    Hilbert space $\mathscr{H} = \mathbb{C}^2 \otimes \mathbb{C}^2 \otimes \mathbb{C}^3$.
    Starting from the Standard Model helicity amplitudes, we reconstruct the full
    $12\times 12$ spin density matrix and characterise its entanglement structure
    through one-to-one negativities, one-to-other negativities, and the genuine multipartite
    negativity, evaluated at three increasingly inclusive levels of phase space integration.
    Pairwise entanglement is generally suppressed relative to the collective (one-to-other)
    and the genuine multipartite entanglement, and all measures decrease as more kinematic
    information is integrated out. Assuming quantum tomography in the fully leptonic
    decay channel at $\sqrt{s}=1$ TeV, we find that collective entanglement should
    be accessible at a realistic high-luminosity polarised lepton collider. By contrast,
    certifying genuine multipartite entanglement is more challenging, with only limited
    sensitivity projected for a specific polarisation benchmark within the expected
    ILC luminosity. The study establishes $e^+e^-\to t \bar{t}Z$ as an attractive
    laboratory for probing multipartite entanglement in high-energy collisions and
    provides a general mixed state framework that applies to any tripartite spin system.
  venue: arXiv (Cornell University)
- title: Experimental Validation of Decoherence Inhibition via Intra-System Informational
    Coupling in Superconducting Quantum Processors.
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19708346
  category: quantum-information
  subcategory: theory
  authors:
  - Ignacio Giménez Moreno
  abstract: 'This work presents the empirical validation of the PSI Model, a theoretical
    framework proposing that the effective decoherence rate (\gamma_{eff}) of an open
    quantum system is conditioned by its internal informational architecture. Through
    the execution of 26 quantum circuits on NISQ hardware (IBM Quantum), we test the
    fundamental ansatz \gamma_{eff}(t) = \sigma(t) - \lambda \cdot I_Q(t), where \sigma
    is the bare entropy production rate and \lambda is the Informational Shielding
    Parameter. The methodology, Protocol P7, employs a complete 9-basis Pauli quantum
    state tomography to compare two distinct channels: Channel A (noise baseline,
    I_Q = 0) and Channel B (active entanglement, I_Q > 0). The experimental results
    demonstrate a critical statistical asymmetry: while Channel A collapses toward
    a uniform noise state, Channel B maintains a bimodal structure with a 96.9% persistence
    across 1024 shots. This provides conclusive evidence of a shielding effect against
    decoherence with a statistical significance of 10^{-180}. Within this framework,
    the study identifies a high-fidelity estimation of the coupling constant (\lambda
    \approx 0.18) derived from the observed probability distributions. The robustness
    of the finding is verified through a double-CNOT null control (Circuit 19), which
    actively falsifies the hypothesis of results being hardware artifacts. This study
    establishes the PSI Model as an original operational approach to quantum stability,
    providing an executable metric to predict state survival by leveraging internal
    mutual information—a mechanism distinct from classical decoherence and einselection
    models. Ignacio Giménez Moreno ORCID 0009-0007-2052-1291. Correo Electrónico:
    igimor1@gmail.com'
