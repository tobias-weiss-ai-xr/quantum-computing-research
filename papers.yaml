- title: Information-Theoretic Framework for Quantum State Purification and Error
    Correction via Entropy Compression Mechanisms
  date: 2026-04
  url: https://doi.org/10.20944/preprints202604.2029.v1
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Jiaqi Tang
  - Zhaohui Liao
  - Mujiangshan Wang
  abstract: 'The extreme sensitivity of qubits to environmental noise constitutes
    the central bottleneck impeding the practical deployment of near-term quantum
    computing. Quantum error correction suppresses physical errors by encoding logical
    qubits into redundant physical qubits, yet its corrective gain deteriorates sharply
    when physical error rates approach the fault-tolerant threshold. This paper proposes
    a purification-assisted quantum error correction framework that systematically
    embeds a purification preprocessing module between the encoding layer and the
    physical layer, founded on the permutation symmetry of multiple noisy state copies.
    From an information-theoretic perspective, this framework treats the purification
    process as an entropy reduction mechanism that filters noise entropy from quantum
    states, concentrating quantum information into lower-entropy subspaces and achieving
    entropy suppression before downstream error correction processing. By projecting
    the joint state of identical copies onto the symmetric subspace, the module achieves
    noise entropy filtering, thereby concentrating quantum information and exponentially
    compressing the effective physical error rate before it enters the error-correcting
    code, establishing a compound exponential logical error rate suppression mechanism
    under ideal assumptions. Analytical derivations under depolarizing noise yield
    closed-form expressions for the purification fidelity and the enhanced equivalent
    fault-tolerant threshold, demonstrating that purification with three copies elevates
    the surface code threshold from approximately 1.1% to approximately 2.0%. Building
    on this framework, an Iterative Purification-assisted Error Correction (IPEC)
    algorithm is designed, which dynamically adjusts the purification depth via real-time
    syndrome feedback to achieve an adaptive balance between fidelity gain and resource
    consumption. Monte Carlo simulations under both independent depolarizing noise
    and circuit-level noise models validate the theoretical predictions: the IPEC
    algorithm reduces the logical error rate by approximately 46-fold at code distance
    7 with a physical error rate of 1.0%, achieves an approximately 8-fold improvement
    on quantum LDPC codes, and maintains robust performance in non-stationary noise
    environments through its adaptive mechanism. From an entropy-theoretic perspective,
    the proposed framework constitutes an entropy management mechanism for quantum
    computation, in which the purification process compresses state entropy at the
    input stage and error correction maintains the low-entropy condition during computation,
    together forming a closed-loop entropy flow control system.'
  venue: Preprints.org
- title: 'QECTOR Decoder v3: Syndrome-Faithful Decoding - Foundations, Algorithms,
    and Architecture of a Fifteen-Backend Quantum Error Correction Engine'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21941045
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Guillaume Besnard
  abstract: 'QECTOR Decoder v3: Syndrome Faithful Decoding, Foundations, Algorithms,
    and Architecture of a Fifteen Backend Quantum Error Correction Engine QECTOR Decoder
    v3 is a quantum error correction decoding engine written in Rust with PyO3 Python
    bindings. It provides fifteen specialized decoding backends unified by a single
    invariant enforced on every call: syndrome faithfulness, the requirement that
    H c = s (mod 2) for any correction the engine returns. Scope of this manual This
    reference manual documents implementation version 1.0.0 of qector decoder v3.
    Every mathematical statement in it is anchored to source modules and regression
    tests in the frozen 1.0.0 workspace. Hardware dependent measurements such as latency,
    throughput, and memory are intentionally excluded from the manual; the methodology
    for producing and reporting such figures is specified instead, so any future claim
    is reproducible and auditable. Backend families covered Exact minimum weight perfect
    matching using Edmonds'' blossom algorithmEvent driven Sparse Blossom using radix
    heap region growthZero allocation Union Find (UF 01)Belief propagation with ordered
    statistics (BP OSD) for quantum LDPC codesAmbiguity clustering with learned predecodersSpace
    time and streaming decoding across multiple roundsTwo stage CSS decoding for correlated
    X and Z noiseCUDA and OpenCL batch kernels, proven bit identical to the CPU reference
    on tested configurationsA native routing and orchestration layer with a seven
    tier fallback chain What the manual includes The manual develops the binary field
    mathematics and stabilizer formalism from first principles, proves the core correctness
    theorems shared by every backend including syndrome faithfulness, the logical
    error criterion, and path flipping faithfulness of MWPM, and walks through worked
    numerical examples including the Steane [[7,1,3]] code, the rotated surface code
    at distance 3, and a Wilson confidence interval computed by hand. It documents
    the public API surface, both stable and provisional, the detector error model
    pipeline, the licensing model and tier enforcement, ecosystem integrations such
    as a PyMatching compatible shim, Sinter decoders, and a Qiskit plugin, and the
    testing and validation strategy across correctness, property based, cross decoder
    equivalence, and GPU bit identity layers. Reproducibility policy Claims in this
    manual are explicitly scoped: exactness, bit identity, and accuracy statements
    are attached only to the workloads and configurations on which they were established.
    No universal performance claim is made anywhere in the document, and prior benchmark
    artifacts that did not survive a core fingerprint change were formally withdrawn.
    Appendix D provides the exact reproduction commands, and Appendix C maps every
    claim to its evidence anchor in the source tree. Keywords quantum error correction,
    QEC, decoder, MWPM, Union Find, BP OSD, LDPC, qLDPC, surface code, Stim, Sinter,
    PyMatching, Rust, Python, PyO3, CUDA, batch decoding, reproducible research, benchmarking
    Author Guillaume Lessard, iD01t Productions, ORCID 0009 0000 3465 3753'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'QECTOR DECODER v0.6.6: A Source-Available Rust-Backed Python Platform for
    High-Performance Quantum Error Correction Decoding'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21320543
  category: quantum-error-correction
  subcategory: development
  authors:
  - Guillaume Besnard
  abstract: qector-decoder-v3 (current PyPI release v0.6.6) is a source-available
    Rust-backed Python platform for quantum error-correction (QEC) decoding. It provides
    a uniform API over exact minimum-weight perfect matching (BlossomDecoder), fast
    approximate Union-Find and its SIMD-accelerated variant (FastUnionFindDecoder),
    near-optimal sparse-Blossom decoding, belief-matching, BP-OSD for LDPC/qLDPC codes,
    streaming/hybrid decoders, and high-throughput CPU/GPU batch decoding, with first-class
    Stim and Sinter integration. v0.6.6 is a critical-fix release that restores package
    importability after a total import failure affecting every published v0.6.5 wheel.
    It retains the full v0.6.4/v0.6.5 feature set. This whitepaper documents the full
    architecture, decoder catalogue, performance benchmarks against PyMatching (latency
    and logical error rate), throughput results, tail-latency analysis, and explicit
    accuracy/speed trade-offs across decoder families. All numbers are traceable to
    environment-stamped, content-hashed benchmark artifacts and are fully reproducible.
    The platform is designed for research, Monte Carlo validation, and Stim/Sinter-based
    workflows. It is not positioned as a universal replacement for PyMatching but
    offers measured advantages on repetition codes across tested distances and on
    surface codes at low-to-moderate distance.
