- title: 'Quantum Error Correction and Fault-Tolerant Quantum Computing: Principles,
    Progress, and Future Directions'
  date: 2026-05
  url: https://doi.org/10.5281/zenodo.20176500
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Mirza Adnan Mohtashim
  abstract: Quantum error correction (QEC) stands as the foundational pillar enabling
    fault-tolerantquantum computing, addressing the fundamental challenge of quantum
    decoherence that has long impededscalable quantum information processing. This
    review provides a comprehensive examination of theprinciples, recent advances,
    and future directions in quantum error correction and fault-tolerant quantumcomputing.
    We begin by establishing the theoretical foundations, including the quantum error
    problem,the stabilizer formalism, and the fault-tolerant threshold theorem that
    delineates the boundary betweencomputable and uncomputable quantum systems. We
    then systematically review the landscape of quantumerror correction codes, from
    pioneering approaches including Shor and Steane codes to modern leadingcandidates
    such as the surface code, color codes, and recent developments in quantum low-density
    paritycheck (LDPC) codes. Our analysis extends to fault-tolerant architectures,
    encompassing transversal gateimplementations, magic state distillation, and lattice
    surgery protocols. We further evaluate experimentalprogress across leading physical
    platforms including superconducting circuits, trapped ions, and photonicsystems,
    highlighting landmark achievements from 2020 to 2025. The review also explores
    criticalapplications spanning quantum machine learning, quantum sensing, quantum
    cryptography, and quantumsimulation, demonstrating how robust error correction
    underpins advances across the entire quantumtechnology ecosystem. Finally, we
    identify persistent challenges including resource overhead reduction,scaling requirements,
    and integration with quantum networks, while outlining the most promising researchdirections.
    This review aims to serve as both an accessible introduction for researchers entering
    the fieldand a comprehensive reference for established practitioners seeking to
    understand the current state andtrajectory of quantum error correction research.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Hardware-in-the-Loop Syndrome-to-Decoder Validation for Repetition, Surface,
    CSS-LDPC, and Digitized-GKP Codes
  date: 2026-07
  url: https://arxiv.org/abs/2607.19447
  category: quantum-error-correction
  subcategory: application
  authors:
  - Dennis Delali Kwesi Wayo
  - Chinonso Onah
  - Rodrigo Alves Dias
  abstract: 'Quantum error-correction experiments increasingly require a verified
    interface between measured syndrome bits and decoder-native correction requests.
    We report a four-branch syndrome-to-decoder study spanning three IBM gate-model
    hardware circuits and one PennyLane-backed digitized-GKP model. The hardware branches
    implement a five-data-qubit repetition code, a distance-five rotated-surface-code
    Z-check extraction layer, and the Z-check half of the Steane CSS code as a compact
    CSS-LDPC benchmark. The GKP branch samples finite-squeezed Gaussian-CV q-readout
    and injected q-shifts, then bins wrapped quadrature coordinates into the same
    outer surface-code Z-check interface. All cases use 4096 shots per stream, clean
    and injected streams, LiDMaS+ request construction, and MWPM/minimum-weight correction
    as the plotted baseline, with union-find and hard-decision belief-propagation/min-sum
    policies replayed for interface validation. The correction-volume panels additionally
    report mean minimum-weight correction weight for each decoded stream. Repetition
    and CSS-LDPC hardware preserve the dominant expected syndrome and correction for
    every injected target. The routed 56-qubit surface circuit exhibits broad hardware-induced
    syndrome activation: exact localization drops to $0.003$--$0.108$, but target-containing
    localization remains $0.279$--$0.642$. The digitized-GKP study gives exact q-shift
    localization of $0.350$--$0.495$ and target-containing localization of $0.417$--$0.608$.
    The results support an auditable syndrome-to-decoder interface rather than a threshold
    claim.'
