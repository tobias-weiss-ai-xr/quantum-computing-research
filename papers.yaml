- title: 'NISQ in practice: navigating noise, scale, and hardware constraints of near-term
    devices in quantum machine learning workflows'
  date: 2026-06
  url: https://doi.org/10.1088/1367-2630/ae8053
  category: quantum-hardware
  subcategory: theory
  authors:
  - Chisomo Daka
  - Somnath Bhattacharyya
  abstract: Abstract The arrival of noisy intermediate-scale quantum (NISQ) devices
    defines an era in which quantum utility is fundamentally constrained by finite
    coherence times, limited qubit counts, gate infidelities, restricted connectivity,
    and measurement noise. Within this regime, hybrid quantum-classical frameworks
    have emerged as the dominant operational paradigm, particularly for quantum machine
    learning (QML). This review identifies a fundamental trade-off between expressivity,
    trainability, and noise resilience that governs the performance and scalability
    of NISQ-era QML systems. To contextualize these challenges, we introduce the resource-constrained
    iterative routing framework, a hardware-aware conceptual architecture that integrates
    topology-aware classical compression and distributed quantum orchestration to
    maintain circuit depths within device-dependent limits while routing representations
    toward symmetry-constrained Hilbert subspaces to mitigate noise-induced barren
    plateaus. Furthermore, we shift the discussion of quantum advantage away from
    asymptotic fault-tolerant complexity toward the notion of operational NISQ advantage
    based on finite-resource scaling, trainability preservation, and sampling complexity.
    We evaluate the practical resource efficiency of variational quantum algorithms,
    quantum kernel methods, and quantum neural networks across superconducting, trapped-ion,
    neutral-atom, and photonic platforms. The review also examines reproducibility
    challenges, emphasizing benchmarking against optimized classical baselines, and
    discusses strategies for managing the sampling overhead of error mitigation alongside
    distributed execution and quantum circuit compilation. Ultimately, NISQ in Practice
    positions hybrid QML as a physically constrained computational paradigm while
    outlining a pathway from contemporary noisy workflows toward early fault-tolerant
    quantum architectures.
