- title: Chip-Integrated Broadband Multi-Photon Source for Wavelength-Multiplexed
    Quantum Networks
  date: 2026-03
  url: https://arxiv.org/abs/2603.09397
  category: quantum-information
  subcategory: development
  authors:
  - Xiao-Xu Fang
  - Ling-Xuan Kong
  - He Lu
  abstract: Quantum networks based on wavelength-multiplexed entanglement enable parallel
    distribution of quantum correlations, increasing channel capacity for secure communication
    and distributed quantum information processing. However, broadband integrated
    sources capable of generating multipartite entanglement beyond photon pairs remain
    scarce. Here we report on-chip generation of telecom-band four-photon entanglement
    in a periodically poled thin-film lithium niobate on insulator (LNOI) waveguide.
    Type-0 spontaneous parametric down-conversion provides a phase-matching bandwidth
    exceeding 200 nm, enabling spectrally separable generation of multi-photon entanglement
    across the telecom band. The generated photons are encoded in time bins for robust
    fiber compatibility, and a coherent interface enabling reversible conversion between
    time-bin and polarization degrees of freedom allows complete quantum state tomography.
    We measure two-photon entanglement with a brightness of 6.7 MHz/mW/nm and a fidelity
    of $0.874 \pm 0.002$. At a pump power of 0.08 mW, the four-photon state exhibits
    a fourfold coincidence rate of 1 Hz and a fidelity of $0.74 \pm 0.01$, representing
    a threefold improvement over previous integrated platforms. Our results establish
    LNOI as a scalable platform for broadband multi-photon entanglement and provide
    a practical route toward dense wavelength-multiplexed quantum networks.
  venue: arXiv (Cornell University)
- title: Hyperon-pair spin tomography beyond scalar spin correlations
  date: 2026-06
  url: https://arxiv.org/abs/2606.24811
  category: quantum-information
  subcategory: theory
  authors:
  - Lei Wang
  abstract: 'Spin correlations measured after hadronization probe how quantum information
    is transported through confinement. We formulate a process-independent spin-tomography
    framework for $Λ\barΛ$ pairs in which the weak-decay angles determine the full
    two-spin tensor rather than only its scalar trace. Applied to the short-range
    STAR correlation in unpolarized $pp\toΛ\barΛX$, the framework shows that the published
    scalar $P_{Λ\barΛ}$ leaves a continuous density-matrix degeneracy: separable tensor
    completions and completions that violate the positive-partial-transpose (PPT)
    criterion can have the same trace. The missing observables are the transverse
    and longitudinal tensor components and their anisotropy $A_C=C_\perp-C_\parallel$.
    A local ${}^{3}P_0$ string-breaking benchmark turns the STAR trace into the falsifiable
    pattern $C_\perp&gt;0$, $C_\parallel&lt;0$, and $A_C&gt;0$. We further show that
    feed-down must be treated as a tensor response rather than as a universal scalar
    dilution. In the complementary $e^+e^-$ calibration channel, the same benchmark
    predicts a centrally enhanced $A_C$ of order $0.3$ in Belle II kinematics, measurable
    with about $10^4$ selected pairs for nominal spin-transfer parameters. A claim
    of entanglement requires the reconstructed two-spin density matrix, not the scalar
    trace alone, to violate the PPT bound.'
  venue: arXiv (Cornell University)
- title: 'Discrete and Continuous Wigner Functions in Open Quantum Systems: Non-Markovian
    and Thermodynamic Effects'
  date: 2026-05
  url: https://arxiv.org/abs/2605.29717
  category: quantum-information
  subcategory: method
  authors:
  - Jai Lalita
  abstract: The central aim of the thesis is to examine how non-classical resources
    in finite-dimensional quantum systems can be identified, characterized, and protected
    for practical use in the presence of realistic noise. Using the discrete Wigner
    functions (DWFs) framework, we introduce negative quantum states and examine how
    their Wigner negativity, mana, coherence, and teleportation fidelity evolve under
    unital and non-unital channels, with particular attention to non-Markovian random-telegraph
    and amplitude-damping dynamics. We also analyze protection strategies based on
    weak measurement and quantum measurement reversal, showing that these methods
    can enhance quantum correlations, reduce fidelity deviation, and improve teleportation
    performance for two-qubit negative states in memory-bearing environments. Moreover,
    we demonstrate that certain negative states, derived from phase-space point operators,
    exhibit greater resilience than Bell states in measures of entanglement under
    non-Markovian noise. Further, this thesis focuses on developing and implementing
    quantum circuits for generating these states on superconducting hardware and realizing
    them for the first time on IBM's ibm-Brisbane device. Their preparation is verified
    using quantum state tomography, demonstrating high fidelity under realistic noise
    conditions. We propose a teleportation scheme that leverages one of the two-qubit
    negative quantum states as a resource. Moreover, these two-qubit negative quantum
    states are also found to perform better than the Bell states for maximal CHSH
    violation and Fisher information in noisy conditions. We believe that these negative
    quantum states have the potential to be used in place of the traditional Bell
    states in scenarios where non-Markovian errors are prevalent. (continued in the
    PDF)
