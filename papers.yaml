- title: 'Quantum Artificial Intelligence for Medical Data: Comparative Evaluation
    of Quantum Machine Learning Models'
  date: 2026-05
  url: https://doi.org/10.7759/s44389-025-00063-x
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Swathi Ganesan
  - Lakmali Karunarathne
  - Kavindu Karunarathne
  abstract: Background Artificial Intelligence (AI) incorporation within healthcare
    applications has significantly helped in the improvement of healthcare diagnostics,
    patient forecasting, and clinical decision-making. The steady growing of medical
    data in terms of quantity, quality, and dimension poses more significant problems
    for traditional AI methods in terms of size, time, and computational efficiency.
    However, classical machine learning models often struggle with high-dimensional,
    imbalanced, and heterogeneous medical datasets, which limits their scalability
    and generalizability. The Quantum Artificial Intelligence (QAI) model, which combines
    quantum computing and machine learning in a complementary way, has emerged as
    one of the main trends to defeat these problems. This complementary approach is
    gaining more popularity, with the most advanced work being developed in this area,
    as it offers a fundamental explanation of current complexities and the underlying
    principles and their applications. Methodology This paper begins with the basic
    concepts of quantum computing and where it overlaps with AI. It then moves to
    a comparative approach, discussing various quantum machine learning algorithms
    such as quantum support vector machines, quantum neural networks, and variational
    quantum circuits. A comparative evaluation of quantum support vector machine,
    variational quantum classifier, quantum neural network, quantum K-means, and quantum
    Boltzmann machine is conducted using the Pima Indians Diabetes dataset to assess
    model behaviour and performance under standard metrics. Further detail is provided
    on the theoretical and practical implications of QAI in medical imaging, genomics,
    electronic health records, and drug discovery. Additionally, this paper examines
    platforms, tools, and quantum hardware used for QAI research, and discusses unique
    challenges currently faced in quantum technology. Results Unlike prior surveys
    that primarily provide conceptual overviews, this paper uniquely combines a comprehensive
    review with practical benchmarking of multiple quantum machine learning models
    on a benchmark medical dataset. This provides comparative insights into algorithmic
    performance under real-world constraints, particularly in relation to high-dimensional
    medical data, genomic data, electronic health records with large number of clinical
    attributes, radiology images, etc. In this study, dimensionality arises from multivariate
    clinical features encoded into quantum feature maps and the limitations of current
    quantum systems. Conclusion This paper aims to serve as a starting point for researchers
    and practitioners interested in the potential of quantum-enhanced AI to transform
    health data analytics. By identifying current limitations, evaluating the performance
    of emerging quantum machine learning approaches, and outlining gaps in the literature,
    the paper highlights future research directions necessary to advance QAI in healthcare.
    Overall, the findings outline both the potential and practical constraints of
    quantum models, offering a foundation for future work toward scalable, clinically
    applicable QAI solutions.
  venue: Cureus Journal of Computer Science.
- title: 'Quantum Machine Learning for Numerical Regression: A Hybrid Quantum-Classical
    Approach to Predictive Modeling'
  date: 2026-02
  url: https://doi.org/10.5281/zenodo.18754924
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Satya Mani Gayathri Devi Rayavarapu
  abstract: Quantum Machine Learning (QML) has emerged as a promising paradigm that
    integrates the computational advantages of quantum computing with the versatility
    of classical machine learning techniques. This study proposes a hybrid quantumclassical
    framework for numerical regression tasks, leveraging the capabilities of variational
    quantum circuits to capture complex, high-dimensional relationships within numerical
    datasets. The methodology encodes numerical features into quantum states using
    amplitude encoding and applies a parameterized quantum circuit trained via a classical
    optimizer. Experimental evaluation is conducted using IBM Qiskit’s quantum simulator
    on benchmark regression datasets, comparing model performance against classical
    linear regression and neural network baselines. Results demonstrate that the proposed
    hybrid approach achieves competitive prediction accuracy while reducing model
    complexity, particularly for small to mediumsized datasets. Furthermore, the study
    discusses computational resource requirements, noise resilience, and scalability
    challenges, offering insights into the practical adoption of QML in predictive
    analytics.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Design and Analysis of Modern Quantum Neural Network Architectures for Intelligent
    Systems
  date: 2026-03
  url: https://doi.org/10.4018/979-8-2600-0008-3.ch009
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Lakshmi Chandrakanth Kasireddy
  - Prabhakara Rao Kapula
  - Dineshkumar Rajendran
  abstract: Quantum neural networks (QNNs) offer a principled pathway for integrating
    quantum computation with machine learning through superposition- and entanglement-based
    representations. This chapter proposes an architecture-aware design and evaluation
    framework for modern QNNs, emphasizing robustness and system feasibility alongside
    predictive performance. Multiple architecturesvariational QNNs, quantum convolutional
    neural networks, tensor-network hybrids, and fully quantum models—are assessed
    under a unified protocol. Experimental analysis shows that the proposed architecture-search–guided
    QNN achieves 91.8% classification accuracy and an F1-score of 0.914, outperforming
    fixed-template variational QNNs by approximately 5.6 percentage points. Under
    depolarizing noise with probability p = 0.10, the proposed model retains 85.3%
    accuracy, whereas baseline QNNs fall below 80%. Moreover, circuit depth is reduced
    by nearly 25% relative to standard variational designs, leading to faster convergence
    (42 epochs vs. 57 epochs).
  venue: Advances in computational intelligence and robotics book series
- title: Design of a hybrid quantum machine learning architecture and analysis of
    quantum noise effects
  date: 2026-03
  url: https://doi.org/10.1038/s41598-026-42216-5
  category: quantum-machine-learning
  subcategory: method
  authors:
  - J. A. Bravo-Montes
  - A. Martín-Toledano
  - C. Velasco-Gallego
  abstract: Quantum Machine Learning (QML) is emerging as a promising technology for
    tackling complex computational challenges, although its practical implementation
    faces significant obstacles owed to the inherent noise in current quantum devices.
    This paper presents a hybrid architecture that combines classical and quantum
    elements for the development and training of QML models under noisy conditions.
    This research evaluates the impact of noise on superconducting systems through
    emulation. The study shows that, compared to noise-free configurations, certain
    noise levels tend to allow for a reduction in the number of qubits, thus simplifying
    the architecture of the quantum neural network, which has a direct impact on the
    computational cost and execution times. Experimental validation was performed
    by applying three biomedical datasets related to breast cancer detection. The
    experimental findings revealed that the variations in accuracy between noiseless
    configurations and those subjected to noisy conditions were minimal, with deviations
    ranging from 0.11% to 1.68%. Additionally, it was observed that the incorporation
    of noise during training contributed positively to the efficiency of the process
    for the datasets under test, achieving improvements in training execution times
    ranging from a factor of 1.61 to 4.39, when the proposed architecture was emulated
    on Qaptiva 802.
  venue: Scientific Reports
- title: 'QEML-Net: Quantum-enhanced machine learning for predictive maintenance in
    industrial IoT environments using hybrid classical-quantum neural networks'
  date: 2026-04
  url: https://doi.org/10.55529/jaimlnn.61.100.111
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Dr. Inam Ullah Khan
  abstract: The economic value of predictive maintenance (PdM) for industrial IoT
    machinery is undeniable, as unplanned equipment downtime is estimated to cost
    industries USD 50 billion a year worldwide. Deep learning techniques have achieved
    good fault classification results on benchmark datasets, but they are not robust
    enough to cope with noise in industrial environments, are computationally intensive
    for use at the edge, and are unable to make good use of the capabilities of quantum
    computing. In this paper, a new hybrid network, called QEML-Net (Quantum-Enhanced
    Machine Learning Network), is proposed to combine the ResNet-50 deep residual
    network with Convolutional Block Attention Modules (CBAM), variational quantum
    feature enhancement, and a compound hybrid loss function, for efficient fault
    diagnosis. The framework features a 6-layer, 4-qubit Parameterized Quantum Circuit
    (PQC) with angle encoding and linear CNOT entanglement that is implemented using
    PennyLane. Experiments were performed on six harmonized datasets from public PdM
    which have 57164 samples across eight unified fault categories. The framework
    was validated with the help of Bayesian hyperparameter optimization, 5-fold stratified
    cross-validation, ablation studies, and statistical testing. By optimizing the
    deployment on the edges, QEML-Net got 97.3% accuracy, 96.9% macro-F1 score, AUC
    of 0.988, and real-time inference performance with 19ms latency and 52FPS throughput
    on the benchmark dataset. The statistical analysis revealed significant improvement
    when compared to other methods (p &lt; 0.001). Even when evaluated cross-dataset
    without fine-tuning, good generalization was achieved with an accuracy of 92.8–94.6%.
    The results reveal the advantages of combining the quantum variational circuits
    with deep learning to enhance the classification accuracy, interpretability, and
    deployment efficiency for the fault diagnosis of industrial IoT.
  venue: Journal of Artificial Intelligence Machine Learning and Neural Network
- title: 'Quantum-Inspired Variational Inference for Non-Convex Stochastic Optimization:
    A Unified Mathematical Framework with Convergence Guarantees and Applications
    to Machine Learning in Communication Networks'
  date: 2026-04
  url: https://doi.org/10.3390/math14071236
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Abrar S. Alhazmi
  abstract: 'Non-convex stochastic optimization presents fundamental mathematical
    challenges across machine learning, wireless networks, data center resource allocation,
    and optical wireless communication systems, where complex loss landscapes with
    multiple local minima and saddle points impede classical variational inference
    methods. This paper introduces the Quantum-Inspired Variational Inference (QIVI)
    framework, which systematically integrates quantum mechanical principles (superposition,
    entanglement, and measurement operators) into classical variational inference
    through rigorous mathematical formulations grounded in Hilbert space theory and
    operator algebras. We develop a unified optimization framework that encodes classical
    parameters as quantum-inspired states within finite-dimensional complex Hilbert
    spaces, employing unitary evolution operators and adaptive basis selection governed
    by gradient covariance eigendecomposition. The core mathematical contribution
    establishes that QIVI achieves a convergence rate of O(log2T/T1/2) for σ-strongly
    non-convex functions, provably improving upon the classical O(T−1/4) rate, yielding
    a theoretical speedup factor of 1.85–1.96×. Comprehensive experiments across synthetic
    benchmarks, Bayesian neural networks, and real-world applications in network optimization
    and financial portfolio management demonstrate 23–47% faster convergence, 15–35%
    superior objective values, and 28–46% improved uncertainty calibration. The principal
    contributions include: (i) a rigorous Hilbert space-based mathematical framework
    for quantum-inspired variational inference grounded in operator algebras, (ii)
    a novel hybrid quantum–classical algorithm (QIVI) with adaptive basis selection
    via gradient covariance eigendecomposition, (iii) formal convergence proofs establishing
    provable improvement over classical methods, (iv) comprehensive empirical validation
    across diverse problem domains relevant to machine learning and network optimization,
    and (v) demonstration of the framework’s applicability to optimization problems
    arising in wireless networks, data center resource allocation, and network system
    design. Statistical validation using the Friedman test (χ2=847.3, p&lt;0.001)
    and post hoc Wilcoxon signed-rank tests with Holm–Bonferroni correction confirm
    that QIVI’s improvements over all baseline methods are statistically significant
    at the α=0.05 level across all benchmark categories. The framework discovers 18.1
    out of 20 true modes in multimodal distributions versus 9.1 for classical methods,
    demonstrating the potential of quantum-inspired optimization approaches for challenging
    stochastic problems arising in machine learning, wireless communication, and network
    optimization.'
  venue: Mathematics
- title: 'Adversarial Robustness in Quantum Machine Learning: A Scoping Review'
  date: 2026-04
  url: https://doi.org/10.3390/computers15040233
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Yanche Ari Kustiawan
  - Khairil Imran Ghauth
  abstract: Quantum machine learning (QML) is emerging as a promising paradigm at
    the intersection of quantum computing and artificial intelligence, yet its security
    under adversarial conditions remains insufficiently understood. This scoping review
    aims to systematically map empirical research on adversarial robustness in QML
    and to identify dominant threat models, defense strategies, evaluation approaches,
    practical constraints, and future research directions. Following PRISMA-ScR guidelines,
    four major databases were searched, resulting in 53 eligible empirical studies
    published between 2020 and 2026. The findings show that most research concentrates
    on input-level evasion attacks, particularly adversarial examples, and primarily
    evaluates robustness in classification-oriented models such as variational quantum
    circuits and quantum neural networks. Defense strategies are largely adapted from
    classical adversarial training and noise-based mitigation, with limited deployment
    on real quantum hardware. Robustness assessment is predominantly empirical, relying
    on accuracy degradation and attack success rate, while formal certification methods
    remain less common. The literature also highlights substantial constraints related
    to hardware limitations, NISQ noise, computational cost, and dataset scale. Overall,
    the evidence indicates that adversarial robustness research in QML is expanding
    but remains methodologically concentrated, underscoring the need for standardized
    benchmarking, scalable defenses, and hardware-validated robustness evaluation
    frameworks.
  venue: Computers
- title: 'Quantum–AI for High-Dimensional Learning: Graph Neural Networks, Topological
    Data Analysis, Tensor Networks, and Sparse Predictive Modelling'
  date: 2026-06
  url: https://doi.org/10.62311/nesx/rpj2-30062026
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Murali Krishna Pasupuleti
  abstract: 'Abstract: This study investigates a unified Quantum-AI framework for
    high-dimensional learning in settings where data are simultaneously relational,
    geometric, tensorial, and sparse. The problem is motivated by scientific and industrial
    datasets whose structure exceeds the expressive capacity of purely vector-based
    models: citation networks encode non-Euclidean dependence, audio and detector
    data contain high-order covariance patterns, and high-energy physics classification
    involves small signals embedded in large feature spaces. The proposed framework
    combines graph neural networks for relational propagation, topological data analysis
    for filtration-stable shape descriptors, tensor networks for low-rank multilinear
    compression, and sparse predictive modelling for interpretable feature selection.
    The methodological contribution is a reproducible benchmark design grounded in
    public real-data sources: OGBN-Arxiv for graph node classification, UCI YearPredictionMSD
    for high-dimensional regression, and UCI HIGGS for scientific binary classification.
    Because this manuscript is generated as a self-contained research paper without
    executing a full external training pipeline, the results section reports a realistic,
    domain-plausible benchmark protocol with transparent assumptions and internally
    consistent metrics. Equations, tables, and figures are embedded in context to
    show how the proposed hybrid architecture may improve accuracy, compression, stability,
    and interpretability relative to classical baselines. The study concludes that
    high-dimensional learning benefits most when graph structure, topological invariants,
    tensor-rank constraints, and sparsity priors are treated as complementary inductive
    biases rather than as competing model families. Keywords Quantum artificial intelligence;
    high-dimensional learning; graph neural networks; topological data analysis; tensor
    networks; sparse predictive modelling; persistent homology; OGBN-Arxiv; HIGGS;
    YearPredictionMSD; quantum kernels; variational circuits; scalable machine learning'
  venue: International Journal of Academic and Industrial Research Innovations(IJAIRI)
- title: Grokking and epoch-wise double descent in quantum neural networks
  date: 2026-07
  url: https://arxiv.org/abs/2607.08350
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Daniel Pranjić
  - Marco Roth
  - Christian Tutschku
  abstract: Grokking, the delayed transition from memorization to generalization,
    is a fundamental phenomenon in gradient-based learning, yet its dynamics within
    variational quantum machine learning (QML) remain largely unexamined. In this
    work, we report the empirical observation of both the grokking transition and
    epoch-wise double descent in a two-qubit quantum neural network (QNN) under a
    complete parameterization of the SU(4) manifold. We demonstrate that overparameterization
    via increased circuit depth improves the probability of successful generalization.
    Notably, these architectures frequently exhibit an epoch-wise double descent in
    test error, degrading at a critical epoch before recovering into a generalizing
    state. Crucially, we identify a generalization decay in late-stage training, where
    the test error increases significantly despite a stagnant training loss. Bridging
    this behavior with algorithmic stability theory, our analysis reveals that this
    decay correlates with an unconstrained increase of the weight-norm, drifting away
    from sparse, phase-aligned harmonic solutions toward overfitted solutions in the
    Hilbert space. We analyze the underlying temporal dynamics of this transition,
    demonstrating how the onset of generalization is linked to optimization hyperparameters
    such as learning rate and weight decay. Finally, to mitigate late-stage decay,
    we introduce a weak explicit weight-norm regularization into the loss function.
    We demonstrate that this structural anchor stabilizes the post-grokking phase
    and permanently preserves generalization gains, providing a robust framework for
    training overparameterized quantum circuits.
  venue: arXiv (Cornell University)
- title: Introduction to the artificial neural network-based variational Monte Carlo
    method
  date: 2026-03
  url: https://arxiv.org/abs/2603.15460
  category: quantum-machine-learning
  subcategory: method
  authors:
  - William Freitas
  abstract: The construction of trial wave functions based on neural networks combined
    with the variational Monte Carlo method is discussed. The mathematical formulation
    for representing quantum states as artificial neural networks is introduced. The
    advantages of employing such trial states and how machine learning works are discussed.
    It is shown that the variational method is a kind of unsupervised learning algorithm,
    where the multiple minima landscape is used as an asset that leads to a stable
    optimization procedure. The feature representation plays an important role on
    interpretability and on extracting physical insights from nontrivial trial wave
    functions. The algorithm is illustrated for the Yukawa potential and the hydrogen
    molecule.
  venue: arXiv (Cornell University)
- title: Quantum Enhanced Hybrid Face Recognition Using MultiGate-Quantum Convolutional
    Neural Network (MG-QCNN)
  date: 2026-07
  url: https://doi.org/10.22214/ijraset.2026.84199
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Chamarti Venkata Sri Vyshnavi
  - Dr. O. Srinivas Rao
  abstract: Face recognition has become an essential biometric technology for applications
    such as security monitoring, user authentication, and intelligent surveillance
    systems. Conventional approaches based on deep neural networks, particularly convolution-based
    architectures, provide high recognition performance but often demand considerable
    computational resources and extended training durations as network complexity
    increases. To overcome these challenges, Quantum Machine Learning (QML) utilizes
    quantum computing concepts, including quantum superposition and entangled states,
    to achieve efficient feature representation and processing. This paper presents
    a Hybrid Quantum-Classical Face Recognition System built on a Multi-Gate Quantum
    Convolutional Neural Network (MG-QCNN). The proposed framework employs a 4-qubit
    variational quantum circuit that incorporates RY state encoding together with
    RX, RZ, and CNOT quantum operations to extract discriminative facial representations.
    In addition, a structural ablation analysis is conducted to investigate the influence
    of individual quantum components on the overall recognition capability of the
    model. To enhance spatial feature learning and classification performance, several
    classical neural network layers, namely convolution, batch normalization, max-pooling,
    dropout, and fully connected layers, are integrated after the quantum feature
    extraction stage. Within the hybrid framework, the quantum circuit is responsible
    for generating meaningful feature representations, whereas the classical neural
    network performs feature refinement and final identity classification. The framework
    is further combined with the DeepFace verification approach to perform facial
    similarity analysis and identity verification. Moreover, an Open-Set Face Recognition
    mechanism is incorporated to determine if an input facial image corresponds to
    a registered identity or represents an unseen individual. This capability increases
    system reliability and supports accurate unknown-person identification
  venue: International Journal for Research in Applied Science and Engineering Technology
- title: An efficient hybrid quantum machine learning framework for Alzheimer classification
  date: 2026-08
  url: https://doi.org/10.1038/s41598-026-64291-4
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Tajinder Kumar
  - Neha Chachra
  - Purushottam Sharma
  abstract: Abstract Neuro-imaging data is necessary for timely and correct diagnosis
    of the disease Alzheimer’s (AD). Early clinical intervention is challenging due
    to the high-dimensional nature of the images, making it computationally difficult
    to work on representations, sparse annotated datasets and inter-subject variance.
    Deep convolutional VGG, ResNet, DenseNet, MobileNet and other neural networks
    (CNNs) have shown good performance. Diagnostic performance, but they are based
    on a high number of parameters and require highly trained personnel. Data can
    often times restrict resilience to data-skimy clinical settings. To address these
    challenges, the current paper presents a hybrid Quantum Machine Learning (QML)
    architecture for Alzheimer’s disease Detection and classification based on a combination
    of classical CNN-based feature extraction and Variational quantum classifier.
    In the suggested method, diseased, relevant, and compact features are extracted
    using pre-trained CNN backbones. Data from structural MRI scans is later translated
    into quantum states and computed. With parameterised variational quantum circuits
    optimised with a hybrid quantum-classical learning loop. The proposed method has
    been experimentally evaluated on benchmark datasets of MRI scans of Alzheimer’s
    patients. The hybrid CNNQML model has a mean classification accuracy of about
    93% which is similar to deep CNN models, including ResNet and DenseNet (94%),
    and much more. Beating lightweight models like MobileNet and shallow CNNs by six
    percentage points. It is worth noting that the hybrid QML model performs better
    in conditions with limited training data. Performance degradation is observed
    in accuracy and AUC for all CNN variants, with up to 5% lower performance to deep
    CNNs. Cross-validation, confidence interval, paired significance test, and statistical
    validation. Effect size analysis proves the fact that the hybrid model produces
    statistically significant performance, as well as cases of clinically meaningful
    improvements over lightweight CNN baselines. Similar to the state-of-the-art deep
    networks with significantly reduced trainable parameters in the classification
    stage. These findings show that hybrid QML is a data-efficient and powerful substitute
    in the diagnosis of Alzheimer’s. On the whole, this is a work that sets a practical
    way to integrate quantum machine learning into clinical neuro-imaging pipelines
    and hybrid settings. QML has supplementary deep-learning enhancement to classics
    in next-generation Alzheimer’s Decision-support systems.
  venue: Scientific Reports
- title: Hybrid Quantum Neural Networks for Early Diagnosis of Multiple Sclerosis
    using Explorable Quantum AI (VQE and QAOA)
  date: 2026-03
  url: https://doi.org/10.5281/zenodo.19057870
  category: quantum-machine-learning
  subcategory: method
  authors:
  - Vittor Gabriel Fontini Novaes da Silva
  abstract: This study proposes a hybrid architecture of Quantum Neural Networks (HQNN)
    combining quantum computing with classical machine learning to improve the early
    diagnosis of Multiple Sclerosis (MS). The model integrates simulated multimodal
    data, including Ultra-High Field MRI (7T), liquid biomarkers (Neurofilament Light
    Chain - NfL), and genetic data. By utilizing variational algorithms such as VQE
    and QAOA, the simulated HQNN demonstrates superior performance in capturing complex
    patterns in high-dimensional spaces, achieving higher accuracy and AUC compared
    to traditional models like SVM and Random Forest. The research also emphasizes
    Explainable AI (XAI) to ensure clinical transparency.
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: Noise Models Impacts and Mitigation Strategies in Photonic Quantum Machine
    Learning
  date: 2026-03
  url: https://arxiv.org/abs/2603.09645
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - A. M. A. S. D. Alagiyawanna
  - Asoka Karunananda
  abstract: 'Photonic Quantum Machine Learning (PQML) is an emerging method to implement
    scalable, energy-efficient quantum information processing by combining photonic
    quantum computing technologies with machine learning techniques. The features
    of photonic technologies offer several benefits: room-temperature operation; fast
    (low delay) processing of signals; and the possibility of representing computations
    in high-dimensional (Hilbert) spaces. This makes photonic technologies a good
    candidate for the near-term development of quantum devices. However, noise is
    still a major limiting factor for the performance, reliability, and scalability
    of PQML implementations. This review provides a detailed and systematic analysis
    of the sources of noise that will affect PQML implementations. We will present
    an overview of the principal photonic quantum computer designs and summarize the
    many different types of quantum machine learning algorithms that have been successfully
    implemented using photonic quantum computer architectures such as variational
    quantum circuits, quantum neural networks, and quantum support vector machines.
    We identify and categorize the primary sources of noise within photonic quantum
    systems and how these sources of noise behave algorithm-specifically with respect
    to degrading the accuracy of learning, unstable training, and slower convergence
    than expected. Additionally, we review traditional and advanced techniques for
    characterizing noise and provide an extensive survey of strategies for mitigating
    the effects of noise on learning performance. Finally, we discuss recent advances
    that demonstrate PQML''s capability to operate in real-world settings with realistic
    noise conditions and future obstacles that will challenge the use of PQML as an
    effective quantum processing platform.'
