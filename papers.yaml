    standard gate-based compilations. Our results are based on principles of graph
    sparsification and decomposition; the former reduces the number of edges in a
    graph while maintaining its cut structure, while the latter breaks a weighted
    graph into a small number of unweighted graphs. Though these techniques have been
    used as heuristics in various hybrid quantum algorithms, there have been no guarantees
    on their performance, to the best of our knowledge. This work provides the first
    provable guarantees using sparsification and decomposition to improve quantum
    noise resilience and reduce quantum circuit complexity. For quantum hardware that
    uses edge-by-edge QAOA compilations, sparsification leads to a direct reduction
