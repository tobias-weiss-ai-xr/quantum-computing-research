  authors:
  - R. Naveenkumar
  - N. M. Sivamangai
  - C. M. Lingesh
  abstract: This chapter presents Quantum Key distribution (QKD)—an innovative technique
    for secure communication—based on the underlying principles of quantum physics
    rather than conventional computing constraints. It examines the fundamental principles
    of QKD, including measurement disturbance, entanglement, and superposition, using
    comparative visualizations. Visual representations, including a bar chart representing
    essential protocols (e.g., BB84 and E91), a line chart illustrating the correlation
    between quantum bit error rate (QBER) and transmission distance, and a pie chart
    outlining the functions of quantum principles, augment intellectual comprehension.
    The chapter emphasizes the equilibrium between security and practicality in various
    protocols, providing insights into QKD&s;s capacity to give enduring, physics-based
    cryptographic solutions in the face of emerging quantum computing threats.
  venue: Auerbach Publications eBooks
- title: Quantum cryptography for secure messaging
  date: 2026-03
  url: https://doi.org/10.30574/wjarr.2026.29.3.0716
  category: quantum-cryptography
  subcategory: theory
  authors:
  - JANGAM BHARGAVI
  - YERLA ASHRITHA
  - MULAGALA SRI HARSHITHA
  abstract: The project “Quantum Cryptography for Secure Messaging” aims to create
    a highly secure communication system using the BB84 protocol, a key method in
    quantum key distribution. As traditional encryption systems face growing threats
    from cyberattacks and future quantum computers, this project provides a future-proof
    solution for message encryption. It uses simulated quantum bits (qubits) to generate
    secret keys based on quantum mechanics, ensuring that any eavesdropping attempts
    can be detected instantly. The process involves encoding binary data into quantum
    states, securely exchanging keys, and applying them for symmetric encryption of
    messages. Key features include real-time key generation, automatic encryption
    and decryption, and intrusion detection. The expected outcome is a working prototype
    of a secure messaging system that can resist both current and emerging security
    challenges, highlighting the potential of quantum cryptography as a foundation
    for the next generation of digital security.
  venue: World Journal of Advanced Research and Reviews
- title: Advancing Secure Communication in the Quantum Era through the Integration
    of Artificial Intelligence and Quantum Cryptographic Techniques
  date: 2026-05
  url: https://doi.org/10.51583/ijltemas.2026.150500034
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Mr. Hemant N. Chaudhari
  abstract: Utilizing the ideas of quantum physics, quantum cryptography is quickly
    becoming a vital defense against the growing cybersecurity risks of the contemporary
    day, especially in light of developing quantum computing. This essay investigates
    the complex field of quantum cryptography and looks at how it can transform network
    security and protect private data. We examine the fundamental ideas of quantum
    cryptography, such as Quantum Key Distribution (QKD) protocols like BB84 and E91,
    which use quantum features like superposition and entanglement to provide potentially
    indestructible secure communication channels. We also discuss the urgent need
    for quantum-resistant solutions in view of the developing "quantum threat" to
    well-known cryptographic algorithms like RSA and AES. The potential benefits and
    difficulties of using artificial intelligence (AI) techniques to boost quantum
    cryptography systems' resilience and efficiency are also examined. The creation
    of effective quantum repeater networks and enhanced security proofs are among
    the outstanding research topics, future difficulties, and present implementations
    in quantum cryptography that are covered in this study. We stress how crucial
    quantum cryptography is to protecting sensitive communications in the quantum
    era for a variety of industries, including the military, government, financial
    industry, and healthcare. We come to the conclusion that quantum cryptography
    has enormous potential for protecting vital information systems from future cyberattacks
    that are becoming more complex, even if we acknowledge the technology's early
    stages of development.
