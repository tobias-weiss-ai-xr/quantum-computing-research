- title: Accelerating Computation in Quantum LDPC Code
  date: 2026-03
  url: https://doi.org/10.1145/3779212.3790122
  category: quantum-error-correction
  subcategory: application
  authors:
  - Jungmin Cho
  - Hyeonseong Jeong
  - Junpyo Kim
  abstract: Fault-tolerant quantum computing (FTQC) uses quantum error correction
    (QEC) codes to execute large-scale quantum programs on noisy quantum computers.
    Quantum low-density parity-check (qLDPC) codes are promising as they use an order
    of magnitude fewer qubits than widely used surface codes. However, as qLDPC codes
    support only a limited set of operations, they require programs to be decomposed
    into many qLDPC-supported operations. This prohibitively increases the execution
    time of FTQC applications to tens of days, hindering the practical viability of
    qLDPC codes.
  venue: ''
- title: 'Fault-Tolerant Quantum Computation: Architectural Trade-Offs Between Surface
    Codes, Color Codes, and Quantum LDPC Codes'
  date: 2026-08
  url: https://doi.org/10.5281/zenodo.21981195
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Pasindu Nanayakkara
  abstract: 'Fault-tolerant quantum computing (FTQC) is required to execute quantum
    algorithms capable of tackling computationally intractable problems in chemistry,
    material science, and cryptography. Noisy Intermediate-Scale Quantum (NISQ) devices
    remain constrained by physical error rates that degrade quantum coherence over
    short circuit depths. Quantum error correction (QEC) protects fragile logical
    states by encoding them into non-local degrees of freedom across topological physical
    qubit arrays. This research presents a comprehensive architectural and theoretical
    evaluation of three primary QEC paradigms: planar surface codes, topological color
    codes, and asymptotic quantum low-density parity-check (qLDPC) codes. We examine
    error thresholds, transversal gate constraints governed by the Eastin-Knill theorem,
    magic state distillation (MSD) overheads, lattice surgery, and classical decoding
    latencies across superconducting transmons, trapped ions, and neutral atom platforms.'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'QGPU: Parallel logic in quantum LDPC codes'
  date: 2026-03
  url: https://arxiv.org/abs/2603.05398
  category: quantum-error-correction
  subcategory: method
  authors:
  - Boren Gu
  - Andy Zeyi Liu
  - Armanda O. Quintavalle
  abstract: 'Quantum error correction is critical to the design and manufacture of
    scalable quantum computing systems. Recently, there has been growing interest
    in quantum low-density parity-check codes as a resource-efficient alternative
    to surface codes. Their adoption is hindered by the difficulty of compiling fault-tolerant
    logical operations. A key challenge is that logical qubits do not necessarily
    map to disjoint sets of physical qubits, which limits parallelism. We introduce
    clustered-cyclic codes, a quantum low-density parity-check code family with finite-size
    instances such as [[136,8,14]] and [[198,18,10]] that are competitive with state-of-the-art
    constructions. These codes admit a directly addressable logical basis, enabling
    highly parallel logical measurement layers. To leverage this structure, we propose
    parallel product surgery for quantum product codes. Using an auxiliary copy of
    the data patch and an engineered product-connection structure, the protocol performs
    many logical Pauli-product measurements in a single surgery round with small,
    fixed overhead. For clustered-cyclic codes, this yields surface-code-style maximal
    parallelism: up to k/2 disjoint Pauli-product measurements per round under explicit
    algebraic conditions. We prove that parallel product surgery preserves the code
    distance for hypergraph product codes and numerically verify distance preservation
    for the listed clustered-cyclic instances with k = 8. Finally, for the [[24,8,3]]
    clustered-cyclic code, treating half of the logical qubits as auxiliaries enables
    arbitrary parallel CNOTs on disjoint pairs; combined with symmetry-derived operations,
    these gates generate the full Clifford group fault-tolerantly.'
  venue: arXiv (Cornell University)
- title: Fast logical operations in quantum LDPC codes using simple resource states
  date: 2026-07
  url: https://arxiv.org/abs/2607.16166
  category: quantum-error-correction
  subcategory: method
  authors:
  - Mark Webster
  - Nicolas Delfosse
  abstract: Quantum LPDC codes provide a substantial reduction in qubit overhead required
    for fault-tolerant quantum computation compared to surface code, thanks to their
    high encoding rate. However, operating simultaneously on multiple logical qubits
    encoded in the same block is more challenging and may slow down logical operations.
    Prior work addresses this problem by designing complex resource states to perform
    logical measurements in LDPC codes. Here, we propose an approach that only consumes
    cat states. Whereas previous work on cat-based measurements focuses on a single
    logical measurement, we design a protocol for the joint measurement of $\ell$
    commuting logical operators. The key ingredient is the design of a scheduler code
    determining the measurement sequence and allowing for the decoding of all logical
    measurement outcomes. Numerical simulations with the LDPC codes Q70 and Q102 of
    the walking cat architecture show a speed-up of nearly $3\times$ over Viterbi
    measurements for the measurement of $\ell=20$ commuting logical operators. Combining
    our fast logical measurements with a new variant of the CliNR partial error correction
    scheme, we achieve a speed-up of up to $74\times$ for random Clifford circuits.
    Our approach also applies to non-Clifford gates, producing a speed-up of up to
    $5\times$ for Toffoli gates.
  venue: arXiv (Cornell University)
- title: Concatenating Algebraic Codes over High-Rate Quantum LDPC Codes
  date: 2026-05
  url: https://arxiv.org/abs/2605.21898
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Adam Wills
  - Michael E. Beverland
  - Lev S. Bishop
  abstract: Different quantum error correction schemes trade off overhead, error suppression,
    and hardware connectivity. Code concatenation can relax these tradeoffs by using
    an outer code whose non-local connectivity is supplied by logical operations of
    an inner code rather than directly by hardware. Prior works showed that this can
    reduce memory overhead for local low-rate inner codes such as the surface code.
    Here, we study concatenation over non-local, high-rate inner codes. Such inner
    codes experience correlated errors among the many logical qubits in a single codeblock.
    We handle this by treating each block as a single logical Galois qudit, enabling
    concatenation with algebraic outer codes with excellent parameters and, crucially,
    list decoders. In particular, we consider a memory system formed by concatenating
    quantum Reed-Solomon outer codes over the gross code. For fault-tolerant syndrome
    extraction, we develop a Galois qudit Shor scheme using "time-like" Reed-Solomon
    protection against measurement errors. Interestingly, a lightweight fault tolerance
    scheme, that would fail for qubits, works well for large-alphabet qudits, suggesting
    a very different theory of fault tolerance for such qudits. The whole protocol
    is optimised via improved bicycle instruction logical error rates, novel compilation
    strategies, and recent decoder post-selection rules. At uniform $10^{-3}$ physical
    noise, the concatenated gross code reaches the teraquop regime, which it previously
    could not access, with a lower space overhead than the $288$-qubit two-gross code,
    while offering several advantages from the engineering standpoint. Beyond our
    main case study, we believe the core ideas of Galois qudits, quantum Reed-Solomon
    outer codes, and list decoding, will prove generically powerful and highly transferable
    ideas across high-rate quantum architectures.
