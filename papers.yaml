- title: 'How to Build a Quantum Supercomputer: Enabling Utility-Scale Quantum Computing
    with HPC-QC Integration'
  date: 2026-02
  url: https://doi.org/10.48448/1n8w-sw25
  category: quantum-hardware
  subcategory: theory
  authors:
  - Armed Forces Communications and Electronics Association 2026
  - Namit Anand
  abstract: Major theoretical and experimental advances in designing controllable
    quantum systems have brought us closer to Richard Feynman's vision of using quantum
    mechanics to simulate nature. Today, we can access up to hundreds of qubits across
    a range of device types, including superconducting qubits, neutral atoms, trapped
    ions, photonics, and more. But to unlock the full potential of quantum computing
    (QC)—meaningful speedups for real-world problems like simulating chemistry and
    materials science—we need to scale these quantum systems to orders of magnitude
    more qubits and do so cost-effectively. This milestone, known as quantum utility,
    marks the point where quantum computers become truly useful. To achieve quantum
    utility, it will be necessary to tightly integrate quantum processors (QPUs) with
    classical, high-performance computing (HPC) systems. This is because, rather than
    acting as general-purpose processors, QPUs function more like accelerators or
    coprocessors, designed to tackle highly specialized tasks that are beyond the
    reach of classical computers. This hybrid HPC-QC model will be essential not only
    in the near term—the noisy, intermediate-scale quantum (NISQ) era—but also for
    future fault-tolerant quantum computation (FTQC), as quantum error-correction
    schemes will rely heavily on classical co-processors. To achieve so-called utility-scale
    quantum computing, it will be necessary to integrate with existing heterogeneous
    HPC infrastructures and develop a hybrid quantum-classical full computing stack.
    In other words, we will need to build a quantum supercomputer. We present a full
    quantum-classical stack with tight integration of HPC and QC in multiple layers.
    At the highest layer, we extend familiar HPC programming environments to include
    QC capabilities, making it easier for developers to run quantum tasks alongside
    classical, high-performance ones. This includes a quantum accelerator API, which
    allows seamless execution of quantum algorithms, and a smart scheduler that efficiently
    distributes quantum workloads across available resources. At a lower level, we
    provide an HPC solution for circuit compilation and real-time quantum error correction
    that uses known hardware profiles to synthesize optimized fault-tolerant circuits.
    Integration at this layer will require fast communication between the quantum
    and classical components, and can be enabled by ultra-low latency interconnects.
    Novel algorithms and heterogeneous coprocessing—including CPU/GPUs, QPUs, and
    probabilistic processing units (PPUs)—allow the system to partition a particular
    problem into subproblems and send them out to the right coprocessors, enabling
    even more efficient execution. To aid in designing and evaluating the hybrid stack,
    we provide resource estimates for utility-scale (FTQC) problems in materials science
    as well as demonstrate HPC-QC integration workflows for several near-term (NISQ)
    applications.
