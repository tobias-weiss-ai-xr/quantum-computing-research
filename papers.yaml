- title: Fault-tolerant quantum computation with static atomic buses
  date: 2026-07
  url: https://arxiv.org/abs/2607.02804
  category: quantum-error-correction
  subcategory: method
  authors:
  - Matteo Bergonzoni
  - Laura Pecorari
  - Sam Norrell
  abstract: Efficient quantum error correction and fault-tolerant quantum computing
    require scalable, high-fidelity long-range connectivity. In neutral-atom quantum
    computers, this is commonly achieved through atom transport, but shuttling introduces
    latency and motional heating that worsen with system size. Here, we introduce
    a neutral-atom architecture based on static atomic buses, in which auxiliary mediator
    atoms enable long-range entangling operations without qubit transport. The architecture
    naturally supports long-range stabilizer measurements in high-rate LDPC codes
    and transversal logical gates between neighboring surface-code patches, enabling
    a modular framework for efficient logical memories, Clifford computation, and
    magic-state distillation. To realize these capabilities, we co-design optimal-control
    protocols for bus-mediated controlled-Z gates that incorporate both microscopic
    neutral-atom dynamics and architectural constraints. We obtain smooth bus-mediated
    gates with fidelities approaching 99.9% and durations of a few hundred nanoseconds
    by combining time-optimal control with interaction-flatness and robustness constraints.
    Large-scale simulations of quantum error correction and logical entangling operations
    between neighboring surface-code patches predict more than an order-of-magnitude
    improvement in logical error rates compared with atom-shuttling architectures
    under realistic noise. The architecture achieves logical gate times of approximately
    100 us and quantum-error-correction cycle times of about 1 ms for code distances
    d&lt;12. These results establish static atomic buses as a practical alternative
    to atom shuttling for scalable fault-tolerant neutral-atom quantum computing.
  venue: arXiv (Cornell University)
- title: 'The 2026 Quantum Audit: What Changed, What Didn''t, and What It Costs'
  date: 2026-04
  url: https://doi.org/10.5281/zenodo.19519508
  category: quantum-error-correction
  subcategory: method
  authors:
  - Kase Branham
  abstract: 'This paper applies the Quantum Operations Model (QOM)¹ cost framework
    to the five mostconsequential developments in quantum computing from late 2025
    through early 2026: theGoogle/Oratomic cryptographic resource estimate compression,
    Microsoft''s contestedtopological qubit claims, IBM''s qLDPC-based Starling architecture
    roadmap, the first deliveriesof error-corrected "level-2" quantum machines (systems
    implementing real-time quantum errorcorrection on physical hardware), and emerging
    continuous-variable (CV) error correctiontechniques that bypass Gottesman-Kitaev-Preskill
    (GKP) state preparation. We ask: how dothese recent advances alter the cost structure
    of fault-tolerant quantum computation as modeledby QOM?The answer is nuanced.
    Algorithmic improvements — particularly in Shor''s algorithmcompilation and quantum
    LDPC error correction codes — have compressed the gap betweencurrent hardware
    and useful fault-tolerant computation more than any single hardware advance,though
    these algorithmic results carry their own assumptions that require scrutiny. The
    QECoverhead,² identified in prior work as the dominant cost factor in quantum
    computation, is beingrenegotiated through new codes but has not yet been reduced
    in practice on any shippinghardware. Meanwhile, the topological qubit program
    suffered a significant credibility correctionwhen replication studies published
    in Science found simpler explanations for previouslycelebrated experimental signatures.
    Updated QOM cost tables are provided for all four majorarchitectures under both
    legacy surface-code and projected qLDPC overhead assumptions, withsensitivity
    ranges across physical error rates from 10⁻³ to 10⁻⁴. The central thesis of the
    QuantumAudit series — that quantum computing''s near-term value lies in capability
    rather than costreduction — remains intact, but the timeline to that capability
    shortened meaningfully this year.¹ The Quantum Operations Model (QOM) is an original
    cost-accounting framework developed bythe author across three prior papers in
    this series: "Time Is Money: Wall-Clock Economics ofFault-Tolerant Quantum Computation,"
    "The Decoder Is Architecture: Classical Bottlenecks inFault-Tolerant Quantum Systems,"
    and "Show Me the Numbers: Concrete Costs of QuantumOperations." All three are
    available on Zenodo and Academia.edu. The QOM source code isavailable at github.com/kase1111-hash.²
    Throughout this paper, "QEC overhead" refers to the combined physical-to-logical
    qubit ratioand the code-distance time multiplier required to achieve a target
    logical error rate — thequantity introduced in the first Quantum Audit paper as
    the "error correction tax."'
  venue: Zenodo (CERN European Organization for Nuclear Research)
- title: 'The Nine‑Node Coherence Engine: A Coherence‑First Framework for Graphene‑Based
    Quantum Architectures'
  date: 2026-06
  url: https://doi.org/10.5281/zenodo.20903218
  category: quantum-error-correction
  subcategory: theory
  authors:
  - Neil Gamroth
  abstract: 'This work introduces the Nine‑Node Coherence Engine, a coherence‑first
    architectural framework for emerging quantum hardware with a focus on layered
    graphene systems. The framework formalizes two core constructs: the BT‑3X lattice,
    a nine‑node coherence structure shown to be isomorphic to the 9‑qubit Shor code,
    and the Coheron field, a three‑axis coherence engine that functions as a conceptual
    analogue to topological surface codes. Together, these structures provide a unified
    model for coherence propagation across multi‑layer graphene stacks. The paper
    demonstrates how BT‑3X coherence blocks align naturally with graphene nanocell
    geometry and how Coheron‑guided coherence stabilization may support non‑local
    error suppression. Several architectural predictions follow from the framework,
    including the optimality of 3×3 qubit tiles, the importance of ordered interlayer
    coherence propagation, and the potential for LDPC enhancement through Coheron‑aligned
    stabilizer networks. The Nine‑Node Coherence Engine offers a coherence‑first design
    paradigm that bridges materials science, quantum error correction, and systems
    architecture, pointing toward scalable quantum technologies grounded in structural
    coherence principles.'
