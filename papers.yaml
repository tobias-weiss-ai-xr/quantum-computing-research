- title: Real-Time Sign-Problem-Suppressed Quantum Monte Carlo Algorithm for Noisy
    Quantum Circuit Simulations
  date: 2026-04
  url: https://arxiv.org/abs/2502.18929
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Tong Shen
  - Daniel A. Lidar
  abstract: We present a real-time quantum Monte Carlo algorithm that simulates the
    dynamics of open quantum systems by stochastically compressing and evolving the
    density matrix under both Markovian and non-Markovian master equations. Our algorithm
    uses population dynamics to continuously suppress the sign problem, preventing
    its accumulation throughout the evolution for a broad class of noisy-circuit Liouvillians
    of practical and experimental interest. We apply it to a variety of quantum circuits
    and demonstrate significant speedups and scaling improvements over state-of-the-art
    quantum trajectory methods and convergence to exact solutions even in non-Markovian
    regimes where trajectory methods fail. Our approach improves the efficiency of
    classical simulation of gate-based quantum computing, quantum annealing, and general
    open system dynamics.
  venue: Physical Review Letters
- title: Distributed quantum approximate optimization algorithm on a quantum-centric
    supercomputing architecture
  date: 2026-06
  url: https://arxiv.org/abs/2407.20212
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Seongmin Kim
  - Vincent R. Pascuzzi
  - Zhihao Xu
  abstract: Abstract Quantum approximate optimization algorithm (QAOA) has shown promise
    in solving combinatorial optimization problems by providing quantum speedup on
    near-term gate-based quantum computing systems. However, QAOA faces challenges
    for high-dimensional problems due to the large number of qubits required and the
    complexity of deep circuits, limiting its scalability for real-world applications.
    In this study, we present a distributed QAOA (DQAOA), which leverages distributed
    computing strategies to decompose a large computational workload into smaller
    tasks that require fewer qubits and shallower circuits than are necessary to solve
    the original problem. These sub-problems are processed using a combination of
    high-performance and quantum computing resources. The global solution is iteratively
    updated by aggregating sub-solutions, allowing convergence toward the optimal
    solution. We demonstrate that DQAOA can handle considerably large-scale optimization
    problems (e.g., 1000-bit problem), achieving a high solution quality and short
    time-to-solution, outperforming existing strategies. Furthermore, we realize DQAOA
    on a quantum-centric supercomputing architecture, paving the way for practical
    applications of gate-based quantum computers in real-world optimization tasks.
    To extend DQAOA’s applicability to materials science, we further develop an active
    learning algorithm integrated with our DQAOA (AL-DQAOA), which involves machine
    learning, DQAOA, and active data production in an iterative loop. We successfully
    optimize photonic structures using AL-DQAOA, indicating that solving real-world
    optimization problems using gate-based quantum computing is feasible. We expect
    the proposed DQAOA to be applicable to a wide range of optimization problems and
    AL-DQAOA to find broader applications in material design.
  venue: npj Quantum Information
- title: Optimality of Quantum Adiabatic Search Algorithm and Its Circuit Model
  date: 2026-03
  url: https://doi.org/10.3390/quantum8020028
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Jie Sun
  - Zhimin Zhang
  - Songfeng Lu
  abstract: 'In this paper, we study two aspects of quantum adiabatic evolution for
    a prototypical search problem: the optimality of the corresponding algorithm and
    its relation to the quantum circuit model. Firstly, we propose a general framework
    for proving the square-root speedup of the quantum adiabatic algorithm to be optimal
    over classical computation, which is readily applicable to the case of multiple
    targets. Through this framework, we also find that it is possible to further reduce
    the time complexity by increasing the physical energy of the system, encompassing
    results from previous works. Secondly, we find that, on the one hand, when the
    quantum adiabatic algorithm that achieves quadratic speedup is implemented on
    a quantum circuit, the time slice needed is always consistent with its time complexity,
    which also encompasses previous results; on the other hand, however, if a further
    algorithmic improvement is considered, the time slice always remains invariant.
    This phenomenon represents a significant observation with potential applications.
    We anticipate that the main results of this paper will interest the quantum adiabatic
    computation community and may help us to design efficient quantum algorithms for
    practical problems in the future.'
  venue: Quantum Reports
- title: Efficient Time-Aware Partitioning of Quantum Circuits for Distributed Quantum
    Computing
  date: 2026-04
  url: https://arxiv.org/abs/2603.04126
  category: quantum-algorithms
  subcategory: method
  authors:
  - Raymond P. H. Wu
  - Chathu Ranaweera
  - Sutharshan Rajasegarar
  abstract: To overcome the physical limitations of scaling monolithic quantum computers,
    distributed quantum computing (DQC) interconnects multiple smaller-scale quantum
    processing units (QPUs) to form a quantum network. However, this approach introduces
    a critical challenge, namely the high cost of quantum communication between remote
    QPUs incurred by quantum state teleportation and quantum gate teleportation. To
    minimize this communication overhead, DQC compilers must strategically partition
    quantum circuits by mapping logical qubits to distributed physical QPUs. Static
    graph partitioning methods are fundamentally ill-equipped for this task as they
    ignore execution dynamics and underlying network topology, while metaheuristics
    require substantial computational runtime. In this work, we propose a heuristic
    based on beam search to solve the circuit partitioning problem. Our time-aware
    algorithm incrementally constructs a low-cost sequence of qubit assignments across
    successive time steps to minimize overall communication overhead. The time and
    space complexities of the proposed algorithm scale quadratically with the number
    of qubits and linearly with circuit depth, offering a significant computational
    speedup over common metaheuristics. We demonstrate that our proposed algorithm
    consistently achieves significantly lower communication costs than static baselines
    across varying circuit sizes, depths, and network topologies, providing an efficient
    compilation tool for near-term distributed quantum hardware.
  venue: ''
- title: Combinatorial optimization enhanced by shallow quantum circuits with 104
    superconducting qubits
  date: 2026-02
  url: https://arxiv.org/abs/2509.11535
  category: quantum-algorithms
  subcategory: method
  authors:
  - Xuhao Zhu
  - Zuoheng Zou
  - Feitong Jin
  abstract: A pivotal task for quantum computing is to speed up the solution of problems
    that are both classically intractable and practically valuable. Among these, combinatorial
    optimization problems have attracted tremendous attention due to their broad applicability
    and natural fitness to Ising Hamiltonians. Here we propose a quantum-sampling
    strategy, on the basis of which we design an algorithm to accelerate the solution
    of the ground states of the Ising model, a class of Nondeterministic Polynomial
    time (NP)-hard problems in combinatorial optimization. The algorithm employs a
    shallow-circuit quantum-sampling subroutine to navigate the energy landscape.
    Using up to 104 superconducting qubits, we experimentally demonstrate that this
    algorithm outputs favorable solutions compared with even a highly optimized classical
    simulated-annealing algorithm, and we illustrate the path toward quantum speedup
    based on the time-to-solution metric relative to simulated annealing under serial
    execution. Our results indicate a promising alternative to classical heuristics
    for combinatorial optimization, for which quantum advantage may become possible
    on near-term superconducting quantum processors.
  venue: National Science Review
- title: Iterative Interpolation Schedules for Quantum Approximate Optimization Algorithm
  date: 2026-05
  url: https://doi.org/10.1145/3815778
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Anuj Apte
  - Shree Hari Sureshbabu
  - Ruslan Shaydulin
  abstract: 'Quantum Approximate Optimization Algorithm (QAOA) is a promising quantum
    heuristic with empirical evidence of speedup over classical state-of-the-art for
    some problems. QAOA uses a parameterized circuit with p layers, where higher p
    yields better solutions, but requires optimizing 2p independent parameters, which
    is challenging at large p . We present an iterative interpolation method that
    exploits the smoothness of optimal parameter schedules by expressing them in a
    basis of orthogonal functions, generalizing the work of Zhou et al. By optimizing
    a small number of basis coefficients and iteratively increasing both circuit depth
    and coefficient count until convergence, our method constructs high-quality schedules
    for large p . We provide theoretical justification using Jackson’s theorem and
    Lipschitz continuity to bound the required number of basis coefficients for a
    given accuracy. Our approach achieves better performance with fewer optimization
    steps than existing methods across three benchmark problems: the Sherrington-Kirkpatrick
    (SK) model, portfolio optimization, and Low Autocorrelation Binary Sequences (LABS).
    For the largest LABS instance, we achieve near-optimal merit factors with schedules
    exceeding 1,000 layers, an order of magnitude beyond previous methods. Additionally,
    we observe that a mild growth in QAOA depth suffices to solve the SK model exactly,
    a result of independent theoretical interest.'
  venue: ACM Transactions on Quantum Computing
- title: A quantum gradient descent algorithm for optimizing Gaussian process models
  date: 2026-04
  url: https://doi.org/10.1142/s0218202526420042
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Junpeng Hu
  - Jinglai Li
  - Lei Zhang
  abstract: Gaussian process regression (GPR) is a nonparametric supervised learning
    method, widely valued for its ability to quantify uncertainty. Despite its advantages
    and broad applications, classical GPR implementations face significant scalability
    challenges, as they involve matrix operations with a cubic complexity in relation
    to the dataset size. This computational challenge is further compounded by the
    demand of optimizing the Gaussian Process (GP) model over its hyperparameters,
    rendering the total computational cost prohibitive for data intensive problems.
    To address this issue, we propose a quantum gradient descent algorithm to optimize
    the GP model. Taking advantage of recent advances in quantum algorithms for linear
    algebra, our algorithm achieves exponential speedup in computing the gradients
    of the log marginal likelihood. The entire gradient descent process is integrated
    into the quantum circuit. Through runtime analysis and error bounds, we demonstrate
    that our approach significantly improves the scalability of GPR model optimization,
    making it computationally feasible for large-scale applications.
  venue: Mathematical Models and Methods in Applied Sciences
- title: End-to-end quantum algorithm for topology optimization in structural mechanics
  date: 2026-03
  url: https://arxiv.org/abs/2510.07280
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Leonhard Hölscher
  - Oliver Ahrend
  - Lukas Karch
  abstract: Abstract Topology optimization is a key methodology in engineering design
    for finding efficient and robust structures. Due to the enormous size of the design
    space, evaluating all possible configurations is typically infeasible. In this
    work, we present an end-to-end, fault-tolerant quantum algorithm for topology
    optimization that operates on an exponentially large Hilbert space representing
    the design space. We demonstrate the algorithm on the two-dimensional Messerschmitt-Bölkow-Blohm
    beam problem. By restricting design variables to binary values, we reformulate
    the compliance minimization task as a combinatorial satisfiability problem, solved
    using Grover’s algorithm. Within Grover’s oracle, the compliance is computed through
    the finite-element method using established quantum algorithms, including block-encoding
    of the stiffness matrix, quantum singular value transformation for matrix inversion,
    Hadamard test, and quantum amplitude estimation. The complete algorithm is implemented
    and validated using classical quantum-circuit simulations. A detailed complexity
    analysis shows that the method evaluates the compliance of exponentially many
    structures in quantum superposition in polynomial time. In the global search,
    our approach maintains Grover’s quadratic speedup compared to classical unstructured
    search. Overall, the proposed quantum workflow demonstrates how quantum algorithms
    can advance the field of computational science and engineering.
  venue: Quantum Science and Technology
- title: Quantum-classical auxiliary field quantum Monte Carlo with matchgate shadows
    on trapped ion quantum computers
  date: 2026-06
  url: https://arxiv.org/abs/2506.22408
  category: quantum-algorithms
  subcategory: method
  authors:
  - Luning Zhao
  - Joshua J. Goings
  - Willie Aboumrad
  abstract: We demonstrate an end-to-end workflow to model chemical reaction barriers
    with the quantum-classical auxiliary field quantum Monte Carlo (QC-AFQMC) algorithm
    with quantum tomography using matchgate shadows. The workflow operates within
    an accelerated quantum supercomputing environment with the IonQ Forte quantum
    computer and NVIDIA graphic processing units (GPUs) on Amazon Web Services. We
    present several algorithmic innovations and an efficient GPU-accelerated execution
    that achieves a several orders of magnitude speedup over the state-of-the-art
    implementation of QC-AFQMC. We apply the algorithm to simulate the oxidative addition
    step of the nickel-catalyzed Suzuki-Miyaura reaction using 24 qubits of IonQ Forte
    with 16 qubits used to represent the trial state, plus 8 additional ancilla qubits
    for error mitigation, resulting in the largest QC-AFQMC with matchgate shadow
    experiments ever performed on quantum hardware. We achieve a <a:math xmlns:a="http://www.w3.org/1998/Math/MathML">
    <a:mrow> <a:mn>9</a:mn> <a:mo>×</a:mo> </a:mrow> </a:math> speedup in collecting
    matchgate circuit measurements, and our distributed-parallel postprocessing implementation
    attains a <b:math xmlns:b="http://www.w3.org/1998/Math/MathML"> <b:mrow> <b:mn>656</b:mn>
    <b:mo>×</b:mo> </b:mrow> </b:math> time-to-solution improvement over the prior
    state of the art. Chemical reaction barriers for the model reaction evaluated
    with active-space QC-AFQMC are within the uncertainty interval of <c:math xmlns:c="http://www.w3.org/1998/Math/MathML">
    <c:mrow> <c:mo>±</c:mo> <c:mn>4</c:mn> </c:mrow> </c:math> kcal/mol from the reference
    CCSD(T) (coupled cluster singles and doubles with perturbative triples) result
    when matchgates are sampled on the ideal simulator and within 10 kcal/mol from
    reference when measured on quantum processing unit. This work marks a step toward
    practical quantum chemistry simulations on quantum devices while identifying several
    opportunities for further development.
  venue: Physical Review Research
- title: Iterative Quantum Feature Maps
  date: 2026-05
  url: https://arxiv.org/abs/2506.19461
  category: quantum-algorithms
  subcategory: method
  authors:
  - Nasa Matsumoto
  - Quoc Hoan Tran
  - Koki Chinzei
  abstract: ABSTRACT Quantum machine learning models that leverage quantum circuits
    as quantum feature maps (QFMs) are recognized for their enhanced expressive power
    in learning tasks. Such models have demonstrated rigorous end‐to‐end quantum speedups
    for specific families of classification problems. However, deploying deep QFMs
    on real quantum hardware remains challenging due to circuit noise and hardware
    constraints. Additionally, variational quantum algorithms often suffer from computational
    bottlenecks, particularly in accurate gradient estimation, which significantly
    increases quantum resource demands during training. We propose Iterative Quantum
    Feature Maps (IQFMs), a hybrid quantum‐classical framework that constructs a deep
    architecture by iteratively connecting shallow QFMs with classically computed
    augmentation weights. By incorporating contrastive learning and a layer‐wise training
    mechanism, the IQFMs framework effectively reduces quantum runtime and mitigates
    noise‐induced degradation. In tasks involving noisy quantum data, numerical experiments
    show that the IQFMs framework outperforms quantum convolutional neural networks,
    without requiring the optimization of variational quantum parameters. Even for
    a typical classical image classification benchmark, a carefully designed IQFMs
    framework achieves performance comparable to that of classical neural networks.
    This framework presents a promising path to address current limitations and harness
    the full potential of quantum‐enhanced machine learning.
  venue: Advanced Quantum Technologies
- title: 'Quantum linear solvers for scientific computing: a comparison of VQLS, HHL
    and quantum annealing on time-fractional diffusion problems'
  date: 2026-02
  url: https://doi.org/10.1038/s41598-026-40910-y
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Amir Hossein Salehi Shayegan
  abstract: 'Time-fractional diffusion equations have emerged as powerful models for
    describing anomalous transport phenomena in physics, biology and engineering.
    To address the computational challenges arising from their non-local operators,
    we employ the WEB-spline finite element method, which provides a flexible and
    accurate discretization framework. The resulting linear system of equations are
    then explored in the context of quantum computing. Specifically, we investigate
    three prominent quantum linear solvers: the variational quantum linear solver
    (VQLS), the Harrow-Hassidim-Lloyd (HHL) algorithm and quantum annealing (QA).
    VQLS leverages hybrid variational techniques and shallow circuits, making it well-suited
    for noisy intermediate-scale quantum (NISQ) devices, while HHL offers a theoretically
    exponential speedup for sparse systems but requires deep fault-tolerant circuits.
    QA, in contrast, reformulates the problem into a quadratic unconstrained binary
    optimization (QUBO) instance, enabling approximate solutions through energy minimization
    on specialized hardware. We present a comparative analysis in terms of circuit
    depth, noise resilience, scalability and solution extraction, including the role
    of quantum state tomography in reconstructing classical information. Numerical
    experiments on a time-fractional diffusion problem highlight the complementary
    strengths and limitations of each method. This study bridges advanced numerical
    discretization with emerging quantum algorithms, providing insights into the feasibility
    and future potential of quantum-enhanced solvers for fractional partial differential
    equations.'
  venue: Scientific Reports
- title: 'phase2: full-state vector simulation of quantum time evolution at scale'
  date: 2026-07
  url: https://doi.org/10.1038/s44488-026-00002-2
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Marek Miller
  - Jakob Günther
  - Freek Witteveen
  abstract: <title>Abstract</title> Large-scale classical simulation of quantum computers
    is crucial for benchmarking quantum algorithms, establishing boundaries of quantum
    advantage and exploring heuristic quantum algorithms. We present a full-state
    vector simulation algorithm and software implementation designed to perform HPC
    simulation of layers of rotations around a string of Pauli operators. We demonstrate
    robust scalability of the simulation method on large distributed CPU and GPU systems.
    Our distributed computation harnessed up to 16384 CPU cores and 512 NVIDIA H100
    GPUs, using 32 TB of memory. The simulator significantly outperforms other high-performance
    libraries, showing a typical speedup of 10-100 for large-scale multi-GPU workloads.
    As a first application of our approach, we report a numerical experiment aimed
    at simulating exactly Hamiltonian dynamics of up to 40 qubits to investigate the
    Trotter error for a quantum chemistry problem. Bounding the Trotter error is important
    for evaluating the cost of quantum algorithms for chemistry, and rigorous bounds
    are often conservative, as our simulations confirm. Our software, specifically
    designed for quantum time evolution applications, is also well equipped to manage
    circuits that utilize standard gate sets.
  venue: Communications AI & Computing
- title: Advancing scientific discovery and complex optimization through distributed
    quantum neural networks
  date: 2026-07
  url: https://arxiv.org/abs/2503.00221
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Seongmin Kim
  - In‐Saeng Suh
  abstract: Abstract Optimization problems are critical across various domains, yet
    existing quantum algorithms, despite their great potential, struggle with scalability
    and accuracy due to excessive reliance on entanglement. To address these limitations,
    we propose a variational quantum optimization algorithm (VQOA), which employs
    an ansatz based solely on quantum superposition, where single-qubit rotation gates
    function analogously to neurons in classical deep neural networks. This ansatz,
    which can be regarded as quantum neural networks, significantly reduces circuit
    complexity, enhances noise robustness, mitigates Barren Plateau issues, and enables
    efficient partitioning for highly complex, large-scale optimization. Furthermore,
    we introduce distributed VQOA (DVQOA), which integrates high-performance computing
    with quantum computing to achieve superior performance. These features enable
    a significant acceleration of material optimization tasks (e.g., metamaterial
    design), achieving more than 50 × speedup compared to state-of-the-art optimization
    algorithms. Beyond material design, DVQOA efficiently solves quantum chemistry
    problems and N -ary ( N ≥2) optimization problems involving higher-order interactions,
    outperforming classical deep neural networks. These advantages establish DVQOA
    as a highly promising and versatile solver for real-world problems, demonstrating
    the practical benefits of the quantum-classical approach.
  venue: npj Computational Materials
- title: Iterative Matrix Product State Simulation for Scalable Grover’s Algorithm
  date: 2026-04
  url: https://doi.org/10.1109/icassp55912.2026.11461240
  category: quantum-algorithms
  subcategory: method
  authors:
  - Mei Ian Sam
  - Tzu-Ling Kuo
  - Tai-Yue Li
  abstract: 'Grover’s algorithm is a cornerstone of quantum search algorithm, offering
    quadratic speedup for unstructured problems. However, limited qubit counts and
    noise in today’s noisy intermediate-scale quantum (NISQ) devices hinder large-scale
    hardware validation, making efficient classical simulation essential for algorithm
    development and hardware assessment. We present an iterative Grover simulation
    framework based on matrix product states (MPS) to efficiently simulate large-scale
    Grover’s algorithm. Within the NVIDIA CUDA-Q environment, we compare iterative
    and common (non-iterative) Grover’s circuits across statevector and MPS backends.
    On the MPS backend at 29 qubits, the iterative Grover’s circuit runs about 15×
    faster than the common (non-iterative) Grover’s circuit, and about 3-4× faster
    than the statevector backend. In sampling experiments, Grover’s circuits demonstrate
    strong low-shot stability: as the qubit number increases beyond 13, a single-shot
    measurement still closely mirrors the results from 4,096 shots, indicating reliable
    estimates with minimal sampling and significant potential to cut measurement costs.
    Overall, an iterative MPS design delivers speed and scalability for Grover’s circuit
    simulation, enabling practical large-scale implementations.'
  venue: ''
- title: 'Quantum amplitude estimation for Wright–Fisher parameter inference: Theoretical
    query complexity advantages conditional on efficient oracle construction'
  date: 2026-04
  url: https://doi.org/10.1142/s0129183126430047
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Behrouz Parsa Moghaddam
  - Mahmoud A. Zaky
  - Arman Dabiri
  abstract: 'We establish theoretical foundations for applying quantum amplitude estimation
    to Wright– Fisher population genetics, demonstrating that quantum methods could
    provide substantial query complexity improvements — reducing sample requirements
    from [Formula: see text] to [Formula: see text] — conditional on efficient oracle
    construction. Through paired classical simulations comparing high-variance vs
    low-variance estimation strategies across extensive computational replicates,
    we isolate the effects of variance reduction on evolutionary dynamics while validating
    theoretical predictions with exceptional precision. Our comprehensive statistical
    analysis confirms distributional equivalence between methods through consensus
    across multiple independent tests, including Bayesian model comparison and generational
    Kolmogorov–Smirnov testing. Overlapping confidence intervals for fixation probability
    validate that query complexity reduction does not degrade evolutionary prediction
    quality — the central requirement for practical quantum advantage. Fixation timing
    distributions remain statistically indistinguishable, demonstrating that variance
    reduction preserves both stochastic establishment dynamics and deterministic sweep
    phases across the complete evolutionary trajectory. These theoretical advantages
    depend entirely on three unresolved prerequisites: (i) oracle construction overhead
    must remain polynomial in problem parameters, requiring either quantum random
    access memory (qRAM) — experimentally undemonstrated at practical scales — or
    problem-specific circuits for fitness landscape encoding; (ii) fault-tolerant
    quantum hardware with gate error rates orders of magnitude below current technology;
    (iii) scalable quantum architectures maintaining coherence across the required
    computational depth. Break-even analysis establishes that without efficient oracle
    construction, query complexity advantages may be offset by oracle overhead, resulting
    in marginal or zero net computational benefit. This work contributes: (a) rigorous
    characterization of variance propagation through evolutionary dynamics with near-perfect
    scaling law validation, (b) identification of weak-selection, high-noise regimes
    where quantum variance reduction provides maximum benefit and (c) transparent
    delineation of necessary vs sufficient conditions for practical quantum advantage.
    Our framework establishes that reduced estimation variance, if achievable through
    quantum or other advanced methods, yields measurable evolutionary benefits while
    explicitly acknowledging that translating theoretical query advantages into end-to-end
    computational speedup requires coordinated breakthroughs in quantum algorithmic
    primitives and hardware capabilities.'
  venue: International Journal of Modern Physics C
- title: Demonstration of Exponential Quantum Speedup with Constant-Depth Compiled
    Circuits for Simon's Problem
  date: 2026-04
  url: https://arxiv.org/abs/2604.27457
  category: quantum-algorithms
  subcategory: theory
  authors:
  - Phattharaporn Singkanipa
  - Victor Kasatkin
  - Daniel A. Lidar
  abstract: We demonstrate exponential algorithmic quantum speedup for a restricted-Hamming-weight
    version of Simon's problem, in which the hidden string $b$ is promised to satisfy
    $\text{HW}(b)\le w$ for a Hamming-weight cutoff $w$, on present-day superconducting
    quantum processors. We introduce a hardware-aware compilation strategy that reduces
    the quantum part of each Simon query circuit to constant depth. The resulting
    compiled circuits have $O(1)$ depth, require only linear nearest-neighbor connectivity,
    map directly onto common device layouts, and avoid additional routing and SWAP
    overhead. Implemented on IBM's $156$-qubit Boston and $120$-qubit Miami processors,
    these circuits achieve sufficient fidelity to exhibit algorithmic quantum speedup
    without error suppression. Using the number-of-queries-to-solution (NTS) metric,
    we observe exponential speedup over the classical lower-bound benchmark for all
    restricted-Hamming-weight cutoffs $w\ge 4$ on Boston and across low-to-intermediate
    Hamming-weight cutoffs on Miami; at higher Hamming-weight cutoffs on Miami, we
    still observe polynomial speedup. The same construction also enables unrestricted
    instances of Simon's problem, corresponding to $w=n$ for problem size $n$, over
    the finite problem-size ranges for which our NTS computation is feasible; in this
    regime, the observed scaling advantage is not limited to the restricted-Hamming-weight
    setting. These results show that careful hardware-aware compilation can make quantum
    speedup experimentally accessible for a canonical hidden-subgroup problem in the
    NISQ regime.
