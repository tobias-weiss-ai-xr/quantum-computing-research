  - Kavitha Subramani
  abstract: Email has long been a vital tool for personal and professional communication,
    but its security relies on traditional cryptographic algorithms that are expected
    to become vulnerable due to developments in quantum computing. The paper presents
    a secure application-layer email model compatible with existing frameworks, enhancing
    confidentiality using quantum-resistant methods. The system supports OAuth 2.0
    and OpenID Connect, eliminating password-based authentication and improving access
    security while enabling integration with services like Gmail and Outlook. It uses
    symmetric encryption and a hybrid one-time pad–based key mechanism to simulate
    post-quantum secure keys. All encryption and decryption occur at the application
    layer, ensuring end-to-end security without modifying SMTP or IMAP, while maintaining
    compatibility with existing email systems.
