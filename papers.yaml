- title: 'zkQML: Verifiable and Privacy-Preserving Inference for Quantum Machine Learning
    (Student Abstract)'
  date: 2026-03
  url: https://doi.org/10.1609/aaai.v40i48.42232
  category: quantum-machine-learning
  subcategory: theory
  authors:
  - Seung Kwon Lee
  - Seok Bin Son
  - Joongheon Kim
  abstract: Quantum machine learning (QML) has attracted growing interest for their
    ability to achieve superior performance with significantly fewer parameters. However,
    the high cost and scarcity of current hardware push inference to cloud-hosted
    quantum devices, creating a tension between verifiability and confidentiality.
    This work proposes a novel framework that converts quantum neural network operations
    into classical arithmetic circuits that faithfully approximate genuine quantum
    computations. By encrypting these circuits with zero-knowledge proofs, it ensures
    computational validity while concealing internal parameters. Experimental results
    show that our classical circuits achieve fidelity above 0.9996 and total variation
    distance below 1% compared to actual quantum computations, verifying the practicality
    of trustworthy and privacy-preserving quantum inference.
  venue: Proceedings of the AAAI Conference on Artificial Intelligence
- title: 'QuMod: Parallel Quantum Job Scheduling on Modular QPUs Using Circuit Cutting'
  date: 2026-04
  url: https://doi.org/10.1109/qcnc69040.2026.00020
  category: quantum-hardware
  subcategory: method
  authors:
  - Vinooth Kulkarni
  - Aaron Orenstein
  - Xinpeng Li
  abstract: The quantum computing community is increasingly positioning quantum processors
    as accelerators within classical HPC workflows, analogous to GPUs and TPUs. However,
    many real-world applications require scaling to hundreds or thousands of physical
    qubits to realize logical qubits via error correction. To reach these scales,
    hardware vendors employing diverse technologies-such as trapped ions, photonics,
    neutral atoms, and superconducting circuits-are moving beyond single, monolithic
    QPUs toward modular architectures connected via interconnects. For example, IonQ
    has proposed photonic links for scaling, while IBM has demonstrated a modular
    QPU architecture by classically linking two 127-qubit devices. Using dynamic circuits,
    Bell-pairbased teleportation, and circuit cutting, they have shown how to execute
    a large quantum circuit that cannot fit on a single QPU. As interest in quantum
    computing grows, cloud providers must ensure fair and efficient resource allocation
    for multiple users sharing such modular systems. Classical interconnection of
    QPUs introduces new scheduling challenges, particularly when multiple jobs execute
    in parallel. In this work, we develop a multi-programmable scheduler for modular
    quantum systems that jointly considers qubit mapping, parallel circuit execution,
    measurement synchronization across subcircuits, and teleportation operations between
    QPUs using dynamic circuits.
