- title: 'TransScale Boundary State Field Calculus: Typed Observation, Admissible
    Transfer, and Falsifiable Persistence in Finite Open Systems'
  date: 2026-07
  url: https://doi.org/10.5281/zenodo.21286690
  category: quantum-simulation
  subcategory: theory
  authors:
  - J Tree
  abstract: 'Abstract Boundary-State Field Calculus (BSC) is a mathematical and experimental
    framework for studying finite open systems when the internal state is only partly
    accessible through boundaries, sensors, and computational models. Its central
    purpose is practical: to separate the behavior of a system from the way it is
    measured, reconstructed, simulated, and controlled. Each step is treated as a
    distinct object with declared assumptions, uncertainty, physical constraints,
    comparison baselines, and conditions for failure. Volume IV develops this framework
    for optical physics, scientific machine learning, photonic computing, inverse
    problems, and closed-loop experimentation. Electromagnetic fields are placed in
    function spaces with well-defined boundary traces. Maxwell dynamics are separated
    from detector response, and coherent detection, intensity measurements, photon
    counting, heterodyne readout, and quantum measurements are treated as different
    information channels with different limits. Energy balance, passivity, reciprocity,
    causality, calibration, and quantum precision bounds are enforced as physical
    tests rather than optional modeling preferences. Scientific machine learning is
    treated as an approximation to a declared physical operator, not as a replacement
    for physics. Neural operators and digital twins are evaluated for boundary consistency,
    resolution transfer, geometry transfer, calibration, uncertainty, conservation,
    and out-of-distribution behavior. Photonic neural hardware is modeled as a physical
    scattering system whose performance depends on fabrication, temperature, wavelength,
    drift, detector noise, and total system resources. The volume states falsifiable
    predictions concerning phase diversity, spectral extrapolation, neural-operator
    transfer, photonic sim-to-real error, robust inverse design, adaptive measurement,
    biofilm sensing, quantum readout, and prior-driven superresolution. The result
    is not a universal theory or a new microscopic law. It is a testable framework
    for determining what an experiment actually measured, what a model legitimately
    inferred, what transfers across scale or hardware, and what must be rejected.
    Introduction Every scientific instrument observes a transformed fragment of the
    system it studies. A camera records photons rather than the complete electromagnetic
    field. An electrode measures current, voltage, impedance, and redox behavior at
    a biofilm interface rather than every chemical and biological state inside the
    colony. A quantum detector records outcomes produced by a measurement protocol
    rather than exposing the underlying state directly. A machine-learning surrogate
    approximates a physical solver, but its behavior may change when the grid, geometry,
    wavelength, boundary conditions, or hardware platform changes. Many scientific
    errors begin when these distinctions are compressed into a single black box. A
    detector limitation is mistaken for a physical absence. A reconstruction supplied
    by a prior is presented as information contained in the data. A model that performs
    well on one numerical grid is described as learning the underlying operator. A
    photonic accelerator is compared with digital hardware while excluding the energy
    used by lasers, modulators, calibration, detection, data conversion, and thermal
    control. A boundary measurement is treated as if it were the full interior state.
    Boundary-State Field Calculus was developed to make these distinctions explicit.
    The framework does not propose that optics, biology, quantum matter, cosmology,
    and machine learning share one microscopic mechanism. Their local sciences remain
    different. Maxwell equations govern electromagnetic fields. Reaction, transport,
    redox, membrane, and metabolic processes govern biological systems. Hamiltonians
    and quantum channels govern quantum experiments. General relativity and survey
    likelihoods govern cosmological inference. The proposed unification is methodological:
    each field must answer the same basic questions before a claim can be trusted.
    What is the physical domain? Where is its boundary or measured interface? What
    variables describe the internal state? What can the instrument actually observe?
    Which physically different states produce the same measurement? What assumptions
    enter the reconstruction? What information was available before the outcome occurred?
    What happens when the model is moved to another resolution, scale, geometry, device,
    or population? Which conservation, safety, and calibration conditions must hold?
    What result would force the claim to be withdrawn? The first volume introduced
    a common description of finite open systems using local dynamics, boundary exchange,
    measurement, admissible states, and scale maps. The second volume supplied formal
    mathematical foundations using stochastic kernels, measurable quotients, information
    geometry, trace theory, sheaves, viability, operator algebra, and renormalization.
    The third volume converted the framework into executable experiment bundles containing
    a target, baseline, intervention class, candidate operators, matched null models,
    loss function, admission rule, and demotion rule. Volume IV applies this structure
    to optical physics and scientific AI. This specialization is timely because modern
    optical science increasingly combines physical simulation, computational imaging,
    machine learning, inverse design, adaptive measurement, and analog photonic hardware.
    These systems are powerful, but their largest errors often occur at the interfaces
    between components. A Maxwell solver may be accurate while the detector model
    is wrong. A neural operator may fit training data while violating energy conservation
    or failing on a new geometry. An inverse-designed device may perform well in simulation
    while being hypersensitive to fabrication error. An adaptive measurement system
    may appear efficient because its model is overconfident. A photonic neural network
    may match a digital computation under laboratory calibration and then drift with
    temperature or wavelength. Volume IV turns these failure modes into measurable
    quantities. Energy conservation is checked through a Poynting ledger. Passive
    and reciprocal devices are tested for violations of their expected scattering
    constraints. Causal spectral models are checked against dispersion relations.
    Optical measurements are classified by the information they preserve or erase.
    Fisher information and modal rank are used to determine whether added measurements
    supply genuinely independent information. Reconstruction results are tested for
    sensitivity to priors and regularizers. Neural operators are evaluated across
    resolution, geometry, boundary conditions, and physical constraints. Photonic
    hardware is compared with its digital target using an explicit transfer error
    that includes calibration and environmental drift. AI-generated hypotheses are
    separated from the data used to judge them so that search does not masquerade
    as discovery. The electroactive-biofilm module provides a concrete biological
    example. Redox potential, pH, impedance, extracellular electron-transfer proxies,
    and interface morphology are treated as measurable boundary variables. The scientific
    question is not whether the boundary is inherently special. It is whether those
    measurements improve prediction of recovery after a controlled voltage, redox,
    pH, or flow perturbation beyond ordinary explanations such as biomass, nutrients,
    temperature, species composition, time, and instrument drift. If the boundary
    variables fail that comparison, the claim is rejected. If they survive, the result
    remains local to the tested organism, electrode, perturbation, and measurement
    protocol until independently reproduced. The same discipline applies to computational
    imaging and superresolution. When two physical states produce the same detector
    distribution, no algorithm can distinguish them from those data alone. Any apparent
    distinction must come from additional measurements, prior information, or assumptions
    learned from other examples. The framework therefore asks not only whether an
    image looks plausible, but which details were supported by the measurement and
    which were supplied by the reconstruction method. The value of BSC is not that
    every proposed module will succeed. The framework is designed so that useful negative
    results remain possible. A phase may prove unobservable. A neural operator may
    fail to transfer between resolutions. A photonic advantage may disappear under
    complete resource accounting. A biofilm boundary signal may be explained by biomass
    or sensor drift. An AI-generated equation may fail an independent perturbation.
    Each failure removes an unsupported claim and improves the design of the next
    experiment. This publication therefore presents a research program rather than
    a completed theory. Its claims are intended to be implemented, benchmarked, challenged,
    and revised. The immediate goals are reproducible simulations, public data and
    code, preregistered predictions, independent calibration, matched null models,
    external experimental tests, and a permanent record of both promotion and demotion.
    Its scientific importance will be determined not by the breadth of its vocabulary,
    but by whether these tools improve the reliability of real measurements, models,
    devices, and decisions. The wording above reflects the project’s stated progression
    from a finite-system audit calculus, through its mathematical completion and experiment-bundle
    formalism, to the optical and AI specialization in Volume IV. Abstract Scientific
    results increasingly depend on a chain of interacting systems: physical laws,
    boundary conditions, sources, detectors, numerical solvers, learned models, hardware,
    calibration procedures, and automated decisions. Each part may appear accurate
    on its own while the complete chain produces a false or overstated conclusion.
    Information may be lost at measurement, unsupported detail m'
