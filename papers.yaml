- title: Synchronized DNA sources for unconditionally secure cryptography
  date: 2026-03
  url: https://arxiv.org/abs/2603.17149
  category: quantum-cryptography
  subcategory: method
  authors:
  - Sandra Jaudou
  - Hélène Gasnier
  - Elias Boudjella
  abstract: Secure communication is the cornerstone of modern infrastructures, yet
    achieving unconditional security -resistant to any computational attack- remains
    a fundamental challenge. The One-Time Pad (OTP), proven by Shannon to offer perfect
    secrecy, requires a shared random key as long as the message, used only once.
    However, distributing large keys over long distances has been impractical due
    to the lack of secure and scalable sharing options. Here, we introduce a DNA-based
    cryptographic primitive that leverages random pools of synthetic DNA to install
    a synchronized entropy source between distant parties. Our approach uses duplicated
    DNA molecules -comprising random index-payload pairs- as a shared secret. These
    molecules are locally sequenced and digitized to generate a common binary mask
    for OTP encryption, achieving unconditional security without relying on computational
    assumptions. We experimentally demonstrate this protocol between Tokyo and Paris,
    using in-house sequencing, generating a shared secret mask of $\sim$ 400 Mb with
    a residual error rate to achieve the usual overall decryption failure rate of
    $2^{-128}$. The min-entropy of the binary mask meets the most recent National
    Institute of Standards and Technology requirements (SP 800-90B), and is comparable
    to that of approved cryptographic random number generators. Critically, our system
    can resist two types of adversarial interference through molecular copy-number
    statistics, providing an additional layer of security reminiscent of Quantum Key
    Distribution, but without distance limitations. This work establishes DNA as a
    scalable entropy source for long-distance OTP, enabling high-throughput and secure
    communications in sensitive contexts. By bridging molecular biology and cryptography,
    DNA-based key distribution opens a promising new route toward unconditional security
    in global communication networks.
  venue: HAL (Le Centre pour la Communication Scientifique Directe)
- title: A Quantum-Enhanced Key Agreement and Signature Protocol for Securing Transportation
    Cyber-Physical Systems
  date: 2026-04
  url: https://doi.org/10.1109/tits.2026.3678384
  category: quantum-cryptography
  subcategory: theory
  authors:
  - Sahaya Beni Prathiba
  - Saikiran Sankaranarayanan
  - Rampriya Rajendran Shanthi
  abstract: Transportation Cyber-Physical Systems (T-CPS) integrate transportation
    information with physical elements, enabling advanced features such as real-time
    vehicle tracking, collision avoidance, and intelligent traffic management. However,
    this also increases the need for improved security protocols to safeguard the
    critical identity-based data they transmit through vulnerable wireless networks,
    such as Vehicle Identification Numbers (VINs) and live Global Positioning System
    (GPS) coordinates. These T-CPS, traditionally protected by classical encryption
    algorithms, are now vulnerable due to the rise in quantum computing. Existing
    solutions are hindered by their complex security features and high computational
    overhead. To address these challenges, we propose Quantum Key Agreement and Signature
    Verification (QKASV), a post-quantum protocol that integrates Quantum Key Distribution
    (QKD) and Quantum Signatures for T-CPS. QKASV uses identity-tied QKD-based keys
    for session creation, followed by either individual or group quantum signatures.
    Signatures are created by applying basic quantum gates sequentially rather than
    lattice-based or certificate-based schemes. Hence, this speeds up the overall
    key generation, distribution, and management process without compromising the
    enhanced security. Formal security analysis using standard security models and
    the Scyther cryptographic protocol verification tool proves that QKASV meets standard
    security requirements. Further, comparison with similar schemes shows that QKASV
    operates on the least communication rounds required per signature, and reduces
    the computational overhead by at least 12%. Therefore, QKASV offers a better security
    solution compared to existing schemes.
  venue: IEEE Transactions on Intelligent Transportation Systems
- title: Quantum resistant software Defined-Networking IPsec, enabling ITS communication
    over IP networks on real telco infrastructures
  date: 2026-03
  url: https://doi.org/10.1016/j.comnet.2026.112171
  category: quantum-cryptography
  subcategory: method
  authors:
  - Rubén B. Méndez
  - Jaime S. Buruaga
  - Juan P. Brito
  abstract: • The first functional implementation that integrates SDN, QKD, and IPsec
    technologies within a unified architecture, enabling dynamic establishment of
    IPsec tunnels protected with Quantum Key Distribution. • The proposed solution
    is based on the implementation of IPsec in accordance with QKD-related standards
    defined by ETSI, specifically adhering to the specifications ETSI GS QKD 004 and
    ETSI GS QKD 015. This approach ensures interoperability and alignment with current
    best practices for quantum secure network deployments. • Experimental results
    were obtained from a field-deployed QKD network operating over a hybrid quantum-classical
    infrastructure, providing empirical validation of the proposed approach in a production-grade
    environment laying a solid foundation for future large-scale deployments. The
    importance of digital communications makes protecting data in transit a critical
    priority. Internet Protocol Security (IPsec) plays a central role in this protection,
    by ensuring data confidentiality, integrity, and authenticity. However, quantum
    computing threatens the foundations of IPsec. Its ability to efficiently solve
    mathematical problems such as factoring and discrete logarithms could break the
    public-key cryptography used for IPsec key exchange. Quantum Key Distribution
    (QKD) is one of the most promising solutions to this problem, offering a security
    layer immune to both classical and quantum computational attacks. This work proposes
    a solution that integrates emerging quantum technologies into existing security
    and communication infrastructures to ensure long-term protection. We combine IPsec
    with Software-Defined Networking and QKD to build a novel network security infrastructure.
    It is designed to resist both classical and quantum threats. It is based on recent
    standardization efforts and operational tools for QKD integration. We demonstrate
    advanced capabilities such as rekeying and secure key transport on a field deployed
    QKD network operating within a shared quantum-classical production infrastructure.
  venue: Computer Networks
- title: 'Quantum-Secure Communication for Future Cyber-Physical and IoT Systems:
    A Systematic Review of Classical to Learning Approaches'
  date: 2026-06
  url: https://doi.org/10.3390/computers15060389
  category: quantum-cryptography
  subcategory: method
  authors:
  - Bandana Mallick
  - Priyadarsan Parida
  - Bibhu Prasad
  abstract: Cyber-physical systems (CPSs) based on the Internet of Things (IoT) form
    the backbone of modern smart infrastructures, including smart cities, healthcare
    monitoring, industrial automation, and intelligent transportation. However, connecting
    many resource-limited IoT devices makes them more vulnerable to cyber threats,
    particularly quantum attacks. This review comprehensively examines quantum-secure
    communication (QSC) frameworks for IoT-enabled CPS, focusing on Quantum Key Distribution
    (QKD), post-quantum cryptographic (PQC) algorithms, and hybrid quantum–classical
    security models suitable for constrained devices. A PRISMA-guided search of the
    Scopus and Google Scholar database was conducted in January 2026 using three keyword
    groups related to hybrid security, artificial intelligence, and cyber-physical
    systems. Based on the evaluation, 6008 publications have been identified between
    2001 and 2026. The first-round screening was performed for 4948 articles, after
    excluding duplicates. During the screening stage, 348 articles were selected for
    abstract scrutiny, 115 records were excluded due to no direct focus on CPS/IoT
    applications, 52 studies were excluded because these papers relied on traditional
    security models, 25 studies were excluded due to insufficient relevance to the
    review objectives, and 15 additional non-English studies were removed. Following
    the screening stage, 141 studies were selected for full-text eligibility. Out
    of those, 86 studies were removed due to a lack of specific evaluation metrics
    or not being published in a peer-reviewed venue. Furthermore, the publications
    are classified as QKD-based secure CPS and QSC for industrial IoT, AI-Assisted
    Secure Communication for CPS Networks, and hybrid PQC-QKD models for CPS/IoT devices.
    This article investigates recent advancements in secure data transmission, verified
    protocols, and AI-driven anomaly detection customized to CPS/IoT environments.
    In addition, operational hurdles, interaction with open innovations, real-time
    deployment, and secure edge-cloud integration are highlighted. By analyzing recent
    developments and identifying research gaps, this review provides a structured
    roadmap for designing secure, scalable, and quantum-safe IoT-based CPS frameworks
    capable of withstanding next-generation cyber threats. This systematic review
    was performed and reported according to the PRISMA 2020 guidelines.
  venue: Computers
- title: 'Quantum Computing and IoT: Transforming Cybersecurity in the Defence Sector'
  date: 2026-03
  url: https://doi.org/10.1108/978-1-83549-198-020261005
  category: quantum-cryptography
  subcategory: method
  authors:
  - Mohd Nadeem
  - Suhel Ahmad Khan
  - A. Agrawal
  abstract: The rapid advancement of digital technologies, particularly the Internet
    of Things (IoT) and quantum computing (QC), is reshaping modern military operations
    by enhancing real-time data collection, autonomous decision-making, and situational
    awareness. IoT-enabled systems, such as UAVs, battlefield sensors, and smart logistics,
    provide military forces with operational superiority but also introduce significant
    cybersecurity risks, including espionage, cyber sabotage, and unauthorized access.
    The emergence of QC further complicates this landscape, as quantum algorithms
    can break traditional encryption protocols, threatening the security of military
    communications and IoT infrastructure. However, quantum technologies also offer
    revolutionary cybersecurity solutions, such as Quantum Key Distribution (QKD)
    and Post-Quantum Cryptography (PQC), which leverage the principles of quantum
    mechanics to ensure secure communication. Despite these advancements, challenges
    such as the technological maturity of quantum solutions, high implementation costs,
    and global competition in quantum research pose obstacles to widespread military
    adoption. This chapter explores the interplay between QC and military IoT security,
    addressing both the vulnerabilities of IoT systems and the potential of quantum-enhanced
    security frameworks. By integrating quantum-safe cryptographic techniques, defence
    organizations can fortify military IoT infrastructure, mitigate cyber threats,
    and maintain strategic superiority in an era of increasing digital warfare.
