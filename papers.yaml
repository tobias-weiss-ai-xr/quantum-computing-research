- title: A harmonized corpus of quantum error correction publications and patents
    (1995–2025)
  date: 2026-07
  url: https://doi.org/10.17632/cxrrmvy56p.1
  category: quantum-error-correction
  subcategory: method
  authors:
  - Saikat Barua
  - Humayra Shemushee
  abstract: 'This dataset is a harmonized corpus of research and invention output
    in quantum error correction, the set of techniques by which quantum information
    is protected against noise, and the central obstacle standing between present-day
    quantum processors and fault-tolerant computation. It brings together the scholarly
    literature and the patent record of the field in a single schema and under a single
    open license, spanning 1995 to 2025. The corpus contains 16,270 records: 14,381
    scholarly publications retrieved from OpenAlex and enriched against Crossref,
    and 1,889 United States patent publications retrieved from Google Patents Public
    Data. Each record carries a common set of fields, including identifier, source,
    type, title, abstract, year, venue or issuing office, authors or assignees with
    affiliations, citation count, cited references, and subfield tags describing which
    aspects of the field a record concerns, such as codes, fault tolerance, decoders,
    logical qubits, surface and topological codes, bosonic codes, quantum LDPC codes
    and magic-state distillation. A separate flag identifies records concerned with
    machine-learning and neural decoders, and a full variable dictionary accompanies
    the data. Every record is assigned to one of three retrieval tiers. The core tier
    comprises records whose titles carry an explicit quantum-error-correction term,
    and is the subset recommended for most analyses. The extended tier comprises records
    in which such a term appears only in the abstract, offering greater recall at
    lower precision. A third tier holds patents carrying the official quantum-error-correction
    classification, CPC G06N10/70, yet containing no such term anywhere. These are
    labelled rather than discarded, because they document a finding of practical importance:
    two-thirds of patents bearing this classification carry it as a secondary code
    on broad quantum-computing inventions, so classification alone is not a sufficient
    filter. The quality of the core tier has been measured rather than asserted. A
    stratified random sample of one hundred core records was screened for topical
    relevance, yielding a precision of 86.0 per cent with a Wilson ninety-five per
    cent confidence interval of 77.9 to 91.5 per cent, and the labelled sample is
    included so that this figure can be checked. The residual out-of-scope material
    consists chiefly of quantum key distribution, algorithms designed to run on fault-tolerant
    machines rather than error correction itself, and error-suppression techniques
    such as dynamical decoupling. Drawn entirely from openly licensed sources, the
    corpus may be redistributed and reused without restriction, supporting bibliometric
    study of a rapidly growing field, analysis of the relationship between academic
    research and industrial invention, examination of the emergence of machine-learning
    decoders, and use as a filtered document collection for text mining.'
