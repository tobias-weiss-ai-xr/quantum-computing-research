    $$dM = T_H\,dS + \Omega_H\,dJ + \Phi_H\,dQ$$ Back-reaction from Hawking radiation
    drives the evolution of mass and spin: $$\frac{dM}{dt} = -\frac{\alpha(a_*)\,n_\text{eff}}{M^2}$$
    where $\alpha = 1/(15360\pi)$ is the Page constant and $n_\text{eff}$ is the effective
    number of particle species. The spin enhancement factor accounts for superradiant
    emission: $$f(a_*) = 1 + 4.8\,a_*^2 + 2.5\,a_*^4$$ The spin evolves as: $$\frac{da_*}{dt}
    = (g - 2)\,\frac{a_*}{M}\,\frac{dM}{dt}, \qquad g(a_*) = 1.0 + 2.7\,a_*^2 + 3.5\,a_*^4$$
    The evaporation lifetime for a Schwarzschild black hole is: $$t_\text{evap} =
