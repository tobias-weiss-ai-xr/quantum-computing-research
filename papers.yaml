- title: Comprehensive survey of global research trends, challenges, and comparative
    advances in quantum cryptography and post-quantum cryptographic algorithms
  date: 2026-07
  url: https://doi.org/10.1007/s44163-026-01841-9
  category: quantum-cryptography
  subcategory: method
  authors:
  - Anubhav Saxena
  - Dinesh Kumar Saini
  - Satpal Singh Kushwaha
  abstract: Quantum computing provides the pathway to dismantle the security provided
    by cryptography especially classical public-key systems due to the emergence of
    Shor’s algorithm. This emerging threat necessitates the development of new security
    paradigms that are quantum-resistant. Consequently, two new approaches have emerged
    as prominent solutions, namely Quantum Key Distribution (QKD), which relies on
    quantum mechanical principles for security, and Post-Quantum Cryptography (PQC),
    which relies on classical cryptography for quantum resistance. This paper presents
    an extensive analysis of the global research trends in quantum cryptography and
    post-quantum cryptographic algorithms by incorporating the use of both bibliometric
    analysis and comparative analysis. The paper relies on a dataset collected from
    the Web of Science database from 2010 to 2025. The findings of the paper demonstrate
    an increase in scientific production in the field of quantum cryptography, with
    post-quantum cryptography emerging as a new dominant area coinciding with standardization
    by NIST, whereas quantum key distribution continues to evolve with new developments
    in quantum communication.
