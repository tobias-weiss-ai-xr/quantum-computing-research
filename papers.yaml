  subcategory: theory
  authors:
  - C M Rakshitha
  - K R Nataraj
  - Nirmala Hiremani
  abstract: Quantum cryptography is a significant development in secure communication
    that uses quantum mechanics concepts to improve data security against developing
    attacks. By utilizing phenomena such as quantum superposition and entanglement,
    it provides robust methods such as quantum key distribution (QKD) that provide
    key security against eavesdropping. This review begins with the underlying concepts
    of quantum computing, which support quantum cryptography techniques. This research
    study provides a brief comparison of classical computing with quantum computing
    and technological developments through various research and possible consequences.
    Then it investigates fundamental principles of quantum mechanics such as, Heisenberg
    uncertainty principle and photon polarization. The chapter then explores the main
    quantum cryptography concepts such as QKD, emphasizing its theoretical foundations,
    Shor’s and Grover’s algorithm effects on traditional algorithms, and programming
    tools which can be used in real-world applications.
