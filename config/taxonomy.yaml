  - id: application
    keywords: ["application", "applied", "deploy", "real-world", "experiment", "demonstration", "case study"]
  - id: development
    keywords: ["implementation", "system", "platform", "toolkit", "library", "open-source", "software", "SDK", "API", "compiler", "transpiler"]
  - id: systems
    keywords: ["hardware", "architecture", "device", "qubit", "gate", "processor", "chip", "fidelity", "coherence", "calibration"]
