# ⚙️ Research Taxonomy & Discovery Config — Quantum Computing Research
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Quantum Computing Research"
  short: "quantum-computing"
  description: "Quantum computing research corpus: algorithms, error correction, hardware, simulation, machine learning, cryptography, and information theory."
  openalex_mailto: "research+quantum@tobias-weiss-ai-xr.de"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis (quantum computing subfields).
# Subcategories = the secondary axis (research aspects).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:
    - id: quantum-algorithms
      display: "Quantum Algorithms & Complexity"
    - id: quantum-error-correction
      display: "Quantum Error Correction"
    - id: quantum-hardware
      display: "Quantum Hardware & Architecture"
    - id: quantum-information
      display: "Quantum Information Theory"
    - id: quantum-simulation
      display: "Quantum Simulation"
    - id: quantum-machine-learning
      display: "Quantum Machine Learning"
    - id: quantum-cryptography
      display: "Quantum Cryptography & Communication"
    - id: quantum-software
      display: "Quantum Software & Tools"
    - id: survey
      display: "Surveys & Taxonomies"
  subcategories:
    - id: theory
      display: "Theory"
    - id: method
      display: "Method"
    - id: application
      display: "Application"
    - id: development
      display: "Development"
    - id: systems
      display: "Systems & Technology"
    - id: evaluation
      display: "Evaluation & Benchmarks"
    - id: review
      display: "Reviews & Surveys"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
arxiv_queries:
  - query: 'cat:quant-ph AND (abs:"quantum algorithm" OR abs:"quantum circuit" OR abs:"quantum speedup")'
    category: quantum-algorithms
    subcategory_hint: method
  - query: 'cat:quant-ph AND (abs:"quantum error correction" OR abs:"surface code" OR abs:"LDPC" OR abs:"stabilizer code")'
    category: quantum-error-correction
    subcategory_hint: method
  - query: 'cat:quant-ph AND (abs:"quantum hardware" OR abs:"superconducting qubit" OR abs:"trapped ion" OR abs:"neutral atom" OR abs:"photonic qubit" OR abs:"silicon spin qubit")'
    category: quantum-hardware
    subcategory_hint: systems
  - query: 'cat:quant-ph AND (abs:"quantum information" OR abs:"entanglement" OR abs:"quantum channel" OR abs:"quantum state tomography")'
    category: quantum-information
    subcategory_hint: theory
  - query: 'cat:quant-ph AND (abs:"quantum simulation" OR abs:"analog quantum simulation" OR abs:"digital quantum simulation" OR abs:"Hamiltonian simulation")'
    category: quantum-simulation
    subcategory_hint: method
  - query: 'cat:quant-ph AND (abs:"quantum machine learning" OR abs:"quantum neural network" OR abs:"variational quantum eigensolver" OR abs:"quantum kernel")'
    category: quantum-machine-learning
    subcategory_hint: method
  - query: 'cat:quant-ph AND (abs:"quantum key distribution" OR abs:"quantum cryptography" OR abs:"quantum communication" OR abs:"quantum repeater")'
    category: quantum-cryptography
    subcategory_hint: application
  - query: 'cat:quant-ph AND (abs:"quantum compiler" OR abs:"quantum transpiler" OR abs:"quantum software" OR abs:"Qiskit" OR abs:"Cirq" OR abs:"PennyLane")'
    category: quantum-software
    subcategory_hint: development
  - query: 'cat:quant-ph AND (abs:"survey" OR abs:"review" OR abs:"taxonomy" OR abs:"NISQ")'
    category: survey
    subcategory_hint: review
  - query: 'cat:cs.IT AND (abs:"quantum" OR abs:"QKD")'
    category: quantum-cryptography
    subcategory_hint: theory
  - query: 'cat:cs.CC AND (abs:"quantum" OR abs:"BQP")'
    category: quantum-algorithms
    subcategory_hint: theory

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
other_sources_queries:
  - source: dblp
    query: quantum algorithm circuit
    category: quantum-algorithms
    subcategory_hint: method
  - source: dblp
    query: quantum error correction surface code
    category: quantum-error-correction
    subcategory_hint: method
  - source: dblp
    query: quantum machine learning variational
    category: quantum-machine-learning
    subcategory_hint: method
  - source: dblp
    query: quantum cryptography key distribution
    category: quantum-cryptography
    subcategory_hint: application
  - source: crossref
    query: quantum computing survey review
    category: survey
    subcategory_hint: review
  - source: crossref
    query: superconducting qubit hardware
    category: quantum-hardware
    subcategory_hint: systems
  - source: crossref
    query: quantum simulation Hamiltonian
    category: quantum-simulation
    subcategory_hint: method
  - source: europepmc
    query: quantum error correction code
    category: quantum-error-correction
    subcategory_hint: method

