# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
github_queries:
  - query: "topic:quantum-computing+stars:>100"
    category: quantum-software
  - query: "quantum+circuit+simulator+stars:>200"
    category: quantum-software
    subcategory_hint: development
  - query: "quantum+error+correction+stars:>50"
    category: quantum-error-correction
  - query: "quantum+machine+learning+stars:>100"
    category: quantum-machine-learning
  - query: "Qiskit+stars:>500"
    category: quantum-software
    subcategory_hint: development
  - query: "quantum+algorithm+library+stars:>50"
    category: quantum-algorithms
  - query: "awesome+quantum+stars:>100"
    category: survey
    subcategory_hint: review

# ── GitLab repository discovery (fetch_gitlab_repos.py) ──────────────────────
